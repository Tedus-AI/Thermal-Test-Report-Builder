    function setupCoverImageHandlers(page) {
      const zone = document.getElementById('cover-photo-zone');
      const fileInput = document.getElementById('cover-file-input');
      if (!zone || !fileInput) return;

      // Browse button opens file dialog; zone click does NOT (so paste works)
      const browseBtn = zone.querySelector('.img-browse-btn');
      if (browseBtn) {
        browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
      }
      // If image already placed, zone click does nothing special (markers handled elsewhere)
      // Double-click on empty zone opens file dialog as convenience
      zone.addEventListener('dblclick', (e) => {
        if (e.target.closest('.photo-action-btn')) return;
        if (!page.data.cover_image) fileInput.click();
      });

      fileInput.addEventListener('change', async () => {
        if (fileInput.files.length > 0) {
          await handleCoverImage(page, fileInput.files[0]);
        }
      });

      // Drag & Drop
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('dragover');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('dragover');
      });

      zone.addEventListener('drop', async (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          await handleCoverImage(page, file);
        }
      });

      // Replace / Delete buttons
      const replaceBtn = document.getElementById('photo-replace');
      const deleteBtn = document.getElementById('photo-delete');

      if (replaceBtn) {
        replaceBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          fileInput.click();
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          page.data.cover_image = '';
          renderCoverPage(page);
          scheduleSave(state.activePage);
        });
      }

      // Resize handle drag (percentage-based)
      const resizeHandle = document.getElementById('cover-photo-resize');
      if (resizeHandle) {
        resizeHandle.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const startX = e.clientX;
          const startW = zone.offsetWidth;
          const aspect = startW / zone.offsetHeight;
          const parentW = zone.parentElement.clientWidth;

          const onMove = (ev) => {
            const dx = ev.clientX - startX;
            let newW = Math.max(200, startW + dx * 2); // *2 because zone is centered
            const maxW = parentW * 0.95;
            if (newW > maxW) newW = maxW;
            const pct = (newW / parentW) * 100;
            zone.style.width = pct + '%';
            zone.style.aspectRatio = aspect.toFixed(4);
          };

          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            // Save as percentage + aspect ratio
            const parentW = zone.parentElement.clientWidth;
            page.data.cover_image_w_pct = Math.round((zone.offsetWidth / parentW) * 100);
            page.data.cover_image_w = zone.offsetWidth;
            page.data.cover_image_h = zone.offsetHeight;
            scheduleSave(state.activePage);
          };

          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }

    }

    async function handlePaste(e) {
      if (state.activePage === null) return;

      const el = document.activeElement;
      const isTextInput = el && (
        el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable
      );
      if (isTextInput) return;

      const page = state.pages[state.activePage];
      const dt = e.clipboardData;
      if (!dt) return;

      // ── Read all clipboard data SYNCHRONOUSLY before any await ──
      // (the DataTransfer is emptied once the event handler yields)
      let imageFile = null;
      let htmlItem = null;

      // 1) image/* items, then 2) dt.files (Firefox/Safari compatibility)
      for (const item of (dt.items || [])) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const f = item.getAsFile();
          if (f) { imageFile = f; break; }
        }
      }
      if (!imageFile) {
        for (const f of (dt.files || [])) {
          if (f.type.startsWith('image/')) { imageFile = f; break; }
        }
      }
      // 3) Office apps often provide the image only inside text/html
      if (!imageFile) {
        for (const item of (dt.items || [])) {
          if (item.type === 'text/html') { htmlItem = item; break; }
        }
      }
      if (imageFile || htmlItem) e.preventDefault();
      const htmlString = htmlItem ? await new Promise(resolve => htmlItem.getAsString(resolve)) : null;

      // ── Process collected data ──
      if (imageFile) {
        await routePastedImage(page, imageFile);
        return;
      }
      if (htmlString) {
        const file = await extractImageFromHTML(htmlString);
        if (file) await routePastedImage(page, file);
      }
    }

    // Office apps often paste an image only as an <img> inside text/html. The
    // HTML is parsed with DOMParser (inert: no scripts, no handlers, no loads)
    // and only a data: or http(s) image source is used.
    async function extractImageFromHTML(html) {
      let src = '';
      try {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const img = doc.querySelector('img[src]');
        src = img ? img.getAttribute('src') : '';
      } catch (err) { return null; }
      if (!src || !/^(data:image\/|https?:\/\/)/i.test(src)) return null;
      try {
        const res = await fetch(src);
        const blob = await res.blob();
        if (!blob.type.startsWith('image/')) return null;
        return new File([blob], 'pasted-image.png', { type: blob.type || 'image/png' });
      } catch (err) {
        console.warn('Failed to read pasted image:', err);
        return null;
      }
    }

    async function routePastedImage(page, file) {
      const clip = (page.type === 'image' || page.type === 'annotation') ? await photoClipFor(file) : null;
      if (clip) file = { clip };
      if (page.type === 'cover') {
        await handleCoverImage(page, file);
      } else if (page.type === 'image') {
        await handleImagePagePaste(page, file);
      } else if (page.type === 'annotation') {
        await handleAnnotationPhoto(page, file);
      }
    }

    async function handleCoverImage(page, file) {
      const imageData = await processImage(file);
      page.data.cover_image = imageData;
      renderCoverPage(page);
      scheduleSave(state.activePage);
    }

    // Helper: wraps editor canvas innerHTML with Delta Blue page elements
    function editorPageWrapHTML(innerHtml) {
      return `<div class="report-page-wrap">
        <div class="prog-bar-top"></div>
        <div class="prog-bar-bot"></div>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="page-footer"><span>CONFIDENTIAL</span></div>
        ${innerHtml}
      </div>`;
    }

    function addImagePage() { return addPageOfType('image'); }

    // ━━━ Annotation Page Module ━━━

    // CSS transform applied to the annotation photo (rotate / flip). Same string
    // is used in the editor and in the exported PDF so they always match.
    // Generic image transform (pan + rotate + flip + zoom); shared by annotation
    // & image pages. offX/offY are a percentage of the element's own box, so the
    // exact same string works in the editor and the exported PDF as long as the
    // element has the same aspect ratio in both (it does — see renderImagePage).
    // Transform order (applied right→left): scale/flip first, then rotate, then
    // translate in screen space so panning direction is independent of rotation.
    function cssImgTransform(rotate, flipH, flipV, zoom, offX, offY) {
      const r = rotate || 0;
      const z = (zoom == null) ? 1 : zoom;
      const sx = (flipH ? -1 : 1) * z;
      const sy = (flipV ? -1 : 1) * z;
      const ox = offX || 0;
      const oy = offY || 0;
      return `translate(${ox}%, ${oy}%) rotate(${r}deg) scale(${sx}, ${sy})`;
    }
    // Shared interactive image cropper. Loads `src`, bakes the given rotate/flip
    // so the user crops exactly what they see, lets them drag/resize a selection
    // rectangle, then returns a NEW cropped data URL via onConfirm(url). Crop is
    // destructive by design: the editor and the exported PDF then share one
    // identical bitmap, so they can never diverge.
    function openImageCropper(src, opts, onConfirm) {
      opts = opts || {};
      const rotate = (((opts.rotate || 0) % 360) + 360) % 360;
      const flipH = !!opts.flipH, flipV = !!opts.flipV;

      const baseImg = new Image();
      baseImg.onload = () => {
        // 1) Bake rotate/flip into an "oriented" canvas.
        const nw = baseImg.naturalWidth || baseImg.width;
        const nh = baseImg.naturalHeight || baseImg.height;
        const swap = (rotate === 90 || rotate === 270);
        const ow = swap ? nh : nw, oh = swap ? nw : nh;
        const oc = document.createElement('canvas');
        oc.width = ow; oc.height = oh;
        const octx = oc.getContext('2d');
        octx.translate(ow / 2, oh / 2);
        octx.rotate(rotate * Math.PI / 180);
        octx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
        octx.drawImage(baseImg, -nw / 2, -nh / 2);
        const orientedURL = oc.toDataURL('image/png');

        // 2) Modal.
        const overlay = document.createElement('div');
        overlay.className = 'sim-modal-overlay crop-modal-overlay';
        overlay.innerHTML = `
          <div class="crop-modal">
            <div class="sim-modal-header">裁切圖片　·　拖曳選取框調整範圍</div>
            <div class="crop-stage">
              <div class="crop-frame">
                <img class="crop-base" src="${orientedURL}" draggable="false">
                <div class="crop-sel">
                  <div class="crop-h nw"></div><div class="crop-h ne"></div>
                  <div class="crop-h sw"></div><div class="crop-h se"></div>
                </div>
              </div>
            </div>
            <div class="crop-actions">
              <button class="crop-btn cancel">取消</button>
              <button class="crop-btn confirm">確認裁切</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);

        const frame = overlay.querySelector('.crop-frame');
        const sel = overlay.querySelector('.crop-sel');
        const stage = overlay.querySelector('.crop-stage');

        // Fit the oriented image within the stage.
        const scale = Math.min(stage.clientWidth / ow, stage.clientHeight / oh);
        const dw = Math.max(1, Math.round(ow * scale));
        const dh = Math.max(1, Math.round(oh * scale));
        frame.style.width = dw + 'px';
        frame.style.height = dh + 'px';

        // Selection rectangle in fractions (0..1) of the frame.
        let r = { x: 0, y: 0, w: 1, h: 1 };
        const applySel = () => {
          sel.style.left = (r.x * dw) + 'px';
          sel.style.top = (r.y * dh) + 'px';
          sel.style.width = (r.w * dw) + 'px';
          sel.style.height = (r.h * dh) + 'px';
        };
        applySel();

        const startDrag = (e, mode) => {
          e.preventDefault(); e.stopPropagation();
          const sx = e.clientX, sy = e.clientY;
          const r0 = { ...r };
          const minS = 0.05;
          const onMove = (ev) => {
            const dx = (ev.clientX - sx) / dw;
            const dy = (ev.clientY - sy) / dh;
            let { x, y, w, h } = r0;
            if (mode === 'move') {
              x = Math.min(Math.max(0, r0.x + dx), 1 - r0.w);
              y = Math.min(Math.max(0, r0.y + dy), 1 - r0.h);
            } else {
              if (mode.includes('w')) { const nx = Math.min(Math.max(0, r0.x + dx), r0.x + r0.w - minS); w = r0.w + (r0.x - nx); x = nx; }
              if (mode.includes('e')) { w = Math.min(Math.max(minS, r0.w + dx), 1 - r0.x); }
              if (mode.includes('n')) { const ny = Math.min(Math.max(0, r0.y + dy), r0.y + r0.h - minS); h = r0.h + (r0.y - ny); y = ny; }
              if (mode.includes('s')) { h = Math.min(Math.max(minS, r0.h + dy), 1 - r0.y); }
            }
            r = { x, y, w, h };
            applySel();
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        };

        sel.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('crop-h')) return;
          startDrag(e, 'move');
        });
        sel.querySelectorAll('.crop-h').forEach(h => {
          h.addEventListener('mousedown', (e) => startDrag(e, h.classList[1])); // nw/ne/sw/se
        });

        const cleanup = () => overlay.remove();
        overlay.querySelector('.cancel').addEventListener('click', cleanup);
        overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) cleanup(); });
        overlay.querySelector('.confirm').addEventListener('click', () => {
          const out = document.createElement('canvas');
          out.width = Math.max(1, Math.round(r.w * ow));
          out.height = Math.max(1, Math.round(r.h * oh));
          const ctx = out.getContext('2d');
          ctx.fillStyle = '#ffffff';           // avoid black where a source alpha existed
          ctx.fillRect(0, 0, out.width, out.height);
          ctx.drawImage(oc, r.x * ow, r.y * oh, r.w * ow, r.h * oh, 0, 0, out.width, out.height);
          const url = out.toDataURL('image/jpeg', 0.9);
          cleanup();
          onConfirm(url, { ...r });          // r = kept part, in fractions of the oriented image
        });
      };
      baseImg.onerror = () => { /* ignore — leave image unchanged */ };
      baseImg.src = src;
    }

    function addAnnotationPage() { return addPageOfType('annotation'); }

    // ━━━ Annotation page (Thermocouple Location) ━━━
    // One layout, two consumers: the editor shows the very page the PDF prints
    // (same HTML from annoPageInnerHTML, scaled to fit) with the interactive
    // handles layered on top, so what you place is exactly what gets exported.
    //
    // Geometry, all in page px. The stage is the 842 × 559 area below a fixed
    // 36 px title band (the same stage the old version used, so old pages map 1:1):
    //   d.img_box    { x, y, w, h }     photo frame on the stage (aspect = photo)
    //   d.img_rot    0 | 90 | 180 | 270 display rotation (lossless CSS)
    //   d.img_fh     bool               mirror, applied before the rotation
    //   marker.x / y 0–100 % of img_box → points move and scale with the photo
    //   marker.lx/ly label top-left on the stage
    //   d.label_size 'S' | 'M' | 'L', d.show_idx (number badge), d.temp_src { page_id, ta }
    // Up to two photos (ANNO_MAX). Photo 1 keeps the fields above on d itself (older
    // pages stay as they are); photo 2 has the same fields in d.photo2, and its
    // markers carry m.p = 1. caption (on d / d.photo2) prints under the photo;
    // d.layout 'auto' | '1' | '2h' | '2v' says how two photos share the page.
    const ANNO_TITLE_H = 36;
    const ANNO_W = 842, ANNO_H = 595 - ANNO_TITLE_H;
    const ANNO_SAFE = { l: 18, t: 4, r: ANNO_W - 18, b: ANNO_H - 26 };   // clear of the page bars and footer
    const ANNO_LABEL_FS = { S: 9, M: 10.5, L: 12 };
    const ANNO_GAP = 14;                                                  // photo ↔ label column gap (auto layout)
    const ANNO_NAME_FONT = "'DM Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
    const ANNO_NUM_FONT = "'JetBrains Mono','Noto Sans TC',monospace";
    const ANNO_TEMP_STYLE = {
      pass: { bg: '#dcfce7', fg: '#166534', bd: '#16a34a' }, warn: { bg: '#fef3c7', fg: '#92400e', bd: '#d97706' },
      fail: { bg: '#fee2e2', fg: '#b91c1c', bd: '#dc2626' }, none: { bg: '#f1f5f9', fg: '#334155', bd: '#94a3b8' },
    };
    const r1 = v => Math.round(v * 10) / 10;
    const p2 = v => Math.round(v * 100) / 100;          // marker % (0.01)
    const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    const ANNO_MAX = 2;
    const ANNO_CAP_H = 18;                                                // caption band under a photo
    const ANNO_CAP_FONT = "'Noto Sans TC','DM Sans',sans-serif";
    const ANNO_SLOT_GAP = 16;
    const ANNO_LAYOUTS = [{ k: '1', cap: 1, name: '1 張' }, { k: '2h', cap: 2, name: '2 張左右' }, { k: '2v', cap: 2, name: '2 張上下' }];
    const ANNO_PHOTO_KEYS = ['photo_url_or_base64', 'img_box', 'img_rot', 'img_fh', 'img_fit', 'caption'];
    const annoPh = (d, i) => i ? (d.photo2 || null) : d;                 // photo i (same field names on both)
    const annoHasPh = P => !!(P && P.photo_url_or_base64 && P.img_box);
    const annoPhotos = d => [0, 1].filter(i => annoHasPh(annoPh(d, i)));
    const annoPi = m => (m && m.p === 1) ? 1 : 0;                         // photo of a marker
    const annoMk = (d, i) => d.markers.filter(m => annoPi(m) === i);
    const annoCap = P => String((P && P.caption) || '').trim();
    const annoCapH = P => annoCap(P) ? ANNO_CAP_H : 0;
    const annoFoot = P => ({ x: P.img_box.x, y: P.img_box.y, w: P.img_box.w, h: P.img_box.h + annoCapH(P) });   // photo + caption
    function annoMovePhoto(from, to) {     // copy the photo fields of one photo object onto another
      ANNO_PHOTO_KEYS.forEach(k => { if (from[k] !== undefined) to[k] = from[k]; else delete to[k]; });
    }
    // Photo 1's markers first, then photo 2's (each in its own order), so the numbers
    // (TC1, TC2 …, badges, list, batch naming) run photo by photo. True if reordered.
    function annoSortMarkers(d) {
      const ms = d.markers;
      if (ms.every((m, k) => k === 0 || annoPi(ms[k - 1]) <= annoPi(m))) return false;
      d.markers = [...ms.filter(m => !annoPi(m)), ...ms.filter(m => annoPi(m))];
      return true;
    }

    // Pages saved by the previous version kept the frame in anno_photo_* and the
    // labels in % of the stage. Convert once, in place (idempotent).
    function annoNormalize(d) {
      if (!d) return false;
      if (!Array.isArray(d.markers)) d.markers = [];
      let fixed = false;
      if (d.photo2 && (typeof d.photo2 !== 'object' || Array.isArray(d.photo2))) { delete d.photo2; fixed = true; }
      if (d.photo2 && !d.photo_url_or_base64 && d.photo2.photo_url_or_base64) {   // photo 1 always comes first: trade places
        const tmp = {};
        annoMovePhoto(d, tmp); annoMovePhoto(d.photo2, d); annoMovePhoto(tmp, d.photo2);
        d.markers.forEach(m => { if (annoPi(m)) delete m.p; else m.p = 1; });
        fixed = true;
      }
      if (d.photo2 && !d.photo2.photo_url_or_base64 && !d.markers.some(m => annoPi(m) === 1)) { delete d.photo2; fixed = true; }
      if (annoSortMarkers(d)) fixed = true;
      if (d.anno_v === 2) return fixed;
      if (d.photo_url_or_base64) {
        const w = d.anno_photo_w || 680, h = d.anno_photo_h || 430;
        d.img_box = { x: d.anno_photo_x != null ? d.anno_photo_x : (ANNO_W - w) / 2, y: d.anno_photo_y != null ? d.anno_photo_y : (ANNO_H - h) / 2, w, h };
      }
      // old CSS rotate + flips → (rotation, mirror); scaleY(−1) = rotate(180°)·scaleX(−1)
      let rot = (((d.anno_rotate || 0) % 360) + 360) % 360, fh = !!d.anno_flip_h;
      if (d.anno_flip_v) { rot = (rot + 180) % 360; fh = !fh; }
      d.img_rot = rot; d.img_fh = fh;
      d.markers.forEach(m => {
        if (m.label_x >= 0 && m.label_y >= 0) { m.lx = r1(m.label_x / 100 * ANNO_W); m.ly = r1(m.label_y / 100 * ANNO_H); }
        delete m.label_x; delete m.label_y; delete m.label_w;
      });
      ['anno_photo_x', 'anno_photo_y', 'anno_photo_w', 'anno_photo_h', 'anno_rotate', 'anno_flip_h', 'anno_flip_v'].forEach(k => delete d[k]);
      d.anno_v = 2;
      return true;
    }

    // ── Label geometry (measured with the fonts the page prints with) ──
    let _annoCtx = null;
    function annoTextW(text, font) {
      if (!_annoCtx) _annoCtx = document.createElement('canvas').getContext('2d');
      _annoCtx.font = font;
      return _annoCtx.measureText(String(text)).width;
    }
    const annoFs = d => ANNO_LABEL_FS[d.label_size] || ANNO_LABEL_FS.M;
    const annoLabelH = d => Math.round(annoFs(d) * 1.9);
    const annoPad = d => Math.round(annoFs(d) * 0.6);
    function annoMarkerName(m, i) { return (m && m.label) || ('TC' + (i + 1)); }
    function annoLabelSize(d, m, i, t) {
      const fs = annoFs(d), pad = annoPad(d);
      let w = 3 + annoTextW(annoMarkerName(m, i), `500 ${fs}px ${ANNO_NAME_FONT}`) + pad * 2;
      if (d.show_idx) w += annoTextW(String(i + 1), `700 ${r1(fs * 0.85)}px ${ANNO_NUM_FONT}`) + pad * 1.4;
      if (t) w += annoTextW(t.text, `700 ${fs}px ${ANNO_NUM_FONT}`) + pad * 1.4;
      return { w: Math.ceil(w), h: annoLabelH(d) };
    }
    function annoClampLabel(x, y, w, h) {
      return { x: clampN(x, ANNO_SAFE.l, Math.max(ANNO_SAFE.l, ANNO_SAFE.r - w)), y: clampN(y, ANNO_SAFE.t, Math.max(ANNO_SAFE.t, ANNO_SAFE.b - h)) };
    }
    const annoDot = (d, m) => { const B = annoPh(d, annoPi(m)).img_box; return { x: B.x + m.x / 100 * B.w, y: B.y + m.y / 100 * B.h }; };
    // Label rectangles as drawn (clamped into the page); i = number of the marker.
    // Markers whose photo is not there (a template copy without photos) are left out.
    function annoLabelRects(d, tv) {
      const out = [];
      d.markers.forEach((m, i) => {
        if (!annoHasPh(annoPh(d, annoPi(m)))) return;
        const s = annoLabelSize(d, m, i, tv && tv.byMarker.get(m.id));
        const p = annoClampLabel(m.lx, m.ly, s.w, s.h);
        out.push({ m, i, x: p.x, y: p.y, w: s.w, h: s.h });
      });
      return out;
    }

    // Measured-temperature overlay: each marker shows the Tc of the data-page
    // component with the same name at the chosen Ta, coloured by its margin
    // status. d.temp_src = { page_id, ta } (null / absent = off).
    function annoTempOverlay(d) {
      const src = d.temp_src;
      if (!src || !src.page_id) return null;
      const dp = state.pages.find(p => p.id === src.page_id && p.type === 'data');
      if (!dp) return null;
      const tas = dp.data.ta_conditions || [];
      const ta = tas.includes(src.ta) ? src.ta : (tas.length ? tas[tas.length - 1] : null);
      if (ta === null) return null;
      const comps = dp.data.components || [];
      const byMarker = new Map();
      (d.markers || []).forEach((m, i) => {
        const name = annoMarkerName(m, i);
        let best = null, bestSc = 0;
        comps.forEach(c => {
          const sc = loggerCsv.nameScore(name, c.name) || loggerCsv.nameScore(c.name || '', name);
          if (sc > bestSc) { best = c; bestSc = sc; }
        });
        if (!best || bestSc < 2) return;
        const calc = computeComponent(best, tas);
        const cell = calc.cells.find(x => x.ta === ta);
        if (!cell || (isNaN(cell.tc) && !calc.disabled)) return;
        byMarker.set(m.id, calc.disabled
          ? { text: '斷線', status: 'none' }
          : { text: cell.tc.toFixed(1) + '°C', status: cell.status === 'none' ? 'none' : cell.status });
      });
      const pageIdx = state.pages.indexOf(dp);
      return { ta, byMarker, label: `Ta = ${ta}°C · ${pageBaseLabel(pageIdx)}${dp.data.list_note ? ' · ' + dp.data.list_note : ''}` };
    }

    // ── Shared page HTML (editor + preview + PDF) ──
    // Fitted frames (img_fit: frame aspect = photo aspect) are filled exactly, small photos
    // included; old frames not yet fitted keep the old layout (photo fitted into the
    // unrotated frame, then rotated) so their points stay where they were drawn.
    function annoImgInnerStyle(P) {
      const B = P.img_box, rot = P.img_rot || 0, swap = !!P.img_fit && (rot === 90 || rot === 270);
      const iw = swap ? B.h : B.w, ih = swap ? B.w : B.h;
      const tf = (rot ? `rotate(${rot}deg)` : '') + (P.img_fh ? ' scaleX(-1)' : '');
      return `position:absolute;left:${r1((B.w - iw) / 2)}px;top:${r1((B.h - ih) / 2)}px;width:${r1(iw)}px;height:${r1(ih)}px;display:flex;align-items:center;justify-content:center;${tf ? 'transform:' + tf.trim() + ';' : ''}`;
    }
    // Caption band under the photo (a little wider than it; long text is set smaller).
    // A = the photo's area (annoArea): next to the other photo the band stays on its own side.
    function annoCapRect(P, A = ANNO_SAFE) {
      const B = P.img_box, w = Math.max(40, Math.min(A.r - A.l, B.w + 60));
      return { x: r1(clampN(B.x + B.w / 2 - w / 2, A.l, Math.max(A.l, A.r - w))), y: r1(B.y + B.h), w: r1(w), h: ANNO_CAP_H };
    }
    function annoCapHTML(P, i, editor, A) {
      const cap = annoCap(P);
      if (!cap || !P.img_box) return '';
      const R = annoCapRect(P, A);
      const fs = r1(clampN(11 * (R.w - 8) / Math.max(1, annoTextW(cap, `11px ${ANNO_CAP_FONT}`)), 8, 11));
      return `<div ${editor ? `data-an-cap="${i}"` : ''} style="position:absolute;left:${R.x}px;top:${R.y}px;width:${R.w}px;height:${R.h}px;display:flex;align-items:center;justify-content:center;font-family:${ANNO_CAP_FONT};font-size:${fs}px;color:rgba(15,23,42,0.72);white-space:nowrap;overflow:hidden;z-index:1;">${escHtml(cap)}</div>`;
    }
    function annoImageHTML(d, editor) {
      return annoPhotos(d).map(i => {
        const P = annoPh(d, i), B = P.img_box;
        return `<div ${editor ? `data-an-img="${i}" id="${i ? 'an-img-1' : 'an-img'}"` : ''} style="position:absolute;left:${r1(B.x)}px;top:${r1(B.y)}px;width:${r1(B.w)}px;height:${r1(B.h)}px;overflow:hidden;z-index:1;">
          <div data-an-imgin style="${annoImgInnerStyle(P)}"><img src="${escapeAttr(P.photo_url_or_base64)}" draggable="false" style="${P.img_fit ? 'width:100%;height:100%;' : 'max-width:100%;max-height:100%;'}display:block;"></div>
          <div style="position:absolute;left:0;top:0;right:0;bottom:0;border:1px solid #C2DFF8;"></div>
        </div>${annoCapHTML(P, i, editor, annoArea(d, i))}`;
      }).join('');
    }
    // Leader lines, points and labels. opts.editor adds hit-test attributes and
    // selection classes only (no geometry differences).
    function annoOverlayHTML(d, tv, opts = {}) {
      if (!annoPhotos(d).length) return '';
      const fs = annoFs(d), pad = annoPad(d);
      let lines = '', dots = '', labels = '';
      annoLabelRects(d, tv).forEach(r => {
        const { m, i } = r;
        const p = annoDot(d, m);
        const t = tv && tv.byMarker.get(m.id);
        const cls = opts.editor ? (opts.sel === m.id ? ' sel' : opts.hover === m.id ? ' hover' : '') : '';
        lines += `<line x1="${r1(p.x)}" y1="${r1(p.y)}" x2="${r1(r.x + r.w / 2)}" y2="${r1(r.y + r.h / 2)}" stroke="#dc2626" stroke-width="1.1"/>`;
        dots += `<div ${opts.editor ? `data-an-dot="${escapeAttr(m.id)}" class="an-dot${cls}"` : ''} style="position:absolute;left:${r1(p.x - 4)}px;top:${r1(p.y - 4)}px;width:8px;height:8px;border-radius:50%;background:#dc2626;border:1.5px solid #fff;box-sizing:border-box;z-index:3;"></div>`;
        const ts = t && (ANNO_TEMP_STYLE[t.status] || ANNO_TEMP_STYLE.none);
        labels += `<div ${opts.editor ? `data-an-lbl="${escapeAttr(m.id)}" class="an-lbl${cls}"` : ''} style="position:absolute;left:${r1(r.x)}px;top:${r1(r.y)}px;width:${r.w}px;height:${r.h}px;display:flex;align-items:stretch;box-sizing:border-box;border:1px solid #2357A7;border-radius:3px;background:#fff;overflow:hidden;white-space:nowrap;font-size:${fs}px;line-height:1;color:#0f172a;z-index:4;">`
          + (d.show_idx ? `<span style="display:flex;align-items:center;padding:0 ${r1(pad * 0.7)}px;background:#2357A7;color:#fff;font-family:${ANNO_NUM_FONT};font-weight:700;font-size:${r1(fs * 0.85)}px;">${i + 1}</span>` : '')
          + `<span style="flex:1;display:flex;align-items:center;padding:0 ${pad}px;font-family:${ANNO_NAME_FONT};font-weight:500;">${escHtml(annoMarkerName(m, i))}</span>`
          + (t ? `<span style="display:flex;align-items:center;padding:0 ${r1(pad * 0.7)}px;background:${ts.bg};color:${ts.fg};border-left:1px solid ${ts.bd};font-family:${ANNO_NUM_FONT};font-weight:700;">${escHtml(t.text)}</span>` : '')
          + '</div>';
      });
      return `<svg width="${ANNO_W}" height="${ANNO_H}" viewBox="0 0 ${ANNO_W} ${ANNO_H}" style="position:absolute;left:0;top:0;z-index:2;pointer-events:none;">${lines}</svg>${dots}${labels}`;
    }
    function annoPageInnerHTML(d, opts = {}) {
      const tv = opts.tv !== undefined ? opts.tv : annoTempOverlay(d);
      const legend = tv ? `<span style="margin-left:12px;font-family:'Noto Sans TC','DM Sans',sans-serif;font-size:10.5px;font-weight:500;color:rgba(15,23,42,0.6);">實測 Tc（${escHtml(tv.label)}）　<span style="color:#16a34a;">■</span> Pass　<span style="color:#d97706;">■</span> Warning　<span style="color:#dc2626;">■</span> Fail</span>` : '';
      const layer = `position:absolute;left:0;top:0;width:${ANNO_W}px;height:${ANNO_H}px;`;
      return `<div style="position:absolute;left:0;top:0;width:${ANNO_W}px;height:${ANNO_TITLE_H}px;box-sizing:border-box;padding:10px 18px 0;display:flex;align-items:center;white-space:nowrap;overflow:hidden;">

      for (let k = 0; k < a.length; k += 4) {
        const R = (a[k] * br - 128) * ct + 128, G = (a[k + 1] * br - 128) * ct + 128, Bc = (a[k + 2] * br - 128) * ct + 128;
        a[k] = m[0] * R + m[1] * G + m[2] * Bc;            // Uint8ClampedArray clamps + rounds
        a[k + 1] = m[3] * R + m[4] * G + m[5] * Bc;
        a[k + 2] = m[6] * R + m[7] * G + m[8] * Bc;

    // Auto-enhance = stretch the 1 %–99 % luminance range, expressed as the
    // brightness + contrast slider values (so it previews live and stays editable).
    async function annoAutoLevels(url) {
      const im = await annoLoadImage(url);
      if (!im) return null;
      const sc = Math.min(1, 400 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc));
      const ctx = c.getContext('2d');
      ctx.drawImage(im, 0, 0, c.width, c.height);
      const a = ctx.getImageData(0, 0, c.width, c.height).data;
      const hist = new Array(256).fill(0);
      for (let k = 0; k < a.length; k += 4) hist[Math.round(0.299 * a[k] + 0.587 * a[k + 1] + 0.114 * a[k + 2])]++;

      for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.01) { lo = v; break; } }
      acc = 0;
      for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.01) { hi = v; break; } }

      const ct = 1 - off / 128, br = ga / ct;                    // = contrast(brightness(v))

    // Brightness / contrast / saturation popover (annotation + image pages). Live CSS

    function photoAdjustPopover(anchor, img, o) {
      document.querySelector('.an-pop')?.remove();

      const pop = document.createElement('div');
      pop.className = 'an-pop';
      const row = (k, label, min, max) => `<label class="an-pop-row"><span>${label}</span><input type="range" min="${min}" max="${max}" value="0" data-adj="${k}"><output data-out="${k}">0</output></label>`;

      pop._close = close;

    // target: index of the photo to replace, 'add' (a new photo), or undefined: add while

      const d = page.data;
      annoNormalize(d);
      const have = annoPhotos(d), room = have.length < ANNO_MAX;
      if (target === 'add' && !room) { showToast(`標註頁最多 ${ANNO_MAX} 張照片`, 'warn'); return; }
      let pi = typeof target === 'number' && have.includes(target) ? target : room ? (have.includes(0) ? 1 : 0) : annoUI.photo;
      const replacing = have.includes(pi);
      if (pi === 1 && !d.photo2) d.photo2 = {};
      const P = annoPh(d, pi);
      const rot = clip ? clip.rot || 0 : 0;
      const ar = rot % 180 ? im.naturalHeight / im.naturalWidth : im.naturalWidth / im.naturalHeight;   // as shown
      annoCropUndo.delete(P); annoAdjOriginal.delete(P);
      if (replacing) {                                  // replace: same width and centre (inside its half), points kept
        const B = P.img_box, h = B.w / ar;
        P.img_box = annoFitIn(annoArea(d, pi), { x: B.x, y: B.y + (B.h - h) / 2, w: B.w, h }, annoCapH(P));
      } else if (pi === 0) {
        P.img_box = annoDefaultBox(ar);
      } else {
        P.img_box = { x: ANNO_SAFE.l, y: ANNO_SAFE.t, w: r1(200 * ar), h: 200 };   // placed by the layout below
      }
      P.photo_url_or_base64 = url;
      P.img_rot = rot; P.img_fh = !!(clip && clip.fh); P.img_fit = true;
      if (clip && clip.caption && !replacing && !annoCap(P)) P.caption = clip.caption;
      const capH = annoCapH(P);                       // photo + caption band stay on the page
      if (capH && P.img_box.y + P.img_box.h + capH > ANNO_SAFE.b + 0.5) P.img_box = annoFitInSafe(P.img_box, capH);
      annoUI.tv = undefined; annoUI.photo = pi;
      const tv = annoTempOverlay(d);
      if (!replacing && pi === 1) annoAutoLayout(d, tv);                           // second photo: apply the layout
      else if ((!replacing || have.length > 1) && annoMk(d, pi).length) annoAutoArrange(d, tv, { photo: pi });   // template copy / new size in a half
      annoEnsureLabels(d, tv);
      annoSave(page);
      annoRerender(page);
      if (!replacing && pi === 1) showToast('已加入第二張照片並排版（右側「照片與版面」可切換左右 / 上下）', 'ok');
      else if (replacing && target === undefined) showToast(`已更換照片 ${pi + 1}（標註頁最多 ${ANNO_MAX} 張）`, 'ok');
    }

    async function annoTool(page, tool, btn) {
      const d = page.data;
      const tv = annoTv(d);
      const pi = annoUI.photo, P = annoPh(d, pi);
      const commit = () => { annoUI.tv = undefined; annoSave(page); annoRerender(page); };
      const fileInput = document.getElementById('anno-file-input');
      const photoOps = ['rotl', 'rotr', 'fliph', 'flipv', 'crop', 'center'], allOps = ['layout', 'arrange'];
      // old frames: fit before remapping points
      let fitted = false;
      for (const j of photoOps.includes(tool) ? [pi] : allOps.includes(tool) ? annoPhotos(d) : []) {
        const Q = annoPh(d, j);
        if (Q && !Q.img_fit && await annoEnsureFit(d, j)) fitted = true;
      }
      if (fitted) annoSaveNow(page);
      if (tool === 'select' || tool === 'add') annoSetMode(page, tool);
      else if (tool === 'replace') { annoUI.fileTarget = annoHasPh(P) ? pi : undefined; fileInput?.click(); }
      else if (tool === 'addimg') { annoUI.fileTarget = 'add'; fileInput?.click(); }
      else if (tool === 'copyimg') { if (annoHasPh(P)) showPhotoCopyMenu(btn, { url: P.photo_url_or_base64, rot: P.img_rot, fh: P.img_fh, caption: P.caption }); }
      else if (!annoHasPh(P) && !allOps.includes(tool) && !['size', 'num', 'zoomin', 'zoomout', 'zoomfit', 'uncrop'].includes(tool)) return;
      else if (tool === 'rotl' || tool === 'rotr') { annoRotate(d, tool === 'rotr' ? 1 : -1, pi); annoAutoArrange(d, tv, { photo: pi }); commit(); }
      else if (tool === 'fliph' || tool === 'flipv') { annoFlip(d, tool === 'fliph' ? 'h' : 'v', pi); annoAutoArrange(d, tv, { photo: pi }); commit(); }
      else if (tool === 'crop') {
        openImageCropper(P.photo_url_or_base64, { rotate: P.img_rot || 0, flipH: !!P.img_fh }, (url, r) => {
          if (!r || annoPh(d, pi) !== P) return;
          annoCropUndo.set(P, { url: P.photo_url_or_base64, box: { ...P.img_box }, rot: P.img_rot || 0, fh: !!P.img_fh, pts: annoMk(d, pi).map(m => [m.id, m.x, m.y]) });
          annoAdjOriginal.delete(P);
          annoApplyCrop(d, url, r, pi);
          commit();
        });
      } else if (tool === 'uncrop') {
        const j = [pi, 1 - pi].find(k => annoHasPh(annoPh(d, k)) && annoCropUndo.has(annoPh(d, k)));
        if (j === undefined) return;
        const Q = annoPh(d, j), o = annoCropUndo.get(Q);
        annoCropUndo.delete(Q);
        Q.photo_url_or_base64 = o.url; Q.img_box = o.box; Q.img_rot = o.rot; Q.img_fh = o.fh;
        const pts = new Map(o.pts.map(p => [p[0], p]));
        d.markers.forEach(m => { const p = pts.get(m.id); if (p) { m.x = p[1]; m.y = p[2]; } });
        commit();
      } else if (tool === 'adjust') annoShowAdjust(page, btn);
      else if (tool === 'center') {
        const B = P.img_box, A = annoArea(d, pi), ch = annoCapH(P);
        const dx = r1((A.l + A.r) / 2 - (B.x + B.w / 2)), dy = r1((A.t + A.b) / 2 - (B.y + (B.h + ch) / 2));
        P.img_box = { ...B, x: B.x + dx, y: B.y + dy };
        annoMk(d, pi).forEach(m => { m.lx += dx; m.ly += dy; });
        annoCommitLabels(d, tv);
        commit();
      } else if (tool === 'delimg') annoDeletePhoto(page, pi);
      else if (tool === 'layout') { annoAutoLayout(d, tv); commit(); showToast('已排版（Ctrl+Z 可復原）', 'ok'); }
      else if (tool === 'arrange') {
        if (!d.markers.length) return;
        annoAutoArrange(d, tv); commit();
      } else if (tool === 'size') {
        d.label_size = { S: 'M', M: 'L', L: 'S' }[d.label_size || 'M'];
        annoCommitLabels(d, tv);
        commit();
      } else if (tool === 'num') { d.show_idx = !d.show_idx; annoCommitLabels(d, tv); commit(); }
      else if (tool === 'zoomin') annoZoom(page, 1);
      else if (tool === 'zoomout') annoZoom(page, -1);
      else if (tool === 'zoomfit') annoZoom(page, 0);
    }

    function annoBindEditor(page) {
      const d = page.data;
      const paper = document.getElementById('an-paper');
      const vp = document.getElementById('an-viewport');
      const fileInput = document.getElementById('anno-file-input');

      $canvas.querySelector('.an-toolbar').addEventListener('click', (e) => {
        const b = e.target.closest('[data-an-tool]');
        if (b && !b.disabled) { if (b.dataset.anTool !== 'adjust') b.blur(); annoTool(page, b.dataset.anTool, b); }
      });
      $canvas.querySelector('[data-field="tc_category"]').addEventListener('change', (e) => {
        d.tc_category = e.target.value;
        d.title = d.tc_category + ' Thermocouple Location';
        annoSave(page);
        renderAnnotationPage(page);
      });
      fileInput.addEventListener('change', async () => {
        const f = fileInput.files[0], target = annoUI.fileTarget;
        annoUI.fileTarget = undefined;
        fileInput.value = '';
        if (f) await handleAnnotationPhoto(page, f, target);
      });

      // Drop a photo anywhere on the page area
      vp.addEventListener('dragover', (e) => { if (Array.from(e.dataTransfer?.types || []).includes('Files')) { e.preventDefault(); vp.classList.add('dragover'); } });
      vp.addEventListener('dragleave', (e) => { if (e.target === vp) vp.classList.remove('dragover'); });
      vp.addEventListener('drop', async (e) => {
        vp.classList.remove('dragover');
        const fs = Array.from(e.dataTransfer?.files || []).filter(x => x.type.startsWith('image/'));
        if (!fs.length) return;
        e.preventDefault();
        // onto a photo: replace it; elsewhere: add (up to 2), then replace the selected one
        const onImg = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.matches && el.matches('[data-an-img]'));
        if (onImg) { await handleAnnotationPhoto(page, fs[0], +onImg.dataset.anImg); return; }
        const n = Math.max(1, ANNO_MAX - annoPhotos(d).length);
        for (const f of fs.slice(0, n)) await handleAnnotationPhoto(page, f);
        if (fs.length > n) showToast(`標註頁最多 ${ANNO_MAX} 張照片，其餘未加入`, 'warn');
      });
      vp.addEventListener('wheel', (e) => {
        if (!e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        annoZoom(page, e.deltaY < 0 ? 1 : -1, { x: e.clientX, y: e.clientY });
      }, { passive: false });

      // Side panel
      const side = document.getElementById('an-side');
      side.addEventListener('change', (e) => {
        const t = e.target;
        if (t.matches('[data-anno-temp-page]')) {
          const dp = state.pages.find(p => p.id === t.value);
          d.temp_src = dp ? { page_id: dp.id, ta: (dp.data.ta_conditions || []).slice(-1)[0] } : null;
        } else if (t.matches('[data-anno-temp-ta]')) {
          d.temp_src = Object.assign({}, d.temp_src, { ta: parseFloat(t.value) });
        } else if (t.matches('[data-an-place-src]')) {
          d.place_src = t.value;
          if (annoUI.seq) annoUI.armed = annoUnplaced(d)[0] || null;
          annoSave(page);
          renderAnnotationPage(page);
          return;
        } else if (t.matches('[data-an-capin]')) {
          annoSetCaption(page, +t.dataset.anCapin, t.value.trim());
          return;
        } else {
          if (t.closest('[data-an-name]')) { annoUI.tv = undefined; annoRefreshSide(page); }
          return;
        }
        annoUI.tv = undefined;
        annoCommitLabels(d, annoTv(d));
        annoSave(page);
        renderAnnotationPage(page);
      });
      side.addEventListener('click', (e) => {
        const lay = e.target.closest('[data-an-layout]');
        if (lay) { if (!lay.disabled) annoSetLayout(page, lay.dataset.anLayout); return; }
        if (e.target.closest('#an-swap')) { annoSwapPhotos(page); return; }
        if (e.target.closest('#an-add2')) { annoUI.fileTarget = 'add'; fileInput.click(); return; }
        if (e.target.closest('#an-paste-clip')) { if (photoClip) handleAnnotationPhoto(page, { clip: photoClip }, 'add'); return; }
        const pdel = e.target.closest('[data-an-pdel]');
        if (pdel) { annoDeletePhoto(page, +pdel.dataset.anPdel); return; }
        const prow = e.target.closest('[data-an-prow]');
        if (prow) { if (!e.target.closest('input')) annoSelectPhoto(page, +prow.dataset.anProw); return; }
        const chip = e.target.closest('[data-an-arm]');
        if (chip) { annoArm(page, annoUI.armed === chip.dataset.anArm ? null : chip.dataset.anArm, false); return; }
        if (e.target.closest('#an-seq')) { if (annoUI.seq) { annoUI.seq = false; annoUI.armed = null; renderAnnotationPage(page); } else annoArm(page, annoUnplaced(d)[0], true); return; }
        const del = e.target.closest('[data-an-del]');
        if (del) { annoDeleteMarker(page, del.dataset.anDel); return; }
        if (e.target.closest('#anno-batch-name')) { showAnnoBatchNameModal(page); return; }
        const row = e.target.closest('[data-an-row]');
        if (row && !e.target.closest('input')) annoSelect(page, row.dataset.anRow);
      });
      side.addEventListener('focusin', (e) => {
        const c = e.target.closest('[data-an-capin]');
        if (c) { annoSelectPhoto(page, +c.dataset.anCapin); return; }
        const n = e.target.closest('[data-an-name]');
        if (n && annoUI.sel !== n.dataset.anName) annoSelect(page, n.dataset.anName);
      });
      side.addEventListener('input', (e) => {
        const c = e.target.closest('[data-an-capin]');
        if (c) {                                               // live on the page; committed (and saved) on change
          const P = annoPh(d, +c.dataset.anCapin);
          if (P) { P.caption = c.value; annoRenderCaps(d); }
          return;
        }
        const n = e.target.closest('[data-an-name]');
        if (!n) return;
        const m = d.markers.find(x => x.id === n.dataset.anName);
        if (!m) return;
        m.label = n.value;
        annoUI.tv = undefined;
        annoRenderOverlay(page);
        annoSave(page);
      });
      side.addEventListener('keydown', (e) => {
        if (e.target.closest('[data-an-capin]') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); return; }
        const n = e.target.closest('[data-an-name]');
        if (n && e.key === 'Enter') { e.preventDefault(); const next = n.closest('li').nextElementSibling?.querySelector('[data-an-name]'); if (next) next.focus(); else n.blur(); }
      });
      side.addEventListener('mouseover', (e) => {
        const row = e.target.closest('[data-an-row]');
        const id = row ? row.dataset.anRow : null;
        if (id !== annoUI.hover) { annoUI.hover = id; annoRenderOverlay(page); }
      });
      side.addEventListener('mouseleave', () => { if (annoUI.hover) { annoUI.hover = null; annoRenderOverlay(page); } });

      // Page: drop zone button
      paper.addEventListener('click', (e) => {
        if (e.target.closest('#an-drop-clip')) { if (photoClip) handleAnnotationPhoto(page, { clip: photoClip }); return; }
        if (e.target.closest('.an-drop-btn')) { annoUI.fileTarget = undefined; fileInput.click(); return; }
        const g = e.target.closest('[data-an-capedit]');
        if (g) annoEditCaption(page, +g.dataset.anCapedit);
      });
      paper.addEventListener('contextmenu', (e) => {
        const t = e.target.closest('[data-an-lbl],[data-an-dot]');
        if (!t) return;
        e.preventDefault();
        const id = t.dataset.anLbl || t.dataset.anDot;
        annoSelect(page, id);
        annoShowMenu(page, id, e.clientX, e.clientY);
      });
      paper.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.an-rename, .an-drop-btn, [data-an-capedit]')) return;
        // pan: middle button, or Space + drag
        if (e.button === 1 || (e.button === 0 && annoUI.space)) {
          e.preventDefault();
          const sx = e.clientX, sy = e.clientY, sl = vp.scrollLeft, st = vp.scrollTop;
          annoDrag(paper, e, ev => { vp.scrollLeft = sl - (ev.clientX - sx); vp.scrollTop = st - (ev.clientY - sy); }, () => {});
          return;
        }
        if (e.button !== 0 || !annoPhotos(d).length) return;
        const handle = e.target.closest('[data-an-handle]');
        const dot = e.target.closest('[data-an-dot]');
        const lbl = e.target.closest('[data-an-lbl]');
        const onImg = e.target.closest('[data-an-img]') || (annoUI.mode === 'select' ? e.target.closest('[data-an-cap]') : null);
        const pi = onImg ? +(onImg.dataset.anImg ?? onImg.dataset.anCap) : annoUI.photo;
        const P = annoPh(d, pi);
        const tv = annoTv(d);
        const p0 = annoPt(paper, e);
        if (!handle && !dot && !lbl && !onImg) { if (annoUI.sel) annoSelect(page, null); return; }
        e.preventDefault();
        document.activeElement?.blur?.();
        const capEl = !dot && !lbl && annoUI.mode === 'select' ? e.target.closest('[data-an-cap]') : null;
        const hitId = (dot && dot.dataset.anDot) || (lbl && lbl.dataset.anLbl) || (capEl ? 'cap:' + capEl.dataset.anCap : null);
        const last = annoUI.lastPress;
        annoUI.lastPress = hitId ? { id: hitId, t: e.timeStamp, x: e.clientX, y: e.clientY } : null;
        if (hitId && last && last.id === hitId && e.timeStamp - last.t < 450 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 6) {
          annoUI.lastPress = null;
          if (capEl) annoEditCaption(page, +capEl.dataset.anCap);
          else annoStartRename(page, hitId);
          return;
        }

        if (handle) {                                            // resize the selected photo, aspect locked, opposite corner fixed
          const hp = annoUI.photo, H = annoPh(d, hp);
          if (!annoHasPh(H)) return;
          const c = handle.dataset.anHandle, B0 = { ...H.img_box }, ar = B0.w / B0.h, ch = annoCapH(H);
          const ax = c[1] === 'e' ? B0.x : B0.x + B0.w, ay = c[0] === 's' ? B0.y : B0.y + B0.h;
          const sx = c[1] === 'e' ? 1 : -1, sy = c[0] === 's' ? 1 : -1;
          const maxW = Math.min(sx > 0 ? ANNO_SAFE.r - ax : ax - ANNO_SAFE.l, (sy > 0 ? ANNO_SAFE.b - ch - ay : ay - ANNO_SAFE.t) * ar);
          const L0 = annoMk(d, hp).map(m => { const s = annoLabelSize(d, m, d.markers.indexOf(m), tv && tv.byMarker.get(m.id)); return { m, cx: m.lx + s.w / 2, cy: m.ly + s.h / 2, w: s.w, h: s.h }; });
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            const w = clampN(Math.max((p.x - ax) * sx, (p.y - ay) * sy * ar), 60, maxW), h = w / ar;
            H.img_box = { x: r1(sx > 0 ? ax : ax - w), y: r1(sy > 0 ? ay : ay - h), w: r1(w), h: r1(h) };
            if (!ev.altKey) {
              const k = w / B0.w;
              L0.forEach(o => { o.m.lx = r1(ax + (o.cx - ax) * k - o.w / 2); o.m.ly = r1(ay + (o.cy - ay) * k - o.h / 2); });
            }
            annoApplyImgBox(d, hp);
            annoRenderOverlay(page);
          }, () => { annoCommitLabels(d, tv); annoSave(page); annoRenderOverlay(page); });
          return;
        }

        if (dot) {                                               // move the point (stays on the photo)
          const m = d.markers.find(x => x.id === dot.dataset.anDot);
          if (!m) return;
          annoSelect(page, m.id);
          let moved = false;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 3) return;
            moved = true;
            const B = annoPh(d, annoPi(m)).img_box;
            m.x = p2(clampN((p.x - B.x) / B.w * 100, 0, 100));
            m.y = p2(clampN((p.y - B.y) / B.h * 100, 0, 100));
            annoRenderOverlay(page);
          }, () => { if (moved) annoSave(page); });
          return;
        }

        if (lbl) {                                               // move the label (snaps to other labels' edges)
          const m = d.markers.find(x => x.id === lbl.dataset.anLbl);
          if (!m) return;
          annoSelect(page, m.id);
          const rects = annoLabelRects(d, tv);
          const me = rects.find(r => r.m === m);
          const edges = rects.filter(r => r.m !== m).flatMap(r => [r.x, r.x + r.w]);
          let moved = false;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 3) return;
            moved = true;
            let x = me.x + p.x - p0.x;
            const y = me.y + p.y - p0.y;
            let snap = null;
            if (!ev.altKey) {
              const tol = 5 / p.k;
              for (const ex of edges) {
                if (Math.abs(x - ex) < tol) { x = ex; snap = ex; break; }
                if (Math.abs(x + me.w - ex) < tol) { x = ex - me.w; snap = ex; break; }
              }
            }
            const q = annoClampLabel(x, y, me.w, me.h);
            m.lx = r1(q.x); m.ly = r1(q.y);
            annoRenderOverlay(page);
            const g = paper.querySelector('.an-guide');
            if (g) { g.style.display = snap === null ? 'none' : 'block'; g.style.left = snap + 'px'; }
          }, () => {
            const g = paper.querySelector('.an-guide');
            if (g) g.style.display = 'none';
            if (moved) annoSave(page);
          });
          return;
        }

        if (onImg && annoUI.mode === 'add') {                     // new point; drag out to place its label
          const B = P.img_box;
          const m = { id: annoNewId(), x: p2(clampN((p0.x - B.x) / B.w * 100, 0, 100)), y: p2(clampN((p0.y - B.y) / B.h * 100, 0, 100)), label: annoUI.armed || '' };
          if (pi === 1) m.p = 1;
          annoSelectPhoto(page, pi);
          d.markers.push(m);
          annoSortMarkers(d);
          annoUI.sel = m.id; annoUI.tv = undefined;
          const tv2 = annoTv(d);
          annoPlaceLabel(d, m, tv2);
          annoRenderOverlay(page);
          let moved = false;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 6) return;
            moved = true;
            const s = annoLabelSize(d, m, d.markers.indexOf(m), tv2 && tv2.byMarker.get(m.id));
            const q = annoClampLabel(p.x - s.w / 2, p.y - s.h / 2, s.w, s.h);
            m.lx = r1(q.x); m.ly = r1(q.y);
            annoRenderOverlay(page);
            const rub = paper.querySelector('.an-rubber'), line = rub && rub.querySelector('line');
            if (line) { rub.style.display = 'block'; line.setAttribute('x1', p0.x); line.setAttribute('y1', p0.y); line.setAttribute('x2', p.x); line.setAttribute('y2', p.y); }
          }, () => {
            const rub = paper.querySelector('.an-rubber');
            if (rub) rub.style.display = 'none';
            annoSave(page);
            if (annoUI.armed) annoNextArmed(d);
            annoUI.tv = undefined;
            annoRefresh(page);
            if (!m.label) annoStartRename(page, m.id);
          });
          return;
        }

        if (onImg) {                                             // move photo i with its labels (Alt: photo + points only)
          const reselect = pi !== annoUI.photo;
          annoSelectPhoto(page, pi);
          const B0 = { ...P.img_box }, ch = annoCapH(P);
          const L0 = annoMk(d, pi).map(m => [m, m.lx, m.ly]);
          let moved = false;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 3) return;
            moved = true;
            const dx = clampN(p.x - p0.x, ANNO_SAFE.l - B0.x, Math.max(ANNO_SAFE.l - B0.x, ANNO_SAFE.r - B0.x - B0.w));

    // Keyboard: V / A modes, Esc, Delete, arrows (label; Alt = point), Enter / F2 rename,
    // Ctrl+D duplicate, + / − / 0 zoom, Space = pan. Only while an annotation page is open.
    window.addEventListener('keydown', (e) => {
      const page = state.pages[state.activePage];
      if (!page || page.type !== 'annotation' || !document.getElementById('an-paper')) return;
      if (document.querySelector('.tool-modal-overlay, .sim-modal-overlay, .hp-modal-overlay, .update-backdrop') || document.getElementById('preview-overlay')?.classList.contains('open')) return;

      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      const d = page.data;
      const k = e.key;
      let handled = true;
      if (e.ctrlKey || e.metaKey) {
        if ((k === 'd' || k === 'D') && annoUI.sel) annoDuplicate(page, annoUI.sel);
        else if ((k === 'c' || k === 'C') && annoHasPh(annoPh(d, annoUI.photo)) && !String(window.getSelection() || '')) {
          const P = annoPh(d, annoUI.photo);
          copyPhotoKey({ url: P.photo_url_or_base64, rot: P.img_rot, fh: P.img_fh, caption: P.caption });
        } else handled = false;
      } else if (k === 'v' || k === 'V') annoSetMode(page, 'select');
      else if (k === 'a' || k === 'A') annoSetMode(page, 'add');
      else if (k === 'Escape') {
        const pop = document.querySelector('.an-pop, .an-ctx');
        if (pop) { if (pop._close) pop._close(); else pop.remove(); }
        else if (annoUI.mode === 'add') annoSetMode(page, 'select');
        else if (annoUI.sel) annoSelect(page, null);
        else handled = false;
      } else if ((k === 'Delete' || k === 'Backspace') && annoUI.sel) annoDeleteMarker(page, annoUI.sel);
      else if ((k === 'Enter' || k === 'F2') && annoUI.sel) annoStartRename(page, annoUI.sel);
      else if (k.startsWith('Arrow') && annoUI.sel) {
        const m = d.markers.find(x => x.id === annoUI.sel);
        if (!m) return;
        const dx = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0, dy = k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0;
        if (e.altKey) {

      else if (k === '-' || k === '_') annoZoom(page, -1);
      else if (k === '0') annoZoom(page, 0);
      else if (k === ' ') { annoUI.space = true; document.getElementById('an-paper')?.classList.add('panning'); }

      if (handled) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ' && annoUI.space) { e.preventDefault(); annoUI.space = false; document.getElementById('an-paper')?.classList.remove('panning'); }
    }, true);
    window.addEventListener('blur', () => { annoUI.space = false; document.getElementById('an-paper')?.classList.remove('panning'); });   // missed keyup (Alt+Tab)

    // ━━━ Copy a photo between image / annotation pages ━━━

    // and puts what is shown on the system clipboard as PNG (so Ctrl+V works on any
    // image / annotation page, or in PowerPoint …). Pasting that same picture back into
    // the tool uses photoClip, so the photo is not compressed a second time.
    let photoClip = null;                    // { url, rot, fh, caption, sig }

    function photoPixelHash(src, w, h) {

      menu.innerHTML = `<div class="an-ctx-note">✓ 已複製${sys ? '：到任何圖片頁 / 標註頁按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 貼上' : '：到任何圖片頁 / 標註頁按「📋 貼上複製的圖片」'}</div>

        const act = e.target.closest('[data-act]')?.dataset.act;

    }

      const { clip, sys } = await copyPhoto(src);
      if (photoClip !== clip) return;
      showToast(sys ? '已複製圖片：到任何圖片頁 / 標註頁按 Ctrl+V 貼上' : '已複製圖片：到任何圖片頁 / 標註頁按「📋 貼上複製的圖片」', 'ok');

    //

    //              shown in its slot frame: contain-fit × z, centred on (cx, cy) of the photo

    const IM_GAP = 12, IM_CAP_H = 20;

    function imNormalize(d) {
      if (!d) return false;

      if (!Array.isArray(d.texts)) d.texts = [];
      d.images.forEach(im => { if (im && !Array.isArray(im.callouts)) im.callouts = []; });
      if (d.im_v === 2) return false;

      // Old PDF grid: 786 px wide; height 595 − 22 − 28 − title band (42, or 22 with no title);
      // 10 px gaps; 1 col (≤ 1) · 2 cols (2) · 2 × 2 (≥ 3) by split %; a 29 px caption under
      // captioned photos; markers were % of the cell's photo box (inside its 1 px border).
      const n0 = d.images.length, gridH = 595 - 22 - 28 - (String(d.title || '').trim() ? 42 : 22);
      const oc = (d.col_split != null ? d.col_split : 50) / 100, orr = (d.row_split != null ? d.row_split : 50) / 100;
      d.images.forEach((im, i) => {
        if (!im || !im.url_or_base64) return;
        const w = n0 <= 1 ? 786 : (786 - 10) * (i % 2 ? 1 - oc : oc);
        const h = n0 <= 2 ? gridH : (gridH - 10) * (Math.floor(i / 2) ? 1 - orr : orr);

      });

      d.split = { c: d.col_split != null ? d.col_split : 50, r: d.row_split != null ? d.row_split : 50 };
      delete d.col_split; delete d.row_split;

        im.rot = rot; im.fh = fh;
        delete im.rotate; delete im.flip_h; delete im.flip_v;
        const legacy = (im.zoom && im.zoom !== 1) || im.off_x || im.off_y || (im.markers || []).length || (im.circles || []).length;
        if (legacy) im.legacy = im._oldCell;       // converted once the photo's size is known (imEnsureAspect)
        else { delete im.zoom; delete im.off_x; delete im.off_y; delete im.markers; delete im.circles; }
        delete im._oldCell;

    }

        case '2x2': return [R(A.x, A.y, w1, h1), R(A.x + w1 + g, A.y, A.w - g - w1, h1), R(A.x, A.y + h1 + g, w1, A.h - g - h1), R(A.x + w1 + g, A.y + h1 + g, A.w - g - w1, A.h - g - h1)];

    const imLabelText = (c, k) => c.label || (c.type === 'circle' ? '圈選' : c.type === 'rect' ? '方框' : c.type === 'text' ? '文字' : '標註') + (k + 1);

    function imCalloutGeo(d) {

    // Move photos / shapes / frames to their current geometry without rebuilding the

    function imUpdateGeo(page) {
      const d = page.data, slots = imSlots(d);
      d.images.forEach((im, i) => {
        const fr = document.querySelector(`[data-im-frame="${i}"]`);
        if (!fr || !slots[i]) return;
        const F = imFrame(slots[i], im), R = imPhotoRect(im, F);
        Object.assign(fr.style, { left: F.x + 'px', top: F.y + 'px', width: F.w + 'px', height: F.h + 'px' });
        const cap = document.querySelector(`[data-im-cap="${i}"]`);

        if (rot) {

    // Inline edit of a label (callout / text) or a caption.
    function imInlineEdit(page, rect, value, placeholder, fs, onDone) {
      const ui = document.getElementById('an-ui');

    async function imAddFiles(page, files, at) {
      const d = page.data;

    async function imTool(page, tool, btn) {
      const d = page.data, i = imUI.selImg, im = i !== null ? d.images[i] : null;
      const F = im ? imFrame(imSlots(d)[i], im) : null;
      const commit = () => { imSave(page); imRerender(page); };
      if (['select', 'dot', 'circle', 'rect', 'text'].includes(tool)) { imSetMode(page, tool); return; }
      if (tool === 'size') { d.label_size = { S: 'M', M: 'L', L: 'S' }[d.label_size || 'M']; commit(); return; }
      if (tool === 'vzin') return annoZoom(page, 1, null, imUI);
      if (tool === 'vzout') return annoZoom(page, -1, null, imUI);
      if (tool === 'vzfit') return annoZoom(page, 0, null, imUI);
      if (!im) return;
      if (!im.nar && ['rotl', 'rotr', 'fliph', 'flipv', 'crop', 'zin', 'zout', 'fit', 'fill'].includes(tool)) {

      else if (tool === 'rotl' || tool === 'rotr') { imRotate(im, tool === 'rotr' ? 1 : -1); imClampView(im, F); commit(); }
      else if (tool === 'fliph' || tool === 'flipv') { imFlip(im, tool === 'fliph' ? 'h' : 'v'); commit(); }
      else if (tool === 'zin' || tool === 'zout') {
        im.z = clampN((im.z || 1) * (tool === 'zin' ? 1.25 : 0.8), 0.2, 8);
        imClampView(im, F); commit();
      } else if (tool === 'fit' || tool === 'fill') { im.z = Math.round(imContainZ(im, F, tool) * 1e4) / 1e4; im.cx = 0.5; im.cy = 0.5; commit(); }
      else if (tool === 'up' || tool === 'down') {
        const j = tool === 'up' ? i - 1 : i + 1;
        if (!d.images[j]) return;
        [d.images[i], d.images[j]] = [d.images[j], d.images[i]];
        d.images.forEach((x, n) => { x.position = n; });
        imUI.selImg = j;

      } else if (tool === 'crop') {

          if (c.w != null) { c.w = Math.round(c.w * o.r.w * 1e4) / 1e4; c.h = Math.round(c.h * o.r.h * 1e4) / 1e4; }

    function imBind(page) {
