    // Loads the export fonts for exactly these glyphs (Google Fonts serves CJK in
    // unicode-range subsets, fetched only for the characters asked for).
    async function loadPdfFonts(doc, glyphs, timeoutMs = 0) {
      if (!doc.fonts || !doc.fonts.load) return;
      const specs = [];
      ["'Space Grotesk'", "'DM Sans'", "'Noto Sans TC'", "'JetBrains Mono'"].forEach(fam => {
        ['400', '500', '600', '700'].forEach(w => specs.push(`${w} 12px ${fam}`));
      });
      const text = Array.from(new Set(String(glyphs || ''))).join('') || 'A';
      const all = Promise.all(specs.map(sp => doc.fonts.load(sp, text).catch(() => {})))
        .then(() => doc.fonts.ready).catch(() => {});
      await (timeoutMs ? Promise.race([all, new Promise(r => setTimeout(r, timeoutMs))]) : all);
    }

    // Pages laid out with exactly the fonts they are drawn with. Loading by the data alone
    // misses text the builders add (「ΔT」, the margin note, titles …); html2canvas loads
    // those subsets in its copy of the page, so rows drawn there came out taller than
    // measured (preview fine, PDF over the footer). So: lay out, load the fonts for the
    // text of the built pages, and lay out again if that brought in any new font.
    const PDF_GLYPHS = '類別元件名稱備註類型實測頁THERMAL TEST DATA EMBEDDED SENSOR READINGS SensorLocalRemoteRFDigitalPWRRecAbs0123456789.-/%°CΔT✓✗—–−×≥≤±→※·（）：；、，。';
    const pagesText = (vps) => vps.map(vp => { const t = document.createElement('template'); t.innerHTML = vp.html; return t.content.textContent; }).join('');
    const loadedFaces = () => { let n = 0; document.fonts.forEach(f => { if (f.status === 'loaded') n++; }); return n; };
    const nextFrames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    // built: pages already laid out with the fonts loaded right now (reused when no font arrives).
    async function buildVirtualPagesWithFonts(built) {
      if (!document.fonts || !document.fonts.load) return built || buildVirtualPages();
      let glyphs = PDF_GLYPHS;
      try { glyphs += JSON.stringify((state.pages || []).map(p => p.data), (k, v) => typeof v === 'string' && v.startsWith('data:') ? '' : v); } catch (_) {}
      const start = loadedFaces();
      try { await loadPdfFonts(document, glyphs); await nextFrames(); } catch (e) { /* lay out with what is there */ }
      let vps = built && loadedFaces() === start ? built : buildVirtualPages();
      try {
        const before = loadedFaces();
        await loadPdfFonts(document, pagesText(numberVirtualPages(vps)));
        if (loadedFaces() !== before) { await nextFrames(); vps = buildVirtualPages(); }
      } catch (e) { /* keep the first layout */ }
      return vps;
    }
    // Safety net for the html2canvas copy: if a page there still ends lower than the
    // pagination measured (a font that did not arrive in time …), shrink its content a
    // little so it stays above the footer note / page number instead of running over them.
    function pdfFitToFooter(root) {
      const end = root.querySelector('[data-pg-end]'), box = end && end.parentElement;
      if (!box) return 1;
      const top = root.getBoundingClientRect().top;
      const foots = Array.from(root.querySelectorAll('[data-pg-foot]'), f => f.getBoundingClientRect().top - top);
      const room = Math.min(PG_LIMIT, ...foots.map(f => f - PG_FOOT_GAP));
      const y = end.getBoundingClientRect().top - top, y0 = box.getBoundingClientRect().top - top;
      if (y <= room + 0.5 || y - y0 < 1) return 1;
      const k = Math.max(0.8, (room - y0) / (y - y0));
      box.style.transformOrigin = 'top center';
      box.style.transform = `scale(${k})`;
      return k;
    }

    async function exportPDF(selectedPageIdxs, opts = {}) {
      if (state.pages.length === 0) return;
      if (typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
        alert('PDF 匯出函式庫載入中，請稍後再試');
        return;
      }

      setStatus('saving', '匯出中...');
      const { jsPDF } = jspdf;

      // Build filename from cover page
      let filename = 'ThermalReport';
      const coverPage = state.pages.find(p => p.type === 'cover');
      if (coverPage && coverPage.data) {
        const d = coverPage.data;
        const parts = [];
        if (d.project_name) parts.push(d.project_name.replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g, '_'));
        if (d.stage) parts.push(d.stage);
        if (d.date) parts.push(d.date);
        if (d.report_version) parts.push(String(d.report_version).replace(/[^a-zA-Z0-9._-]/g, '_'));
        parts.push('ThermalReport');
        filename = parts.join('_');
      } else {
        filename += '_' + todayStr();
      }

      // Ensure webfonts are fully loaded before measuring row heights — otherwise
      // pagination measures with fallback metrics and the rendered page overflows.
      // IMPORTANT: Google Fonts splits CJK into many unicode-range subsets, and
      // document.fonts.load() with the default Latin probe string never fetches
      // the subset that contains 元件名稱/備註 etc. We must load with the ACTUAL
      // glyphs that will be rendered, or the measurer lays CJK out with a shorter
      // system fallback (under-measuring) while the export renders the taller
      // webfont — pushing the last row onto the footer.
      let pdf = null;
      let virtualPages = await buildVirtualPagesWithFonts();   // see there: same fonts as the render
      // Optional page selection: keep only virtual pages whose source page was picked.
      if (selectedPageIdxs instanceof Set) {
        virtualPages = virtualPages.filter(vp => selectedPageIdxs.has(vp.pageIdx));
      }
      virtualPages = numberVirtualPages(virtualPages);
      if (virtualPages.length === 0) {
        setStatus('saved', '未選取頁面');
        alert('未選取任何可匯出的頁面。');
        return;
      }

      try {
        for (let i = 0; i < virtualPages.length; i++) {
          const vp = virtualPages[i];
          const isLandscape = vp.isLandscape;
          const w = isLandscape ? 842 : 595;
          const h = isLandscape ? 595 : 842;

          const offscreen = document.createElement('div');
          offscreen.className = 'pdf-offscreen';
          offscreen.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px;background:#fff;z-index:-1;overflow:hidden;font-family:${PDF_FONT};letter-spacing:0px;word-spacing:0px;`;
          // html2canvas letter-spacing workaround, scoped to the offscreen page
          // only (an unscoped rule would restyle the whole app while exporting).
          const resetStyle = document.createElement('style');
          resetStyle.textContent = '.pdf-offscreen *, .pdf-offscreen *::before, .pdf-offscreen *::after { letter-spacing: 0px !important; word-spacing: 0px !important; text-transform: none !important; }';
          offscreen.appendChild(resetStyle);
          const content = document.createElement('div');
          content.style.cssText = 'width:100%;height:100%;letter-spacing:0px;word-spacing:0px;';
          content.innerHTML = vp.html;
          offscreen.appendChild(content);
          document.body.appendChild(offscreen);

          let canvasImg;
          try {
            const imgs = offscreen.querySelectorAll('img');
            if (imgs.length > 0) {
              await Promise.all(Array.from(imgs).map(img =>
                img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
              ));
            }
            await new Promise(r => setTimeout(r, 100));

            canvasImg = await html2canvas(offscreen, {
              scale: 2,
              useCORS: true,
              backgroundColor: '#ffffff',
              width: w,
              height: h,
              logging: false,
              // html2canvas lays the page out again in a cloned document, which loads
              // the webfonts anew: wait for the glyphs of this page there too, or it
              // can draw rows with fallback metrics, taller than the pagination measured.
              onclone: async (doc, el) => { await loadPdfFonts(doc, el.textContent, 4000); pdfFitToFooter(el); },
            });
          } finally {
            offscreen.remove();   // always clean up, even when rendering fails
          }

          const orientation = isLandscape ? 'landscape' : 'portrait';
          const pdfW = isLandscape ? 297 : 210;
          const pdfH = isLandscape ? 210 : 297;

          if (pdf === null) {
            pdf = new jsPDF({ orientation, unit: 'mm', format: 'a4' });
          } else {
            pdf.addPage('a4', orientation);
          }

          const imgData = canvasImg.toDataURL('image/jpeg', 0.92);
          pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
        }

        pdf.save(filename + '.pdf');
        setStatus('saved', 'PDF 已匯出');
        console.log('✅ PDF exported:', filename + '.pdf');
        if (opts.upload) {
          try {
            const url = await spSync.uploadExport(opts.folder || 'Report', filename + '.pdf', pdf.output('blob'));
            showToast(`PDF 已上傳到 SharePoint：Reports/${opts.folder || 'Report'}/`, 'ok', 8000, url ? { href: url, label: '開啟' } : null);
          } catch (e) {
            showToast(e && e.auth
              ? 'PDF 已下載；SharePoint 登入已過期，請按工具列的 ☁ 重新登入後再匯出一次'
              : 'PDF 已下載，但上傳 SharePoint 失敗：' + (e.message || e), 'err', 9000);
          }
        }
      } catch (err) {
        console.error('PDF export error:', err);
        setStatus('saved', '匯出失敗');
        alert('PDF 匯出失敗：' + err.message);
      }
    }

    // ━━━ Efficiency tools (效率小工具) ━━━
    // Shared helpers for the "fewer clicks" features: tool modal, remembered
    // defaults, component-spec memory, data-page summary, data-logger import,
    // Sim Tc paste by name, conclusion draft, batch images, report check and
    // page-list badges.

    // Dark tool modal (same look as the pickers). `title` is HTML (escape it).
    function openToolModal({ title, body, footer, width, onClose }) {
      const overlay = document.createElement('div');
      overlay.className = 'sim-modal-overlay tool-modal-overlay';
      overlay.innerHTML = `<div class="sim-modal tool-modal"${width ? ` style="width:${width}px"` : ''}>
          <div class="sim-modal-header">${title}</div>
          <div class="sim-modal-body tool-modal-body">${body}</div>
          <div class="sim-modal-footer">${footer}</div>
        </div>`;
      document.body.appendChild(overlay);
      let closed = false;
      const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
      function close() {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onKey, true);
        overlay.remove();
        if (onClose) onClose();
      }
      document.addEventListener('keydown', onKey, true);
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
      const $ = sel => overlay.querySelector(sel);
      const $$ = sel => Array.from(overlay.querySelectorAll(sel));
      return { overlay, close, $, $$ };
    }

    // Small per-user preferences kept in this browser (not report data).
    const LS_PREFS = 'thermal_user_prefs';
    function userPrefs() {
      try { return JSON.parse(localStorage.getItem(LS_PREFS)) || {}; } catch (e) { return {}; }
    }
    function setUserPref(key, value) {
      try { const p = userPrefs(); p[key] = value; localStorage.setItem(LS_PREFS, JSON.stringify(p)); } catch (e) { /* private mode */ }
    }
    // Default Tested by: last one typed on a cover, else the Microsoft account name.
    function defaultTestedBy() {
      const p = userPrefs();
      if (p.tested_by) return p.tested_by;
      try { const acc = window.spSync && spSync.account(); return (acc && acc.name) || ''; } catch (e) { return ''; }
    }

    const round1 = v => Math.round(v * 10) / 10;
    const naturalCompare = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });

    // ── Component spec memory ──
    // Specs entered for a component name in ANY report are remembered: the name
    // field offers them (datalist) and an empty-spec component with that name is
    // filled in (category / spec type / Tc spec / derating / TIM).
    let specMemoryOthers = new Map();      // other reports of this database
    const specKey = n => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
    function addSpecEntry(map, c, from) {
      const k = specKey(c && c.name);
      if (!k || !(parseTemp(c.tc_spec) > 0)) return;
      map.set(k, {
        name: String(c.name).trim(), category: c.category || 'RF', spec_type: c.spec_type || 'Rec.',
        tc_spec: numStr(c.tc_spec), derating: c.derating || '', tim_type: c.tim_type || '', from: from || '',
      });
    }
    async function loadSpecMemory() {
      const map = new Map();
      try {
        const digests = await dbAdapter.getReportDigests();
        reportDigestCache = digests.filter(r => r.id !== state.reportId);
        digests.filter(r => r.id !== state.reportId)
          .sort((a, b) => String(a.updated_at || '').localeCompare(String(b.updated_at || '')))   // newest last → wins
          .forEach(r => r.dataPages.forEach(dp => dp.components.forEach(c => addSpecEntry(map, c, r.project_name || ''))));
      } catch (e) { /* no database / old file: memory stays empty */ }
      specMemoryOthers = map;
    }
    // Other reports + this report's data pages (this report wins).
    function specMemory() {
      const map = new Map(specMemoryOthers);
      state.pages.forEach(p => {
        if (p.type === 'data') (p.data.components || []).forEach(c => addSpecEntry(map, c, '本報告'));
      });
      return map;
    }
    // Fill an empty-spec component from memory. Returns the entry used, or null.
    function fillSpecFromMemory(comp, mem) {
      if (!comp || parseTemp(comp.tc_spec) > 0) return null;
      const e = (mem || specMemory()).get(specKey(comp.name));
      if (!e) return null;
      comp.category = e.category;
      comp.spec_type = e.spec_type;
      comp.tc_spec = e.tc_spec;
      if (e.derating) comp.derating = e.derating;
      if (e.tim_type && !comp.tim_type) comp.tim_type = e.tim_type;
      return e;
    }
    function specMemoryDatalistHTML(mem) {
      const opts = Array.from(mem.values()).sort((a, b) => naturalCompare(a.name, b.name)).map(e =>
        `<option value="${escapeAttr(e.name)}">${escHtml(`${e.category} · ${e.spec_type} ${e.tc_spec}°C × ${e.derating || '—'}${e.from ? ' · ' + e.from : ''}`)}</option>`);
      return `<datalist id="dt-name-memory">${opts.join('')}</datalist>`;
    }

    // ── Data page: summary bar ──
    function dataPageStats(d) {
      const tas = d.ta_conditions || [];
      const rows = (d.components || []).map((c, ri) => ({ c, ri, calc: computeComponent(c, tas) }));
      const n = { total: rows.length, pass: 0, warn: 0, fail: 0, unmeasured: 0, noSpec: 0, off: 0 };
      let worst = null, hottest = null;
      rows.forEach(x => {
        if (x.calc.disabled) { n.off++; return; }
        if (!(x.calc.derated > 0)) n.noSpec++;
        else if (x.calc.status === 'none') n.unmeasured++;
        else n[x.calc.status]++;
        const w = x.calc.worst;
        if (w && (!worst || w.marginPct < worst.cell.marginPct)) worst = { x, cell: w };
        const m = x.calc.maxCell;
        if (m && (!hottest || m.tc > hottest.cell.tc)) hottest = { x, cell: m };
      });
      const memFillable = (d.components || []).filter(c => !(parseTemp(c.tc_spec) > 0) && String(c.name || '').trim()).length;
      return { rows, n, worst, hottest, memFillable };
    }
    function dataSummaryHTML(d) {
      const s = dataPageStats(d);
      if (!s.n.total) return '';
      const nm = x => escHtml(x.c.name || '(未命名)');
      const chip = (cls, label, jump) => jump
        ? `<button type="button" class="dt-sum-chip ${cls}" data-sum-jump="${jump}" data-freeze-keep title="跳到第一顆">${label}</button>`
        : `<span class="dt-sum-chip ${cls}">${label}</span>`;
      const parts = [chip('', `共 ${s.n.total} 顆`)];
      if (s.n.pass) parts.push(chip('dt-sum-pass', `✔ ${s.n.pass} Pass`));
      if (s.n.warn) parts.push(chip('dt-sum-warn', `⚠ ${s.n.warn} Warning`, 'warn'));
      if (s.n.fail) parts.push(chip('dt-sum-fail', `❌ ${s.n.fail} Fail`, 'fail'));
      if (s.n.unmeasured) parts.push(chip('', `未量測 ${s.n.unmeasured}`, 'none'));
      if (s.n.noSpec) parts.push(chip('', `未填規格 ${s.n.noSpec}`, 'nospec'));
      if (s.n.off) parts.push(chip('', `斷線 ${s.n.off}`));
      if (s.worst) {
        const w = s.worst.cell;
        parts.push('<span class="dt-sum-sep"></span>',
          `<span class="dt-sum-item">最小 Margin：<b class="dt-sum-link" data-sum-row="${s.worst.x.ri}">${nm(s.worst.x)}</b> ${fmtPct(w.marginPct)}（${fmtDeltaC(w.marginC)} @ ${w.ta}°C）</span>`);
      }
      if (s.hottest) {
        const h = s.hottest.cell;
        parts.push(`<span class="dt-sum-item">最高 Tc：<b class="dt-sum-link" data-sum-row="${s.hottest.x.ri}">${nm(s.hottest.x)}</b> ${fmt1(h.tc)}°C @ ${h.ta}°C</span>`);
      }
      if (s.memFillable && !d.frozen) {
        const mem = specMemory();
        const k = (d.components || []).filter(c => !(parseTemp(c.tc_spec) > 0) && mem.has(specKey(c.name))).length;
        if (k) parts.push(`<button type="button" class="dt-sum-act" data-sum-fill-spec title="以其他報告 / 數據頁填過的同名元件規格帶入">⚡ 帶入規格記憶（${k} 顆）</button>`);
      }
      const logs = Object.entries(d.logger_last || {}).filter(([key]) => (d.ta_conditions || []).some(t => 'ta_' + t === key));
      logs.forEach(([key, lg]) => {
        const ta = key.replace(/^ta_/, '');
        const amb = (typeof lg.ambient === 'number') ? `，實測環溫 ${lg.ambient.toFixed(1)}°C${lg.corrected ? '（已修正到目標 Ta）' : ''}` : '';
        const uns = (lg.unstable || []).length ? `，⚠ ${lg.unstable.length} 顆未達穩態` : '';
        parts.push(`<span class="dt-sum-log">📥 Ta ${escHtml(ta)}°C：${escHtml(lg.file || '')}（${escHtml(lg.window || '')}${escHtml(amb)}${escHtml(uns)}）</span>`);
      });
      return parts.join('');
    }
    // Scroll a data-page row into view and flash it.
    function flashDataRow(ri) {
      const tr = $canvas.querySelector(`#dt-tbody tr[data-row-idx="${ri}"]`);
      if (!tr) return;
      tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
      tr.classList.remove('dt-row-flash');
      void tr.offsetWidth;
      tr.classList.add('dt-row-flash');
    }

    // Re-render a page but keep the caret in the field the user is typing in.
    function focusSelectorOf(el) {
      if (!el || !$canvas.contains(el)) return null;
      const attrs = ['data-comp', 'data-comp-field', 'data-ta-key', 'data-sensor', 'data-sensor-field', 'data-sensor-ta', 'data-header', 'data-mp-ta', 'data-field', 'data-sim-idx', 'data-sim-field'];
      const parts = attrs.filter(a => el.hasAttribute(a)).map(a => `[${a}="${CSS.escape(el.getAttribute(a))}"]`);
      if (!parts.length) return null;
      const cls = ['mp-v', 'mp-i'].find(c => el.classList.contains(c));
      return el.tagName.toLowerCase() + parts.join('') + (cls ? '.' + cls : '');
    }
    function rerenderKeepFocus(renderFn, page) {
      const sel = focusSelectorOf(document.activeElement);
      renderFn(page);
      if (sel) { const el = $canvas.querySelector(sel); if (el) el.focus(); }
    }

    // ── Data page: data-logger CSV import ──
    const LOGGER_DEFAULTS = { minutes: 10, rowsN: 30, stableRange: 1, correct: false };
    function loggerPrefs() { return Object.assign({}, LOGGER_DEFAULTS, userPrefs().logger || {}); }
    const AMBIENT_RE = /amb|ambient|環溫|環境|chamber|room|\bair\b|^\s*ta\s*$|\bta\b/i;
    // "101 <PA-1> (C)" → "PA-1"; "CH3: FPGA [°C]" → "FPGA".
    const cleanChannelName = name => loggerCsv.channelLabel(name);
    async function readTextFile(file) {
      const buf = await file.arrayBuffer();
      let best = new TextDecoder('utf-8').decode(buf);
      const bad = t => (t.match(/�/g) || []).length;
      if (bad(best)) {
        ['big5', 'shift_jis', 'gb18030'].forEach(enc => {
          try { const t = new TextDecoder(enc).decode(buf); if (bad(t) < bad(best)) best = t; } catch (e) { /* unsupported */ }
        });
      }
      return best;
    }

    function showLoggerImportModal(page, initialFile) {
      const d = page.data;
      if (d.frozen) { alert('此數據頁已凍結，請先解除凍結再匯入。'); return; }
      if (!(d.ta_conditions || []).length) { alert('請先新增至少一個 Ta 條件。'); return; }
      if (!d.components) d.components = [];
      d.components.forEach(c => { if (!c.uid) c.uid = newCompUid(); });   // mapping is keyed by uid
      const pageIdx = state.pages.indexOf(page);
      const prefs = loggerPrefs();
      const st = {
        parsed: null, fileName: '', analysis: null,
        map: {},                         // component uid → channel index (-1 = none)
        ambient: -1, taKey: null, addUnmapped: false, matchedBy: '',
      };
      const m = openToolModal({
        title: `📥 匯入記錄器 CSV <span class="tool-muted" style="font-weight:400;font-size:12px;">— ${escHtml(pageBaseLabel(pageIdx))}${d.list_note ? ' · ' + escHtml(d.list_note) : ''}</span>`,
        width: 940,
        body: '<div id="lg-root"></div>',
        footer: `<span class="tool-foot-info" id="lg-foot"></span>
          <button class="sim-modal-btn" id="lg-cancel">取消</button>
          <button class="sim-modal-btn primary" id="lg-apply" disabled>填入</button>`,
      });
      const root = m.$('#lg-root');
      m.$('#lg-cancel').addEventListener('click', m.close);
      m.$('#lg-apply').addEventListener('click', apply);

      const channels = () => (st.parsed ? st.parsed.channels : []);
      const statOf = ci => (st.analysis && ci >= 0) ? st.analysis.stats[ci] : null;
      const ambientAvg = () => { const s = statOf(st.ambient); return s && !isNaN(s.avg) ? s.avg : NaN; };
      const targetTa = () => parseFloat(String(st.taKey).replace(/^ta_/, ''));
      const correction = () => (prefs.correct && !isNaN(ambientAvg())) ? targetTa() - ambientAvg() : 0;

      function analyze() {
        st.analysis = loggerCsv.analyze(st.parsed, { minutes: prefs.minutes, rowsN: prefs.rowsN, stableRange: prefs.stableRange });
      }
      function autoMap(mode) {
        const chs = channels();
        st.map = {};
        const used = new Set(st.ambient >= 0 ? [st.ambient] : []);
        const comps = d.components;
        let matched = 0;
        if (mode !== 'order') {
          // 1) the channel this component was read from last time (same file layout)
          comps.forEach(c => {
            const prev = d.logger_map && d.logger_map[c.uid];
            const ci = prev ? chs.findIndex((ch, i) => ch.name === prev && !used.has(i)) : -1;
            if (ci >= 0) { st.map[c.uid] = ci; used.add(ci); matched++; }
          });
          // 2) channel named after the component (best score first)
          const cands = [];
          comps.forEach(c => {
            if (st.map[c.uid] !== undefined || !String(c.name || '').trim()) return;
            chs.forEach((ch, ci) => { const sc = loggerCsv.nameScore(c.name, ch.name); if (sc) cands.push({ uid: c.uid, ci, sc }); });
          });
          // a loose (score 1) match that several channels / components share is ambiguous → skip
          const ones = (key, val) => cands.filter(x => x.sc === 1 && x[key] === val).length;
          cands.filter(x => x.sc > 1 || (ones('uid', x.uid) === 1 && ones('ci', x.ci) === 1))
            .sort((a, b) => b.sc - a.sc).forEach(x => {
              if (st.map[x.uid] !== undefined || used.has(x.ci)) return;
              st.map[x.uid] = x.ci; used.add(x.ci); matched++;
            });
        }
        st.matchedBy = matched ? 'name' : '';
        // 3) nothing matched by name → in order (TC1 → first channel …)
        if (mode === 'order' || (mode !== 'name' && !matched)) {
          st.map = {};
          const free = chs.map((_, i) => i).filter(i => i !== st.ambient);
          comps.forEach((c, k) => { st.map[c.uid] = k < free.length ? free[k] : -1; });
          st.matchedBy = 'order';
        }
        comps.forEach(c => { if (st.map[c.uid] === undefined) st.map[c.uid] = -1; });
        st.addUnmapped = !comps.length;
      }
      function pickDefaults() {
        const chs = channels();
        const prevAmb = d.logger_ambient ? chs.findIndex(ch => ch.name === d.logger_ambient) : -1;
        st.ambient = prevAmb >= 0 ? prevAmb : chs.findIndex(ch => AMBIENT_RE.test(cleanChannelName(ch.name)) || AMBIENT_RE.test(ch.name));
        analyze();
        // Ta: the condition closest to the measured ambient (within 5°C), else the
        // first Ta still empty, else the last one.
        const tas = d.ta_conditions;
        const amb = ambientAvg();
        let ta = null;
        if (!isNaN(amb)) {
          const best = tas.slice().sort((a, b) => Math.abs(a - amb) - Math.abs(b - amb))[0];
          if (Math.abs(best - amb) <= 5) ta = best;
        }
        if (ta === null) ta = tas.find(t => !d.components.some(c => !isNaN(parseTemp((c.readings || {})['ta_' + t])))) ?? tas[tas.length - 1];
        st.taKey = 'ta_' + ta;
        autoMap('auto');
      }

      async function loadFile(file) {
        if (!file) return;
        try {
          const text = await readTextFile(file);
          const parsed = loggerCsv.parse(text);
          if (parsed.error) { alert('無法讀取「' + file.name + '」：' + parsed.error); return; }
          st.parsed = parsed;
          st.fileName = file.name;
          pickDefaults();
          render();
        } catch (e) {
          alert('讀取檔案失敗：' + e.message);
        }
      }

      function windowText() {
        const info = st.analysis.info;
        return info.mode === 'time' ? `最後 ${prefs.minutes} 分鐘平均` : `最後 ${info.rows} 筆平均`;
      }

      function render() {
        if (!st.parsed) {
          root.innerHTML = `
            <div class="tool-drop" id="lg-drop">
              <span class="tool-drop-icon">📄</span>
              把記錄器匯出的 CSV / TXT 拖到這裡，或 <button type="button" class="sim-modal-tool-btn" id="lg-browse">選擇檔案</button>
              <div class="tool-hint" style="margin-top:10px;">支援 Keysight / Graphtec / Yokogawa / Hioki 等格式（逗號、分號、Tab 分隔皆可）。<br>
                每個通道取最後一段時間的平均值當實測 Tc，並檢查是否已達穩態；通道會依名稱自動對應元件，對不到就依順序。</div>
              <input type="file" id="lg-file" accept=".csv,.txt,.tsv,.dat,text/csv,text/plain" style="display:none">
            </div>`;
          const drop = root.querySelector('#lg-drop');
          const input = root.querySelector('#lg-file');
          root.querySelector('#lg-browse').addEventListener('click', () => input.click());
          input.addEventListener('change', () => loadFile(input.files[0]));
          drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
          drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
          drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('dragover'); loadFile(e.dataTransfer.files[0]); });
          updateFoot();
          return;
        }
        const chs = channels();
        const info = st.analysis.info;
        const amb = ambientAvg();
        const tas = d.ta_conditions;
        const existing = d.components.filter(c => !isNaN(parseTemp((c.readings || {})[st.taKey]))).length;
        const span = info.mode === 'time' ? `記錄 ${round1(info.totalMinutes)} 分鐘` : `${info.totalRows} 筆（無時間欄，依筆數取樣）`;
        const chOpts = (sel, withNone) => (withNone ? `<option value="-1"${sel < 0 ? ' selected' : ''}>— 不使用 —</option>` : '') +
          chs.map((ch, i) => `<option value="${i}"${i === sel ? ' selected' : ''}>${escHtml(ch.name)}</option>`).join('');
        const usedBy = new Map();
        Object.entries(st.map).forEach(([uid, ci]) => { if (ci >= 0) usedBy.set(ci, (usedBy.get(ci) || 0) + 1); });
        const corr = correction();
        const rows = d.components.map((c, k) => {
          const ci = st.map[c.uid] ?? -1;
          const s = statOf(ci);
          const cur = parseTemp((c.readings || {})[st.taKey]);
          const nv = s && !isNaN(s.avg) ? round1(s.avg + corr) : NaN;
          const state = !s ? '<span class="tool-muted">—</span>'
            : isNaN(s.avg) ? '<span class="tool-bad">無數值</span>'
            : s.stable ? '<span class="tool-ok">✓ 穩定</span>' : '<span class="tool-warn">⚠ 未穩定</span>';
          const dup = ci >= 0 && usedBy.get(ci) > 1 ? ' <span class="tool-warn" title="多顆元件對應到同一個通道">重複</span>' : '';
          return `<tr class="${c.disabled ? 'is-off' : ''}">
            <td class="tool-muted">${k + 1}</td>
            <td>${escHtml(c.name || '(未命名)')}${c.disabled ? ' <span class="tool-muted">斷線</span>' : ''}</td>
            <td><select class="tool-select" data-lg-map="${escapeAttr(c.uid)}">${chOpts(ci, true)}</select>${dup}</td>
            <td class="num">${s ? fmt1(s.avg) : '—'}</td>
            <td class="num">${s ? fmt1(s.range) : '—'}</td>
            <td class="num">${s && !isNaN(s.slope) ? (s.slope >= 0 ? '+' : '') + s.slope.toFixed(2) : '—'}</td>
            <td>${state}</td>
            <td class="num">${isNaN(cur) ? '<span class="tool-muted">空</span>' : fmt1(cur)} → <b>${isNaN(nv) ? '—' : nv.toFixed(1)}</b></td>
          </tr>`;
        }).join('');
        const mapped = new Set(Object.values(st.map).filter(ci => ci >= 0));
        const unmapped = chs.map((ch, i) => i).filter(i => i !== st.ambient && !mapped.has(i));
        root.innerHTML = `
          <div class="tool-row">
            <span>📄 <b>${escHtml(st.fileName)}</b></span>
            <span class="tool-muted">${st.parsed.rows.length} 筆 · ${chs.length} 個通道 · ${span}${st.parsed.timeHeader ? ` · 時間欄「${escHtml(st.parsed.timeHeader)}」` : ''}</span>
            <button type="button" class="sim-modal-tool-btn" id="lg-change">更換檔案</button>
            <input type="file" id="lg-file" accept=".csv,.txt,.tsv,.dat,text/csv,text/plain" style="display:none">
          </div>
          <div class="tool-row">
            <label>填入 <select class="tool-select" id="lg-ta">${tas.map(t => `<option value="ta_${t}"${'ta_' + t === st.taKey ? ' selected' : ''}>Ta = ${t}°C</option>`).join('')}</select></label>
            ${existing ? `<span class="tool-warn">此 Ta 已有 ${existing} 筆數值，將被覆蓋</span>` : ''}
            ${info.mode === 'time'
              ? `<label>取最後 <input type="number" min="1" step="1" class="tool-input" id="lg-min" value="${prefs.minutes}"> 分鐘平均</label>`
              : `<label>取最後 <input type="number" min="1" step="1" class="tool-input" id="lg-rows" value="${prefs.rowsN}"> 筆平均</label>`}
            <label title="平均區間內 最高 − 最低 不超過此值視為已達穩態">穩態判定：區間溫差 ≤ <input type="number" min="0" step="0.1" class="tool-input" id="lg-range" value="${prefs.stableRange}"> °C</label>
          </div>
          <div class="tool-row">
            <label>環溫通道 <select class="tool-select" id="lg-amb">${chOpts(st.ambient, true)}</select></label>
            ${!isNaN(amb) ? `<span>實測環溫 <b>${amb.toFixed(1)}°C</b>（目標 ${targetTa()}°C，差 ${(amb - targetTa() >= 0 ? '+' : '') + (amb - targetTa()).toFixed(1)}°C）</span>
              <label title="Tc 修正 = Tc 實測 + (Ta 目標 − Ta 實測)，假設溫升不隨環溫改變"><input type="checkbox" id="lg-correct"${prefs.correct ? ' checked' : ''}> 依環溫差修正到目標 Ta</label>` : ''}
          </div>
          <div class="tool-table-wrap">
            <table class="tool-table">
              <thead><tr><th>#</th><th>元件</th><th>對應通道</th><th style="text-align:right">平均 °C</th><th style="text-align:right" title="平均區間內 最高 − 最低">區間溫差</th><th style="text-align:right" title="平均區間內的溫度變化率">趨勢 °C/min</th><th>穩態</th><th style="text-align:right">目前 → 填入</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="8" class="tool-muted" style="text-align:center;padding:14px;">此數據頁還沒有元件 — 勾選下方「未對應的通道新增為元件」即可直接建立</td></tr>`}</tbody>
            </table>
          </div>
          <div class="tool-row" style="margin-top:10px;">
            <button type="button" class="sim-modal-tool-btn" id="lg-by-name">依名稱對應</button>
            <button type="button" class="sim-modal-tool-btn" id="lg-by-order">依順序對應</button>
            <button type="button" class="sim-modal-tool-btn" id="lg-clear">清除對應</button>
            <span class="tool-muted">${st.matchedBy === 'name' ? '已依通道名稱 / 上次的對應自動配對' : st.matchedBy === 'order' ? '通道名稱對不到元件，已依順序配對 — 請確認' : ''}</span>
          </div>
          ${unmapped.length ? `<div class="tool-row">
            <label><input type="checkbox" id="lg-add"${st.addUnmapped ? ' checked' : ''}> 未對應的通道新增為元件（${unmapped.length}）</label>
            <span>${unmapped.slice(0, 12).map(i => `<span class="tool-chip">${escHtml(cleanChannelName(chs[i].name))}</span>`).join('')}${unmapped.length > 12 ? '…' : ''}</span>
          </div>` : ''}`;
        const input = root.querySelector('#lg-file');
        root.querySelector('#lg-change').addEventListener('click', () => input.click());
        input.addEventListener('change', () => loadFile(input.files[0]));
        root.querySelector('#lg-ta').addEventListener('change', (e) => { st.taKey = e.target.value; render(); });
        const num = (id, key, min) => {
          const el = root.querySelector(id);
          if (!el) return;
          el.addEventListener('change', () => {
            const v = parseFloat(el.value);
            if (!(v >= min)) { el.value = prefs[key]; return; }
            prefs[key] = v; setUserPref('logger', prefs); analyze(); render();
          });
        };
        num('#lg-min', 'minutes', 0.1); num('#lg-rows', 'rowsN', 1); num('#lg-range', 'stableRange', 0);
        root.querySelector('#lg-amb').addEventListener('change', (e) => {
          st.ambient = parseInt(e.target.value);
          Object.keys(st.map).forEach(uid => { if (st.map[uid] === st.ambient) st.map[uid] = -1; });
          render();
        });
        const corrEl = root.querySelector('#lg-correct');
        if (corrEl) corrEl.addEventListener('change', () => { prefs.correct = corrEl.checked; setUserPref('logger', prefs); render(); });
        root.querySelectorAll('[data-lg-map]').forEach(sel => sel.addEventListener('change', () => {
          st.map[sel.dataset.lgMap] = parseInt(sel.value); render();
        }));
        root.querySelector('#lg-by-name').addEventListener('click', () => { autoMap('name'); render(); });
        root.querySelector('#lg-by-order').addEventListener('click', () => { autoMap('order'); render(); });
        root.querySelector('#lg-clear').addEventListener('click', () => { d.components.forEach(c => { st.map[c.uid] = -1; }); st.matchedBy = ''; render(); });
        const addEl = root.querySelector('#lg-add');
        if (addEl) addEl.addEventListener('change', () => { st.addUnmapped = addEl.checked; updateFoot(); });
        updateFoot();
      }

      function plan() {
        const chs = channels();
        const fills = [];
        d.components.forEach(c => {
          const ci = st.map[c.uid] ?? -1;
          const s = statOf(ci);
          if (s && !isNaN(s.avg)) fills.push({ comp: c, ci, s });
        });
        const mapped = new Set(Object.values(st.map).filter(ci => ci >= 0));
        const adds = st.addUnmapped
          ? chs.map((ch, i) => i).filter(i => i !== st.ambient && !mapped.has(i) && statOf(i) && !isNaN(statOf(i).avg))
          : [];
        return { fills, adds };
      }
      function updateFoot() {
        const foot = m.$('#lg-foot');
        const btn = m.$('#lg-apply');
        if (!st.parsed) { foot.textContent = ''; btn.disabled = true; return; }
        const p = plan();
        const n = p.fills.length + p.adds.length;
        const unstable = p.fills.filter(f => !f.s.stable).length + p.adds.filter(ci => !statOf(ci).stable).length;
        foot.innerHTML = n ? `將填入 <b>${n}</b> 顆（Ta = ${escHtml(String(targetTa()))}°C，${escHtml(windowText())}）${unstable ? ` · <span class="tool-warn">⚠ ${unstable} 顆未達穩態</span>` : ''}` : '沒有可填入的元件';
        btn.disabled = !n;
        btn.textContent = n ? `填入 ${n} 顆` : '填入';
      }

      function apply() {
        const p = plan();
        if (!p.fills.length && !p.adds.length) return;
        const chs = channels();
        const corr = correction();
        const unstable = [];
        p.fills.forEach(f => {
          if (!f.comp.readings) f.comp.readings = {};
          f.comp.readings[st.taKey] = String(round1(f.s.avg + corr));
          if (!f.s.stable) unstable.push(f.comp.name || cleanChannelName(chs[f.ci].name));
        });
        const mem = specMemory();
        const lastCat = d.components.length ? d.components[d.components.length - 1].category : 'RF';
        p.adds.forEach(ci => {
          const s = statOf(ci);
          const comp = { uid: newCompUid(), category: lastCat, name: cleanChannelName(chs[ci].name), spec_type: 'Rec.', tc_spec: '', derating: '0.90', tim_type: '', readings: {}, note: '' };
          fillSpecFromMemory(comp, mem);
          comp.readings[st.taKey] = String(round1(s.avg + corr));
          d.components.push(comp);
          st.map[comp.uid] = ci;
          if (!s.stable) unstable.push(comp.name);
        });
        // Remember the layout so the next file (another Ta) maps by itself.
        d.logger_map = Object.assign({}, d.logger_map || {});
        d.components.forEach(c => { const ci = st.map[c.uid]; if (ci >= 0 && chs[ci]) d.logger_map[c.uid] = chs[ci].name; });
        d.logger_ambient = st.ambient >= 0 ? chs[st.ambient].name : '';
        const amb = ambientAvg();
        d.logger_last = Object.assign({}, d.logger_last || {});
        d.logger_last[st.taKey] = {
          file: st.fileName, at: new Date().toISOString(), window: windowText(),
          ambient: isNaN(amb) ? null : round1(amb), corrected: !!corr, unstable: unstable.slice(0, 50),
          n: p.fills.length + p.adds.length,
        };
        m.close();
        scheduleSave(pageIdx);
        if (state.pages[state.activePage] === page) renderDataPage(page);
        renderPageList();
        showToast(`已填入 ${p.fills.length + p.adds.length} 顆元件（Ta = ${targetTa()}°C）${p.adds.length ? `，其中新增 ${p.adds.length} 顆` : ''}${unstable.length ? `；⚠ ${unstable.length} 顆未達穩態：${unstable.slice(0, 5).join('、')}${unstable.length > 5 ? '…' : ''}` : ''}`,
          unstable.length ? 'warn' : 'ok', unstable.length ? 9000 : 4500);
      }

      render();
      if (initialFile) loadFile(initialFile);
    }

    // ── Data page: copy as a new test condition (same components, values cleared) ──
    function clearDataPageValues(data) {
      (data.components || []).forEach(c => { c.readings = {}; });
      (data.sensors || []).forEach(s => { s.readings = {}; });
      data.machine_power = {};
      data.frozen = false;
      data.logger_last = {};
      return data;
    }

    // ── 比對頁: paste Sim Tc by component name ──
    function parseNameValueLines(text) {
      const out = [];
      String(text || '').split(/\r?\n/).forEach(line => {
        if (!line.trim()) return;
        let cells = line.split(/\t|,|;|\s{2,}/).map(c => c.trim()).filter(Boolean);
        if (cells.length === 1) {                                  // "PA-1 85.2" (single space)
          const mm = line.trim().match(/^(.*\S)\s+([-+]?\d+(?:\.\d+)?)\s*(?:°?C|℃)?$/i);
          if (mm) cells = [mm[1], mm[2]];
        }
        let vi = -1;
        for (let i = cells.length - 1; i >= 0; i--) { if (!isNaN(parseTemp(cells[i]))) { vi = i; break; } }
        if (vi < 0) return;                                        // header / text line
        const name = cells.slice(0, vi).filter(c => isNaN(parseTemp(c))).join(' ');
        if (!name) return;
        out.push({ name, value: String(parseTemp(cells[vi])) });
      });
      return out;
    }
    // Best unique match of `name` among `cands` (objects with .component_name).
    function matchByName(name, cands) {
      let best = null, bestSc = 0, tie = false;
      cands.forEach(c => {
        const sc = loggerCsv.nameScore(name, c.component_name) || loggerCsv.nameScore(c.component_name, name);
        if (sc > bestSc) { best = c; bestSc = sc; tie = false; }
        else if (sc && sc === bestSc) tie = true;
      });
      return best && !tie ? best : null;
    }
    function showSimPasteModal(page) {
      const d = page.data;
      const pageIdx = state.pages.indexOf(page);
      const compareTa = simCompareTa(d);
      let addMissing = true;
      const m = openToolModal({
        title: '貼上模擬結果（依元件名稱）',
        width: 720,
        body: `<div class="tool-hint" style="margin-bottom:8px;">從 Excel / FloTHERM / Icepak 的結果表複製「元件名稱 + 溫度」兩欄貼上，每列一顆。順序不用一樣，依名稱自動對應。</div>
          <textarea class="tool-textarea" id="sp-text" placeholder="PA-1&#9;85.2&#10;PA-2&#9;86.0&#10;FPGA&#9;92.4"></textarea>
          <div class="tool-row" style="margin:8px 0;"><label><input type="checkbox" id="sp-add" checked> 比對表還沒有、但數據頁有的元件 → 自動加入</label></div>
          <div id="sp-preview"></div>`,
        footer: `<span class="tool-foot-info" id="sp-foot"></span>
          <button class="sim-modal-btn" id="sp-cancel">取消</button>
          <button class="sim-modal-btn primary" id="sp-apply" disabled>套用</button>`,
      });
      const ta = m.$('#sp-text');
      setTimeout(() => ta.focus(), 30);
      m.$('#sp-cancel').addEventListener('click', m.close);
      m.$('#sp-add').addEventListener('change', (e) => { addMissing = e.target.checked; preview(); });
      ta.addEventListener('input', preview);
      let result = [];
      function candidates() {
        const all = getDataPageComponents();
        const items = (d.items || []).map((it, i) => {
          const r = resolveComponentRef(it, all);
          return { component_name: r ? r.component_name : (it.component_name || ''), itemIdx: i, ref: r };
        });
        // Data-page components not in the table yet — prefer the data page the
        // table already uses, else any page that has the comparison Ta.
        const pageCount = {};
        items.forEach(x => { if (x.ref) pageCount[x.ref.source_page] = (pageCount[x.ref.source_page] || 0) + 1; });
        const mainPage = Object.keys(pageCount).sort((a, b) => pageCount[b] - pageCount[a])[0];
        const inTable = new Set(items.filter(x => x.ref).map(x => compRefKey(x.ref)));
        const byName = new Map();
        all.filter(c => !inTable.has(compRefKey(c))).forEach(c => {
          const k = specKey(c.component_name);
          const prev = byName.get(k);
          const rank = c2 => (c2.source_page === mainPage ? 2 : 0) + (compareTa !== null && c2.tas.includes(compareTa) ? 1 : 0);
          if (!prev || rank(c) > rank(prev)) byName.set(k, c);
        });
        return { items, extras: Array.from(byName.values()) };
      }
      function preview() {
        const lines = parseNameValueLines(ta.value);
        const { items, extras } = candidates();
        const usedItems = new Set(), usedExtras = new Set();
        result = lines.map(l => {
          const hit = matchByName(l.name, items.filter(x => !usedItems.has(x.itemIdx)));
          if (hit) { usedItems.add(hit.itemIdx); return { ...l, kind: 'item', itemIdx: hit.itemIdx, target: hit.component_name }; }
          const ex = addMissing ? matchByName(l.name, extras.filter(x => !usedExtras.has(compRefKey(x)))) : null;
          if (ex) { usedExtras.add(compRefKey(ex)); return { ...l, kind: 'add', comp: ex, target: ex.component_name }; }
          return { ...l, kind: 'none' };
        });
        const nItem = result.filter(r => r.kind === 'item').length, nAdd = result.filter(r => r.kind === 'add').length;
        const nNone = result.length - nItem - nAdd;
        m.$('#sp-preview').innerHTML = result.length ? `<div class="tool-table-wrap" style="max-height:34vh;"><table class="tool-table">
            <thead><tr><th>貼上的名稱</th><th style="text-align:right">Sim Tc</th><th>對應</th></tr></thead>
            <tbody>${result.map(r => `<tr><td>${escHtml(r.name)}</td><td class="num">${escHtml(r.value)}</td><td>${
              r.kind === 'item' ? `<span class="tool-ok">✓ ${escHtml(r.target)}</span>`
              : r.kind === 'add' ? `<span class="tool-ok">＋ ${escHtml(r.target)}</span> <span class="tool-muted">（從數據頁加入）</span>`
              : '<span class="tool-bad">✗ 找不到</span>'}</td></tr>`).join('')}</tbody></table></div>` : '';
        m.$('#sp-foot').innerHTML = result.length ? `更新 ${nItem} 顆${nAdd ? `、新增 ${nAdd} 顆` : ''}${nNone ? ` · <span class="tool-warn">${nNone} 列找不到</span>` : ''}` : '';
        m.$('#sp-apply').disabled = !(nItem + nAdd);
      }
      m.$('#sp-apply').addEventListener('click', () => {
        let n = 0;
        result.forEach(r => {
          if (r.kind === 'item') { d.items[r.itemIdx].sim_tc = r.value; n++; }
          else if (r.kind === 'add') {
            d.items.push({ category: r.comp.category, component_name: r.comp.component_name, sim_tc: r.value, note: '', source_page: r.comp.source_page, source_uid: r.comp.source_uid });
            n++;
          }
        });
        m.close();
        scheduleSave(pageIdx);
        renderSimVsMeasPage(page);
        showToast(`已套用 ${n} 顆元件的 Sim Tc`, 'ok');
      });
    }

    // ── 結論頁: draft text + issues from the data ──
    function machinePowerText(pageData, ta) {
      const mp = (pageData.machine_power || {})['ta_' + ta] || {};
      const w = parseTemp(mp.v) * parseTemp(mp.i);
      return isFinite(w) && w > 0 ? `${w.toFixed(1)} W` : '';
    }
    function buildConclusionDraft() {
      const groups = getDataPageComponentGroups();
      const overall = computeOverallResult(groups);
      const lines = [];
      groups.forEach((g, i) => {
        const pp = overall.perPage[i];
        const pageData = state.pages[g.pageIdx].data;
        const pass = pp.nEvaluated - pp.nFail - pp.nWarn;
        const counts = [`${pass} Pass`];
        if (pp.nWarn) counts.push(`${pp.nWarn} Warning`);
        if (pp.nFail) counts.push(`${pp.nFail} Fail`);
        if (pp.unmeasured) counts.push(`${pp.unmeasured} 顆未量測`);
        let s = `【${pp.name}】Ta = ${g.tas.join(' / ')}°C，量測 ${pp.total} 顆元件：${counts.join('、')}。`;
        let worst = null;
        g.components.forEach(c => { const w = c.calc.worst; if (!c.disabled && w && (!worst || w.marginPct < worst.w.marginPct)) worst = { c, w }; });
        if (worst) s += `最小 Margin 為 ${worst.c.component_name} ${fmtPct(worst.w.marginPct)}（${fmtDeltaC(worst.w.marginC)} @ Ta ${worst.w.ta}°C）。`;
        const maxTa = g.tas.length ? Math.max(...g.tas) : null;
        const pw = maxTa !== null ? machinePowerText(pageData, maxTa) : '';
        if (pw) s += `整機功耗 ${pw} @ Ta ${maxTa}°C。`;
        s += `判定：${pp.label}。`;
        lines.push(s);
      });
      state.pages.forEach(p => {
        if (p.type === 'sim_vs_meas') {
          const t = simSummaryText(p.data);
          if (t) lines.push('【模擬比對】' + t);
        } else if (p.type === 'compare') {
          compareSummaryLines(compareTable(p.data, false)).forEach(l => lines.push('【比較】' + l));
        }
      });
      if (groups.length) {
        let s = `綜合判定：${overall.label}`;
        const fails = overall.flagged.filter(c => c.calc.status === 'fail').map(c => c.component_name);
        const warns = overall.flagged.filter(c => c.calc.status === 'warn').map(c => c.component_name);
        const uniq = a => Array.from(new Set(a));
        const warnOnly = uniq(warns).filter(n => !fails.includes(n));
        if (fails.length) s += `；${uniq(fails).join('、')} 超過 Derated Spec，需改善散熱設計後重測`;
        if (warnOnly.length) s += `；${warnOnly.join('、')} Margin 低於 ${MARGIN_PASS_PCT}%，建議持續追蹤`;
        lines.push(s + '。');
      }
      return lines;
    }
    // One-paragraph summary of a 比對頁 (counts, mean / max deviation, bias).
    function simSummaryText(d) {
      const all = getDataPageComponents();
      const ta = simCompareTa(d);
      const vals = (d.items || []).map(it => simRowValues(it, all, ta)).filter(v => v.judge !== 'none');
      if (!vals.length) return '';
      const cnt = j => vals.filter(v => v.judge === j).length;
      const mean = vals.reduce((a, v) => a + v.devC, 0) / vals.length;
      const meanAbs = vals.reduce((a, v) => a + Math.abs(v.devC), 0) / vals.length;
      const worst = vals.reduce((a, v) => (Math.abs(v.devC) > Math.abs(a.devC) ? v : a), vals[0]);
      const sign = x => (x >= 0 ? '+' : '') + x.toFixed(1);
      const bias = mean > 1 ? `模擬整體偏高 ${sign(mean)}°C（偏保守）`
        : mean < -1 ? `模擬整體偏低 ${sign(mean)}°C（有低估風險，建議檢查功耗或接觸熱阻設定）` : `無明顯系統偏差（平均 ${sign(mean)}°C）`;
      const bad = vals.filter(v => v.judge === 'bad').map(v => v.name);
      return `於 Ta = ${ta}°C 比對 ${vals.length} 顆元件：✅ ${cnt('good')}、⚠️ ${cnt('warn')}、❌ ${cnt('bad')}；平均絕對偏差 ${meanAbs.toFixed(1)}°C，${bias}；最大偏差 ${worst.name} ${sign(worst.devC)}°C（${fmtPct(worst.devPct)}）。`
        + (bad.length ? `${bad.join('、')} 偏差超出 ±${SIM_DEV_WARN_PCT}% / ±${SIM_DEV_WARN_C}°C，建議回頭檢查模型。` : '');
    }

    // Sim vs Meas grouped bars (Meas = brand blue, Sim = orange; palette checked
    // for colour-vision deficiency), the derated spec as a dashed tick, the
    // comparison Ta as the baseline. Drawn on a canvas and embedded as a PNG so
    // the editor and html2canvas (PDF) show exactly the same picture.
    // Dev % sits in one aligned row above the plot (coloured like the table's 判斷),
    // not on top of each group — there it rode up and down with every spec tick.
    // More than SIM_CHART_MAX components are split over several charts (same Tc
    // scale) so every group keeps room for its bars, label and name.
    const SIM_CHART_W = 786, SIM_CHART_H = 230, SIM_CHART_MAX = 18;
    const SIM_JUDGE_COLOR = { good: '#1E8E4E', warn: '#C27A06', bad: '#D23B2A', none: '#64748B' };
    function simChartDataURLs(d) {
      const all = getDataPageComponents();
      const ta = simCompareTa(d);
      const pts = (d.items || []).map(it => simRowValues(it, all, ta)).filter(v => !isNaN(v.simTc) && !isNaN(v.measTc));
      if (!pts.length) return [];
      const vals = pts.flatMap(v => [v.simTc, v.measTc, v.derated].filter(x => isFinite(x)));
      const base = ta !== null ? ta : Math.min(...vals) - 5;
      const yMin = Math.floor(Math.min(base, ...vals) / 5) * 5;   // the Ta baseline sits on a grid line
      const yMax = Math.ceil((Math.max(...vals) + 4) / 10) * 10;
      const n = Math.ceil(pts.length / SIM_CHART_MAX), size = Math.ceil(pts.length / n);
      // the charts of one set look alike: same Tc scale, bottom margin and name rotation
      const rotate = (SIM_CHART_W - 56) / size < 60, B = size > 10 ? 50 : 34;
      return Array.from({ length: n }, (_, k) => simChartPNG(pts.slice(k * size, (k + 1) * size), { ta, base, yMin, yMax, rotate, B, part: n > 1 ? `${k + 1} / ${n}` : '' }));
    }
    const simChartDataURL = d => simChartDataURLs(d)[0] || '';
    function simChartPNG(pts, o) {
      const { ta, base, yMin, yMax } = o;
      const W = SIM_CHART_W, H = SIM_CHART_H, S = 2;
      const c = document.createElement('canvas');
      c.width = W * S; c.height = H * S;
      const g = c.getContext('2d');
      g.scale(S, S);
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
      const C = { meas: '#2357A7', sim: '#EB6834', spec: '#334155', grid: '#E5E9F0', ink: '#334155', muted: '#64748B' };
      const font = (px, w) => `${w || 400} ${px}px 'DM Sans','Noto Sans TC','Microsoft JhengHei',sans-serif`;
      const L = 44, R = 12, T = 42, B = o.B != null ? o.B : (pts.length > 10 ? 50 : 34), DEV_Y = 31;
      const pw = W - L - R, ph = H - T - B;
      const y = v => T + ph - (v - yMin) / (yMax - yMin) * ph;
      // grid + axis labels
      g.font = font(9); g.textAlign = 'right'; g.textBaseline = 'middle';
      for (let v = yMin; v <= yMax; v += (yMax - yMin > 60 ? 20 : 10)) {
        g.strokeStyle = C.grid; g.lineWidth = 1; g.beginPath(); g.moveTo(L, y(v)); g.lineTo(W - R, y(v)); g.stroke();
        g.fillStyle = C.muted; g.fillText(String(v), L - 6, y(v));
      }
      g.save(); g.translate(11, T + ph / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillStyle = C.muted; g.fillText('Tc (°C)', 0, 0); g.restore();
      g.font = font(8.5, 600); g.fillStyle = C.muted; g.textAlign = 'right'; g.fillText('Dev', L - 6, DEV_Y);
      const yBase = y(Math.max(yMin, base));
      // bars
      const gw = pw / pts.length;
      const bw = Math.max(3, Math.min(22, (gw - 10) / 2));
      const bar = (x, v, color) => {
        const top = y(v), h = Math.max(0, yBase - top), r = Math.min(4, bw / 2, h);
        g.fillStyle = color; g.beginPath();
        g.moveTo(x, yBase); g.lineTo(x, top + r); g.quadraticCurveTo(x, top, x + r, top);
        g.lineTo(x + bw - r, top); g.quadraticCurveTo(x + bw, top, x + bw, top + r); g.lineTo(x + bw, yBase); g.closePath(); g.fill();
      };
      pts.forEach((v, i) => {
        const cx = L + gw * i + gw / 2;
        if (i % 2) { g.fillStyle = 'rgba(15,23,42,0.025)'; g.fillRect(L + gw * i, T, gw, ph); }   // zebra: which bars belong together
        bar(cx - bw - 1, v.measTc, C.meas);                // 2px gap between the pair
        bar(cx + 1, v.simTc, C.sim);
        if (isFinite(v.derated)) {                         // derated spec tick
          g.strokeStyle = C.spec; g.lineWidth = 1.5; g.setLineDash([3, 2]);
          const tk = Math.min(bw + 5, gw / 2 - 3);           // a gap between neighbouring groups' ticks
          g.beginPath(); g.moveTo(cx - tk, y(v.derated)); g.lineTo(cx + tk, y(v.derated)); g.stroke(); g.setLineDash([]);
        }
        if (!isNaN(v.devPct) || !isNaN(v.devC)) {          // deviation: one aligned row, coloured by 判斷
          g.font = font(gw < 30 ? 7.5 : 8.5, 700); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = SIM_JUDGE_COLOR[v.judge] || C.ink;
          const txt = !isNaN(v.devPct) ? (v.devPct >= 0 ? '+' : '') + v.devPct.toFixed(0) + '%' : (v.devC >= 0 ? '+' : '') + v.devC.toFixed(1) + '°';
          g.fillText(txt, cx, DEV_Y);
        }
        // x label (rotated when the groups are narrow)
        g.fillStyle = C.ink; g.font = font(9);
        let name = String(v.name || '');
        const rotated = o.rotate != null ? o.rotate : gw < 60;
        const maxW = rotated ? 70 : gw - 6;
        while (name.length > 1 && g.measureText(name).width > maxW) name = name.slice(0, -1);
        if (name !== String(v.name || '')) name = name.slice(0, -1) + '…';
        if (rotated) { g.save(); g.translate(cx, yBase + 8); g.rotate(-Math.PI / 5); g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(name, 0, 0); g.restore(); }
        else { g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(name, cx, yBase + 6); }
      });
      g.strokeStyle = C.grid; g.lineWidth = 1; g.beginPath(); g.moveTo(L, DEV_Y + 7); g.lineTo(W - R, DEV_Y + 7); g.stroke();
      // baseline (comparison Ta)
      g.strokeStyle = '#94A3B8'; g.lineWidth = 1; g.beginPath(); g.moveTo(L, yBase); g.lineTo(W - R, yBase); g.stroke();
      // legend (top-right) + title (top-left)
      g.textBaseline = 'middle'; g.font = font(9.5, 600); g.textAlign = 'left'; g.fillStyle = '#0B3D7A';
      g.fillText(`Sim vs Meas Tc${ta !== null ? ` @ Ta = ${ta}°C（基準線 = Ta）` : ''}${o.part ? `（${o.part}）` : ''}`, L, 12);
      const items = [['Meas Tc', 'box', C.meas], ['Sim Tc', 'box', C.sim], ['Derated Spec', 'dash', C.spec]];
      g.font = font(9);
      let lx = W - R;
      items.slice().reverse().forEach(([label, kind, color]) => {
        const tw = g.measureText(label).width;
        lx -= tw; g.fillStyle = C.ink; g.textAlign = 'left'; g.fillText(label, lx, 12);
        lx -= 16;
        if (kind === 'box') { g.fillStyle = color; g.fillRect(lx, 7, 10, 10); }
        else { g.strokeStyle = color; g.lineWidth = 1.5; g.setLineDash([3, 2]); g.beginPath(); g.moveTo(lx, 12); g.lineTo(lx + 12, 12); g.stroke(); g.setLineDash([]); }
        lx -= 14;
      });
      return c.toDataURL('image/png');
    }

    function flaggedIssueLines() {
      const groups = getDataPageComponentGroups();
      const out = [];
      groups.forEach(g => {
        summarizeComponents(g.components).flagged.forEach(c => {
          const w = c.calc.worst;
          const prefix = c.component_name + (groups.length > 1 ? `（${conditionName(g)}）` : '') + '：';
          const text = c.calc.status === 'fail'
            ? `Tc ${fmt1(w.tc)}°C @ Ta ${w.ta}°C 超過 Derated Spec ${fmt1(c.tc_derated)}°C（Margin ${fmtPct(w.marginPct)}，${fmtDeltaC(w.marginC)}）`
            : `Margin ${fmtPct(w.marginPct)}（${fmtDeltaC(w.marginC)} @ Ta ${w.ta}°C），低於 ${MARGIN_PASS_PCT}% 建議值`;
          out.push({ prefix, line: prefix + text });
        });
      });
      return out;
    }

    // ── 圖片頁: many images at once (one image page per 1 / 2 / 4 images) ──
    const fileStem = name => String(name || '').replace(/\.[^.]+$/, '');
    async function insertImagePagesFromFiles(files, opts) {
      const list = Array.from(files || []).filter(f => f && (f.type || '').startsWith('image/')).sort((a, b) => naturalCompare(a.name, b.name));
      if (!list.length) return 0;
      const per = [1, 2, 4].includes(opts.perPage) ? opts.perPage : 4;
      let at = opts.afterIdx === undefined || opts.afterIdx === null ? state.pages.length : opts.afterIdx + 1;
      const firstNew = at;
      const t = showToast(`處理圖片中 0 / ${list.length}…`, '', 0);
      const created = [];
      const rid = state.reportId, pagesRef = state.pages;
      const switched = () => state.reportId !== rid || state.pages !== pagesRef;
      for (let i = 0; i < list.length; i += per) {
        const images = [];
        for (const f of list.slice(i, i + per)) {
          const im = await imMakeImage(f, opts.captions ? fileStem(f.name) : '');
          if (switched()) break;
          if (!im) continue;
          images.push({ ...im, position: images.length });
          t.firstChild.textContent = `處理圖片中 ${i + images.length} / ${list.length}…`;
        }
        if (switched()) {                        // report closed / switched meanwhile → don't write into another one
          t.remove();
          if (created.length) saveStructure();
          showToast('已切換報告，批次圖片已停止' + (created.length ? `（已加入 ${created.length} 頁）` : ''), 'warn');
          return created.length;
        }
        const page = makePage('image');
        if (opts.title) page.data.title = opts.title;
        page.data.images = images;
        state.pages.splice(at++, 0, page);
        initPageSnapshot(page);
        created.push(page);
      }
      t.remove();
      saveStructure();
      renderPageList();
      selectPage(firstNew);
      showToast(`已加入 ${list.length} 張圖片（${created.length} 頁圖片頁）`, 'ok');
      return created.length;
    }

    // ── 標註頁: name every marker at once (paste a column from Excel) ──
    function showAnnoBatchNameModal(page) {
      const markers = page.data.markers || [];
      if (!markers.length) { alert('請先在照片上放置標註點。'); return; }
      const pageIdx = state.pages.indexOf(page);
