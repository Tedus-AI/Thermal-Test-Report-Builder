    // ── Report check (shown before export; every item jumps to its page) ──
    function runReportCheck() {
      const out = [];
      const add = (idx, level, text) => out.push({ idx, level, text });
      const groups = getDataPageComponentGroups();
      const all = groups.flatMap(g => g.components);
      state.pages.forEach((p, idx) => {
        const d = p.data || {};
        if (p.type === 'cover') {
          if (!String(d.project_name || '').trim()) add(idx, 'warn', '封面未填案名');
          if (!String(d.model || '').trim()) add(idx, 'info', '封面未填產品型號');
          if (!String(d.tested_by || '').trim()) add(idx, 'info', '封面未填 Tested by');
          if (!d.cover_image) add(idx, 'info', '封面沒有產品圖片');
        } else if (p.type === 'image') {
          if (!(d.images || []).some(im => im && im.url_or_base64)) add(idx, 'warn', '圖片頁沒有圖片');
          else if (!String(d.title || '').trim()) add(idx, 'info', '圖片頁未填標題');
        } else if (p.type === 'annotation') {
          if (!d.photo_url_or_base64) add(idx, 'warn', '標註頁沒有照片');
          else if (!(d.markers || []).length) add(idx, 'info', '標註頁沒有標註點');
          else {
            const unnamed = d.markers.filter(m => !String(m.label || '').trim()).length;
            if (unnamed) add(idx, 'info', `${unnamed} 個標註點未命名（PDF 會顯示 TC 編號）`);
          }
        } else if (p.type === 'data') {
          const comps = d.components || [];
          const tas = d.ta_conditions || [];
          if (!comps.length) { add(idx, 'warn', '數據頁沒有元件'); return; }
          const noName = comps.filter(c => !String(c.name || '').trim()).length;
          if (noName) add(idx, 'warn', `${noName} 顆元件未命名`);
          const noSpec = comps.filter(c => !c.disabled && !(parseTemp(c.tc_spec) > 0)).length;
          if (noSpec) add(idx, 'warn', `${noSpec} 顆元件未填 Tc Spec，無法判定`);
          tas.forEach(ta => {
            const miss = comps.filter(c => !c.disabled && isNaN(parseTemp((c.readings || {})['ta_' + ta]))).length;
            if (miss) add(idx, 'warn', `Ta ${ta}°C 有 ${miss} 顆未填實測值`);
          });
          const mpMiss = tas.filter(ta => !machinePowerText(d, ta));
          if (mpMiss.length) add(idx, 'info', `機台功耗未填（Ta ${mpMiss.join(' / ')}°C）`);
          if (!(d.header || {}).test_date) add(idx, 'info', '未填 Test Date');
          Object.entries(d.logger_last || {}).forEach(([key, lg]) => {
            if (tas.some(t => 'ta_' + t === key) && (lg.unstable || []).length) add(idx, 'info', `Ta ${key.replace(/^ta_/, '')}°C 匯入時 ${lg.unstable.length} 顆未達穩態`);
          });
        } else if (p.type === 'sim_vs_meas') {
          const items = d.items || [];
          if (!items.length) { add(idx, 'warn', '比對頁尚未選取元件'); return; }
          const ta = simCompareTa(d);
          const vals = items.map(it => simRowValues(it, all, ta));
          const stale = vals.filter(v => v.stale).length;
          if (stale) add(idx, 'warn', `${stale} 個比對元件的來源已變更，請重新選取`);
          const noSim = items.filter(it => isNaN(parseTemp(it.sim_tc))).length;
          if (noSim) add(idx, 'warn', `${noSim} 個元件未填 Sim Tc`);
          const noTa = vals.filter(v => v.noTa).length;
          if (noTa) add(idx, 'warn', `${noTa} 個元件的數據頁沒有 Ta = ${ta}°C`);
          if (!String(d.conclusion || '').trim()) add(idx, 'info', '比對頁未填結論敘述');
        } else if (p.type === 'compare') {
          const sd = (d.series || []).map(sr => compareSeriesData(sr, false));
          if (sd.length < 2) add(idx, 'warn', '比較頁至少需要 2 個比較對象');
          const missing = sd.filter(x => !x.ok).length;
          if (missing) add(idx, 'warn', `${missing} 個比較對象找不到來源`);
          if (sd.some(x => x.ok && !x.live)) add(idx, 'info', '部分比較對象使用快照（來源報告不在目前資料庫）');
        } else if (p.type === 'conclusion') {
          const text = String(d.summary || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
          if (!text) add(idx, 'warn', '結論未填寫');
          const overall = computeOverallResult(groups);
          const listed = new Set((d.compliance || []).map(r => compRefKey(resolveComponentRef(r, all))).filter(Boolean));
          const unl = overall.flagged.filter(c => !listed.has(compRefKey(c))).length;
          if (unl) add(idx, 'warn', `${unl} 顆 Fail / Warning 元件未列入 Compliance Summary`);
          const stale = (d.compliance || []).filter(r => !resolveComponentRef(r, all)).length;
          if (stale) add(idx, 'warn', `${stale} 列 Compliance 的來源元件已變更`);
          if (overall.nFail && !(d.issues || []).some(t => String(t || '').trim())) add(idx, 'info', '有 Fail 元件，但 Issues Found 是空的');
        }
      });
      if (state.pages.some(p => p.type === 'data') && !state.pages.some(p => p.type === 'conclusion')) add(null, 'info', '報告沒有結論頁');
      return out;
    }

    // ── Page-list badges (status at a glance; refreshed shortly after edits) ──
    function pageBadge(page) {
      const d = page.data || {};
      if (page.type === 'data') {
        const s = dataPageStats(d);
        const judged = s.n.pass + s.n.warn + s.n.fail + s.n.unmeasured;
        if (s.n.fail) return { cls: 'fail', text: '❌' + s.n.fail, title: `${s.n.fail} Fail${s.n.warn ? ' · ' + s.n.warn + ' Warning' : ''}` };
        if (s.n.warn) return { cls: 'warn', text: '⚠' + s.n.warn, title: `${s.n.warn} Warning` };
        if (judged && s.n.unmeasured) return { cls: '', text: `${judged - s.n.unmeasured}/${judged}`, title: `已量測 ${judged - s.n.unmeasured} / ${judged} 顆` };
        if (judged) return { cls: 'pass', text: '✓', title: '全部 Pass' };
        return null;
      }
      if (page.type === 'sim_vs_meas') {
        const items = d.items || [];
        if (!items.length) return { cls: '', text: '空', title: '尚未選取元件' };
        const miss = items.filter(it => isNaN(parseTemp(it.sim_tc))).length;
        return miss ? { cls: '', text: `缺${miss}`, title: `${miss} 個元件未填 Sim Tc` } : null;
      }
      if (page.type === 'conclusion') {
        const s = computeOverallResult();
        if (s.status === 'none') return null;
        return { cls: s.status === 'warning' ? 'warn' : s.status, text: s.status === 'fail' ? 'FAIL' : s.status === 'warning' ? 'COND' : 'PASS', title: s.label };
      }
      if (page.type === 'image' && !(d.images || []).some(im => im && im.url_or_base64)) return { cls: '', text: '空', title: '尚未放入圖片' };
      if (page.type === 'compare' && (d.series || []).length < 2) return { cls: '', text: '空', title: '至少需要 2 個比較對象' };
      if (page.type === 'annotation' && !d.photo_url_or_base64) return { cls: '', text: '空', title: '尚未放入照片' };
      return null;
    }
    function pageBadgeHTML(page) {
      const b = pageBadge(page);
      return b ? `<span class="page-badge${b.cls ? ' page-badge-' + b.cls : ''}" title="${escapeAttr(b.title)}">${escHtml(b.text)}</span>` : '';
    }
    let _badgeTimer = null;
    function schedulePageBadgeRefresh() {
      clearTimeout(_badgeTimer);
      _badgeTimer = setTimeout(refreshPageBadges, 400);
    }
    function refreshPageBadges() {
      _badgeTimer = null;
      $pageList.querySelectorAll('.page-item').forEach(el => {
        const page = state.pages[parseInt(el.dataset.index)];
        if (!page) return;
        const html = pageBadgeHTML(page);
        const cur = el.querySelector('.page-badge');
        if (cur) { if (html) cur.outerHTML = html; else cur.remove(); }
        else if (html) el.querySelector('.page-label').insertAdjacentHTML('afterend', html);
      });
    }

    // ── New report from an existing one (template) ──
    // Keeps page structure, components, specs, Ta conditions, logger channel
    // mapping and (optionally) photos; clears every measured / simulated value
    // and the conclusion. Note pages (scratch jottings) are not carried over.
    function templateFromPages(pages, o) {
      const idMap = {};
      const out = [];
      pages.filter(p => p && p.type && p.type !== 'note').forEach(src => {
        const p = { id: newPageId(), type: src.type, order: out.length, data: JSON.parse(JSON.stringify(src.data || {})) };
        if (src.id) idMap[src.id] = p.id;
        const d = p.data;
        if (p.type === 'cover') {
          Object.assign(d, { project_name: o.name, model: o.model, stage: o.stage, date: o.date, report_version: 'v1.0' });
          if (!o.keepImages) d.cover_image = '';
        } else if (p.type === 'image') {
          if (!o.keepImages) d.images = [];
        } else if (p.type === 'annotation') {
          if (!o.keepImages) { d.photo_url_or_base64 = ''; if (d.photo2) d.photo2.photo_url_or_base64 = ''; }
        } else if (p.type === 'data') {
          clearDataPageValues(d);
          d.header = Object.assign({}, d.header || {}, { test_date: o.date, stage: o.stage, sw_images: [] });
          (d.components || []).forEach(c => { if (!c.uid) c.uid = newCompUid(); delete c.highlight; delete c.disabled; });
          (d.sensors || []).forEach(s => { delete s.highlight; delete s.disabled; });
        } else if (p.type === 'sim_vs_meas') {
          (d.items || []).forEach(it => { it.sim_tc = ''; it.note = ''; });
          d.conclusion = ''; d.conclusion_html = '';
          if (!o.keepImages) { d.sim_image = ''; d.meas_image = ''; }
        } else if (p.type === 'conclusion') {
          Object.assign(d, { summary: '', issues: [''], actions: [], compliance: [], flag_hint_hidden: false });
        }
        out.push(p);
      });
      // Re-point 比對頁 links at the new data-page ids (component uids are kept).
      out.forEach(p => {
        if (p.type === 'sim_vs_meas') (p.data.items || []).forEach(it => { if (idMap[it.source_page]) it.source_page = idMap[it.source_page]; });
        if (p.type === 'annotation' && p.data.temp_src && idMap[p.data.temp_src.page_id]) p.data.temp_src.page_id = idMap[p.data.temp_src.page_id];
        if (p.type === 'compare') (p.data.series || []).forEach(sr => { if (!sr.report_id && idMap[sr.page_id]) sr.page_id = idMap[sr.page_id]; });
      });
      return out;
    }

    // ━━━ 比較頁 (Comparison page) ━━━
    // Compares component Tc between test conditions of this report and/or data
    // pages of OTHER reports in the database (e.g. EVT vs DVT). Rows are matched
    // by component name; the first series is the baseline and every other
    // series gets a ΔTc column. A series from another report keeps a snapshot of
    // its values, so the page (and the PDF) still works if that report is
    // deleted or is not in a colleague's database.
    //   d = { title, ta, sort: 'order'|'delta', series: [{ report_id|null, page_id, label, snapshot? }] }
    const COMPARE_MAX_SERIES = 4;
    let reportDigestCache = [];          // other reports' digests (filled by loadSpecMemory)

    // Pages of reports not opened since page ids were introduced have no id yet → match by position.
    const compareDigestPageKey = dp => dp.id || ('#' + dp.n);
    function compareSourceLabel(reportName, pageN, note) {
      return `${reportName ? reportName + ' · ' : ''}數據頁 ${pageN}${note ? ' · ' + note : ''}`;
    }
    // Live data of one series → { ok, live, label, tas, comps } (comps as stored on a data page).
    function compareSeriesData(s, refreshSnapshot) {
      if (!s) return { ok: false };
      if (!s.report_id) {
        const idx = state.pages.findIndex(p => p.id === s.page_id && p.type === 'data');
        if (idx < 0) return { ok: false, label: s.label || '（已刪除的數據頁）' };
        const p = state.pages[idx];
        return { ok: true, live: true, label: s.label || (pageBaseLabel(idx) + (p.data.list_note ? ' · ' + p.data.list_note : '')), tas: p.data.ta_conditions || [], comps: p.data.components || [] };
      }
      const rep = reportDigestCache.find(r => r.id === s.report_id);
      const dp = rep && rep.dataPages.find(x => compareDigestPageKey(x) === s.page_id || s.page_id === '#' + x.n);
      if (dp) {
        const snap = { report_name: rep.project_name || '', stage: rep.stage || '', page_label: compareSourceLabel('', dp.n, dp.note).trim(), ta_conditions: dp.ta_conditions, components: dp.components };
        let changed = false;
        if (refreshSnapshot && JSON.stringify(s.snapshot) !== JSON.stringify(snap)) { s.snapshot = snap; changed = true; }
        return { ok: true, live: true, changed, label: s.label || `${rep.stage ? rep.stage + ' · ' : ''}${compareSourceLabel(rep.project_name, dp.n, dp.note)}`, tas: dp.ta_conditions, comps: dp.components };
      }
      if (s.snapshot) {
        const sn = s.snapshot;
        return { ok: true, live: false, label: s.label || `${sn.stage ? sn.stage + ' · ' : ''}${sn.report_name} · ${sn.page_label}`, tas: sn.ta_conditions || [], comps: sn.components || [] };
      }
      return { ok: false, label: s.label || '（找不到來源報告）' };
    }
    function compareTaOptions(seriesData) {
      const ok = seriesData.filter(x => x.ok);
      const union = Array.from(new Set(ok.flatMap(x => x.tas))).sort((a, b) => a - b);
      const common = union.filter(t => ok.every(x => x.tas.includes(t)));
      return { union, common };
    }
    function compareTable(d, refresh) {
      const series = (d.series || []).slice(0, COMPARE_MAX_SERIES);
      const sd = series.map(s => compareSeriesData(s, refresh));
      const { union, common } = compareTaOptions(sd);
      let ta = typeof d.ta === 'number' && union.includes(d.ta) ? d.ta
        : common.includes(55) ? 55 : common.length ? common[common.length - 1] : union.length ? union[union.length - 1] : null;
      const rows = [], byKey = new Map();
      sd.forEach((x, si) => {
        if (!x.ok) return;
        x.comps.forEach(c => {
          const k = specKey(c.name);
          if (!k) return;
          let row = byKey.get(k);
          if (!row) { row = { name: String(c.name).trim(), category: c.category || 'RF', derated: NaN, cells: [] }; byKey.set(k, row); rows.push(row); }
          const calc = computeComponent(c, x.tas);
          const cell = calc.cells.find(z => z.ta === ta);
          row.cells[si] = { tc: cell && !calc.disabled ? cell.tc : NaN, status: calc.disabled ? 'disabled' : cell ? cell.status : 'none', noTa: !x.tas.includes(ta) };
          if (calc.derated > 0) { row.derated = calc.derated; row.category = c.category || row.category; }   // the latest series wins
        });
      });
      rows.forEach(r => {
        r.deltas = sd.map((x, si) => {
          const a = r.cells[0], b = r.cells[si];
          return si && a && b && !isNaN(a.tc) && !isNaN(b.tc) ? b.tc - a.tc : NaN;
        });
      });
      if (d.sort === 'delta' && sd.length > 1) {
        const last = sd.length - 1;
        rows.sort((a, b) => (isNaN(b.deltas[last]) ? -Infinity : Math.abs(b.deltas[last])) - (isNaN(a.deltas[last]) ? -Infinity : Math.abs(a.deltas[last])));
      }
      return { series, sd, ta, union, common, rows, changed: sd.some(x => x.changed) };
    }
    // "B vs A：平均 ΔTc −2.3°C（8 顆），降溫最多 PA-1 −5.1°C，升溫最多 LNA +1.2°C"
    function compareSummaryLines(t) {
      const sign = v => (v >= 0 ? '+' : '') + v.toFixed(1);
      return t.sd.slice(1).map((x, k) => {
        const si = k + 1;
        const ds = t.rows.map(r => ({ r, v: r.deltas[si] })).filter(z => !isNaN(z.v));
        if (!ds.length || !x.ok || !t.sd[0].ok) return '';
        const mean = ds.reduce((a, z) => a + z.v, 0) / ds.length;
        const min = ds.reduce((a, z) => (z.v < a.v ? z : a)), max = ds.reduce((a, z) => (z.v > a.v ? z : a));
        return `${x.label} 對比 ${t.sd[0].label}：平均 ΔTc ${sign(mean)}°C（${ds.length} 顆）`
          + (min.v < 0 ? `，降溫最多 ${min.r.name} ${sign(min.v)}°C` : '')
          + (max.v > 0 ? `，升溫最多 ${max.r.name} ${sign(max.v)}°C` : '') + '。';
      }).filter(Boolean);
    }
    // Static table (editor preview + PDF). rows = a chunk of t.rows.
    function compareTableHTML(t, rows) {
      const th = 'text-align:center;font-family:&apos;JetBrains Mono&apos;,monospace;font-size:8px;font-weight:500;color:#fff;padding:4px 6px;background:#0B3D7A;border:1px solid rgba(255,255,255,0.3);white-space:normal;letter-spacing:0;';
      const td = 'padding:3px 5px;border:1px solid rgba(15,23,42,0.08);font-size:10px;white-space:nowrap;letter-spacing:0;text-align:center;';
      const stBg = { fail: 'background:rgba(231,76,60,0.10);color:#c0392b;font-weight:600;', warn: 'background:rgba(243,156,18,0.12);color:#b9770e;font-weight:600;', pass: '', none: '', disabled: 'color:rgba(15,23,42,0.4);' };
      const head = t.sd.map((x, si) => `<th style="${th}">${escHtml(x.label || '—')}${si === 0 ? '<br><span style="opacity:0.75;">（基準）</span>' : ''}<br>Tc${t.ta !== null ? ` @ ${t.ta}°C` : ''}</th>${si ? `<th style="${th}">ΔTc (°C)</th>` : ''}`).join('');
      const body = rows.map(r => {
        const cells = t.sd.map((x, si) => {
          const c = r.cells[si];
          const tcTxt = !x.ok || !c ? '—' : c.status === 'disabled' ? '斷線' : c.noTa ? '無此 Ta' : fmt1(c.tc);
          const dv = r.deltas[si];
          const dTxt = isNaN(dv) ? '—' : (dv >= 0 ? '+' : '') + dv.toFixed(1);
          const dStyle = isNaN(dv) || Math.abs(dv) < 0.5 ? 'color:rgba(15,23,42,0.6);' : dv < 0 ? 'color:#1e8449;font-weight:700;' : 'color:#c0392b;font-weight:700;';
          return `<td style="${td}${c ? stBg[c.status] || '' : ''}">${tcTxt}</td>${si ? `<td style="${td}${dStyle}">${dTxt}</td>` : ''}`;
        }).join('');
        return `<tr><td style="${td}text-align:left;"><span style="display:inline-block;width:3px;height:14px;border-radius:2px;background:${catColorOf(r.category)};margin-right:3px;vertical-align:middle;"></span>${escHtml(r.category)}</td>
          <td style="${td}white-space:normal;word-break:break-word;">${escHtml(r.name)}</td><td style="${td}">${fmt1(r.derated)}</td>${cells}</tr>`;
      }).join('');
      return `<div style="border:1px solid #C2DFF8;"><table style="width:100%;border-collapse:collapse;font-size:10px;">
          <thead><tr><th style="${th}">類別</th><th style="${th}">元件名稱</th><th style="${th}">Derated Tc (°C)</th>${head}</tr></thead>
          <tbody>${body || `<tr><td colspan="${3 + t.sd.length * 2}" style="${td}color:rgba(15,23,42,0.5);">尚無可比較的元件</td></tr>`}</tbody></table></div>`;
    }
    const COMPARE_NOTE = '※ 依元件名稱對應；ΔTc = 比較對象 Tc − 基準 Tc（負值 = 降溫，綠色；正值 = 升溫，紅色；|ΔTc| < 0.5°C 視為持平）。Tc 底色：紅 = Fail、黃 = Warning（依各自的 Derated Spec）。';
    function buildComparePagesHTML(d) {
      const t = compareTable(d, false);
      const title = `<div style="font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.02em;color:#0B3D7A;margin-bottom:8px;">${escHtml(d.title || 'COMPARISON')}${t.ta !== null ? ` — Ta = ${t.ta}°C` : ''}</div>`;
      const stale = t.sd.filter(x => x.ok && !x.live).length ? `<div style="font-size:8.5px;color:#b45309;margin-top:4px;">※ 部分比較對象的報告不在目前資料庫，使用加入時的數值快照。</div>` : '';
      const extras = `<div style="font-size:9px;color:rgba(15,23,42,0.6);padding-top:6px;line-height:1.6;">${escHtml(COMPARE_NOTE)}</div>${stale}
        ${compareSummaryLines(t).map(l => `<div style="font-size:10.5px;color:rgba(15,23,42,0.85);margin-top:6px;">■ ${escHtml(l)}</div>`).join('')}`;
      const shell = body => wrapPageHTML(`<div style="width:100%;height:100%;padding:22px 28px 28px;color:rgba(15,23,42,0.9);overflow:hidden;letter-spacing:0;">${title}${body}${PG_END}</div>`);
      if (!t.rows.length) return [shell(compareTableHTML(t, []) + extras)];
      // rows per page by measurement; notes / summaries under the last rows or on their own page
      const pages = pgSplit(t.rows.length, (a, b) => shell(compareTableHTML(t, t.rows.slice(a, b)))).map(([a, b]) => compareTableHTML(t, t.rows.slice(a, b)));
      const last = pages.length - 1;
      if (pgFits(shell(pages[last] + extras))) pages[last] += extras;
      else pages.push(extras);
      return pages.map(shell);
    }

    function renderComparePage(page) {
      const d = page.data;
      if (!Array.isArray(d.series)) d.series = [];
      const pageIdx = state.activePage;
      const t = compareTable(d, true);
      if (t.changed) scheduleSave(pageIdx, { undo: false });           // refreshed snapshot of another report
      // source options: this report's data pages + every data page of other reports
      const localOpts = state.pages.map((p, i) => ({ p, i })).filter(x => x.p.type === 'data')
        .map(x => `<option value="L|${escapeAttr(x.p.id)}">${escHtml(pageBaseLabel(x.i) + (x.p.data.list_note ? ' · ' + x.p.data.list_note : ''))}</option>`).join('');
      const otherGroups = reportDigestCache.filter(r => r.dataPages.length).map(r =>
        `<optgroup label="${escapeAttr([r.project_name || '未命名報告', r.model, r.stage].filter(Boolean).join(' · '))}">${r.dataPages.map(dp =>
          `<option value="R|${escapeAttr(r.id)}|${escapeAttr(compareDigestPageKey(dp))}">${escHtml((r.stage ? r.stage + ' · ' : '') + compareSourceLabel(r.project_name || '未命名報告', dp.n, dp.note))}</option>`).join('')}</optgroup>`).join('');
      const srcOptions = `<optgroup label="本報告">${localOpts}</optgroup>${otherGroups}`;
      const valueOf = s => s.report_id ? `R|${s.report_id}|${s.page_id}` : `L|${s.page_id}`;
      const seriesRows = d.series.slice(0, COMPARE_MAX_SERIES).map((s, i) => {
        const x = t.sd[i];
        const known = (s.report_id ? reportDigestCache.some(r => r.id === s.report_id) : true);
        return `<div class="cmp-series-row">
          <span class="cmp-tag${i === 0 ? ' base' : ''}">${i === 0 ? '基準' : '比較 ' + i}</span>
          <select class="tool-select-light" data-cmp-src="${i}">${known ? '' : `<option value="${escapeAttr(valueOf(s))}" selected>（快照）${escHtml(x.label || '')}</option>`}${srcOptions.replace(`value="${escapeAttr(valueOf(s))}"`, `value="${escapeAttr(valueOf(s))}" selected`)}</select>
          <input type="text" class="cmp-label" data-cmp-label="${i}" placeholder="${escapeAttr(x.label || '欄位名稱')}" value="${escapeAttr(s.label || '')}" title="表頭顯示名稱（空白 = 自動）">
          ${!x.ok ? '<span class="cmp-warn">⚠ 找不到來源</span>' : !x.live ? '<span class="cmp-warn" title="來源報告不在目前資料庫，使用加入時的快照">快照</span>' : ''}
          <button type="button" class="cmp-btn" data-cmp-up="${i}" title="上移"${i === 0 ? ' disabled' : ''}>↑</button>
          <button type="button" class="cmp-btn" data-cmp-del="${i}" title="移除">✕</button>
        </div>`;
      }).join('');
      const taSel = t.union.length ? `<label class="cmp-ctl">比較 Ta <select class="tool-select-light" id="cmp-ta">${t.union.map(v => `<option value="${v}"${v === t.ta ? ' selected' : ''}>${v}°C${t.common.includes(v) ? '' : '（部分對象沒有）'}</option>`).join('')}</select></label>` : '';
      $canvas.innerHTML = editorPageWrapHTML(`
        <div class="cmp-page">
          <div class="cmp-top">
            <input type="text" class="cmp-title" id="cmp-title" placeholder="比較標題（例：RF 補償前後 / EVT vs DVT）" value="${escapeAttr(d.title || '')}">
            ${taSel}
            <label class="cmp-ctl">排序 <select class="tool-select-light" id="cmp-sort"><option value="order"${d.sort !== 'delta' ? ' selected' : ''}>依基準順序</option><option value="delta"${d.sort === 'delta' ? ' selected' : ''}>依 |ΔTc| 大 → 小</option></select></label>
          </div>
          <div class="cmp-series">
            ${seriesRows || '<div class="cmp-empty">選擇要比較的數據頁：本報告的不同測試條件，或其他報告（例如上一個 Stage）。第一個是基準。</div>'}
            ${d.series.length < COMPARE_MAX_SERIES ? `<div class="cmp-series-row"><select class="tool-select-light" id="cmp-add"><option value="">＋ 加入比較對象…</option>${srcOptions}</select></div>` : ''}
          </div>
          <div class="cmp-table">${compareTableHTML(t, t.rows)}</div>
          <div class="cmp-note">${escHtml(COMPARE_NOTE)}</div>
          <div class="cmp-summary">${compareSummaryLines(t).map(l => `<div>■ ${escHtml(l)}</div>`).join('')}</div>
        </div>`);
      $canvas.classList.add('scrollable-edit');

      const parseSrc = v => {
        const [kind, a, b] = v.split('|');
        if (kind === 'L') return { report_id: null, page_id: a };
        if (kind === 'R') return { report_id: a, page_id: b };
        return null;
      };
      const commit = () => { scheduleSave(pageIdx); renderComparePage(page); };
      document.getElementById('cmp-title').addEventListener('input', (e) => { d.title = e.target.value; scheduleSave(pageIdx); });
      document.getElementById('cmp-ta')?.addEventListener('change', (e) => { d.ta = parseFloat(e.target.value); commit(); });
      document.getElementById('cmp-sort').addEventListener('change', (e) => { d.sort = e.target.value; commit(); });
      document.getElementById('cmp-add')?.addEventListener('change', (e) => {
        const s = parseSrc(e.target.value);
        if (!s) return;
        d.series.push(s);
        compareSeriesData(s, true);       // take the snapshot right away
        commit();
      });
      $canvas.querySelectorAll('[data-cmp-src]').forEach(sel => sel.addEventListener('change', () => {
        const i = parseInt(sel.dataset.cmpSrc);
        const s = parseSrc(sel.value);
        if (!s) return;
        d.series[i] = Object.assign({ label: d.series[i].label || '' }, s);
        compareSeriesData(d.series[i], true);
        commit();
      }));
      $canvas.querySelectorAll('[data-cmp-label]').forEach(inp => inp.addEventListener('change', () => {
        d.series[parseInt(inp.dataset.cmpLabel)].label = inp.value.trim();
        commit();
      }));
      $canvas.querySelectorAll('[data-cmp-up]').forEach(btn => btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.cmpUp);
        if (i < 1) return;
        [d.series[i - 1], d.series[i]] = [d.series[i], d.series[i - 1]];
        commit();
      }));
      $canvas.querySelectorAll('[data-cmp-del]').forEach(btn => btn.addEventListener('click', () => {
        d.series.splice(parseInt(btn.dataset.cmpDel), 1);
        commit();
      }));
    }

    // ━━━ 目錄頁 (Table of contents) ━━━
    // One line per report page in the PDF, with the page number it starts on.
    // Numbers come from the pages actually previewed / exported (filled in by
    // numberVirtualPages), so a data page spanning several PDF pages, or an
    // export of selected pages only, is always numbered right.
    function tocEntryLabel(page, pageIdx) {
      const d = page.data || {};
      if (page.type === 'image') return d.title || pageBaseLabel(pageIdx);
      if (page.type === 'annotation') return d.title || 'Thermocouple Location';
      if (page.type === 'data') return 'Thermal Test Data' + (d.list_note ? ' — ' + d.list_note : '');
      if (page.type === 'sim_vs_meas') { const ta = simCompareTa(d); return 'Simulation vs Measurement' + (ta !== null ? ` — Ta = ${ta}°C` : ''); }
      if (page.type === 'conclusion') return 'Test Conclusion';
      if (page.type === 'compare') return d.title || 'Comparison';
      return pageBaseLabel(pageIdx);
    }
    // Second line of an entry: a data page's 註記 (top_note — usually the test condition).
    const tocEntrySub = (page) => page.type === 'data' ? String((page.data && page.data.top_note) || '').trim() : '';
    function buildTocHTML(list, tocPage) {
      const seen = new Set();
      const entries = [];
      list.forEach((vp, i) => {
        if (vp.page === tocPage || vp.page.type === 'cover' || seen.has(vp.page)) return;
        seen.add(vp.page);
        entries.push({ label: tocEntryLabel(vp.page, vp.pageIdx), sub: tocEntrySub(vp.page), num: i + 1 });
      });
      // One column (conditions wrap) → two columns (conditions on one line) → two columns
      // without them: the first that fits on the page (measured, like the other pages).
      const variants = [{ two: false, fs: 12.5, sub: 'wrap' }, { two: true, fs: 11, sub: 'line' }, { two: true, fs: 10.5, sub: '' }]
        .slice(entries.length > 16 ? 1 : 0);
      const page = (v) => {
        const row = e => `<div style="padding:${v.two ? 4 : 5}px 0;">
            <div style="display:flex;align-items:baseline;gap:6px;font-size:${v.fs}px;color:rgba(15,23,42,0.88);">
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:${v.two ? 300 : 620}px;">${escHtml(e.label)}</span>
              <span style="flex:1;border-bottom:1px dotted rgba(15,23,42,0.35);transform:translateY(-3px);"></span>
              <span style="font-family:'JetBrains Mono',monospace;color:#0B3D7A;font-weight:600;">${e.num}</span></div>
            ${v.sub && e.sub ? `<div data-toc-sub style="margin:2px 34px 0 14px;font-family:'JetBrains Mono','Noto Sans TC',monospace;font-size:${v.two ? 8.5 : 9.5}px;line-height:1.4;color:rgba(15,23,42,0.58);${v.sub === 'wrap' ? 'overflow-wrap:anywhere;' : 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'}">${escHtml(e.sub)}</div>` : ''}
          </div>`;
        const half = Math.ceil(entries.length / 2);
        const cols = v.two
          ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 36px;"><div style="min-width:0;">${entries.slice(0, half).map(row).join('')}</div><div style="min-width:0;">${entries.slice(half).map(row).join('')}</div></div>`
          : entries.map(row).join('');
        return wrapPageHTML(`<div style="width:100%;height:100%;padding:34px 60px 40px;letter-spacing:0;">
            <div style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#0B3D7A;letter-spacing:0.04em;">${escHtml((tocPage.data && tocPage.data.title) || 'CONTENTS')}</div>
            <div style="width:48px;height:2px;background:#2357A7;margin:8px 0 18px;"></div>
            ${cols || '<div style="color:rgba(15,23,42,0.5);font-size:12px;">（沒有其他頁面）</div>'}${PG_END}
          </div>`);
      };
      for (const v of variants) { const html = page(v); if (v === variants[variants.length - 1] || pgFits(html)) return html; }
    }
    function renderTocPage(page) {
      const d = page.data;
      const list = numberVirtualPages(buildVirtualPages());
      const vp = list.find(v => v.page === page);
      $canvas.innerHTML = `<div style="position:relative;width:100%;height:100%;">${vp ? vp.html : ''}
        <div class="toc-editor-bar">
          <input type="text" id="toc-title" value="${escapeAttr(d.title || '')}" placeholder="標題（預設 CONTENTS）">
          <span>頁碼依匯出時實際的頁數自動計算（只匯出部分頁面時也會重算）</span>
        </div></div>`;
      document.getElementById('toc-title').addEventListener('change', (e) => { d.title = e.target.value.trim(); scheduleSave(state.activePage); renderTocPage(page); });
    }

    // ━━━ Utility ━━━
    function escapeAttr(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ━━━ Report Homepage ━━━
    const $homepage = document.getElementById('homepage');
    const $editorApp = document.getElementById('editor-app');
    const $hpGrid = document.getElementById('hp-grid');
    const $hpEmpty = document.getElementById('hp-empty');

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - d) / 1000);
      if (diff < 60) return '剛剛';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
      const days = Math.floor(diff / 86400);
      if (days <= 30) return days + ' 天前';
      return d.toLocaleDateString('zh-TW');
    }

    async function loadReportList() {
      try {
        return await dbAdapter.getAllReports();
      } catch (err) {
        console.warn('Could not load report list:', err);
        return [];
      }
    }

    // Homepage list: search / Stage filter / sort, with each report's overall
    // result (from its data pages) on the card. Clicking a card opens it.
    const STAGE_ORDER = ['Prototype', 'EVT', 'DVT', 'PVT', 'MP'];
    const hpView = { q: '', stage: '', sort: userPrefs().hp_sort || 'updated' };
    let hpCache = { reports: [], digests: new Map() };
    const $hpTools = document.getElementById('hp-tools');

    function digestResult(dg) {
      if (!dg) return null;
      const comps = dg.dataPages.flatMap(dp => dp.components.map(c => {
        const calc = computeComponent(c, dp.ta_conditions);
        return { disabled: calc.disabled, tc_derated: calc.derated, calc };
      }));
      return summarizeComponents(comps);
    }

    async function renderHomepage() {
      if (!dbAdapter.isReady()) {
        $hpTools.style.display = 'none';
        renderHomepageNoDb();
        return;
      }
      const reports = await loadReportList();
      let digests = [];
      try { digests = await dbAdapter.getReportDigests(); } catch (e) { /* cards just show no result */ }
      hpCache = { reports, digests: new Map(digests.map(x => [x.id, x])) };
      if (reports.length === 0) {
        $hpTools.style.display = 'none';
        $hpEmpty.innerHTML = `<div class="icon">📋</div><div class="text">尚無報告，點擊右上方「+ 新增報告」開始</div>`;
        $hpEmpty.style.display = 'flex';
        $hpGrid.style.display = 'none';
        return;
      }
      $hpEmpty.style.display = 'none';
      $hpTools.style.display = 'flex';
      $hpGrid.style.display = 'grid';
      const stages = STAGE_ORDER.filter(st => reports.some(r => r.stage === st))
        .concat(Array.from(new Set(reports.map(r => r.stage).filter(st => st && !STAGE_ORDER.includes(st)))));
      if (hpView.stage && !stages.includes(hpView.stage)) hpView.stage = '';
      document.getElementById('hp-stage-filter').innerHTML = ['', ...stages].map(st =>
        `<button type="button" class="hp-stage-btn${hpView.stage === st ? ' active' : ''}" data-stage="${escapeAttr(st)}">${st ? escHtml(st) : '全部'}</button>`).join('');
      document.getElementById('hp-sort').value = hpView.sort;
      renderHomepageGrid();
    }

    function renderHomepageGrid() {
      const terms = hpView.q.toLowerCase().split(/\s+/).filter(Boolean);
      const time = r => String(r.updated_at || r.created_at || '');
      const list = hpCache.reports.filter(r => {
        if (hpView.stage && r.stage !== hpView.stage) return false;
        const hay = [r.project_name, r.model, r.stage, r.date].join(' ').toLowerCase();
        return terms.every(t => hay.includes(t));
      }).sort(hpView.sort === 'name' ? (a, b) => naturalCompare(a.project_name || '', b.project_name || '')
        : hpView.sort === 'created' ? (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || ''))
        : (a, b) => time(b).localeCompare(time(a)));
      document.getElementById('hp-count').textContent = list.length === hpCache.reports.length
        ? `共 ${list.length} 份` : `顯示 ${list.length} / ${hpCache.reports.length} 份`;
      if (!list.length) {
        $hpGrid.innerHTML = '<div class="hp-no-match">沒有符合條件的報告</div>';
        return;
      }
      const RESULT_SHORT = { pass: '✓ PASS', warning: '⚠ CONDITIONAL', fail: '✕ FAIL' };
      $hpGrid.innerHTML = list.map(r => {
        const dg = hpCache.digests.get(r.id);
        const sm = digestResult(dg);
        const result = sm && sm.status !== 'none'
          ? `<span class="hp-result hp-result-${sm.status}" title="${escapeAttr(summaryCountsText(sm))}">${RESULT_SHORT[sm.status]}</span>` : '';
        return `
        <div class="hp-card" data-report-id="${escapeAttr(r.id)}">
          <div class="hp-card-title" contenteditable="true" spellcheck="false"
               data-report-id="${escapeAttr(r.id)}" data-original="${escapeAttr(r.project_name || '未命名報告')}"
          >${escapeAttr(r.project_name || '未命名報告')}</div>
          ${r.model ? `<div class="hp-card-date" style="font-size:12px;margin-top:-4px;">${escapeAttr(r.model)}</div>` : ''}
          <div class="hp-card-meta">
            ${r.stage ? `<span class="hp-badge">${escapeAttr(r.stage)}</span>` : ''}
            ${result}
            ${/衝突副本/.test(r.project_name || '') ? '<span class="hp-conflict" title="SharePoint 同步時兩人改了同一份報告，這是對方的版本">衝突副本</span>' : ''}
            ${r.date ? `<span class="hp-card-date">${escapeAttr(r.date)}</span>` : ''}
            ${dg ? `<span class="hp-card-pages">${dg.pageCount} 頁</span>` : ''}
          </div>
          <div class="hp-card-updated">最後編輯：${timeAgo(r.updated_at || r.created_at)}</div>
          <div class="hp-card-actions">
            <button class="hp-card-btn primary" data-action="open" data-id="${escapeAttr(r.id)}">開啟編輯</button>
            <button class="hp-card-btn" data-action="template" data-id="${escapeAttr(r.id)}" title="以這份報告的頁面、元件與規格建立新報告（量測值清空）">當範本新增</button>
            <button class="hp-card-btn" data-action="duplicate" data-id="${escapeAttr(r.id)}">複製</button>
            <button class="hp-card-btn danger" data-action="delete" data-id="${escapeAttr(r.id)}" data-name="${escapeAttr(r.project_name || '未命名報告')}">刪除</button>
          </div>
        </div>`;
      }).join('');

      // Bind card actions
      $hpGrid.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          if (action === 'open') {
            await openReport(id);
          } else if (action === 'template') {
            showNewReportModal({ templateId: id });
          } else if (action === 'duplicate') {
            await duplicateReport(id);
          } else if (action === 'delete') {
            showDeleteDialog(id, btn.dataset.name);
          }
        });
      });
      // Click anywhere else on a card (not the editable title) → open it
      $hpGrid.querySelectorAll('.hp-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.hp-card-title, button')) return;
          openReport(card.dataset.reportId);
        });
      });

      // Bind inline title editing
      $hpGrid.querySelectorAll('.hp-card-title').forEach(titleEl => {
        titleEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
          if (e.key === 'Escape') { titleEl.textContent = titleEl.dataset.original; titleEl.blur(); }
        });
        titleEl.addEventListener('blur', async () => {
          const newName = titleEl.textContent.trim() || '未命名報告';
          titleEl.textContent = newName;
          if (newName === titleEl.dataset.original) return;
          titleEl.dataset.original = newName;
          const reportId = titleEl.dataset.reportId;
          // Update delete button's data-name too
          const card = titleEl.closest('.hp-card');
          const delBtn = card?.querySelector('[data-action="delete"]');
          if (delBtn) delBtn.dataset.name = newName;
          const cached = hpCache.reports.find(r => r.id === reportId);
          if (cached) cached.project_name = newName;
          // Save meta + the cover page's project name in one write
          try {
            const pages = await dbAdapter.getAllPages(reportId);
            const cover = pages.find(p => p && p.type === 'cover');
            const writes = [dbAdapter.updateReportMeta(reportId, { project_name: newName, updated_at: new Date().toISOString() })];
            if (cover && cover.data) {
              cover.data.project_name = newName;
              writes.push(dbAdapter.setPage(reportId, cover.order, cover));
            }
            await Promise.all(writes);
          } catch (err) {
            handleSaveError(err);
            alert('改名失敗：' + err.message);
          }
        });
      });
    }

    // The TIM library is shared by every report in the database, so it must be
    // loaded before any report (new or existing) can edit it.
    async function loadTimLibrary() {
      try {
        const lib = await dbAdapter.getTimLibrary();
        return { grease: lib.grease || [], pad: lib.pad || [], putty: lib.putty || [] };
      } catch (e) {
        return { grease: [], pad: [], putty: [] };
      }
    }

    // opts.mode: 'blank' (cover only, default) | 'standard' | 'template' (+ templateId, keepImages)
    async function createNewReport(name, model, stage, date, opts = {}) {
      if (!requireDbOrWarn()) return;
      const id = 'rpt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const now = new Date().toISOString();

      let templatePages = null;
      if (opts.mode === 'template' && opts.templateId) {
        try { templatePages = await dbAdapter.getAllPages(opts.templateId); }
        catch (err) { alert('讀取範本報告失敗：' + err.message); return; }
      }
      try {
        await dbAdapter.createReport(id, {
          project_name: name,
          model: model,
          stage: stage,
          date: date,
          created_at: now,
          updated_at: now,
        });
      } catch (err) {
        handleSaveError(err);
        alert('建立報告失敗：' + err.message);
        return;
      }

      resetEditorSession();
      state.reportId = id;
      spSync.setOpenReport(id);
      state.pages = [];
      state.activePage = null;
      state.timLibrary = await loadTimLibrary();
      if (templatePages) {
        state.pages = templateFromPages(templatePages, { name, model, stage, date, keepImages: opts.keepImages !== false });
      }
      if (!state.pages.some(p => p.type === 'cover')) {
        const cover = makePage('cover');
        Object.assign(cover.data, { project_name: name, model, stage, date });
        state.pages.unshift(cover);
      }
      if (opts.mode === 'standard') {
        ['image', 'annotation', 'data', 'sim_vs_meas', 'conclusion'].forEach(t => state.pages.push(makePage(t)));
      }
      migrateReportData();
      state.pages.forEach((p, i) => { p.order = i; initPageSnapshot(p); });
      await loadSpecMemory();
      annoFitAllPages();
      imFitAllPages();
      saveStructure();
      showEditor();
      renderPageList();
      selectPage(0);
    }

    // One-time upgrades applied when a report is opened. Returns true when
    // anything changed (the caller then persists the whole page list once):
    //  · every data-page component gets a stable uid;
    //  · 比對頁 items / 結論頁 compliance rows are re-linked to their source
    //    component by page id + uid (legacy name/index links are resolved and
    //    upgraded; links that can't be resolved are left for the user to re-pick).
    function migrateReportData() {
      let changed = false;
      state.pages.forEach(p => {
        if (p.type !== 'data') return;
        (p.data.components || []).forEach(c => { if (!c.uid) { c.uid = newCompUid(); changed = true; } });
      });
      state.pages.forEach(p => { if (p.type === 'annotation' && annoNormalize(p.data)) changed = true; });
      state.pages.forEach(p => { if (p.type === 'image' && imNormalize(p.data)) changed = true; });
      state.pages.forEach(p => {
        const rows = p.type === 'sim_vs_meas' ? (p.data.items || [])
          : p.type === 'conclusion' ? (p.data.compliance || []) : [];
        rows.forEach(row => { if (relinkComponentRef(row)) changed = true; });
      });
      return changed;
    }

    async function openReport(reportId) {
      resetEditorSession();
      state.reportId = reportId;
      spSync.setOpenReport(reportId);
      state.pages = [];
      state.activePage = null;
      state.timLibrary = await loadTimLibrary();

      // Load every stored page (no fixed page-count cap, gaps tolerated) and
      // normalise to a contiguous order with unique, persisted page ids.
      let loaded = [];
      try {
        loaded = await dbAdapter.getAllPages(reportId);
      } catch (err) {
        console.warn('Could not load pages:', err);
        alert('無法載入報告：' + err.message);
      }
      let needsStructureSave = false;
      const seen = new Set();
      loaded.forEach(rec => {
        if (!rec || !rec.type) { needsStructureSave = true; return; }
        let id = rec.id;
        if (!id || seen.has(id)) { id = newPageId(); needsStructureSave = true; }
        seen.add(id);
        if (rec.order !== state.pages.length) needsStructureSave = true;
        state.pages.push({ id, type: rec.type, order: state.pages.length, data: rec.data || {} });
      });
      if (migrateReportData()) needsStructureSave = true;
      state.pages.forEach(p => initPageSnapshot(p));
      if (needsStructureSave) saveStructure();
      await loadSpecMemory();
      annoFitAllPages();
      imFitAllPages();

      showEditor();
      renderPageList();
      if (state.pages.length > 0) {
        selectPage(0);
        if (!needsStructureSave) setStatus('saved', '已儲存');
      } else {
        renderCanvas();
        updatePageNavButtons();
        updateUndoRedoButtons();
        setStatus('saved', '就緒');
      }
    }

    // Leave the open report: persist pending edits first; stay put if they
    // could not be written (e.g. the file changed on disk).
    async function leaveEditor() {
      if (state.reportId) {
        await flushAllSaves();
        if (dbAdapter.hasConflict()) { showDbConflictDialog(); return false; }
      }
      resetEditorSession();
      state.reportId = null;
      spSync.setOpenReport(null);
      state.pages = [];
      state.activePage = null;
      $pageList.innerHTML = '';
      $canvas.classList.remove('landscape');
      $canvas.innerHTML = '<span class="canvas-placeholder">← 請從左側選擇或新增頁面</span>';
      updatePageNavButtons();
      showHomepage();
      return true;
    }

    async function duplicateReport(sourceId) {
      const newId = 'rpt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const now = new Date().toISOString();

      try {
        const srcMeta = await dbAdapter.getReportMeta(sourceId);
        const newName = ((srcMeta && srcMeta.project_name) || '') + ' (副本)';
        await dbAdapter.copyReport(sourceId, newId, {
          project_name: newName,
          created_at: now,
          updated_at: now,
        });
      } catch (err) {
        handleSaveError(err);
        alert('複製失敗：' + err.message);
      }

      await renderHomepage();
    }

      const overlay = document.createElement('div');
      overlay.className = 'hp-modal-overlay';
      overlay.innerHTML = `
        <div class="hp-modal">
          <div class="hp-modal-header">確認刪除</div>
          <div class="hp-modal-body">
            <div class="hp-delete-msg">確定刪除「<strong>${escapeAttr(reportName)}</strong>」嗎？<br>此操作無法復原。</div>
          </div>
          <div class="hp-modal-footer">
            <button class="hp-modal-btn" id="hp-del-cancel">取消</button>
            <button class="hp-modal-btn danger" id="hp-del-confirm">確認刪除</button>
          </div>
        </div>
      `;

        alert('刪除失敗：' + err.message);

    // The database file changed on disk behind this window (another tab, a
    // colleague on a shared drive, a sync client). Saving is paused until the
    // user decides; nothing is overwritten silently.
    let _conflictDialogOpen = false;
    let _conflictSnoozed = false;   // "稍後處理": stop auto-popping; the status bar reopens it
    function showDbConflictDialog(force = true) {
      if (_conflictDialogOpen) return;
      if (!force && _conflictSnoozed) return;
      _conflictDialogOpen = true;
      const overlay = document.createElement('div');
      overlay.className = 'hp-modal-overlay';
      overlay.innerHTML = `
        <div class="hp-modal" style="max-width:520px;">
          <div class="hp-modal-header">⚠️ 資料庫檔案已被外部修改</div>
          <div class="hp-modal-body">
            <div class="hp-delete-msg" style="line-height:1.7;">
              資料庫檔案在這個視窗開啟後，被其他分頁、其他使用者或同步程式修改過。<br>
              為避免互相覆蓋，<strong>此視窗已暫停儲存</strong>。請選擇處理方式：<br>
              ・<strong>下載此視窗的資料</strong>：先把這個視窗目前的內容另存一份（建議先做）。<br>
              ・<strong>重新載入檔案</strong>：改用檔案中的最新內容，放棄此視窗尚未寫入的修改。<br>
              ・<strong>以此視窗覆蓋</strong>：用此視窗的內容覆蓋檔案，其他人的修改會遺失。
            </div>
          </div>
          <div class="hp-modal-footer" style="flex-wrap:wrap;">
            <button class="hp-modal-btn" data-cf="download">💾 下載此視窗的資料</button>
            <button class="hp-modal-btn primary" data-cf="reload">重新載入檔案</button>
            <button class="hp-modal-btn danger" data-cf="overwrite">以此視窗覆蓋</button>
            <button class="hp-modal-btn" data-cf="close">稍後處理</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => { overlay.remove(); _conflictDialogOpen = false; };
      overlay.querySelectorAll('[data-cf]').forEach(btn => btn.addEventListener('click', async () => {
        const act = btn.dataset.cf;
        try {
          if (act === 'download') { await dbAdapter.exportBackup(); return; }
          if (act === 'close') { _conflictSnoozed = true; close(); return; }
          if (act === 'reload') {
            close();
            _conflictSnoozed = false;
            discardPendingSaves();
            await dbAdapter.reloadFromDisk();
            const rid = state.reportId;
            if (rid && (await dbAdapter.getReportMeta(rid))) await openReport(rid);
            else await leaveEditor();
            return;
          }
          if (act === 'overwrite') {
            if (!confirm('確定以此視窗的內容覆蓋資料庫檔案？其他人／其他分頁的修改將會遺失。')) return;
            close();
            _conflictSnoozed = false;
            await dbAdapter.forceOverwrite();   // clears the conflict, writes this window's state
            await flushAllSaves();              // then any edits still pending
            setStatus('saved', '已儲存');
          }
        } catch (err) {
          alert('處理失敗：' + err.message);
        }
      }));
    }

    // ━━━ Init ━━━
    async function saveNow() {
      if (!state.reportId || !dbAdapter.isReady()) return;
      const seq = currentSaveSeq();
      await flushAllSaves();
      if (dbAdapter.hasConflict()) { showDbConflictDialog(true); return; }
      if (saveFailedSince(seq) || dbAdapter.hasUnsavedChanges()) {
        showToast('存檔失敗：' + (document.getElementById('status-text').textContent || '資料尚未寫入'), 'err', 6000);
        return;
      }
      if (window.spSync && spSync.isEnabled()) {
        showToast('已儲存到本機，正在同步 SharePoint…', 'ok', 2500);
        spSync.syncNow();
      } else {
        showToast('已儲存', 'ok', 1800);
      }
    }

    async function init() {
      // Set logo images from base64 constants
      const toolbarLogoEl = document.getElementById('toolbar-logo-img');
      if (toolbarLogoEl) toolbarLogoEl.src = TOOLBAR_LOGO_B64;
      const hpLogoEl = document.getElementById('hp-logo-img');
      if (hpLogoEl) hpLogoEl.src = TOOLBAR_LOGO_B64;

      // Global paste handler (registered once)
      document.addEventListener('paste', handlePaste);

      // Setup dropdowns
      setupDropdown('toolbar-add-btn', 'toolbar-add-menu');
      setupDropdown('sidebar-add-btn', 'sidebar-add-menu');

      // Undo & Redo (e.key is upper-case with Shift / Caps Lock → compare lower-cased)
      document.getElementById('btn-undo').addEventListener('click', performUndo);
      document.getElementById('btn-redo').addEventListener('click', performRedo);
      document.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey || e.metaKey)) return;
        const k = (e.key || '').toLowerCase();
        const isUndo = k === 'z' && !e.shiftKey;
        const isRedo = (k === 'z' && e.shiftKey) || k === 'y';
        if (!isUndo && !isRedo) return;
        const el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
        e.preventDefault();
        if (isUndo) performUndo(); else performRedo();
      });

      // Ctrl+S: write now (and sync SharePoint) instead of the browser's "save page".
      document.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || (e.key || '').toLowerCase() !== 's') return;
        e.preventDefault();
        saveNow();
      });

      // Preview & PDF buttons
      document.getElementById('btn-preview').addEventListener('click', openPreview);
      document.getElementById('preview-close').addEventListener('click', closePreview);
      document.getElementById('btn-export-pdf').addEventListener('click', () => {
        if (state.pages.length === 0) return;
        showExportPagePicker((sel, o) => exportPDF(sel, o));
      });

      // Status bar: reopen the conflict dialog after "稍後處理"
      document.getElementById('status-bar').addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        if (dbAdapter.isReady() && dbAdapter.hasConflict()) showDbConflictDialog(true);
      });

      // Back to homepage (flushes pending edits first)
      document.getElementById('btn-back-home').addEventListener('click', () => { leaveEditor(); });

      // New report button
      document.getElementById('hp-new-report').addEventListener('click', () => showNewReportModal());
      setupHomepageTools();

      // Setup SortableJS
      if (typeof Sortable !== 'undefined') {
        Sortable.create($pageList, {
          animation: 150,
          ghostClass: 'sortable-ghost',
          onEnd: (evt) => {
            if (evt.oldIndex === evt.newIndex) return;
            const moved = state.pages.splice(evt.oldIndex, 1)[0];
            state.pages.splice(evt.newIndex, 0, moved);
            if (state.activePage === evt.oldIndex) {
              state.activePage = evt.newIndex;
            } else if (state.activePage > evt.oldIndex && state.activePage <= evt.newIndex) {
              state.activePage--;
            } else if (state.activePage < evt.oldIndex && state.activePage >= evt.newIndex) {
              state.activePage++;
            }
            saveStructure();
            renderPageList();
            updatePageNavButtons();
          }
        });
      }

      // Never lose the last second of typing: write pending edits as soon as the
      // tab is hidden, and ask before closing while a write is still pending.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && hasPendingSaves()) flushAllSaves();
      });
      window.addEventListener('beforeunload', (e) => {
        if (hasPendingSaves()) {
          flushAllSaves();
          e.preventDefault();
          e.returnValue = '';
        }
      });

      showHomepage();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
<script>
// Database connection state shown in the toolbar / homepage:
// level = 'ready' | 'needs-permission' | 'parse-error' | 'none'
window._dbState = { level: 'none' };

function updateDbStatus(message, type) {
  const color = type === 'success' ? '#4caf50' : type === 'error' ? '#ff6b6b' : '#ffcc00';
  ['db-status-text', 'hp-db-status-text'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = message;
    el.style.color = color;
  });
}

function setDbState(level, filename, message) {
  window._dbState = { level, filename, message };
  if (level === 'ready') updateDbStatus('✅ ' + filename, 'success');
  else if (level === 'needs-permission') updateDbStatus('🔒 點擊恢復資料庫: ' + filename, 'warning');
  else if (level === 'parse-error') updateDbStatus('⛔ 資料庫無法讀取: ' + filename, 'error');
  else updateDbStatus('⚠️ 請選擇資料庫', 'warning');
}

// Apply the result of opening / creating a database file.
async function afterDbOpened(result, wasInEditor) {
  if (!result) return;
  if (result.success) {
    setDbState('ready', result.filename);
    spSync.dbOpened();
    if (result.otherTab) {
      alert('注意：這個資料庫似乎已在另一個分頁開啟。\n同時在兩個分頁編輯時，系統會偵測並阻止互相覆蓋，但建議只在一個分頁中編輯。');
    }
    if (wasInEditor) await leaveEditor(); else await renderHomepage();
    await resumeAfterUpdate();
    runAutoBackup(true);   // catch-up backup once a DB is opened
  } else if (result.reason === 'parse-error') {
    alert('無法開啟「' + result.filename + '」：' + result.message +
      '\n\n為避免覆蓋原檔，系統沒有開啟這個檔案。請從自動備份資料夾還原最近的備份。');
    if (!dbAdapter.isReady()) setDbState('parse-error', result.filename, result.message);
    if (!wasInEditor) await renderHomepage();
  }
}

// Switching database while a report is open: persist it first, then go back
// to the report list (the open report belongs to the previous database).
async function prepareDbSwitch() {
  const inEditor = !!state.reportId;
  if (inEditor) {
    await flushAllSaves();
    if (dbAdapter.hasConflict()) { showDbConflictDialog(); return null; }
  }
  return { inEditor };
}

async function handlePickDb() {
  const prep = await prepareDbSwitch();
  if (!prep) return;
  let result;
  try {
    result = (!dbAdapter.isReady() && window._dbState.level === 'needs-permission')
      ? await dbAdapter.reconnect()       // re-grant the previously used file
      : await dbAdapter.pickFile();
  } catch (err) {
    alert('開啟資料庫失敗：' + err.message);
    return;
  }
  await afterDbOpened(result, prep.inEditor);
}

async function handleCreateDb() {
  const prep = await prepareDbSwitch();
  if (!prep) return;
  let result;
  try {
    result = await dbAdapter.createFile();
  } catch (err) {
    alert('建立資料庫失敗：' + err.message);
    return;
  }
  await afterDbOpened(result, prep.inEditor);
}

// ── Toasts (non-blocking messages) ─────────────────────────────────────
// link: optional { href, label } appended after the text (opens in a new tab).
function showToast(text, type, ms, link) {
  let wrap = document.getElementById('toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = text;
  if (link && link.href) {
    const a = document.createElement('a');
    a.href = link.href; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = ' ' + (link.label || '開啟');
    t.appendChild(a);
  }
  const x = document.createElement('button');
  x.className = 'toast-x'; x.textContent = '✕'; x.title = '關閉';
  x.addEventListener('click', () => t.remove());
  t.appendChild(x);
  wrap.appendChild(t);
  if (ms !== 0) setTimeout(() => t.remove(), ms || 3500);
  return t;
}

// ── SharePoint dual save (spSync.js) ───────────────────────────────────
function spTime(d) {
  if (!d) return '';
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function updateSpChips(st) {
  st = st || spSync.status();
  const acc = spSync.account();
  let label, cls = '';
  if (!spSync.isEnabled()) { label = '☁ SharePoint：未連線'; }
  else if (st.state === 'needs-login') { label = '☁ SharePoint：請重新登入'; cls = 'sp-needs-login'; }
  else if (st.state === 'syncing') { label = '☁ SharePoint 同步中…'; cls = 'sp-syncing'; }
  else if (st.state === 'synced') { label = '☁ SharePoint ✓ ' + spTime(st.lastSync); cls = 'sp-synced'; }
  else if (st.state === 'pending') { label = `☁ 未同步（${st.pending} 筆待上傳）`; cls = 'sp-pending'; }
  else if (st.state === 'error') { label = '☁ SharePoint 錯誤'; cls = 'sp-error'; }
  else { label = dbAdapter.isReady() ? '☁ SharePoint：等待同步' : '☁ SharePoint：待開啟資料庫'; cls = 'sp-pending'; }
  const tip = [
    'SharePoint 雙重存檔：' + spSync.location(),
    acc ? '帳號：' + acc.name + (acc.email ? ' <' + acc.email + '>' : '') : '',
    st.message ? '狀態：' + st.message : '',
  ].filter(Boolean).join('\n');
  document.querySelectorAll('[data-sp-chip]').forEach(b => { b.textContent = label; b.className = 'sp-chip ' + cls; b.title = tip; });
}

function closeSpMenu() { document.querySelectorAll('.sp-menu').forEach(m => m.remove()); }

async function handleSpChip(btn) {
  closeSpMenu();
  if (!spSync.isEnabled()) { showSpEnableDialog(); return; }
  const st = spSync.status();
  if (st.state === 'needs-login') {
    const r = await spSync.relogin();
    if (!r.ok && r.reason !== 'cancelled') showToast('Microsoft 登入失敗：' + (r.error || (r.reason === 'popup' ? '登入視窗被瀏覽器擋下，請允許彈出視窗' : r.reason)), 'err', 8000);

    <button data-sp-act="sync">⟳ 立即同步</button>
    <button data-sp-act="open">↗ 開啟 SharePoint 資料夾</button>
    <button data-sp-act="account">👤 切換帳號</button>

  document.body.appendChild(menu);

  setTimeout(() => document.addEventListener('mousedown', function off(e) {

  }), 0);

      else if (act === 'open') {
        const url = await spSync.folderUrl();

      }
      else if (act === 'account') {

      else if (act === 'off') {

      }

}

async function onSpRemote(info) {

// ── Auto-backup folder (每日自動備份到選定資料夾) ──────────────────────
// Web pages can't run when closed, so "daily" means: back up on open (catch-up)
// + periodically while open + when the tab is hidden. One file per calendar day
// (overwritten with the latest state), keeping the newest 30 (pruned in fileDb).
let _autoBackupTimer = null;
let _lastAutoBackupAt = 0;

function updateBackupDirButtons(name, level, done) {
  const label = level === 'ready'
    ? `🗂 自動備份：${name}${done ? ' ✓' : ''}`
    : level === 'needs-permission'
      ? `🗂 自動備份：${name}（點擊授權）`
      : '🗂 自動備份：未設定';
  ['btn-backup-dir', 'hp-btn-backup-dir'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.textContent = label;
  });
}

async function runAutoBackup(force) {
  if (!dbAdapter.hasBackupDir || !dbAdapter.hasBackupDir()) return;
  if (!dbAdapter.isReady()) return;                       // need the DB open (has content)
  const now = Date.now();
  if (!force && now - _lastAutoBackupAt < 10 * 60 * 1000) return;  // throttle to ~10 min
  const res = await dbAdapter.writeAutoBackup();
  if (res && res.success) {
    _lastAutoBackupAt = now;
    updateBackupDirButtons(dbAdapter.getBackupDirName(), 'ready', true);
  } else if (res && res.needsPermission) {
    updateBackupDirButtons(dbAdapter.getBackupDirName(), 'needs-permission');
  }
}

async function initAutoBackup() {
  try {
    const r = await dbAdapter.tryRestoreBackupDir();
    if (r && r.success) {
      updateBackupDirButtons(r.name, 'ready');
      await runAutoBackup(true);
    } else if (r && r.needsPermission) {
      updateBackupDirButtons(r.name, 'needs-permission');
    } else {
      updateBackupDirButtons(null, 'none');
    }
    if (!_autoBackupTimer) {
      _autoBackupTimer = setInterval(() => runAutoBackup(false), 3 * 60 * 60 * 1000); // every 3h
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') runAutoBackup(false);
    });
  } catch (e) {}
}

// Toolbar button: pick a new folder (if already active) or re-grant/pick otherwise.
async function handlePickBackupDir() {
  const res = dbAdapter.hasBackupDir()
    ? await dbAdapter.pickBackupDir()
    : await dbAdapter.reconnectBackupDir();
  if (res && res.success) {
    updateBackupDirButtons(res.name, 'ready');
    await runAutoBackup(true);
  }
}

// ── New version online → save everything, then reload (as in the TIM tool) ──
// The Pages deploy (.github/workflows/pages.yml) stamps index.html (meta
// trb-version) and version.json with the same build id. A different id in
// version.json means a newer build is online: a notice that cannot be
// dismissed counts down, commits the field being edited, writes the local
// database file, syncs SharePoint, and reloads with ?v=<build> so neither the
// browser nor the CDN can hand back the old page; the open report is reopened
// afterwards. Nothing is reloaded over unsaved data: a failed save stops the
// update until the user fixes it and presses 重試.
// The deploy replaces EVERY occurrence of the placeholder in index.html, so the
// code must never spell it out — it is assembled here.
// Pages served straight from the branch (Settings → Pages → Source still
// "Deploy from a branch") are never stamped, and that branch build lands after
// the stamped one. Such a copy still notices a newer deploy by the page date:
// document.lastModified is the Last-Modified of the copy that is running (also
// when it came from the browser cache), a HEAD request returns the one online.
// Local servers (localhost / 127.x) never check.
const BUILD_PLACEHOLDER = '__BUILD_' + 'VERSION__';
const APP_VERSION = (document.querySelector('meta[name="trb-version"]') || {}).content || 'dev';
const APP_IS_DEV = APP_VERSION.includes(BUILD_PLACEHOLDER);
const APP_IS_LOCAL = /^(localhost|127\.\d+\.\d+\.\d+|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
const DOC_MODIFIED = (() => { const t = Date.parse(document.lastModified); return isFinite(t) ? t : 0; })();
const TWIN_DEPLOY_GRACE = 5 * 60 * 1000;     // a stamped copy ignores the unstamped branch build of the same push
const UPDATE_KEY = 'trb_update_attempt';     // sessionStorage { to, n } — stops reload loops
const RESUME_KEY = 'trb_update_resume';      // sessionStorage { reportId, page } — reopen after reload
const UPDATE_COUNTDOWN = 10;                 // seconds (3 when no report is open)
let appUpdate = null;                        // { to, state: 'countdown' | 'saving' | 'error' | 'failed', left, error }
let appUpdateTimer = null;

/** version.json with a timeout; one retry on network errors / 5xx. */
async function fetchAppVersion() {
  for (let attempt = 0; attempt < 2; attempt++) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 8000);
    try {
      const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
      if (res.ok) { const v = await res.json(); return v && v.version ? String(v.version) : null; }
      if (res.status < 500 && res.status !== 429) return null;
    } catch (e) { /* offline / timeout → retry once */ } finally { clearTimeout(t); }
  }
  return null;
}
/** Last-Modified (ms) of the page online, 0 when unknown. */
async function fetchOnlineModified() {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 8000);
  try {
    const res = await fetch(location.pathname + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ctl.signal });
    const lm = res.ok ? Date.parse(res.headers.get('Last-Modified') || '') : NaN;
    return isFinite(lm) ? lm : 0;
  } catch (e) { return 0; } finally { clearTimeout(t); }
}
function readSession(key) { try { return JSON.parse(sessionStorage.getItem(key) || 'null') || {}; } catch (e) { return {}; } }

// Build ids: the stamp, or 'lm-<unix seconds>' for an unstamped deploy (its page date).
const lmBuildTime = (id) => /^lm-\d+$/.test(id || '') ? Number(id.slice(3)) * 1000 : 0;
function fmtBuildTime(t) {
  const d = new Date(t), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const buildLabel = (id) => lmBuildTime(id) ? fmtBuildTime(lmBuildTime(id)) + ' 版' : id;
const appBuildLabel = () => APP_IS_DEV ? (DOC_MODIFIED ? fmtBuildTime(DOC_MODIFIED) + ' 版' : '目前版本') : APP_VERSION;

/** Id of a newer build online, or null. */
async function findNewerBuild() {
  if (!APP_IS_DEV) {
    const v = await fetchAppVersion();
    if (!v) return null;                                        // offline / no version.json
    if (!v.includes(BUILD_PLACEHOLDER)) return v === APP_VERSION ? null : v;
  }
  if (APP_IS_LOCAL || !DOC_MODIFIED) return null;
  const lm = await fetchOnlineModified();
  return lm > DOC_MODIFIED + (APP_IS_DEV ? 0 : TWIN_DEPLOY_GRACE) ? 'lm-' + Math.round(lm / 1000) : null;
}

async function checkAppVersion() {
  if ((APP_IS_DEV && APP_IS_LOCAL) || !/^https?:/.test(location.protocol) || appUpdate) return;
  const v = await findNewerBuild();
  if (!v || appUpdate) return;
  const att = readSession(UPDATE_KEY);
  if (att.to === v && att.n >= 2) { appUpdate = { to: v, state: 'failed' }; renderUpdateNotice(); return; }   // reloaded twice, still old
  appUpdate = { to: v, state: 'countdown', left: state.reportId ? UPDATE_COUNTDOWN : 3 };
  renderUpdateNotice();
  clearInterval(appUpdateTimer);
  appUpdateTimer = setInterval(() => {
    if (!appUpdate || appUpdate.state !== 'countdown') { clearInterval(appUpdateTimer); return; }
    appUpdate.left -= 1;
    if (appUpdate.left <= 0) { clearInterval(appUpdateTimer); applyAppUpdate(); } else renderUpdateNotice();
  }, 1000);
}

async function applyAppUpdate() {
  const u = appUpdate;
  if (!u || u.state === 'saving') return;
  clearInterval(appUpdateTimer);
  u.state = 'saving'; u.step = '儲存到本機…'; renderUpdateNotice();
  const a = document.activeElement;
  if (a && a.blur) a.blur();                                    // commit the field being edited
  await new Promise(r => setTimeout(r, 0));
  if (dbAdapter.isReady()) {
    const seq = currentSaveSeq();
    try { await flushAllSaves(); } catch (e) { /* reported below */ }
    if (hasPendingSaves() || dbAdapter.hasUnsavedChanges() || saveFailedSince(seq)) {
      u.state = 'error';
      u.error = dbAdapter.hasConflict() ? '資料庫檔案已被其他視窗或使用者修改，請先處理衝突' : '資料尚未寫入本機資料庫檔';
      renderUpdateNotice();
      return;                                                   // never reload over unsaved work
    }
    if (spSync.isEnabled()) {
      u.step = '同步到 SharePoint…'; renderUpdateNotice();
      // Unsynced changes stay marked in the local file and are pushed after the reload anyway.
      try { await Promise.race([spSync.syncNow(), new Promise(r => setTimeout(r, 15000))]); } catch (e) { /* see above */ }
    }
  }
  const att = readSession(UPDATE_KEY);
  try {
    sessionStorage.setItem(UPDATE_KEY, JSON.stringify({ to: u.to, n: att.to === u.to ? (att.n || 0) + 1 : 1 }));
    if (state.reportId) sessionStorage.setItem(RESUME_KEY, JSON.stringify({ reportId: state.reportId, page: state.activePage }));
  } catch (e) { /* private mode */ }
  location.replace(location.pathname + '?v=' + encodeURIComponent(u.to) + location.hash);
}

function renderUpdateNotice() {
  let el = document.getElementById('update-notice');
  const u = appUpdate;
  if (!u) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'update-notice'; document.body.appendChild(el); }
  if (u.state === 'failed') {
    el.className = 'update-banner';
    el.innerHTML = `新版本 <span style="font-family:var(--font-mono)">${escHtml(buildLabel(u.to))}</span> 尚未生效，請稍後按 Ctrl+Shift+R 重新整理
      <button class="hp-modal-btn primary" id="update-retry">再試一次</button>`;
    el.querySelector('#update-retry').addEventListener('click', () => {
      appUpdate = null;
      try { sessionStorage.removeItem(UPDATE_KEY); } catch (e) { /* ignore */ }
      renderUpdateNotice();
      checkAppVersion();
    });
    return;
  }
  if (u.state === 'error') {
    // Not blocking: the user has to be able to fix the save problem first.
    el.className = 'update-banner';
    el.innerHTML = `<span>新版本 ${escHtml(buildLabel(u.to))}：存檔失敗（${escHtml(u.error || '')}）。資料還沒寫入，所以先不更新；處理後按「重試」。</span>
      <button class="hp-modal-btn primary" id="update-now">重試</button>`;
    el.querySelector('#update-now').addEventListener('click', () => applyAppUpdate());
    return;
  }
  const saving = u.state === 'saving';
  const what = dbAdapter.isReady()
    ? `會先儲存所有資料（本機${spSync.isEnabled() ? ' + SharePoint' : ''}），再載入新版本${state.reportId ? '，並回到目前的報告' : ''}。`
    : '正在載入新版本。';
  el.className = 'update-backdrop';
  el.innerHTML = `<div class="update-box" role="alertdialog" aria-modal="true" aria-label="有新版本">
      <h3>工具有新版本</h3>
      <div class="update-ver">${escHtml(appBuildLabel())} → ${escHtml(buildLabel(u.to))}</div>
      <div>${escHtml(what)}${saving ? `<br><b>${escHtml(u.step || '')}</b>` : ` <b>${u.left}</b> 秒後自動更新。`}</div>
      <div class="update-foot">
        <button class="hp-modal-btn primary" id="update-now"${saving ? ' disabled' : ''}>${saving ? '儲存中…' : '立即更新'}</button>
      </div>
    </div>`;
  el.querySelector('#update-now').addEventListener('click', () => applyAppUpdate());
}

// After an update reload: reopen the report that was open (once the database is ready).
async function resumeAfterUpdate() {
  const r = readSession(RESUME_KEY);
  if (!r.reportId || !dbAdapter.isReady() || state.reportId) return;
  try { sessionStorage.removeItem(RESUME_KEY); } catch (e) { /* ignore */ }
  const meta = await dbAdapter.getReportMeta(r.reportId).catch(() => null);
  if (!meta) return;
  await openReport(r.reportId);
  if (typeof r.page === 'number' && state.pages[r.page]) selectPage(r.page);
  showToast('已更新到新版本，並回到剛才的報告', 'ok');
}

// After an update reload: drop ?v= from the address bar; clear the loop guard once on the new build.
if (/[?&]v=/.test(location.search)) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignore */ } }
{
  const to = readSession(UPDATE_KEY).to;
  if (to && (to === APP_VERSION || (lmBuildTime(to) && DOC_MODIFIED >= lmBuildTime(to)))) { try { sessionStorage.removeItem(UPDATE_KEY); } catch (e) { /* ignore */ } }
}
setTimeout(checkAppVersion, 3000);
setInterval(checkAppVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkAppVersion(); });

document.addEventListener('DOMContentLoaded', async () => {
  // Ensure homepage logo is set (fallback in case init() hasn't run yet)
  if (typeof TOOLBAR_LOGO_B64 !== 'undefined') {
    const hpLogo = document.getElementById('hp-logo-img');
    if (hpLogo && !hpLogo.src) hpLogo.src = TOOLBAR_LOGO_B64;
  }

  // Try to silently restore previously granted file handle (no user gesture needed).
  const restored = await dbAdapter.tryRestore();
  if (restored && restored.success) {
    setDbState('ready', restored.filename);
    if (restored.otherTab) {
      alert('注意：這個資料庫似乎已在另一個分頁開啟。\n同時在兩個分頁編輯時，系統會偵測並阻止互相覆蓋，但建議只在一個分頁中編輯。');
    }
  } else if (restored && restored.needsPermission) {
    // A handle exists but browser requires a user click to re-grant access.
    setDbState('needs-permission', restored.filename);
  } else if (restored && restored.reason === 'parse-error') {
    setDbState('parse-error', restored.filename, restored.message);
  } else {
    setDbState('none');
  }
  if (typeof renderHomepage === 'function' && !state.reportId) await renderHomepage();
  await resumeAfterUpdate();

  // Restore the auto-backup folder and run a catch-up backup (if the DB is ready).
  await initAutoBackup();

  // SharePoint dual save: restore a previous sign-in and sync.
  spSync.onStatus(updateSpChips);
  spSync.onRemoteChange(onSpRemote);
  spSync.onNotice(msg => showToast(msg, 'warn', 10000));
  updateSpChips();
  spSync.tryRestore();
});
</script>
</body>
