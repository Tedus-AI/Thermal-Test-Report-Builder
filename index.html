          scheduleSave(state.activePage);
          renderDataPage(page);
        });
        tbody.addEventListener('contextmenu', (e) => {
          const tr = e.target.closest('tr[data-row-idx]');
          if (!tr) return;
          e.preventDefault();
          if (d.frozen) return;   // frozen page: rows can't be deleted
          const ri = parseInt(tr.dataset.rowIdx);
          if (confirm('確定要刪除此元件列？')) {
            d.components.splice(ri, 1);
            scheduleSave(state.activePage);
            renderDataPage(page);
          }
        });
      }

      // ── Sensor row actions: disable toggle, highlight swatch, delete ──
      const sensorTbody = document.getElementById('sensor-tbody');
      if (sensorTbody) {
        sensorTbody.addEventListener('click', (e) => {
          const refPick = e.target.closest('[data-sensor-ref-pick]');
          if (refPick) {
            const si = parseInt(refPick.dataset.sensorRefPick);
            if (isNaN(si) || !d.sensors[si]) return;
            showSensorComponentPicker(d, (ref) => {
              d.sensors[si].ref = ref;
              scheduleSave(state.activePage);
              renderDataPage(page);
            });
            return;
          }
          const refClear = e.target.closest('[data-sensor-ref-clear]');
          if (refClear) {
            const si = parseInt(refClear.dataset.sensorRefClear);
            if (isNaN(si) || !d.sensors[si]) return;
            delete d.sensors[si].ref;
            scheduleSave(state.activePage);
            renderDataPage(page);
            return;
          }
          const disBtn = e.target.closest('.dt-disable-btn');
          if (disBtn) {
            const si = parseInt(disBtn.dataset.disableSensor);
            if (isNaN(si) || !d.sensors[si]) return;
            d.sensors[si].disabled = !d.sensors[si].disabled;
            scheduleSave(state.activePage);
            renderDataPage(page);
            return;
          }
          const hlBtn = e.target.closest('.dt-hl-btn');
          if (hlBtn) {
            const si = parseInt(hlBtn.dataset.hlSensor);
            if (isNaN(si) || !d.sensors[si]) return;
            openHighlightPalette(hlBtn, d.sensors[si].highlight || '', (key) => {
              d.sensors[si].highlight = key;
              scheduleSave(state.activePage);
              renderDataPage(page);
            });
            return;
          }
          const btn = e.target.closest('.dt-del-btn');
          if (!btn) return;
          const si = parseInt(btn.dataset.sensorDelRow);
          if (isNaN(si)) return;
          d.sensors.splice(si, 1);
          scheduleSave(state.activePage);
          renderDataPage(page);
        });
        sensorTbody.addEventListener('contextmenu', (e) => {
          const tr = e.target.closest('tr[data-sensor-row-idx]');
          if (!tr) return;
          e.preventDefault();
          if (d.frozen) return;
          const si = parseInt(tr.dataset.sensorRowIdx);
          if (confirm('確定要刪除此 Sensor 列？')) {
            d.sensors.splice(si, 1);
            scheduleSave(state.activePage);
            renderDataPage(page);
          }
        });
      }

      // ── Excel-style block paste (component table + embedded-sensor table) ──
      const N = PASTE_NORMALIZE;
      const compFieldMap = [
        { field: 'category', normalize: N.category }, { field: 'name' }, { field: 'spec_type', normalize: N.specType },
        { field: 'tc_spec', normalize: N.number }, { field: 'derating', normalize: N.derating }, { field: 'tim_type' },
      ];
      d.ta_conditions.forEach(ta => compFieldMap.push({ taKey: 'ta_' + ta, normalize: N.number }));
      compFieldMap.push({ field: 'note' });
      setupGridPaste(page, document.getElementById('dt-tbody'), compFieldMap, 'comp',
        () => d.components, () => ({ uid: newCompUid(), category: 'RF', spec_type: 'Rec.', derating: '0.90', readings: {} }));

      const sensorFieldMap = [{ field: 'name' }, { field: 'type', normalize: N.sensorType }];
      d.ta_conditions.forEach(ta => sensorFieldMap.push({ taKey: 'ta_' + ta }));
      sensorFieldMap.push({ field: 'note' });
      setupGridPaste(page, document.getElementById('sensor-tbody'), sensorFieldMap, 'sensor',
        () => d.sensors, () => ({ name: '', type: 'Local', readings: {}, note: '' }));

      // ── Sensor toggle ──
      const sensorToggle = document.getElementById('sensor-toggle');
      const sensorBody = document.getElementById('sensor-body');
      const sensorArrow = document.getElementById('sensor-arrow');
      if (sensorToggle) {
        sensorToggle.addEventListener('click', () => {
          sensorBody.classList.toggle('open');
          sensorArrow.classList.toggle('open');
        });
        // Auto-open if sensors have data
        const hasSensorData = d.sensors && d.sensors.length > 0 && d.sensors.some(s => s.name || Object.values(s.readings || {}).some(v => v));
        if (hasSensorData) {
          sensorBody.classList.add('open');
          sensorArrow.classList.add('open');
        }
      }

      // ── Sensor field bindings ──
      $canvas.querySelectorAll('[data-sensor-field]').forEach(el => {
        const eventType = el.tagName === 'SELECT' ? 'change' : 'input';
        el.addEventListener(eventType, () => {
          const si = parseInt(el.dataset.sensor);
          d.sensors[si][el.dataset.sensorField] = el.value;
          scheduleSave(state.activePage);
        });
      });

      $canvas.querySelectorAll('[data-sensor-ta]').forEach(el => {
        el.addEventListener('input', () => {
          const si = parseInt(el.dataset.sensor);
          d.sensors[si].readings[el.dataset.sensorTa] = el.value;
          scheduleSave(state.activePage);
        });
      });

      // ── Excel-style drag-to-fill handle ──
      setupDataFillHandle($canvas.querySelector('.data-page'));

      // ── Excel-style range select + copy + delete + nav (both tables) ──
      setupGridSelection(document.getElementById('dt-tbody'));
      setupGridSelection(document.getElementById('sensor-tbody'));

      // ── Add sensor row ──
      const sensorAddBtn = document.getElementById('sensor-add-row');
      if (sensorAddBtn) {
        sensorAddBtn.addEventListener('click', () => {
          d.sensors.push({ name: '', type: 'Local', readings: {}, note: '' });
          scheduleSave(state.activePage);
          renderDataPage(page);
          if (!sensorBody.classList.contains('open')) {
            sensorBody.classList.add('open');
            sensorArrow.classList.add('open');
          }
        });
      }

      // ── TIM Panel bindings ──
      const timPanelToggle = document.getElementById('tim-panel-toggle');
      const timPanelBody = document.getElementById('tim-panel-body');
      const timPanelArrowEl = document.getElementById('tim-panel-arrow');
      if (timPanelToggle) {
        timPanelToggle.addEventListener('click', () => {
          state._timPanelOpen = !state._timPanelOpen;
          timPanelBody.classList.toggle('open');
          timPanelArrowEl.classList.toggle('open');
        });
      }

      const timPanel = document.getElementById('tim-panel');
      if (timPanel) {
        timPanel.querySelectorAll('.tim-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            state._timActiveTab = btn.dataset.timCat;
            renderDataPage(page);
          });
        });

        const timAddBtn = document.getElementById('tim-add-btn');
        if (timAddBtn) {
          timAddBtn.addEventListener('click', async () => {
            const cat = state._timActiveTab || 'grease';
            if (!state.timLibrary[cat]) state.timLibrary[cat] = [];
            state.timLibrary[cat].push({ name: '', k_value: '', vendor: '' });
            scheduleTimSave();
            renderDataPage(page);
          });
        }

        timPanel.querySelectorAll('.tim-entry input[data-tim-field]').forEach(el => {
          el.addEventListener('input', async () => {
            const cat = state._timActiveTab || 'grease';
            const idx = parseInt(el.closest('.tim-entry').dataset.timIdx);
            const field = el.dataset.timField;
            if (state.timLibrary[cat] && state.timLibrary[cat][idx]) {
              state.timLibrary[cat][idx][field] = el.value;
              scheduleTimSave();
              // Reflect the new/edited TIM name in the component TIM Type dropdowns
              // right away (in place, so the field keeps focus while typing).
              if (field === 'name') refreshTimTypeOptions(page);
            }
          });
        });

        timPanel.querySelectorAll('.tim-entry-del').forEach(btn => {
          btn.addEventListener('click', async () => {
            const cat = state._timActiveTab || 'grease';
            const idx = parseInt(btn.dataset.timDel);
            if (state.timLibrary[cat]) {
              state.timLibrary[cat].splice(idx, 1);
              scheduleTimSave();
              renderDataPage(page);
            }
          });
        });
      }

      // ── Whole-page freeze (整頁凍結 / 唯讀鎖定) ──
      // Toggle locks every control on the page so nothing can be edited or
      // deleted by accident. Disabled controls receive no focus/mouse/keyboard,
      // which also neutralises the Excel-grid select/paste/fill/delete handlers.
      const freezeBtn = document.getElementById('data-freeze-btn');
      if (freezeBtn) {
        freezeBtn.addEventListener('click', () => {
          d.frozen = !d.frozen;
          scheduleSave(state.activePage);
          renderDataPage(page);
        });
      }
      if (d.frozen) {
        const dp = $canvas.querySelector('.data-page');
        if (dp) {
          dp.classList.add('data-frozen');
          dp.querySelectorAll('input, select, textarea, button').forEach(el => {
            if (el.hasAttribute('data-freeze-toggle') || el.hasAttribute('data-freeze-keep')) return; // unlock button + summary jumps stay usable
            el.disabled = true;
          });
        }
      }
    }

    // ━━━ Sim vs Meas Comparison Page Module ━━━
    function addSimVsMeasPage() { return addPageOfType('sim_vs_meas'); }

    // ── Component category colours (kept clearly distinct across all 4) ──
    // RF = blue, Digital = green, PWR = orange, Other = purple. Same values are
    // used on screen (via the .cat-* classes) and in the exported PDF.
    const CATEGORY_OPTIONS = ['RF', 'Digital', 'PWR', 'Other'];
    function catClassOf(cat) {
      return cat === 'RF' ? 'cat-rf' : cat === 'Digital' ? 'cat-digital'
        : cat === 'PWR' ? 'cat-pwr' : 'cat-other';
    }
    function catColorOf(cat) {
      return cat === 'RF' ? '#2563EB' : cat === 'Digital' ? '#16A34A'
        : cat === 'PWR' ? '#EA580C' : '#9333EA';
    }
    // Row highlight palette (deliberately avoids red — red is reserved for Fail).
    // hlRowBg = the light row-background tint; hlSwatchColor = the solid dot shown
    // on the swatch button. Empty key ('') means no highlight.
    function hlRowBg(key) {
      return { yellow: '#FEF3C7', blue: '#DBEAFE', green: '#DCFCE7' }[key] || '';
    }
    function hlSwatchColor(key) {
      return { yellow: '#F5B400', blue: '#3B82F6', green: '#22C55E' }[key] || '';
    }
    // Small colour picker opened from a row's highlight swatch. onPick receives
    // the chosen key ('' = clear). Closes on outside click.
    function openHighlightPalette(anchorBtn, currentKey, onPick) {
      document.querySelectorAll('.dt-hl-pop').forEach(el => el.remove());
      const pop = document.createElement('div');
      pop.className = 'dt-hl-pop';
      const opts = [['', '清除'], ['yellow', '黃'], ['blue', '藍'], ['green', '綠']];
      opts.forEach(([key, label]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dt-hl-opt' + (key === (currentKey || '') ? ' is-active' : '');
        b.title = label;
        if (key) { b.style.background = hlSwatchColor(key); b.style.borderColor = hlSwatchColor(key); }
        else { b.textContent = '✕'; }
        b.addEventListener('click', (ev) => { ev.stopPropagation(); pop.remove(); onPick(key); });
        pop.appendChild(b);
      });
      document.body.appendChild(pop);
      const r = anchorBtn.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = r.left;
      if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
      let top = r.bottom + 4;
      if (top + ph > window.innerHeight - 8) top = r.top - ph - 4;
      pop.style.left = Math.max(8, left) + 'px';
      pop.style.top = Math.max(8, top) + 'px';
      setTimeout(() => {
        const close = (ev) => {
          if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('mousedown', close); }
        };
        document.addEventListener('mousedown', close);
      }, 0);
    }

    // Display name for an uploaded SW screenshot: the stored filename minus its
    // extension (shown in the editor, preview and PDF). The real filename is kept
    // in state — only the shown text drops the ".png/.jpg/.bmp" suffix.
    function swDisplayName(name) {
      return String(name || '').replace(/\.[^.\\/]+$/, '');
    }

    // Full-screen preview for an uploaded SW Version screenshot. Closes on the
    // backdrop, the ✕ button, or Escape.
    function openSwLightbox(url, name) {
      document.querySelectorAll('.sw-lightbox').forEach(el => el.remove());
      const ov = document.createElement('div');
      ov.className = 'sw-lightbox';
      ov.innerHTML = `<button type="button" class="sw-lightbox-close" title="關閉">✕</button>`
        + `<div class="sw-lightbox-name">${escHtml(swDisplayName(name))}</div>`
        + `<img src="${escapeAttr(url)}" alt="">`;
      const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (ev) => { if (ev.key === 'Escape') close(); };
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.classList.contains('sw-lightbox-close')) close();
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(ov);
    }

    // Generic data-page component picker. `preCheckedNames` is a Set/array of
    // component_names to pre-check; `onConfirm` receives the raw selected
    // getDataPageComponents() entries so each caller can map them as needed.
    // Pick which annotation page(s) to import components (markers) from.
    // onConfirm receives the selected annotation page objects.
    // Import modal: a two-level tree. Each annotation page has a parent checkbox
    // (import the whole page) and an expand toggle revealing its components
    // (markers) as child checkboxes, so individual components can be picked.
    // onConfirm receives a flat array of { category, name } to import.
    function showAnnotationImportModal(onConfirm) {
      const annoPages = state.pages.filter(p => p.type === 'annotation');
      if (annoPages.length === 0) {
        alert('尚無標註頁可帶入。請先新增標註頁並放置標註。');
        return;
      }

      const markerName = (m, mi) => (m && m.label) || ('TC' + (mi + 1));

      const overlay = document.createElement('div');
      overlay.className = 'sim-modal-overlay';
      const pagesHTML = annoPages.map((p, pi) => {
        const cat = p.data.tc_category || 'RF';
        const catClass = catClassOf(cat);
        const title = p.data.title || (cat + ' Thermocouple Location');
        const markers = p.data.markers || [];
        const count = markers.length;
        const childrenHTML = markers.map((m, mi) =>
          `<label class="anno-imp-child">
            <input type="checkbox" class="anno-imp-marker-cb" data-page="${pi}" data-marker="${mi}" checked>
            <span class="sim-modal-item-cat ${catClass}">${cat}</span>
            <span class="sim-modal-item-label">${escapeAttr(markerName(m, mi))}</span>
          </label>`).join('');
        return `<div class="anno-imp-page" data-page="${pi}">
          <div class="anno-imp-page-row" data-page="${pi}">
            <button type="button" class="anno-imp-toggle" data-page="${pi}"${count === 0 ? ' style="visibility:hidden;"' : ''}>▸</button>
            <input type="checkbox" class="anno-imp-page-cb" data-page="${pi}"${count > 0 ? ' checked' : ''}${count === 0 ? ' disabled' : ''}>
            <span class="sim-modal-item-label" style="font-weight:600;">${escapeAttr(title)}</span>
            <span class="anno-imp-count">${count} 個元件</span>
          </div>
          <div class="anno-imp-children" data-page="${pi}" style="display:none;">${childrenHTML}</div>
        </div>`;
      }).join('');

      overlay.innerHTML = `
        <div class="sim-modal">
          <div class="sim-modal-header">帶入標註頁元件</div>
          <div class="sim-modal-toolbar">
            <button type="button" class="sim-modal-tool-btn" id="anno-import-select-all">全選</button>
            <button type="button" class="sim-modal-tool-btn" id="anno-import-deselect-all">全不選</button>
          </div>
          <div class="sim-modal-body">${pagesHTML}</div>
          <div class="sim-modal-footer">
            <button class="sim-modal-btn" id="anno-import-cancel">取消</button>
            <button class="sim-modal-btn primary" id="anno-import-confirm">帶入</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => document.body.removeChild(overlay);

      // 全選 / 全不選: toggle every marker; keep the page checkboxes in sync
      // (skip disabled ones on pages with no markers).
      const setAllMarkers = (val) => {
        overlay.querySelectorAll('.anno-imp-marker-cb').forEach(cb => { cb.checked = val; });
        overlay.querySelectorAll('.anno-imp-page-cb').forEach(cb => {
          if (!cb.disabled) cb.checked = val;
          cb.indeterminate = false;
        });
      };
      overlay.querySelector('#anno-import-select-all').addEventListener('click', () => setAllMarkers(true));
      overlay.querySelector('#anno-import-deselect-all').addEventListener('click', () => setAllMarkers(false));

      const setExpanded = (pi, open) => {
        const kids = overlay.querySelector(`.anno-imp-children[data-page="${pi}"]`);
        const btn = overlay.querySelector(`.anno-imp-toggle[data-page="${pi}"]`);
        if (!kids || !btn) return;
        kids.style.display = open ? 'block' : 'none';
        btn.textContent = open ? '▾' : '▸';
      };

      // Click the page row (but not the checkbox) to expand/collapse
      overlay.querySelectorAll('.anno-imp-page-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.classList.contains('anno-imp-page-cb')) return;
          const pi = row.dataset.page;
          const kids = overlay.querySelector(`.anno-imp-children[data-page="${pi}"]`);
          if (!kids || !kids.querySelector('.anno-imp-marker-cb')) return;
          setExpanded(pi, kids.style.display === 'none');
        });
      });

      // Parent checkbox toggles all its children
      overlay.querySelectorAll('.anno-imp-page-cb').forEach(cb => {
        cb.addEventListener('change', () => {
          overlay.querySelectorAll(`.anno-imp-marker-cb[data-page="${cb.dataset.page}"]`)
            .forEach(k => { k.checked = cb.checked; });
          cb.indeterminate = false;
        });
      });

      // Child checkbox updates the parent (checked / indeterminate / unchecked)
      const syncParent = (pi) => {
        const pageCb = overlay.querySelector(`.anno-imp-page-cb[data-page="${pi}"]`);
        const kids = Array.from(overlay.querySelectorAll(`.anno-imp-marker-cb[data-page="${pi}"]`));
        if (!pageCb || kids.length === 0) return;
        const n = kids.filter(k => k.checked).length;
        pageCb.checked = n === kids.length;
        pageCb.indeterminate = n > 0 && n < kids.length;
      };
      overlay.querySelectorAll('.anno-imp-marker-cb').forEach(cb => {
        cb.addEventListener('change', () => syncParent(cb.dataset.page));
      });

      overlay.querySelector('#anno-import-cancel').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      overlay.querySelector('#anno-import-confirm').addEventListener('click', () => {
        const selected = [];
        overlay.querySelectorAll('.anno-imp-marker-cb:checked').forEach(cb => {
          const p = annoPages[parseInt(cb.dataset.page)];
          const mi = parseInt(cb.dataset.marker);
          const m = (p.data.markers || [])[mi];
          selected.push({ category: p.data.tc_category || 'RF', name: markerName(m, mi) });
        });
        close();
        onConfirm(selected);
      });
    }

    // Component picker grouped by data page: each data page is a collapsible
    // section with its own "select all" parent checkbox, so components from
    // different data pages are no longer crammed into one flat list. onConfirm
    // still receives a flat array of the selected getDataPageComponents() entries.
    // Pass/fail badge for a data-page component (component picker).
    function compStatusBadgeHTML(c) {
      const st = c.calc.status, w = c.calc.worst;
      if (st === 'disabled') return '<span class="csm-badge csm-badge-off">斷線 N/A</span>';
      if (st === 'none') return `<span class="csm-badge csm-badge-none">${c.tc_derated > 0 ? '未量測' : '無 Spec'}</span>`;
      const label = st === 'fail' ? '❌ Fail' : st === 'warn' ? '⚠️ Warning' : '✔ Pass';
      return `<span class="csm-badge csm-badge-${st}" title="最差 Margin ${fmtPct(w.marginPct)}（${fmtDeltaC(w.marginC)}）@ Ta ${w.ta}°C">${label}<span class="csm-badge-val">${fmtPct(w.marginPct)} @${w.ta}°C</span></span>`;
    }

    function showComponentSelectModal(preCheckedNames, onConfirm) {
      const groups = getDataPageComponentGroups().filter(g => g.components.length > 0);
      if (groups.length === 0) {
        alert('尚無數據頁元件可選取。請先在數據頁新增元件。');
        return;
      }

      // preChecked may be a plain Set of names (legacy caller) or { keys, names }:
      // `keys` are stable "pageId::uid" references (no name bleed across copied
      // data pages), `names` a fallback for rows that couldn't be resolved.
      let keySet, nameSet;
      if (preCheckedNames instanceof Set) { keySet = new Set(); nameSet = preCheckedNames; }
      else if (preCheckedNames && (preCheckedNames.keys || preCheckedNames.names)) {
        keySet = preCheckedNames.keys || new Set();
        nameSet = preCheckedNames.names || new Set();
      } else { keySet = new Set(); nameSet = new Set(); }
      const isPreChecked = (g, comp) =>
        keySet.has(compRefKey(comp)) || nameSet.has(comp.component_name);

      const overlay = document.createElement('div');
      overlay.className = 'sim-modal-overlay';

      const groupsHTML = groups.map((g, gi) => {
        const childrenHTML = g.components.map((comp, ci) => {
          const checked = isPreChecked(g, comp) ? ' checked' : '';
          const catClass = catClassOf(comp.category);
          return `<label class="anno-imp-child">
            <input type="checkbox" class="csm-comp-cb" data-group="${gi}" data-comp="${ci}"${checked}>
            <span class="sim-modal-item-cat ${catClass}">${escHtml(comp.category)}</span>
            <span class="sim-modal-item-label">${escHtml(comp.component_name)}</span>
            ${compStatusBadgeHTML(comp)}
          </label>`;
        }).join('');
        const sm = summarizeComponents(g.components);
        const groupCounts = [sm.nFail ? `<span class="csm-cnt-fail">${sm.nFail} Fail</span>` : '', sm.nWarn ? `<span class="csm-cnt-warn">${sm.nWarn} Warning</span>` : '']
          .filter(Boolean).join(' · ');
        return `<div class="anno-imp-page" data-group="${gi}">
          <div class="anno-imp-page-row" data-group="${gi}">
            <button type="button" class="anno-imp-toggle" data-group="${gi}">▾</button>
            <input type="checkbox" class="csm-group-cb" data-group="${gi}">
            <span class="sim-modal-item-label" style="font-weight:600;">${escapeAttr(g.label)}${g.note ? ' · ' + escapeAttr(g.note) : ''}</span>
            <span class="anno-imp-count">${groupCounts ? groupCounts + ' · ' : ''}${g.components.length} 個元件</span>
          </div>
          <div class="anno-imp-children" data-group="${gi}" style="display:block;">${childrenHTML}</div>
        </div>`;
      }).join('');

      overlay.innerHTML = `
        <div class="sim-modal">
          <div class="sim-modal-header">從數據頁選取元件</div>
          <div class="sim-modal-toolbar">
            <button type="button" class="sim-modal-tool-btn" id="sim-modal-select-all">全選</button>
            <button type="button" class="sim-modal-tool-btn" id="sim-modal-deselect-all">全不選</button>
            <button type="button" class="sim-modal-tool-btn" id="sim-modal-select-flagged" title="勾選所有 Fail / Warning 元件（保留目前已勾選的）">勾選 Fail / Warning</button>
          </div>
          <div class="sim-modal-body">${groupsHTML}</div>
          <div class="sim-modal-footer">
            <button class="sim-modal-btn" id="sim-modal-cancel">取消</button>
            <button class="sim-modal-btn primary" id="sim-modal-confirm">確認選取</button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);
      const close = () => document.body.removeChild(overlay);

      const setExpanded = (gi, open) => {
        const kids = overlay.querySelector(`.anno-imp-children[data-group="${gi}"]`);
        const btn = overlay.querySelector(`.anno-imp-toggle[data-group="${gi}"]`);
        if (!kids || !btn) return;
        kids.style.display = open ? 'block' : 'none';
        btn.textContent = open ? '▾' : '▸';
      };
      // Click the page row (but not the checkbox) to expand/collapse that group.
      overlay.querySelectorAll('.anno-imp-page-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.classList.contains('csm-group-cb')) return;
          const gi = row.dataset.group;
          const kids = overlay.querySelector(`.anno-imp-children[data-group="${gi}"]`);
          setExpanded(gi, kids.style.display === 'none');
        });
      });
      // Group checkbox toggles all its components.
      overlay.querySelectorAll('.csm-group-cb').forEach(cb => {
        cb.addEventListener('change', () => {
          overlay.querySelectorAll(`.csm-comp-cb[data-group="${cb.dataset.group}"]`)
            .forEach(k => { k.checked = cb.checked; });
          cb.indeterminate = false;
        });
      });
      // Component checkbox updates its group (checked / indeterminate / unchecked).
      const syncGroup = (gi) => {
        const gcb = overlay.querySelector(`.csm-group-cb[data-group="${gi}"]`);
        const kids = Array.from(overlay.querySelectorAll(`.csm-comp-cb[data-group="${gi}"]`));
        if (!gcb || kids.length === 0) return;
        const n = kids.filter(k => k.checked).length;
        gcb.checked = n === kids.length;
        gcb.indeterminate = n > 0 && n < kids.length;
      };
      overlay.querySelectorAll('.csm-comp-cb').forEach(cb => {
        cb.addEventListener('change', () => syncGroup(cb.dataset.group));
      });
      groups.forEach((g, gi) => syncGroup(gi));   // reflect any pre-checked items

      const setAll = (val) => {
        overlay.querySelectorAll('.csm-comp-cb').forEach(cb => { cb.checked = val; });
        overlay.querySelectorAll('.csm-group-cb').forEach(cb => { cb.checked = val; cb.indeterminate = false; });
      };
      overlay.querySelector('#sim-modal-select-all').addEventListener('click', () => setAll(true));
      overlay.querySelector('#sim-modal-select-flagged').addEventListener('click', () => {
        overlay.querySelectorAll('.csm-comp-cb').forEach(cb => {
          const c = groups[parseInt(cb.dataset.group)].components[parseInt(cb.dataset.comp)];
          if (c && (c.calc.status === 'fail' || c.calc.status === 'warn')) cb.checked = true;
        });
        groups.forEach((g, gi) => syncGroup(gi));
      });
      overlay.querySelector('#sim-modal-deselect-all').addEventListener('click', () => setAll(false));

      overlay.querySelector('#sim-modal-cancel').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

      overlay.querySelector('#sim-modal-confirm').addEventListener('click', () => {
        const selected = [];
        overlay.querySelectorAll('.csm-comp-cb:checked').forEach(cb => {
          const g = groups[parseInt(cb.dataset.group)];
          const comp = g && g.components[parseInt(cb.dataset.comp)];
          if (comp) selected.push(comp);
        });
        close();
        onConfirm(selected);
      });
    }

    // ── Sensor ↔ component link (對應元件 Δ) ─────────────────────────────
    // A sensor row on a data page can be linked to one component on the SAME
    // page (sensor.ref = { name, idx }). We resolve it back to the live component
    // preferring an index-with-matching-name, then a name search, so reordering
    // the component list doesn't break the link. Returns null if it went stale.
    function resolveSensorRef(d, s) {
      const ref = s && s.ref;
      if (!ref) return null;
      const comps = (d && d.components) || [];
      if (ref.uid) return comps.find(c => c.uid === ref.uid) || null;   // stable link
      const name = ref.name || '';
      if (name) {
        if (typeof ref.idx === 'number' && comps[ref.idx] && (comps[ref.idx].name || '') === name) return comps[ref.idx];
        return comps.find(c => (c.name || '') === name) || null;
      }
      return (typeof ref.idx === 'number' && comps[ref.idx]) ? comps[ref.idx] : null;
    }
    // Per-Ta difference: sensor software value − linked component measured value.
    function sensorRefDeltas(d, s) {
      const comp = resolveSensorRef(d, s);
      if (!comp) return null;
      return (d.ta_conditions || []).map(ta => {
        const key = 'ta_' + ta;
        const sv = parseFloat(s.readings ? s.readings[key] : NaN);
        const cv = parseTemp(comp.readings ? comp.readings[key] : NaN);
        const delta = (!isNaN(sv) && !isNaN(cv)) ? (sv - cv) : null;
        return { ta, sv, cv, delta };
      });
    }
    const fmtDelta = v => v === null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1);

    // Editor cell HTML for a sensor's 對應元件 Δ column.
    function sensorRefCellHTML(d, s, si) {
      if (!s.ref) {
        return `<button type="button" class="sensor-ref-btn" data-sensor-ref-pick="${si}" title="選擇對應元件">＋ 對應元件</button>`;
      }
      const comp = resolveSensorRef(d, s);
      if (!comp) {
        return `<button type="button" class="sensor-ref-btn stale" data-sensor-ref-pick="${si}" title="原元件已變更，點擊重新選擇">⚠ 元件已變更 · 重選</button>`;
      }
      const rows = (sensorRefDeltas(d, s) || []).map(x =>
        `<div class="sensor-ref-delta"><span class="srd-ta">${x.ta}°C</span><span class="srd-val">${fmtDelta(x.delta)}</span></div>`).join('');
      return `<div class="sensor-ref-linked">
          <div class="sensor-ref-head">
            <span class="sensor-ref-name" data-sensor-ref-pick="${si}" title="點擊更換元件">${escHtml(comp.name || '(未命名)')}</span>
            <button type="button" class="sensor-ref-clear" data-sensor-ref-clear="${si}" title="取消連結">✕</button>
          </div>
          <div class="sensor-ref-deltas">${rows}</div>
        </div>`;
    }

    // Single-select picker: this data page's components (with each Ta's measured
    // value shown), so the user can link the sensor to the matching thermocouple.
    function showSensorComponentPicker(d, onPick) {
      const comps = (d && d.components) || [];
      if (comps.length === 0) { alert('此數據頁尚無元件可對應。請先於元件列表新增元件。'); return; }
      const tas = d.ta_conditions || [];
      const catCounters = { RF: 0, Digital: 0, PWR: 0, Other: 0 };
      const overlay = document.createElement('div');
      overlay.className = 'sim-modal-overlay';
      const itemsHTML = comps.map((c, i) => {
        const cat = c.category || 'RF';
        catCounters[cat] = (catCounters[cat] || 0) + 1;
        const autoNum = cat + '-' + catCounters[cat];
        const readings = tas.map(ta => {
          const v = c.readings ? c.readings['ta_' + ta] : '';
          return `<span class="scp-reading">${ta}°C: ${(v !== undefined && v !== '') ? escHtml(String(v)) : '—'}</span>`;
        }).join('');
        return `<button type="button" class="scp-item" data-idx="${i}">
            <span class="sim-modal-item-cat ${catClassOf(cat)}">${cat}</span>
            <span class="scp-num">${autoNum}</span>
            <span class="scp-name">${escHtml(c.name || '(未命名)')}</span>
            <span class="scp-readings">${readings}</span>
          </button>`;
      }).join('');
      overlay.innerHTML = `
        <div class="sim-modal">
          <div class="sim-modal-header">選擇對應元件（取其溫度線實測值）</div>
          <div class="sim-modal-body scp-body">${itemsHTML}</div>
          <div class="sim-modal-footer"><button class="sim-modal-btn" id="scp-cancel">取消</button></div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => document.body.removeChild(overlay);
      overlay.querySelector('#scp-cancel').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      overlay.querySelectorAll('.scp-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const c = comps[parseInt(btn.dataset.idx)];
          close();
          onPick({ name: c.name || '', idx: parseInt(btn.dataset.idx), uid: c.uid });
        });
      });
    }

    function renderSimVsMeasPage(page) {
      const d = page.data;
      if (!d.items) d.items = [];

      const all = getDataPageComponents();
      const compareTa = simCompareTa(d);
      const taOptions = allDataPageTas();
      if (compareTa !== null && !taOptions.includes(compareTa)) taOptions.push(compareTa);
      const taLabel = compareTa === null ? '' : ` @ ${compareTa}°C`;

      // Keep the stored display snapshot (name / category) in step with the
      // live source so legacy fallbacks keep working after renames.
      d.items.forEach(item => {
        const m = resolveComponentRef(item, all);
        if (m) { item.component_name = m.component_name; item.category = m.category; }
      });

      const devClass = j => j === 'good' ? 'sim-dev-good' : j === 'warn' ? 'sim-dev-warn' : j === 'bad' ? 'sim-dev-bad' : '';
      const rowCells = (v) => {
        const measCell = v.stale ? '<span class="sim-ref-warn">—</span>'
          : v.noTa ? `<span class="sim-ref-warn" title="來源數據頁沒有 Ta = ${compareTa}°C 這組條件">無此 Ta</span>`
          : fmt1(v.measTc);
        return {
          meas: measCell,
          measDT: fmt1(v.measDT),
          devC: isNaN(v.devC) ? '—' : v.devC.toFixed(1),
          devPct: fmtPct(v.devPct),
          judge: SIM_JUDGE_ICON[v.judge],
          cls: devClass(v.judge),
          tip: simDevTooltip(v),
        };
      };

      // Build table rows
      const rows = d.items.map((item, i) => {
        const v = simRowValues(item, all, compareTa);
        const c = rowCells(v);
        const catClass = catClassOf(v.category);
        const nameCell = v.stale
          ? `${escHtml(v.name)}<div class="sim-ref-warn" title="來源元件已被刪除或資料頁已移除，請重新選取元件">⚠ 來源元件已變更，請重新選取</div>`
          : escHtml(v.name);
        return `<tr data-sim-row="${i}">
          <td style="text-align:left;"><span class="dt-cat-strip ${catClass}"></span><span class="sim-readonly">${escHtml(v.category)}</span></td>
          <td class="sim-readonly">${nameCell}</td>
          <td class="sim-readonly">${fmt1(v.derated)}</td>
          <td class="sim-tc-cell"><input type="number" step="any" style="width:55px;text-align:center;" placeholder="—" value="${escapeAttr(numStr(item.sim_tc))}" data-sim-idx="${i}" data-sim-field="sim_tc" data-fill-col="sim:sim_tc"></td>
          <td class="sim-readonly">${c.meas}</td>
          <td class="sim-readonly">${c.measDT}</td>
          <td class="${c.cls}" data-sim-col="devC" style="text-align:center;">${c.devC}</td>
          <td class="${c.cls}" data-sim-col="devPct" style="text-align:center;" title="${escapeAttr(c.tip)}">${c.devPct}</td>
          <td class="sim-judge ${c.cls}" data-sim-col="judge">${c.judge}</td>
          <td><input type="text" placeholder="備註" value="${escapeAttr(item.note || '')}" data-sim-idx="${i}" data-sim-field="note" data-fill-col="sim:note"></td>
          <td class="sim-del-cell"><button class="sim-del-btn" data-sim-del="${i}" title="刪除此元件">✕</button></td>
        </tr>`;
      }).join('');

      const taSelect = taOptions.length
        ? `<label class="sim-ta-pick" title="比對使用的環境溫度（Meas Tc 取自此 Ta 的實測值）">比對 Ta
             <select id="sim-compare-ta">${taOptions.map(t =>
               `<option value="${t}" ${t === compareTa ? 'selected' : ''}>${t}°C</option>`).join('')}</select>
           </label>`
        : `<span class="sim-ta-pick sim-ref-warn">尚無數據頁 Ta 條件</span>`;

      $canvas.innerHTML = editorPageWrapHTML(`
        <div class="sim-page">
          <div class="sim-page-top">
            <div class="sim-page-title">Simulation vs Measurement Comparison${compareTa === null ? '' : ` — Ta = ${compareTa}°C`}</div>
            <div class="sim-page-actions">
              ${taSelect}
              <button class="sim-select-btn" id="sim-paste-names" title="從模擬結果表複製「元件名稱 + 溫度」貼上，依名稱自動對應">貼上模擬結果</button>
              <button class="sim-select-btn" id="sim-select-comp">從數據頁選取元件</button>
            </div>
          </div>

          <!-- Comparison table -->
          <div class="sim-table-wrap">
            <table class="sim-table">
              <thead>
                <tr>
                  <th>類別</th>
                  <th>元件名稱</th>
                  <th>Derated Tc (°C)</th>
                  <th>Sim Tc${taLabel}</th>
                  <th>Meas Tc${taLabel}</th>
                  <th title="Meas ΔT = Meas Tc − Ta">Meas ΔT (°C)</th>
                  <th>Dev (°C)</th>
                  <th title="Dev(%) = (Sim Tc − Meas Tc) / (Meas Tc − Ta) × 100">Dev (%)</th>
                  <th>判斷</th>
                  <th>備註</th>
                  <th style="width:30px;"></th>
                </tr>
              </thead>
              <tbody id="sim-tbody">${rows}</tbody>
            </table>
          </div>

          <!-- Static notes -->
          <div class="sim-notes-block">
            ${simNotesLines(compareTa).map(t => `<div>${escHtml(t)}</div>`).join('')}
          </div>

          <!-- Sim vs Meas chart (same image goes into the PDF) -->
          <div class="sim-chart-box">
            <label class="sim-chart-toggle"><input type="checkbox" id="sim-chart-on"${d.show_chart !== false ? ' checked' : ''}> 顯示比較圖（PDF 也會印出）</label>
            <img id="sim-chart-img" class="sim-chart-img" alt="Sim vs Meas chart" style="display:none;">
          </div>

          <!-- Conclusion description -->
          <div class="sim-conclusion">
            <div class="sim-conclusion-label">結論敘述<button type="button" class="sec-tool-btn" id="sim-concl-draft" title="依比對結果產生結論敘述（可再修改）">✨ 產生比對結論</button></div>
            ${conclHlToolbarHTML()}
            <div class="sim-conclusion-input" id="sim-conclusion" contenteditable="true" data-placeholder="輸入模擬與實測比對的結論敘述…"></div>
          </div>
        </div>
      `);
      $canvas.classList.add('scrollable-edit');

      // ── Comparison Ta ──
      const taSel = document.getElementById('sim-compare-ta');
      if (taSel) {
        taSel.addEventListener('change', () => {
          d.compare_ta = parseFloat(taSel.value);
          scheduleSave(state.activePage);
          renderSimVsMeasPage(page);
        });
      }

      // ── Chart ──
      const chartImg = document.getElementById('sim-chart-img');
      const refreshChart = () => {
        const urls = d.show_chart !== false ? simChartDataURLs(d) : [];
        chartImg.style.display = urls.length ? 'block' : 'none';
        if (urls.length) chartImg.src = urls[0];
        chartImg.parentElement.querySelectorAll('.sim-chart-more').forEach(el => el.remove());
        urls.slice(1).reduce((prev, u) => {
          const im = document.createElement('img');
          im.className = 'sim-chart-img sim-chart-more';
          im.alt = 'Sim vs Meas chart';
          im.src = u;
          prev.after(im);
          return im;
        }, chartImg);
      };
      refreshChart();
      document.getElementById('sim-chart-on').addEventListener('change', (e) => {
        d.show_chart = e.target.checked;
        scheduleSave(state.activePage);
        refreshChart();
      });

      // ── Conclusion description (rich text w/ 標記 highlight; saved in place) ──
      const simConcl = document.getElementById('sim-conclusion');
      if (simConcl) {
        // Init from the highlighted HTML if present, else the legacy plain text.
        simConcl.innerHTML = d.conclusion_html ? sanitizeRichHtml(d.conclusion_html) : escHtml(d.conclusion || '');
        const saveConcl = () => {
          const text = simConcl.innerText;
          const empty = text.trim() === '';
          d.conclusion = empty ? '' : text;
          d.conclusion_html = empty ? '' : sanitizeRichHtml(simConcl.innerHTML);
          scheduleSave(state.activePage);
        };
        simConcl.addEventListener('input', saveConcl);
        document.getElementById('sim-concl-draft').addEventListener('click', () => {
          const t = simSummaryText(d);
          if (!t) { showToast('還沒有可比對的 Sim Tc / Meas Tc', 'warn'); return; }
          const cur = simConcl.innerText.trim();
          simConcl.innerHTML = cur ? sanitizeRichHtml(simConcl.innerHTML) + '<br>' + escHtml(t) : escHtml(t);
          saveConcl();
          showToast(cur ? '已在結論敘述後加上比對摘要' : '已產生比對結論，請再依實際情況修改', 'ok');
        });
        setupConclHighlightToolbar(
          simConcl.parentElement.querySelector('.concl-hl-toolbar'),
          simConcl,
          saveConcl
        );
      }

      document.getElementById('sim-paste-names').addEventListener('click', () => showSimPasteModal(page));

      // ── Select components button ──
      document.getElementById('sim-select-comp').addEventListener('click', () => {
        // Pre-check by exact source (data page id + component uid).
        const preKeys = new Set();
        const preNames = new Set();
        (d.items || []).forEach(it => {
          const m = resolveComponentRef(it, all);
          if (m) preKeys.add(compRefKey(m));
          else if (it.component_name) preNames.add(it.component_name);
        });
        showComponentSelectModal({ keys: preKeys, names: preNames }, (rawComps) => {
          const prevByKey = new Map();
          (d.items || []).forEach(it => {
            const m = resolveComponentRef(it, all);
            if (m) prevByKey.set(compRefKey(m), it);
          });
          d.items = rawComps.map(comp => {
            const prev = prevByKey.get(compRefKey(comp));
            return {
              category: comp.category,
              component_name: comp.component_name,
              sim_tc: prev ? prev.sim_tc : '',
              note: prev ? prev.note : '',
              source_page: comp.source_page,
              source_uid: comp.source_uid,
            };
          });
          scheduleSave(state.activePage);
          renderSimVsMeasPage(page);
        });
      });

      // ── Sim Tc input (recomputes the row in place) ──
      $canvas.querySelectorAll('[data-sim-field="sim_tc"]').forEach(el => {
        el.addEventListener('input', () => {
          const idx = parseInt(el.dataset.simIdx);
          d.items[idx].sim_tc = el.value;
          scheduleSave(state.activePage);
          const tr = el.closest('tr');
          if (!tr) return;
          const c = rowCells(simRowValues(d.items[idx], getDataPageComponents(), compareTa));
          const cell = k => tr.querySelector(`[data-sim-col="${k}"]`);
          cell('devC').className = c.cls; cell('devC').textContent = c.devC;
          cell('devPct').className = c.cls; cell('devPct').textContent = c.devPct; cell('devPct').title = c.tip;
          cell('judge').className = 'sim-judge ' + c.cls; cell('judge').textContent = c.judge;
          refreshChart();
        });
      });

      // ── Note fields ──
      $canvas.querySelectorAll('[data-sim-field="note"]').forEach(el => {
        el.addEventListener('input', () => {
          const idx = parseInt(el.dataset.simIdx);
          d.items[idx].note = el.value;
          scheduleSave(state.activePage);
        });
      });

      // ── Delete buttons ──
      $canvas.querySelectorAll('[data-sim-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.simDel);
          d.items.splice(idx, 1);
          scheduleSave(state.activePage);
          renderSimVsMeasPage(page);
        });
      });

      // ── Row right-click delete ──
      const simTbody = document.getElementById('sim-tbody');
      if (simTbody) {
        simTbody.addEventListener('contextmenu', (e) => {
          const tr = e.target.closest('tr[data-sim-row]');
          if (!tr) return;
          e.preventDefault();
          const ri = parseInt(tr.dataset.simRow);
          if (confirm('確定要移除此比對元件？')) {
            d.items.splice(ri, 1);
            scheduleSave(state.activePage);
            renderSimVsMeasPage(page);
          }
        });
      }

      // ── Excel-style grid behaviours (same engine as the data page) ──
      // The two editable columns — Sim Tc and 備註 — get drag-to-fill, rectangular
      // range select + Ctrl+C copy, Delete-to-clear, ↑/↓/Enter navigation, and
      // block paste from Excel. Read-only/computed cells carry no input so they
      // are naturally excluded from the grid, exactly like the data page.
      setupDataFillHandle($canvas.querySelector('.sim-page'));
      setupGridSelection(simTbody);
      const simFieldMap = [{ field: 'sim_tc', normalize: PASTE_NORMALIZE.number }, { field: 'note' }];
      setupGridPaste(page, simTbody, simFieldMap, 'simIdx',
        () => d.items, null, renderSimVsMeasPage);
    }

    // ━━━ Conclusion Page Module ━━━
    function addConclusionPage() { return addPageOfType('conclusion'); }

    // ━━━ Notes Page Module (備註頁) ━━━
    // Editor-only scratchpad for experiment jottings (commands, process notes)
    // plus screenshots. Never rendered in preview / PDF (buildVirtualPages skips
    // it). Data model: { title, blocks:[ { id, time, text, images:[{name,url}] } ] }.
    function noteTimestamp() {
      const dt = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
    }
    function newNoteBlock() {
      return { id: 'nb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), time: noteTimestamp(), text: '', images: [] };
    }

    function addNotePage() { return addPageOfType('note'); }

    function renderNotePage(page) {
      $canvas.classList.add('scrollable-edit');
      const d = page.data;
      if (!Array.isArray(d.blocks)) d.blocks = [newNoteBlock()];
      const pageIdx = state.activePage;

      const blocksHtml = d.blocks.map((blk, bi) => {
        if (!Array.isArray(blk.images)) blk.images = [];
        const thumbs = blk.images.map((im, ii) => `
          <div class="note-thumb" data-note-preview="${bi}:${ii}" title="點擊預覽">
            <img src="${escapeAttr(im.url)}" alt="">
            <button type="button" class="note-thumb-del" data-note-img-del="${bi}:${ii}" title="刪除此圖">✕</button>
            <span class="note-thumb-name">${escHtml(im.name || '')}</span>
          </div>`).join('');
        return `
          <div class="note-block" data-block="${bi}">
            <div class="note-block-head">
              <span class="note-block-time">🕒 ${escHtml(blk.time || '')}</span>
              <div class="note-block-tools">
                <button type="button" class="note-tool-btn note-img-add" data-note-img-add="${bi}" title="附加截圖（BMP/JPG/PNG）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg></button>
                ${blk.images.length ? `<button type="button" class="note-tool-btn note-to-image" data-note-to-image="${bi}" title="把這筆記錄的截圖做成圖片頁（插在結論頁之前），文字當標題">→ 圖片頁</button>` : ''}
                <button type="button" class="note-tool-btn note-block-del" data-note-block-del="${bi}" title="刪除此記錄">✕</button>
              </div>
            </div>
            <textarea class="note-block-text" data-note-text="${bi}" placeholder="輸入指令 / 實驗流程小記…（例：$ ssh dut && ./run_test.sh -mode thermal）　｜ 可直接 Ctrl+V 貼上截圖">${escHtml(blk.text || '')}</textarea>
            <input type="file" class="note-file-input" data-note-file="${bi}" accept="image/png,image/jpeg,image/bmp,.png,.jpg,.jpeg,.bmp" multiple style="display:none;">
            ${blk.images.length ? `<div class="note-img-strip">${thumbs}</div>` : ''}
          </div>`;
      }).join('');

      $canvas.innerHTML = `
        <div class="note-page">
          <div class="note-page-head">
            <div class="note-page-title-row">
              <span class="note-page-kicker">🗒 備註頁</span>
              <input class="note-page-title" type="text" placeholder="標題（例：DVT 熱測隨手記）" value="${escapeAttr(d.title || '')}">
            </div>
            <div class="note-page-hint">此頁僅供實驗隨手記錄（指令、流程小記、截圖…）；截圖可用上傳鈕或直接 Ctrl+V 貼上。不會納入預覽與 PDF 匯出。</div>
          </div>
          <div class="note-blocks">${blocksHtml}</div>
          <button type="button" class="note-add-block-btn" id="note-add-block">＋ 新增記錄</button>
        </div>`;

      const titleEl = $canvas.querySelector('.note-page-title');
      if (titleEl) titleEl.addEventListener('input', () => { d.title = titleEl.value; scheduleSave(pageIdx); });

      // Text edits update state in place (no re-render → textarea keeps focus/caret)
      $canvas.querySelectorAll('textarea[data-note-text]').forEach(ta => {
        ta.addEventListener('input', () => {
          const bi = parseInt(ta.dataset.noteText);
          if (d.blocks[bi]) { d.blocks[bi].text = ta.value; scheduleSave(pageIdx); }
        });
      });

      // Shared: append image File objects to a block (used by both the upload
      // button and clipboard paste). Clipboard screenshots have no real filename,
      // so one is synthesised from the timestamp. Re-renders on success.
      const addNoteImages = async (bi, fileArr) => {
        if (!d.blocks[bi]) return 0;
        const okExt = /\.(png|jpe?g|bmp)$/i;
        const files = fileArr.filter(f => f && (/^image\//.test(f.type) || okExt.test(f.name || '')));
        let added = 0;
        for (const f of files) {
          try {
            const url = await fileToDataURL(f);
            let name = (f.name || '').trim();
            if (!name || name.toLowerCase() === 'image.png') {
              const ext = ((f.type && f.type.split('/')[1]) || 'png').replace('jpeg', 'jpg');
              name = `貼上截圖_${noteTimestamp().replace(/[: ]/g, '-')}.${ext}`;
            }
            d.blocks[bi].images.push({ name, url });
            added++;
          } catch (e) {}
        }
        if (added) { scheduleSave(pageIdx); renderNotePage(page); }
        return added;
      };

      // Paste a screenshot (Win+Shift+S / Ctrl+Win+S → clipboard) with Ctrl+V into
      // the focused block — it lands in that block's image strip, exactly like an
      // uploaded screenshot. Pure-text pastes fall through to normal behaviour.
      $canvas.querySelectorAll('textarea[data-note-text]').forEach(ta => {
        ta.addEventListener('paste', (e) => {
          const items = (e.clipboardData && e.clipboardData.items) || [];
          const imgFiles = Array.from(items)
            .filter(it => it.kind === 'file' && /^image\//.test(it.type))
            .map(it => it.getAsFile())
            .filter(Boolean);
          if (!imgFiles.length) return;
          e.preventDefault();
          addNoteImages(parseInt(ta.dataset.noteText), imgFiles);
        });
      });

      const addBtn = $canvas.querySelector('#note-add-block');
      if (addBtn) addBtn.addEventListener('click', () => {
        d.blocks.push(newNoteBlock());
        scheduleSave(pageIdx);
        renderNotePage(page);
        const tas = $canvas.querySelectorAll('textarea[data-note-text]');
        tas[tas.length - 1] && tas[tas.length - 1].focus();
      });

      $canvas.querySelectorAll('.note-to-image').forEach(btn => {
        btn.addEventListener('click', () => {
          const blk = d.blocks[parseInt(btn.dataset.noteToImage)];
          if (!blk || !blk.images.length) return;
          const at = (() => { const i = state.pages.findIndex(p => p.type === 'conclusion'); return i < 0 ? state.pages.length : i; })();
          const title = String(blk.text || '').split(/\r?\n/).map(x => x.trim()).find(Boolean) || '';
          const created = [];
          for (let k = 0; k < blk.images.length; k += 4) {
            const pg = makePage('image');
            pg.data.title = title.slice(0, 80);
            pg.data.images = blk.images.slice(k, k + 4).map((im, i) => ({ position: i, url_or_base64: im.url, caption: fileStem(im.name || '') }));
            created.push(pg);
          }
          state.pages.splice(at, 0, ...created);
          created.forEach(initPageSnapshot);
          saveStructure();
          imFitAllPages();                        // learn the photo sizes so preview / export lay them out right
          renderPageList();
          showToast(`已建立 ${created.length} 頁圖片頁（插在${at < state.pages.length - created.length ? '結論頁之前' : '最後'}）`, 'ok');
        });
      });

      $canvas.querySelectorAll('.note-block-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const bi = parseInt(btn.dataset.noteBlockDel);
          if (isNaN(bi) || !d.blocks[bi]) return;
          const blk = d.blocks[bi];
          const isEmpty = !((blk.text || '').trim()) && (!blk.images || blk.images.length === 0);
          if (!isEmpty && !confirm('確定要刪除此記錄？')) return;
          d.blocks.splice(bi, 1);
          if (d.blocks.length === 0) d.blocks.push(newNoteBlock());
          scheduleSave(pageIdx);
          renderNotePage(page);
        });
      });

      // Attach screenshots — the icon button opens the block's hidden file input
      $canvas.querySelectorAll('.note-img-add').forEach(btn => {
        btn.addEventListener('click', () => {
          const bi = parseInt(btn.dataset.noteImgAdd);
          const input = $canvas.querySelector(`input[data-note-file="${bi}"]`);
          if (input) input.click();
        });
      });
      $canvas.querySelectorAll('input[data-note-file]').forEach(input => {
        input.addEventListener('change', async () => {
          const bi = parseInt(input.dataset.noteFile);
          const files = Array.from(input.files || []);
          input.value = '';
          await addNoteImages(bi, files);
        });
      });

      // Click a thumbnail to preview; ✕ deletes it
      $canvas.querySelectorAll('.note-thumb').forEach(th => {
        th.addEventListener('click', (e) => {
          if (e.target.closest('.note-thumb-del')) return;
          const [bi, ii] = th.dataset.notePreview.split(':').map(Number);
          const im = d.blocks[bi] && d.blocks[bi].images[ii];
          if (im) openSwLightbox(im.url, im.name);
        });
      });
      $canvas.querySelectorAll('.note-thumb-del').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const [bi, ii] = btn.dataset.noteImgDel.split(':').map(Number);
          if (d.blocks[bi] && d.blocks[bi].images[ii] !== undefined) {
            d.blocks[bi].images.splice(ii, 1);
            scheduleSave(pageIdx);
            renderNotePage(page);
          }
        });
      });
    }

    // 結論頁 verdict presentation (values come from complianceRowValues /
    // computeOverallResult in the thermal data model).
    const CONCL_VERDICT = {
      pass:     { label: '✅ Pass',       cls: 'concl-verdict-pass',    pdf: 'background:rgba(34,197,94,0.12);color:#166534;' },
      warn:     { label: '⚠️ Warning',    cls: 'concl-verdict-warning', pdf: 'background:rgba(250,204,21,0.18);color:#854d0e;' },
      fail:     { label: '❌ Fail',       cls: 'concl-verdict-fail',    pdf: 'background:rgba(239,68,68,0.12);color:#991b1b;' },
      disabled: { label: '斷線 N/A',      cls: '',                      pdf: 'color:rgba(15,23,42,0.5);' },
      stale:    { label: '⚠ 來源已變更',  cls: 'concl-verdict-stale',   pdf: 'color:#b45309;' },
      none:     { label: '—',             cls: '',                      pdf: '' },
    };
    const CONCL_MARGIN_CLS = { pass: 'concl-margin-pass', warn: 'concl-margin-warn', fail: 'concl-margin-fail' };
    const CONCL_MARGIN_PDF = { pass: 'color:#15803d;', warn: 'color:#a16207;', fail: 'color:#b91c1c;' };

    // ── Shared 結論敘述 highlight (標記) for the conclusion + comparison pages ──
    // Both use a contenteditable div storing innerHTML. These helpers wrap the
    // current selection in a <mark> (or unwrap intersecting marks), so the user
    // can highlight a segment of the conclusion text they typed.
    const CONCL_HL_STYLE = 'background:#ffe066;color:inherit;border-radius:2px;padding:0 1px;';

    function conclHlToolbarHTML() {
      return `<div class="concl-hl-toolbar">
        <button type="button" class="concl-hl-btn" data-concl-hl="apply" title="標記選取的文字">🖍 標記</button>
        <button type="button" class="concl-hl-btn" data-concl-hl="remove" title="取消選取範圍的標記">取消標記</button>
      </div>`;
    }

    // Wrap the current (non-empty) selection inside `editor` in a <mark>. Returns
    // true if something was highlighted.
    function conclHighlightApply(editor) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
      const range = sel.getRangeAt(0);
      if (!editor.contains(range.commonAncestorContainer)) return false;
      const mark = document.createElement('mark');
      mark.className = 'concl-hl';
      mark.setAttribute('style', CONCL_HL_STYLE);
      try {
        range.surroundContents(mark);
      } catch (e) {
        // Selection spans multiple nodes → extract then wrap.
        const frag = range.extractContents();
        mark.appendChild(frag);
        range.insertNode(mark);
      }
      // Flatten any nested marks that resulted from wrapping over existing ones.
      editor.querySelectorAll('mark.concl-hl mark').forEach(inner => {
        while (inner.firstChild) inner.parentNode.insertBefore(inner.firstChild, inner);
        inner.remove();
      });
      editor.normalize();
      sel.removeAllRanges();
      return true;
    }

    // Unwrap every <mark> that the current selection intersects. Returns true if
    // any highlight was removed.
    function conclHighlightRemove(editor) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return false;
      const range = sel.getRangeAt(0);
      if (!editor.contains(range.commonAncestorContainer)) return false;
      let changed = false;
      Array.from(editor.querySelectorAll('mark')).forEach(m => {
        if (range.intersectsNode(m)) {
          while (m.firstChild) m.parentNode.insertBefore(m.firstChild, m);
          m.remove();
          changed = true;
        }
      });
      editor.normalize();
      return changed;
    }

    // Wire a highlight toolbar to its editor. mousedown+preventDefault keeps the
    // text selection alive (a plain click would collapse it before the handler).
    function setupConclHighlightToolbar(toolbarEl, editorEl, onChange) {
      if (!toolbarEl || !editorEl) return;
      toolbarEl.querySelectorAll('[data-concl-hl]').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const changed = btn.dataset.conclHl === 'apply'
            ? conclHighlightApply(editorEl)
            : conclHighlightRemove(editorEl);
          if (changed && onChange) onChange();
        });
      });
    }

    function renderConclusionPage(page) {
      const d = page.data;
      if (!d.issues) d.issues = [''];
      if (!d.compliance) d.compliance = [];
      if (!d.actions) d.actions = [];

      // Compliance rows are linked to their source component (page id + uid);
      // every value is recomputed from the live data page on each render.
      // Each data page is one test condition, so results, compliance rows and
      // the Fail/Warning hint are all shown per data page.
      const groups = getDataPageComponentGroups();
      const all = groups.flatMap(g => g.components);
      const overall = computeOverallResult(groups);
      const listedKeys = new Set(d.compliance.map(r => compRefKey(resolveComponentRef(r, all))).filter(Boolean));
      const unlistedByPage = groups.map(g => {
        const sm = overall.perPage.find(pp => pp.pageId === g.pageId);
        return { group: g, sm, items: sm.flagged.filter(c => !listedKeys.has(compRefKey(c))) };
      }).filter(x => x.items.length);
      const unlistedCount = unlistedByPage.reduce((n, x) => n + x.items.length, 0);

      // Result by test condition (one row per data page)
      const conditionRows = overall.perPage.map(pp => `
          <tr>
            <td class="concl-readonly" style="text-align:left;">${escHtml(pp.name)}</td>
            <td class="concl-verdict-cell concl-overall-${pp.status}"><span class="concl-overall-value">${pp.label}</span></td>
            <td class="concl-readonly concl-count">${escHtml(summaryCountsText(pp))}</td>
          </tr>`).join('');
      const conditionTable = overall.perPage.length ? `
          <div class="concl-section">
            <div class="concl-section-title">Result by Test Condition</div>
            <div class="concl-table-wrap">
              <table class="concl-table">
                <thead><tr><th style="width:46%">Test Condition（數據頁）</th><th style="width:22%">Result</th><th style="width:32%">Fail / Warning / 未量測</th></tr></thead>
                <tbody>${conditionRows}</tbody>
              </table>
            </div>
          </div>` : '';

      const rowHtml = ({ i, v }) => {
        const vd = CONCL_VERDICT[v.verdict] || CONCL_VERDICT.none;
        const mCls = CONCL_MARGIN_CLS[v.verdict] || '';
        return `
          <tr>
            <td class="concl-readonly" style="text-align:left;">${escHtml(v.name) || '—'}</td>
            <td class="concl-readonly">${fmt1(v.maxTc)}${v.maxTa !== null ? `<span class="concl-sub">@ Ta ${v.maxTa}°C</span>` : ''}</td>
            <td class="concl-readonly">${fmt1(v.derated)}</td>
            <td class="${mCls}" style="text-align:center;font-weight:600;">${fmtPct(v.marginPct)}${isNaN(v.marginC) ? '' : `<span class="concl-sub">${fmtDeltaC(v.marginC)}</span>`}</td>
            <td class="${vd.cls} concl-verdict-cell">${vd.label}</td>
            <td class="concl-del-cell"><button class="concl-del-btn" data-comp-del="${i}" title="移除此元件">✕</button></td>
          </tr>`;
      };
      let complianceRows = groupComplianceRows(d.compliance, groups, all).map(({ group, items }) => `
          <tr class="concl-group-row"><td colspan="6">${group ? escHtml(conditionName(group)) : '⚠ 來源元件已變更（請重新選取）'}</td></tr>
          ${items.map(rowHtml).join('')}`).join('');
      if (d.compliance.length === 0) {
        complianceRows = `<tr><td colspan="6" class="concl-empty">尚未選取元件 — 點下方按鈕從數據頁選取有疑慮的元件</td></tr>`;
      }

      // Unlisted Fail / Warning components, grouped per data page. Each chip adds
      // one component; each group can be added at once; the box can be closed
      // (remembered on this page) and reopened from the button below the table.
      const chip = c => `<button type="button" class="concl-chip concl-chip-${c.calc.status}" data-add-key="${escapeAttr(compRefKey(c))}"
            title="${c.calc.status === 'fail' ? 'Fail' : 'Warning'}：最差 Margin ${fmtPct(c.calc.worst && c.calc.worst.marginPct)} @ Ta ${c.calc.worst ? c.calc.worst.ta : '—'}°C — 點擊加入">
            ${c.calc.status === 'fail' ? '❌' : '⚠️'} ${escHtml(c.component_name)}</button>`;
      const unlistedHint = (unlistedCount && !d.flag_hint_hidden)
        ? `<div class="concl-hint" id="concl-flag-hint">
             <div class="concl-hint-head">
               <span>⚠ 以下 Fail / Warning 元件尚未列入此表（依數據頁分組，點元件可單獨加入）</span>
               <button type="button" class="concl-hint-close" id="concl-hint-close" title="關閉提示（可從下方按鈕重新顯示）">✕</button>
             </div>
             ${unlistedByPage.map(x => `
               <div class="concl-hint-group">
                 <div class="concl-hint-label">${escHtml(conditionName(x.group))}
                   <span class="concl-hint-count">${x.items.filter(c => c.calc.status === 'fail').length} Fail · ${x.items.filter(c => c.calc.status === 'warn').length} Warning</span>
                   <button type="button" class="concl-hint-btn" data-add-page="${escapeAttr(x.group.pageId)}">加入此頁全部</button>
                 </div>
                 <div class="concl-hint-chips">${x.items.map(chip).join('')}</div>
               </div>`).join('')}
           </div>`
        : '';
      const reopenHintBtn = (unlistedCount && d.flag_hint_hidden)
        ? `<button class="concl-add-btn concl-reopen-btn" id="concl-show-flagged">⚠ 顯示未列入的 Fail / Warning（${unlistedCount}）</button>`
        : '';

      // Build issues
      let issuesHtml = d.issues.map((issue, i) => `
          <li class="concl-issue-item">
            <span class="concl-issue-bullet">•</span>
            <input class="concl-issue-input" type="text" placeholder="輸入問題描述..."
                   value="${escapeAttr(issue)}" data-issue-idx="${i}">
          </li>`).join('');

      // Build actions rows
      let actionsRows = d.actions.map((act, i) => `
          <tr>
            <td><input type="text" placeholder="行動描述" value="${escapeAttr(act.description)}" data-act-idx="${i}" data-act-field="description"></td>
            <td><input type="text" placeholder="Owner" value="${escapeAttr(act.owner)}" data-act-idx="${i}" data-act-field="owner"></td>
            <td><input type="date" value="${escapeAttr(act.due_date)}" data-act-idx="${i}" data-act-field="due_date"></td>
            <td class="concl-del-cell"><button class="concl-del-btn" data-act-del="${i}" title="移除此行動">✕</button></td>
          </tr>`).join('');

      $canvas.innerHTML = editorPageWrapHTML(`
        <div class="conclusion-page">
          <div class="concl-header">
            <div class="concl-page-title">Test Conclusion</div>
            <div class="concl-overall concl-overall-${overall.status}">
              <span class="concl-overall-label">Overall Result</span>
              <span class="concl-overall-value">${overall.label}</span>
              <span class="concl-overall-detail">${escHtml(overall.detail)}</span>
            </div>
          </div>

          <!-- 1. Summary -->
          <div class="concl-section">
            <div class="concl-section-title">Conclusion<button type="button" class="sec-tool-btn" id="concl-draft-btn" title="依數據頁、比對頁的結果產生結論草稿（可再修改）">✨ 產生結論草稿</button></div>
            ${conclHlToolbarHTML()}
            <div class="concl-summary" contenteditable="true" data-placeholder="請輸入實驗結論..."
                 id="concl-summary-editor">${sanitizeRichHtml(d.summary || '')}</div>
          </div>

          ${conditionTable}

          <!-- 2. Compliance Summary -->
          <div class="concl-section">
            <div class="concl-section-title">Compliance Summary</div>
            <div class="concl-table-wrap">
              <table class="concl-table">
                <thead>
                  <tr>
                    <th style="width:34%">Component</th>
                    <th style="width:15%" title="所有 Ta 條件中最高的實測 Tc">Max Tc (°C)</th>
                    <th style="width:16%">Derated Spec (°C)</th>
                    <th style="width:13%">Margin</th>
                    <th style="width:18%">Verdict</th>
                    <th style="width:4%"></th>
                  </tr>
                </thead>
                <tbody id="compliance-tbody">${complianceRows}</tbody>
              </table>
            </div>
            ${unlistedHint}
            <div class="concl-btn-row">
              <button class="concl-add-btn" id="add-compliance-btn">+ 從數據頁選取元件</button>
              ${reopenHintBtn}
            </div>
          </div>

          <!-- 3 + 4. Issues / Next Action side by side -->
          <div class="concl-columns">
            <div class="concl-section">
              <div class="concl-section-title">Issues Found<button type="button" class="sec-tool-btn" id="concl-issues-btn" title="把 Fail / Warning 元件寫成問題條列（已存在的不重複加入）">⇩ 由 Fail / Warning 產生</button></div>
              <ul class="concl-issues-list" id="issues-list">${issuesHtml}</ul>
            </div>
            <div class="concl-section">
              <div class="concl-section-title">Next Action<button type="button" class="sec-tool-btn" id="concl-actions-btn" title="為 Fail / Warning 元件建立待辦（Owner 預設封面的 Tested by，期限兩週）">⇩ 由 Fail / Warning 產生</button></div>
              <table class="concl-actions-table">
                <thead>
                  <tr>
                    <th style="width:52%">Action</th>
                    <th style="width:24%">Owner</th>
                    <th style="width:20%">Due Date</th>
                    <th style="width:4%"></th>
                  </tr>
                </thead>
                <tbody id="actions-tbody">${actionsRows}</tbody>
              </table>
              <button class="concl-add-btn" id="add-action-btn">+ 新增行動</button>
            </div>
          </div>
        </div>
      `);
      $canvas.classList.add('scrollable-edit');

      bindConclusionHandlers(page);
    }

    function bindConclusionHandlers(page) {
      const d = page.data;
      const pageIdx = state.activePage;

      // Summary (contenteditable)
      const summaryEl = document.getElementById('concl-summary-editor');
      if (summaryEl) {
        summaryEl.addEventListener('input', () => {
          d.summary = sanitizeRichHtml(summaryEl.innerHTML);
          scheduleSave(pageIdx);
        });
        // Ctrl+B for bold
        summaryEl.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'b') {
            e.preventDefault();
            document.execCommand('bold');
          }
        });
        // 標記 / 取消標記 highlight toolbar
        setupConclHighlightToolbar(
          summaryEl.parentElement.querySelector('.concl-hl-toolbar'),
          summaryEl,
          () => { d.summary = sanitizeRichHtml(summaryEl.innerHTML); scheduleSave(pageIdx); }
        );
      }

      // ✨ Draft the conclusion text from the data (replace or append).
      document.getElementById('concl-draft-btn')?.addEventListener('click', () => {
        const lines = buildConclusionDraft();
        if (!lines.length) { alert('還沒有數據頁可以產生結論。'); return; }
        const html = lines.map(escHtml).join('<br>');
        const put = (mode) => {
          d.summary = sanitizeRichHtml(mode === 'append' && d.summary ? d.summary + '<br>' + html : html);
          scheduleSave(pageIdx);
          renderConclusionPage(page);
          showToast('已產生結論草稿，請再依實際情況修改', 'ok');
        };
        const current = String(d.summary || '').replace(/<[^>]*>/g, '').trim();
        if (!current) { put('replace'); return; }
        const m = openToolModal({
          title: '產生結論草稿',
          width: 520,
          body: `<div class="tool-hint" style="margin-bottom:8px;">結論已有內容。要用草稿取代，還是加在最後？</div>
            <div class="tool-textarea" style="min-height:0;white-space:normal;">${html}</div>`,
          footer: `<button class="sim-modal-btn" id="cd-cancel">取消</button>
            <button class="sim-modal-btn" id="cd-append">加在最後</button>
            <button class="sim-modal-btn primary" id="cd-replace">取代</button>`,
        });
        m.$('#cd-cancel').addEventListener('click', m.close);
        m.$('#cd-append').addEventListener('click', () => { m.close(); put('append'); });
        m.$('#cd-replace').addEventListener('click', () => { m.close(); put('replace'); });
      });
      // ⇩ Next Action rows for Fail / Warning components (skips ones already listed).
      document.getElementById('concl-actions-btn')?.addEventListener('click', () => {
        const groups = getDataPageComponentGroups();
        const cover = state.pages.find(p => p.type === 'cover');
        const owner = (cover && cover.data.tested_by) || defaultTestedBy();
        const due = new Date(Date.now() + 14 * 86400000);
        const dueStr = `${due.getFullYear()}-${String(due.getMonth() + 1).padStart(2, '0')}-${String(due.getDate()).padStart(2, '0')}`;
        const fresh = [];
        groups.forEach(g => summarizeComponents(g.components).flagged.forEach(c => {
          const where = groups.length > 1 ? `（${conditionName(g)}）` : '';
          const desc = c.calc.status === 'fail'
            ? `改善 ${c.component_name}${where} 散熱並重測（目前 Margin ${fmtPct(c.calc.worst.marginPct)}）`
            : `追蹤 ${c.component_name}${where} 溫度餘裕（Margin ${fmtPct(c.calc.worst.marginPct)}）`;
          const key = c.component_name + where;
          if (!d.actions.some(a => String(a.description || '').includes(key)) && !fresh.some(a => a.description.includes(key))) fresh.push({ description: desc, owner, due_date: dueStr });
        }));
        if (!fresh.length) { showToast('沒有需要新增的行動（沒有 Fail / Warning，或都已列出）', 'ok'); return; }
        d.actions = d.actions.filter(a => String(a.description || '').trim() || a.owner || a.due_date).concat(fresh);
        scheduleSave(pageIdx);
        renderConclusionPage(page);
        showToast(`已加入 ${fresh.length} 項行動，請確認 Owner 與期限`, 'ok');
      });

      // ⇩ Issues from Fail / Warning components (skips ones already listed).
      document.getElementById('concl-issues-btn')?.addEventListener('click', () => {
        const lines = flaggedIssueLines();
        if (!lines.length) { showToast('目前沒有 Fail / Warning 元件', 'ok'); return; }
        const existing = (d.issues || []).filter(t => String(t || '').trim());
        const fresh = lines.filter(x => !existing.some(t => String(t).startsWith(x.prefix)));
        if (!fresh.length) { showToast('Fail / Warning 元件都已列在 Issues Found', 'ok'); return; }
        d.issues = existing.concat(fresh.map(x => x.line));
        scheduleSave(pageIdx);
        renderConclusionPage(page);
        showToast(`已加入 ${fresh.length} 條問題${lines.length > fresh.length ? `（略過已存在 ${lines.length - fresh.length} 條）` : ''}`, 'ok');
      });

      // (Compliance Component / Tc / Spec / Margin / Verdict are all auto-filled
      //  and read-only — Verdict follows the Margin — so there are no inputs here.)

      // Add compliance rows — pick components from the data page (values auto-fill)
      const toRow = comp => ({ component: comp.component_name, source_page: comp.source_page, source_uid: comp.source_uid });
      document.getElementById('add-compliance-btn')?.addEventListener('click', () => {
        const all = getDataPageComponents();
        const keys = new Set(), names = new Set();
        (d.compliance || []).forEach(r => {
          const m = resolveComponentRef(r, all);
          if (m) keys.add(compRefKey(m)); else if (r.component) names.add(r.component);
        });
        showComponentSelectModal({ keys, names }, (rawComps) => {
          d.compliance = rawComps.map(toRow);
          renderConclusionPage(page);
          scheduleSave(pageIdx);
        });
      });
      // Fail / Warning hint: add one (chip), add a whole data page, close, reopen.
      const addByKeys = (keys) => {
        const all = getDataPageComponents();
        const have = new Set(d.compliance.map(r => compRefKey(resolveComponentRef(r, all))).filter(Boolean));
        keys.forEach(k => {
          const c = all.find(x => compRefKey(x) === k);
          if (c && !have.has(k)) { d.compliance.push(toRow(c)); have.add(k); }
        });
        renderConclusionPage(page);
        scheduleSave(pageIdx);
      };
      $canvas.querySelectorAll('[data-add-key]').forEach(btn => {
        btn.addEventListener('click', () => addByKeys([btn.dataset.addKey]));
      });
      $canvas.querySelectorAll('[data-add-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          const pp = computeOverallResult().perPage.find(x => x.pageId === btn.dataset.addPage);
          if (pp) addByKeys(pp.flagged.map(compRefKey));
        });
      });
      document.getElementById('concl-hint-close')?.addEventListener('click', () => {
        d.flag_hint_hidden = true;
        renderConclusionPage(page);
        scheduleSave(pageIdx, { undo: false });
      });
      document.getElementById('concl-show-flagged')?.addEventListener('click', () => {
        d.flag_hint_hidden = false;
        renderConclusionPage(page);
        scheduleSave(pageIdx, { undo: false });
      });

      // Delete a compliance row
      $canvas.querySelectorAll('[data-comp-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          d.compliance.splice(parseInt(btn.dataset.compDel), 1);
          renderConclusionPage(page);
          scheduleSave(pageIdx);
        });
      });

      // Issues inputs
      $canvas.querySelectorAll('[data-issue-idx]').forEach(el => {
        const idx = parseInt(el.dataset.issueIdx);

        el.addEventListener('input', () => {
          d.issues[idx] = el.value;
          scheduleSave(pageIdx);
        });

        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            // Insert new issue after current
            d.issues.splice(idx + 1, 0, '');
            renderConclusionPage(page);
            scheduleSave(pageIdx);
            setTimeout(() => {
              const inputs = $canvas.querySelectorAll('[data-issue-idx]');
              inputs[idx + 1]?.focus();
            }, 30);
          }
          if (e.key === 'Backspace' && el.value === '' && d.issues.length > 1) {
            e.preventDefault();
            d.issues.splice(idx, 1);
            renderConclusionPage(page);
            scheduleSave(pageIdx);
            setTimeout(() => {
              const inputs = $canvas.querySelectorAll('[data-issue-idx]');
              const focusIdx = Math.max(0, idx - 1);
              inputs[focusIdx]?.focus();
            }, 30);
          }
        });
      });

      // Actions table inputs
      $canvas.querySelectorAll('[data-act-idx]').forEach(el => {
        const idx = parseInt(el.dataset.actIdx);
        const field = el.dataset.actField;
        el.addEventListener('input', () => {
          if (d.actions[idx]) {
            d.actions[idx][field] = el.value;
            scheduleSave(pageIdx);
          }
        });
      });

      // Add action row
      document.getElementById('add-action-btn')?.addEventListener('click', () => {
        d.actions.push({ description: '', owner: '', due_date: '' });
        renderConclusionPage(page);
        scheduleSave(pageIdx);
        setTimeout(() => {
          const inputs = $canvas.querySelectorAll('[data-act-field="description"]');
          inputs[inputs.length - 1]?.focus();
        }, 30);
      });

      // Delete an action row
      $canvas.querySelectorAll('[data-act-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          d.actions.splice(parseInt(btn.dataset.actDel), 1);
          renderConclusionPage(page);
          scheduleSave(pageIdx);
        });
      });
    }
