      font-size: 10px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      padding: 3px 4px;
      border-top: 1px solid rgba(15,23,42,0.06);
    }
    .sim-img-caption::placeholder { color: rgba(15,23,42,0.20); }
    .sim-img-caption:focus { background: rgba(56,189,248,0.03); }

    .sim-img-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }
    .sim-img-zone:hover .sim-img-actions { opacity: 1; }

    .sim-img-action-btn {
      padding: 2px 6px;
      font-size: 9px;
      font-family: var(--font-ui);
      color: #fff;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .sim-img-action-btn.danger { background: rgba(220,38,38,0.7); }

    /* Comparison table */
    .sim-table-wrap {
      flex: 1;
      overflow: auto;
      border: 1px solid rgba(15,23,42,0.10);
      border-radius: 6px;
    }

    .sim-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .sim-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      text-align: center;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #ffffff;
      padding: 4px 6px;
      background: #0B3D7A;
      border: 1px solid rgba(255,255,255,0.3);
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    .sim-table td {
      padding: 3px 5px;
      border: 1px solid rgba(15,23,42,0.08);
      vertical-align: middle;
      white-space: nowrap;
      text-align: center;
    }

    .sim-table input {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      padding: 2px 3px;
      width: 100%;
    }
    .sim-table input::placeholder { color: rgba(15,23,42,0.20); }
    .sim-table input:focus { background: rgba(56,189,248,0.05); }

    /* Auto-filled (read-only) component data — same font/colour as the data page */
    .sim-table .sim-readonly {
      color: var(--text-on-white);
      font-size: 11px;
    }

    /* Sim Tc is the only user-entered field — grey it like the data page's
       "Derated Tc" cell so it reads as the field to fill in. */
    .sim-table td.sim-tc-cell { background: rgba(15,23,42,0.03); }

    .sim-dev-good  { background: #dcfce7 !important; color: #15803d !important; font-weight: 600; text-align: center; }
    .sim-dev-warn  { background: #fef9c3 !important; color: #a16207 !important; font-weight: 600; text-align: center; }
    .sim-dev-bad   { background: #fee2e2 !important; color: #b91c1c !important; font-weight: 600; text-align: center; }

    .sim-table .sim-judge { text-align: center; font-size: 12px; }

    .sim-del-cell { text-align: center; padding: 0 !important; }
    .sim-del-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(15,23,42,0.25); font-size: 12px; padding: 2px 6px;
      line-height: 1; transition: color 0.15s;
    }
    .sim-del-btn:hover { color: #dc2626; }

    /* Static notes block */
    .sim-notes-block {
      font-size: 10px;
      color: rgba(15,23,42,0.50);
      line-height: 1.7;
      flex-shrink: 0;
      text-align: left;

    /* ━━━ Annotation page editor (the page itself is the shared PDF layout) ━━━ */
    .an-editor { width: 100%; height: 100%; display: flex; flex-direction: column; background: #F7F9FC; font-family: var(--font-ui); color: var(--text-on-white); }
    .an-toolbar { flex-shrink: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 10px; background: #fff; border-bottom: 1px solid rgba(15,23,42,0.08); position: relative; z-index: 5; }

    .an-tb svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .an-tb:hover { background: rgba(35,87,167,0.10); }
    .an-tb[aria-pressed="true"] { background: #2357A7; color: #fff; }

    .an-tb[data-danger]:hover { background: rgba(220,38,38,0.10); }
    .an-tb:disabled { opacity: 0.32; cursor: default; background: transparent; }
    .an-tb.txt { width: auto; min-width: 44px; padding: 0 6px; font: 600 11px var(--font-mono); color: #0B3D7A; }
    .an-tb[data-tip]:hover::after, .an-tb[data-tip]:focus-visible::after {
      content: attr(data-tip); position: absolute; top: calc(100% + 7px); left: 50%; transform: translateX(-50%);
      white-space: nowrap; background: #0B3D7A; color: #fff; font: 500 11px var(--font-ui); padding: 4px 8px; border-radius: 4px;
      pointer-events: none; z-index: 50; box-shadow: 0 2px 8px rgba(2,27,58,0.25);
    }
    .an-zoom .an-tb[data-tip]:hover::after, .an-zoom .an-tb[data-tip]:focus-visible::after { left: auto; right: 0; transform: none; }
    .an-tb:disabled::after { display: none; }
    .an-main { flex: 1; min-height: 0; display: flex; }
    .an-viewport { flex: 1; min-width: 0; overflow: auto; display: flex; background: #DDE6F1; position: relative; }
    .an-viewport.dragover { box-shadow: inset 0 0 0 3px #2357A7; }
    .an-sizer { margin: auto; position: relative; flex-shrink: 0; }
    .an-paper { position: absolute; left: 0; top: 0; width: 842px; height: 595px; background: #fff; transform-origin: 0 0; box-shadow: 0 2px 16px rgba(11,61,122,0.20); overflow: hidden; user-select: none; touch-action: none; font-size: 16px; line-height: normal; color: #0f172a; }
    .an-paper, .an-paper * { letter-spacing: 0; word-spacing: 0; text-transform: none; }
    .an-paper img { pointer-events: none; }
    .an-paper [data-an-img] { cursor: move; }
    .an-paper.mode-add [data-an-img] { cursor: crosshair; }
    .an-paper.panning, .an-paper.panning * { cursor: grab !important; }
    .an-paper.dragging, .an-paper.dragging * { cursor: grabbing !important; }
    .an-dot { cursor: grab; }
    .an-dot::after { content: ''; position: absolute; left: -7px; top: -7px; right: -7px; bottom: -7px; border-radius: 50%; }
    .an-dot.sel { outline: 2px solid #0ea5e9; outline-offset: 2px; }
    .an-lbl { cursor: grab; }
    .an-lbl.sel { outline: 2px solid #0ea5e9; outline-offset: 1px; }
    .an-dot.hover, .an-lbl.hover { outline: 2px solid rgba(14,165,233,0.5); outline-offset: 1px; }
    #an-ui { position: absolute; left: 0; top: 36px; width: 842px; height: 559px; pointer-events: none; z-index: 30; }
    #an-ui-dyn { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .an-frame { position: absolute; outline: 1px dashed rgba(35,87,167,0.55); pointer-events: none; }
    .an-handle { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: #fff; border: 1.5px solid #2357A7; border-radius: 2px; pointer-events: auto; box-sizing: border-box; }
    .an-handle[data-an-handle="nw"], .an-handle[data-an-handle="se"] { cursor: nwse-resize; }
    .an-handle[data-an-handle="ne"], .an-handle[data-an-handle="sw"] { cursor: nesw-resize; }
    .an-handle:hover { background: #2357A7; }
    .an-safe { position: absolute; border: 1px dashed rgba(35,87,167,0.28); display: none; pointer-events: none; }
    .an-paper.dragging .an-safe { display: block; }
    .an-guide { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed #f97316; pointer-events: none; }
    .an-rubber { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    .an-rubber line { stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .an-rename { position: absolute; pointer-events: auto; box-sizing: border-box; border: 2px solid #0ea5e9; border-radius: 3px; padding: 0 5px; font-family: 'DM Sans','Noto Sans TC',sans-serif; font-weight: 500; outline: none; background: #fff; color: #0f172a; z-index: 5; box-shadow: 0 2px 10px rgba(14,165,233,0.25); }
    .an-drop { position: absolute; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 2px dashed rgba(35,87,167,0.32); border-radius: 10px; color: rgba(15,23,42,0.55); font-size: 13px; background: rgba(232,240,250,0.55); box-sizing: border-box; }
    .an-viewport.dragover .an-drop { border-color: #2357A7; background: rgba(35,87,167,0.08); }

    .an-drop-btn { font: 600 12px var(--font-ui); color: #fff; background: #2357A7; border: none; border-radius: 5px; padding: 6px 14px; cursor: pointer; }
    .an-drop-btn:hover { background: #0B3D7A; }
    .an-side { width: 236px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; background: #fff; border-left: 1px solid rgba(15,23,42,0.08); }

    .an-mini { font: 600 10.5px var(--font-ui); letter-spacing: 0; color: #2357A7; background: rgba(35,87,167,0.07); border: 1px solid rgba(35,87,167,0.25); border-radius: 4px; padding: 1px 7px; cursor: pointer; }
    .an-mini:hover { background: rgba(35,87,167,0.15); }
    .an-select { width: 100%; font: 11.5px var(--font-ui); padding: 3px 4px; border: 1px solid rgba(15,23,42,0.18); border-radius: 4px; background: #fff; color: #0B3D7A; }
    .an-legend { margin-top: 5px; font-size: 10.5px; color: rgba(15,23,42,0.6); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .an-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
    .an-legend i.pass { background: #16a34a; } .an-legend i.warn { background: #d97706; } .an-legend i.fail { background: #dc2626; }
    .an-chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 120px; overflow-y: auto; margin-top: 6px; }
    .an-chip { font: 11px var(--font-ui); border: 1px solid rgba(35,87,167,0.3); background: #fff; color: #1A4E96; border-radius: 10px; padding: 1px 8px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .an-chip:hover { background: rgba(35,87,167,0.08); }
    .an-chip.armed { background: #2357A7; color: #fff; border-color: #2357A7; }
    .an-seq { margin-top: 7px; width: 100%; font: 600 11.5px var(--font-ui); color: #fff; background: #2357A7; border: none; border-radius: 5px; padding: 5px 0; cursor: pointer; }
    .an-seq:hover { background: #0B3D7A; }
    .an-seq.on { background: #fff; color: #b91c1c; border: 1px solid rgba(185,28,28,0.4); }
    .an-empty { font-size: 11px; color: rgba(15,23,42,0.45); padding: 4px 2px; line-height: 1.5; list-style: none; }
    .an-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
    .an-plist { flex: none; margin-top: 6px; }
    .an-plist .im-row { gap: 6px; padding: 3px 2px; }
    .an-grp { list-style: none; font: 700 10px var(--font-ui); letter-spacing: 0.04em; color: rgba(15,23,42,0.5); padding: 6px 2px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .an-grp:first-child { padding-top: 0; }
    .an-row { display: flex; align-items: center; gap: 4px; padding: 1px 2px; border-radius: 4px; cursor: pointer; }

    .an-row.sel { background: rgba(14,165,233,0.13); }

    .an-row:hover .an-del, .an-row.sel .an-del { visibility: visible; }

    .an-status b { color: #0B3D7A; margin-right: 6px; }

    /* ── Shared image cropper modal ── */
    .crop-modal {
      width: min(92vw, 1100px);
      max-width: 1100px;
      background: rgba(15,23,42,0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .crop-stage {
      /* Explicit height only — do NOT use flex:1 here: inside this auto-height
         column modal a flex-basis of 0 would collapse the stage and shrink the
         crop preview to a few pixels. */
      height: min(74vh, 720px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        repeating-conic-gradient(rgba(255,255,255,0.05) 0% 25%, transparent 0% 50%) 50% / 20px 20px;
    }
    .crop-frame {
      position: relative;
      user-select: none;
      touch-action: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .crop-base {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .crop-sel {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.95);
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
      cursor: move;
    }
    .crop-sel::before {
      /* rule-of-thirds guides */
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
      background-position: 0 0;
      pointer-events: none;
      opacity: 0.6;
    }
    .crop-h {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff;
      border: 1px solid rgba(15,23,42,0.4);
      border-radius: 50%;
      z-index: 2;
    }
    .crop-h.nw { left: -7px; top: -7px; cursor: nwse-resize; }
    .crop-h.ne { right: -7px; top: -7px; cursor: nesw-resize; }
    .crop-h.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .crop-h.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
    .crop-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .crop-btn {
      padding: 7px 16px;
      font-size: 13px;
      font-family: var(--font-ui);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      transition: all var(--transition-fast);
    }
    .crop-btn:hover { background: rgba(255,255,255,0.12); }
    .crop-btn.confirm {
      background: #2563EB;
      border-color: #2563EB;
      color: #fff;
      font-weight: 600;
    }
    .crop-btn.confirm:hover { background: #1d4ed8; }

    /* ━━━ Image page editor (shares the annotation editor shell) ━━━ */
    .im-title { flex: 0 1 260px; min-width: 120px; font: 700 13px var(--font-ui); color: #0B3D7A; border: 1px solid rgba(15,23,42,0.14); border-radius: 4px; padding: 4px 8px; background: #fff; }
    .im-title:focus { outline: none; border-color: #0ea5e9; }
    .im-lays { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .im-lay { height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(15,23,42,0.14); border-radius: 5px; background: #fff; cursor: pointer; font: 600 11px var(--font-ui); color: #1A4E96; padding: 0; }
    .im-lay svg { width: 26px; height: 18px; fill: rgba(35,87,167,0.18); stroke: #2357A7; stroke-width: 0.8; }
    .im-lay:hover { background: rgba(35,87,167,0.07); }
    .im-lay.cur { border-color: #2357A7; box-shadow: inset 0 0 0 1px #2357A7; }
    .im-lay.on { background: rgba(35,87,167,0.12); }
    .im-lay:disabled { opacity: 0.3; cursor: default; }
    .im-list .im-row { gap: 6px; padding: 3px 2px; }
    .im-grip { cursor: grab; color: rgba(15,23,42,0.35); font-size: 11px; letter-spacing: -2px; user-select: none; padding: 0 2px; }
    .im-thumb { width: 44px; height: 32px; object-fit: cover; border-radius: 3px; border: 1px solid rgba(15,23,42,0.12); flex-shrink: 0; background: #eef2f7; }
    .im-paper [data-im-frame] { cursor: pointer; }
    .im-paper.mode-dot [data-im-frame], .im-paper.mode-circle [data-im-frame], .im-paper.mode-rect [data-im-frame] { cursor: crosshair; }
    .im-paper.mode-text, .im-paper.mode-text * { cursor: text; }
    .im-paper.swapping, .im-paper.swapping * { cursor: copy !important; }
    .im-shape { cursor: move; }
    .im-shape.sel { outline: 2px solid #0ea5e9; outline-offset: 1px; }
    .im-frame-ui { position: absolute; pointer-events: none; outline: 1px dashed transparent; }
    .im-paper [data-im-frame]:hover + * {}
    .im-frame-ui.sel { outline: 2px solid #2357A7; outline-offset: 1px; }
    .im-frame-ui.drop { outline: 3px dashed #0ea5e9; outline-offset: -3px; background: rgba(14,165,233,0.08); }
    .im-gutter { position: absolute; pointer-events: auto; z-index: 2; }
    .im-gutter.v { width: 8px; cursor: col-resize; }
    .im-gutter.h { height: 8px; cursor: row-resize; }
    .im-gutter:hover, .an-paper.dragging .im-gutter { background: rgba(14,165,233,0.35); border-radius: 3px; }
    .im-capghost { position: absolute; width: 100px; height: 18px; pointer-events: auto; font: 600 10.5px var(--font-ui); color: #2357A7; background: rgba(255,255,255,0.92); border: 1px dashed rgba(35,87,167,0.45); border-radius: 9px; cursor: pointer; }
    .im-capghost:hover { background: #fff; border-style: solid; }
    .im-draw { position: absolute; border: 2px dashed #dc2626; pointer-events: none; box-sizing: border-box; }
    .im-empty { font-size: 12px; }

    /* ━━━ Preview Overlay ━━━ */
    .pv-page, .pv-page * { letter-spacing: 0 !important; word-spacing: 0 !important; text-transform: none !important; }
    .preview-overlay {

    .preview-nav-btn {

    .pdf-render-stage {

    .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
    .tool-row label { display: inline-flex; align-items: center; gap: 6px; }
    .tool-input, .tool-select { background: rgba(0,0,0,0.28); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.16); border-radius: 4px; padding: 3px 6px; font-size: 12px; font-family: var(--font-ui); }
    .tool-input[type="number"] { width: 64px; text-align: center; }
    .tool-select option { background: #0f172a; }
    .tool-table-wrap { max-height: 46vh; overflow: auto; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; }
    .tool-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tool-table th { position: sticky; top: 0; z-index: 1; background: #16233d; color: rgba(226,232,240,0.7); font-weight: 600; font-size: 11px; text-align: left; padding: 6px 8px; white-space: nowrap; }
    .tool-table td { padding: 4px 8px; border-top: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
    .tool-table td.num { font-family: var(--font-mono); text-align: right; }
    .tool-table tr.is-off td { opacity: 0.45; }
    .tool-ok { color: #86efac; } .tool-warn { color: #fcd34d; } .tool-bad { color: #fca5a5; } .tool-muted { color: rgba(226,232,240,0.45); }
    .tool-drop { border: 2px dashed rgba(56,189,248,0.35); border-radius: 10px; padding: 34px 20px; text-align: center; color: rgba(226,232,240,0.78); transition: background 0.12s, border-color 0.12s; }
    .tool-drop.dragover { background: rgba(56,189,248,0.10); border-color: #38bdf8; }
    .tool-drop .tool-drop-icon { font-size: 30px; opacity: 0.6; display: block; margin-bottom: 6px; }
    .tool-chip { display: inline-block; font-size: 11px; padding: 1px 8px; margin: 2px 4px 2px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); color: rgba(226,232,240,0.75); }
    .tool-choice { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; cursor: pointer; margin-bottom: 6px; }
    .tool-choice:has(input:checked) { border-color: rgba(56,189,248,0.6); background: rgba(56,189,248,0.08); }
    .tool-choice input { margin-top: 3px; accent-color: #38bdf8; }
    .tool-choice b { display: block; font-size: 12.5px; color: #f1f5f9; }
    .tool-choice span { font-size: 11.5px; color: rgba(226,232,240,0.62); }

    /* New-report modal: starting content */
    .hp-modal.hp-modal-wide { width: 480px; max-width: calc(100vw - 32px); }
    .hp-modal-wide .hp-modal-body { max-height: calc(100vh - 150px); overflow-y: auto; }
    .hp-modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hp-modal-field label.hp-start-choice, .hp-start-tpl label { text-transform: none; letter-spacing: 0; font-weight: 400; }
    .hp-start-choice { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.10); cursor: pointer; transition: background var(--transition-fast); }
    .hp-start-choice:has(input:checked) { border-color: rgba(91,163,230,0.55); background: rgba(91,163,230,0.10); }
    .hp-start-choice input { margin-top: 3px; accent-color: var(--d-300); }
    .hp-start-choice b { display: block; font-size: 12.5px; color: #f1f5f9; font-weight: 600; }
    .hp-start-choice span { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.5; }
    .hp-start-tpl { display: none; flex-direction: column; gap: 6px; margin: 2px 0 0 26px; }
    .hp-start-tpl.open { display: flex; }
    .hp-start-tpl select { padding: 7px 10px; font-size: 12.5px; color: #e2e8f0; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); }
    .hp-start-tpl select option { background: var(--d-800); }
    .hp-start-tpl label { font-size: 11.5px; color: rgba(255,255,255,0.65); display: flex; align-items: center; gap: 6px; }

    /* Homepage search / filter / sort */
    .hp-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 4px 0 16px; }
    .hp-search { width: 280px; max-width: 100%; padding: 7px 12px; font-size: 13px; font-family: var(--font-ui); color: #e2e8f0; background: rgba(255,255,255,0.04); border: 1px solid rgba(91,163,230,0.18); outline: none; }
    .hp-search:focus { border-color: rgba(91,163,230,0.5); }
    .hp-stage-filter { display: flex; gap: 4px; flex-wrap: wrap; }
    .hp-stage-btn { font-size: 11px; font-family: var(--font-mono); padding: 4px 10px; color: var(--d-300); background: transparent; border: 1px solid rgba(91,163,230,0.2); cursor: pointer; }
    .hp-stage-btn.active { background: rgba(91,163,230,0.22); color: #fff; border-color: rgba(91,163,230,0.5); }
    .hp-sort { font-size: 12px; padding: 5px 8px; color: #e2e8f0; background: rgba(255,255,255,0.04); border: 1px solid rgba(91,163,230,0.18); }
    .hp-sort option { background: var(--d-800); }
    .hp-count { font-size: 11px; color: var(--text-placeholder); margin-left: auto; }
    .hp-result { display: inline-block; font-size: 10px; font-weight: 700; font-family: var(--font-mono); padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); color: var(--d-300); }
    .hp-result-fail { color: #fca5a5; background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.4); }
    .hp-result-warning { color: #fcd34d; background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4); }
    .hp-result-pass { color: #86efac; background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.35); }
    .hp-conflict { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; color: #fdba74; background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.4); }
    .hp-card-pages { font-size: 11px; color: var(--text-placeholder); }
    .hp-no-match { color: var(--text-secondary); font-size: 13px; padding: 30px 0; }

    /* Data page: summary bar + quick actions */
    .dt-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 8px; padding: 7px 10px; font-size: 11px; color: #334155; background: #F3F6FA; border: 1px solid rgba(15,23,42,0.08); border-radius: 6px; }
    .dt-sum-chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; padding: 1px 8px; border-radius: 10px; border: 1px solid rgba(15,23,42,0.12); background: #fff; color: #334155; font-size: 11px; font-family: var(--font-ui); }
    button.dt-sum-chip { cursor: pointer; }
    button.dt-sum-chip:hover { border-color: rgba(35,87,167,0.5); }
    .dt-sum-fail { color: #b91c1c; border-color: rgba(220,38,38,0.35); background: #fef2f2; }
    .dt-sum-warn { color: #92400e; border-color: rgba(217,119,6,0.35); background: #fffbeb; }
    .dt-sum-pass { color: #166534; border-color: rgba(22,163,74,0.3); background: #f0fdf4; }
    .dt-sum-sep { width: 1px; height: 14px; background: rgba(15,23,42,0.12); }
    .dt-sum-item { color: #475569; }
    .dt-sum-item b { color: #0B3D7A; }
    .dt-sum-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
    .dt-sum-log { flex-basis: 100%; font-size: 10.5px; color: #64748b; }
    .dt-sum-act { margin-left: auto; font-size: 11px; font-family: var(--font-ui); color: #2357A7; background: rgba(35,87,167,0.07); border: 1px solid rgba(35,87,167,0.25); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
    .dt-sum-act:hover { background: rgba(35,87,167,0.14); }
    tr.dt-row-flash td { animation: dtFlash 1.4s ease-out; }
    @keyframes dtFlash { 0%, 30% { background: rgba(250,204,21,0.45); } 100% { background: transparent; } }
    .dt-summary:empty { display: none; }
    /* Comparison page */
    .cmp-page { width: 100%; height: 100%; padding: 2.4% 2.8% 1.9%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; color: var(--text-on-white); font-family: var(--font-ui); }
    .cmp-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .cmp-title { flex: 1; min-width: 260px; font-family: var(--font-heading); font-size: 14px; font-weight: 700; color: #0B3D7A; border: none; border-bottom: 1px dashed rgba(15,23,42,0.2); padding: 4px 2px; background: transparent; outline: none; }
    .cmp-ctl { font-size: 11px; font-weight: 600; color: #0B3D7A; display: inline-flex; align-items: center; gap: 6px; }
    .tool-select-light { font-size: 11px; padding: 3px 6px; border: 1px solid rgba(15,23,42,0.2); border-radius: 4px; background: #fff; color: #0B3D7A; max-width: 360px; }
    .cmp-series { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; background: #F3F6FA; border: 1px solid rgba(15,23,42,0.08); border-radius: 6px; }
    .cmp-series-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cmp-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: rgba(35,87,167,0.1); color: #2357A7; min-width: 44px; text-align: center; }
    .cmp-tag.base { background: #0B3D7A; color: #fff; }
    .cmp-label { font-size: 11px; padding: 3px 6px; border: 1px solid rgba(15,23,42,0.15); border-radius: 4px; width: 200px; }
    .cmp-btn { font-size: 11px; width: 24px; height: 22px; border: 1px solid rgba(15,23,42,0.15); border-radius: 4px; background: #fff; color: #334155; cursor: pointer; }
    .cmp-btn:disabled { opacity: 0.35; cursor: default; }
    .cmp-warn { font-size: 10.5px; font-weight: 600; color: #b45309; }
    .cmp-empty { font-size: 11.5px; color: #64748b; }
    .cmp-note { font-size: 10px; color: #64748b; line-height: 1.6; }
    .cmp-summary { font-size: 12px; color: #1e293b; line-height: 1.7; }
    .toc-editor-bar { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: rgba(243,246,250,0.96); border: 1px solid rgba(15,23,42,0.12); border-radius: 6px; font-size: 11px; color: #475569; white-space: nowrap; }
    .toc-editor-bar input { font-size: 12px; padding: 3px 8px; border: 1px solid rgba(15,23,42,0.2); border-radius: 4px; width: 220px; }
    .note-tool-btn.note-to-image { width: auto; padding: 0 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .sim-chart-box { margin-top: 4px; }
    .sim-chart-toggle { font-size: 11px; color: #475569; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .sim-chart-img { display: block; width: 100%; max-width: 786px; height: auto; margin-top: 6px; border: 1px solid rgba(15,23,42,0.08); border-radius: 4px; }
    select.dt-sort-select { width: auto; cursor: pointer; }
    /* Annotation: measured-temperature overlay */
    .data-page.csv-dragover { outline: 3px dashed rgba(35,87,167,0.45); outline-offset: -6px; }

    /* Small action buttons inside page section titles */
    .sec-tool-btn { margin-left: 10px; font-size: 10.5px; font-weight: 600; font-family: var(--font-ui); letter-spacing: 0; text-transform: none; color: #2357A7; background: rgba(35,87,167,0.07); border: 1px solid rgba(35,87,167,0.25); border-radius: 4px; padding: 1px 9px; cursor: pointer; vertical-align: middle; }
    .sec-tool-btn:hover { background: rgba(35,87,167,0.15); }

    /* Export picker: report check + SharePoint upload */
    .exp-check { margin: 8px 14px 0; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; overflow: hidden; }
    .exp-check-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.04); cursor: pointer; user-select: none; }
    .exp-check-head.ok { color: #86efac; }
    .exp-check-head.warn { color: #fcd34d; }
    .exp-check-head .exp-check-toggle { margin-left: auto; font-size: 10px; color: rgba(226,232,240,0.5); }
    .exp-check-list { max-height: 28vh; overflow-y: auto; display: none; }
    .exp-check.open .exp-check-list { display: block; }
    .exp-check-item { display: flex; gap: 8px; width: 100%; text-align: left; padding: 6px 10px; font-size: 12px; color: #e2e8f0; background: transparent; border: none; border-top: 1px solid rgba(255,255,255,0.06); cursor: pointer; font-family: var(--font-ui); }
    .exp-check-item:hover { background: rgba(56,189,248,0.10); }
    .exp-check-item .lv { flex-shrink: 0; width: 16px; }
    .exp-check-item .pg { flex-shrink: 0; min-width: 92px; color: rgba(226,232,240,0.55); font-size: 11px; }
    .exp-sp { margin-right: auto; font-size: 11.5px; color: rgba(226,232,240,0.8); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .exp-sp input { accent-color: #38bdf8; }
    .toast a { color: #2357A7; font-weight: 600; }

    /* New version online → save, then reload */
    .update-backdrop { position: fixed; inset: 0; z-index: 9500; background: rgba(2,10,24,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; }
    .update-box { width: 420px; max-width: calc(100vw - 32px); background: #0f172a; color: #e2e8f0; border: 1px solid rgba(56,189,248,0.35); border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.5); padding: 18px 20px 16px; font-size: 13px; line-height: 1.7; }
    .update-box h3 { margin: 0 0 4px; font-size: 15px; color: #f1f5f9; }
    .update-box .update-ver { font-family: var(--font-mono); font-size: 11px; color: rgba(226,232,240,0.55); margin-bottom: 8px; }
    .update-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
    .update-banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 9500; display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 12.5px; color: #0f172a; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }

    #toast-wrap { position: fixed; right: 18px; bottom: 18px; z-index: 4000; display: flex; flex-direction: column; gap: 8px; max-width: 420px; pointer-events: none; }
    .toast { pointer-events: auto; font-size: 12.5px; line-height: 1.55; color: #0f172a; background: #fff; border-left: 4px solid #3A7AD4; border-radius: 6px; padding: 9px 30px 9px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); position: relative; animation: toastIn 0.18s ease-out; }
    .toast.ok { border-left-color: #22c55e; }
    .toast.warn { border-left-color: #f59e0b; }
    .toast.err { border-left-color: #ef4444; }
    .toast-x { position: absolute; top: 4px; right: 6px; border: none; background: transparent; color: #64748b; cursor: pointer; font-size: 13px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <!-- ━━━ Report Homepage ━━━ -->
  <div class="homepage" id="homepage">
    <div class="hp-header">
      <div class="hp-brand">
        <img id="hp-logo-img" alt="Delta">
        <div class="hp-brand-divider"></div>
        <div class="hp-brand-text">
          <span class="hp-brand-name">DELTA</span>
          <span class="hp-brand-sub">THERMAL TEST REPORT</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="hp-db-status-text"
          style="font-size:12px; color:#aaa; vertical-align:middle;">
          未選擇資料庫
        </span>
        <button onclick="handlePickDb()"
          style="font-size:12px; padding:4px 12px; border-radius:4px;
                 border:1px solid #555; background:transparent;
                 color:#ccc; cursor:pointer;">
          📂 資料庫路徑
        </button>
        <button onclick="dbAdapter.exportBackup()"
          style="font-size:12px; padding:4px 12px; border-radius:4px;
                 border:1px solid #555; background:transparent;
                 color:#ccc; cursor:pointer;">
          💾 備份資料庫
        </button>
        <button class="sp-chip" data-sp-chip onclick="handleSpChip(this)" title="SharePoint 雙重存檔">☁ SharePoint：未連線</button>
        <button id="hp-btn-backup-dir" onclick="handlePickBackupDir()"
          title="設定自動備份資料夾（每日自動備份、保留最近 30 份）"
          style="font-size:12px; padding:4px 12px; border-radius:4px;
                 border:1px solid #555; background:transparent;
                 color:#ccc; cursor:pointer;">
          🗂 自動備份：未設定
        </button>
        <button class="hp-new-btn" id="hp-new-report">+ 新增報告</button>
      </div>
    </div>
    <div class="hp-body" id="hp-body">
      <div class="hp-tools" id="hp-tools" style="display:none;">
        <input type="search" class="hp-search" id="hp-search" placeholder="搜尋案名 / 型號…（按 / 快速搜尋）" autocomplete="off">
        <div class="hp-stage-filter" id="hp-stage-filter"></div>
        <select class="hp-sort" id="hp-sort" title="排序">
          <option value="updated">最近編輯</option>
          <option value="created">建立日期</option>
          <option value="name">案名</option>
        </select>
        <span class="hp-count" id="hp-count"></span>
      </div>
      <div class="hp-empty" id="hp-empty">
        <div class="icon">📋</div>
        <div class="text">尚無報告，點擊右上方「+ 新增報告」開始</div>
      </div>
      <div class="hp-grid" id="hp-grid"></div>
    </div>
  </div>

  <div class="app" id="editor-app" style="display:none;">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <button class="glass-btn" id="btn-back-home" title="回到報告列表" style="margin-right:8px;padding:4px 10px;font-size:12px;">◀ 報告列表</button>
        <img class="toolbar-logo" id="toolbar-logo-img" alt="Delta">
        <div class="toolbar-divider"></div>
        <div class="toolbar-brand">
          <span class="toolbar-brand-name">DELTA</span>
          <span class="toolbar-brand-sub">THERMAL TEST REPORT</span>
        </div>
      </div>
      <div class="toolbar-center">
        <div class="dropdown-wrap">
          <button class="glass-btn" id="toolbar-add-btn">+ 新增頁面 ▾</button>
          <div class="dropdown-menu" id="toolbar-add-menu">
            <button class="dropdown-item" data-type="cover">🏠 封面頁</button>
            <button class="dropdown-item" data-type="image">🖼 圖片頁</button>
            <button class="dropdown-item" data-type="image-batch" title="一次選多張圖片，自動建立多頁圖片頁">🖼 批次圖片頁…</button>
            <button class="dropdown-item" data-type="annotation">📍 標註頁</button>
            <button class="dropdown-item" data-type="data">📊 數據頁</button>
            <button class="dropdown-item" data-type="sim_vs_meas">📉 比對頁</button>
            <button class="dropdown-item" data-type="conclusion">📝 結論頁</button>
            <button class="dropdown-item" data-type="compare" title="比較本報告不同測試條件，或其他報告（例如上一個 Stage）的元件溫度">⚖ 比較頁</button>
            <button class="dropdown-item" data-type="toc" title="自動列出各頁與頁碼，插在封面後">📑 目錄頁</button>
            <button class="dropdown-item" data-type="note">🗒 備註頁（不匯出）</button>
          </div>
        </div>
        <button class="glass-btn" id="btn-undo" title="復原 (Ctrl+Z)" disabled>↩ 復原</button>
        <button class="glass-btn" id="btn-redo" title="取消復原 (Ctrl+Shift+Z)" disabled>↪ 重做</button>
        <button class="glass-btn" id="btn-preview">預覽</button>
        <button class="glass-btn" id="btn-export-pdf">匯出 PDF</button>
      </div>
      <div class="toolbar-right" id="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text" title="修改後約 1 秒自動存檔；Ctrl+S 立即存檔並同步 SharePoint">就緒</span>
        <span id="db-status-text"
          style="font-size:12px; color:#aaa; margin-right:8px; vertical-align:middle;">
          未選擇資料庫
        </span>
        <button onclick="handlePickDb()"
          style="font-size:12px; padding:4px 12px; border-radius:4px;
                 border:1px solid #555; background:transparent;
                 color:#ccc; cursor:pointer; margin-right:4px;">
          📂 資料庫路徑
        </button>
        <button onclick="dbAdapter.exportBackup()"
          style="font-size:12px; padding:4px 12px; border-radius:4px;
                 border:1px solid #555; background:transparent;
                 color:#ccc; cursor:pointer;">
          💾 備份資料庫
        </button>
        <button class="sp-chip" data-sp-chip onclick="handleSpChip(this)" title="SharePoint 雙重存檔" style="margin-right:4px;">☁ SharePoint：未連線</button>
        <button id="btn-backup-dir" onclick="handlePickBackupDir()"
          title="設定自動備份資料夾（每日自動備份、保留最近 30 份）"
          style="font-size:12px; padding:4px 12px; border-radius:4px;
                 border:1px solid #555; background:transparent;
                 color:#ccc; cursor:pointer;">

  <script>
    // ━━━ App State ━━━
    const state = {
      reportId: null,
      pages: [],          // [{id, type, order, data}]
      activePage: null,   // index into pages[]
      timLibrary: { grease: [], pad: [], putty: [] },
    };

    // Unique page id, persisted with the page so undo stacks and cross-page
    // references (比對頁 / 結論頁 → 數據頁) survive reloads, reorders and copies.
    function newPageId() {
      return 'pg_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }
    // Stable id for a component row on a data page (rename/reorder-safe links).
    function newCompUid() {
      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }
    // Today's LOCAL calendar date (YYYY-MM-DD). toISOString() is UTC and gives
    // yesterday's date before 08:00 in Taiwan.
    function todayStr() { return localDateStr(); }

    // ━━━ Undo / Redo ━━━
    const UNDO_MAX = 40;
    let undoStacks = {};   // pageId → [ JSON snapshots ]
    let redoStacks = {};   // pageId → [ JSON snapshots ]

    function performUndo() {
      if (state.activePage === null) return;
      const page = state.pages[state.activePage];
      if (!page) return;
      const id = page.id;
      const stack = undoStacks[id];
      if (!stack || stack.length === 0) return;
      if (!redoStacks[id]) redoStacks[id] = [];
      redoStacks[id].push(JSON.stringify(page.data));
      page.data = JSON.parse(stack.pop());
      lastSavedSnapshots[id] = JSON.stringify(page.data);
      renderCanvas();
      scheduleSave(state.activePage, { undo: false });
      updateUndoRedoButtons();
    }

    function performRedo() {
      if (state.activePage === null) return;
      const page = state.pages[state.activePage];
      if (!page) return;
      const id = page.id;
      const stack = redoStacks[id];
      if (!stack || stack.length === 0) return;
      if (!undoStacks[id]) undoStacks[id] = [];
      undoStacks[id].push(JSON.stringify(page.data));
      page.data = JSON.parse(stack.pop());
      lastSavedSnapshots[id] = JSON.stringify(page.data);
      renderCanvas();
      scheduleSave(state.activePage, { undo: false });
      updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
      const btnUndo = document.getElementById('btn-undo');
      const btnRedo = document.getElementById('btn-redo');
      if (!btnUndo || !btnRedo) return;
      if (state.activePage === null) {
        btnUndo.disabled = true;
        btnRedo.disabled = true;
        return;
      }
      const id = state.pages[state.activePage]?.id;
      btnUndo.disabled = !(undoStacks[id]?.length > 0);
      btnRedo.disabled = !(redoStacks[id]?.length > 0);
    }

    // ━━━ DOM refs ━━━
    const $pageList = document.getElementById('page-list');
    const $canvas = document.getElementById('editor-canvas');
    const $placeholder = document.getElementById('canvas-placeholder');
    const $statusDot = document.getElementById('status-dot');
    const $statusText = document.getElementById('status-text');
    const $contextMenu = document.getElementById('context-menu');
    const $btnPrev = document.getElementById('btn-prev-page');
    const $btnNext = document.getElementById('btn-next-page');

    // ━━━ Page list: drag its edge to resize, «/» to collapse it into a rail of page
    // numbers (still clickable; Fail / Warning show as dots). Per user, in this browser;
    // expanded by default. Double-click the edge = default width; dragging it all the
    // way left collapses.
    const SIDEBAR_W = { def: 152, min: 120, max: 520 };
    const $sidebar = document.getElementById('sidebar');
    const $sbResizer = document.getElementById('sidebar-resizer');
    const sidebarMaxW = () => Math.max(SIDEBAR_W.min, Math.min(SIDEBAR_W.max, Math.round(window.innerWidth * 0.45)));
    const sidebarClampW = (w) => Math.max(SIDEBAR_W.min, Math.min(sidebarMaxW(), Math.round(w)));
    function setSidebarWidth(w) {
      const v = sidebarClampW(w);
      $sidebar.style.width = v + 'px';
      $sbResizer.setAttribute('aria-valuenow', String(v));
      $sbResizer.setAttribute('aria-valuemin', String(SIDEBAR_W.min));
      $sbResizer.setAttribute('aria-valuemax', String(sidebarMaxW()));
      return v;
    }
    const sidebarSavedW = () => +userPrefs().sidebar_w || SIDEBAR_W.def;
    function setSidebarCollapsed(on, save = true) {
      $sidebar.classList.toggle('collapsed', on);
      if (!on) setSidebarWidth(sidebarSavedW());
      const t = document.getElementById('sidebar-toggle');
      const tip = on ? '展開頁面列表' : '收合頁面列表';
      t.title = tip; t.setAttribute('aria-label', tip); t.setAttribute('aria-expanded', String(!on));
      if (save) setUserPref('sidebar_collapsed', on);
    }
    function applySidebarPrefs() {
      setSidebarWidth(sidebarSavedW());
      setSidebarCollapsed(!!userPrefs().sidebar_collapsed, false);
    }
    document.getElementById('sidebar-toggle').addEventListener('click', () => setSidebarCollapsed(!$sidebar.classList.contains('collapsed')));
    $sbResizer.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || $sidebar.classList.contains('collapsed')) return;
      e.preventDefault();
      const x0 = e.clientX, w0 = $sidebar.getBoundingClientRect().width;
      const collapseAt = SIDEBAR_W.min - 50;                 // dragged this far past the minimum → collapse
      try { $sbResizer.setPointerCapture(e.pointerId); } catch (_) {}
      $sbResizer.classList.add('dragging');
      document.body.classList.add('sidebar-resizing');
      const move = (ev) => {
        const raw = w0 + ev.clientX - x0;
        setSidebarWidth(raw);
        $sidebar.classList.toggle('will-collapse', raw < collapseAt);
      };
      const up = (ev) => {
        $sbResizer.removeEventListener('pointermove', move);
        $sbResizer.removeEventListener('pointerup', up);
        $sbResizer.removeEventListener('pointercancel', up);
        $sbResizer.classList.remove('dragging');
        document.body.classList.remove('sidebar-resizing');
        $sidebar.classList.remove('will-collapse');
        const raw = w0 + ev.clientX - x0;
        if (ev.type === 'pointerup' && raw < collapseAt) setSidebarCollapsed(true);   // the width to come back to is kept
        else setUserPref('sidebar_w', setSidebarWidth(raw));
      };
      $sbResizer.addEventListener('pointermove', move);
      $sbResizer.addEventListener('pointerup', up);
      $sbResizer.addEventListener('pointercancel', up);
    });
    $sbResizer.addEventListener('dblclick', () => { setUserPref('sidebar_w', setSidebarWidth(SIDEBAR_W.def)); });
    $sbResizer.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 48 : 16, cur = $sidebar.getBoundingClientRect().width;
      let w = null;
      if (e.key === 'ArrowLeft') w = cur - step;
      else if (e.key === 'ArrowRight') w = cur + step;
      else if (e.key === 'Home') w = SIDEBAR_W.min;
      else if (e.key === 'End') w = sidebarMaxW();
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSidebarCollapsed(true); document.getElementById('sidebar-toggle').focus(); return; }
      if (w === null) return;
      e.preventDefault();
      setUserPref('sidebar_w', setSidebarWidth(w));
    });
    window.addEventListener('resize', () => { if (!$sidebar.classList.contains('collapsed')) setSidebarWidth(sidebarSavedW()); });
    document.addEventListener('DOMContentLoaded', applySidebarPrefs);   // prefs helpers are defined further down

    // ━━━ Page nav buttons ━━━
    function updatePageNavButtons() {
      const idx = state.activePage;
      const total = state.pages.length;
      $btnPrev.disabled = (idx === null || idx <= 0);
      $btnNext.disabled = (idx === null || idx >= total - 1);
      $btnPrev.style.display = (total > 0) ? '' : 'none';
      $btnNext.style.display = (total > 0) ? '' : 'none';
    }

    $btnPrev.addEventListener('click', () => {
      if (state.activePage > 0) selectPage(state.activePage - 1);
    });
    $btnNext.addEventListener('click', () => {
      if (state.activePage < state.pages.length - 1) selectPage(state.activePage + 1);
    });
    // Hide initially until pages load
    $btnPrev.style.display = 'none';
    $btnNext.style.display = 'none';

    // ━━━ Status helpers ━━━
    function setStatus(type, text) {
      $statusDot.className = 'status-dot' + (type === 'saving' ? ' saving' : type === 'offline' ? ' offline' : '');
      $statusText.textContent = text;
    }

    // ━━━ Persistence ━━━
    // Report meta (list card fields) derived from the cover page; written in the
    // same coalesced file write as the page itself.
    function buildReportMeta() {
      const meta = { updated_at: new Date().toISOString() };
      const coverPage = state.pages.find(p => p.type === 'cover');
      if (coverPage) {
        meta.project_name = coverPage.data.project_name || '';
        meta.model = coverPage.data.model || '';
        meta.stage = coverPage.data.stage || '';
        meta.date = coverPage.data.date || '';
      }
      return meta;
    }

    function pageRecord(page) {
      return { id: page.id, type: page.type, order: page.order, data: page.data, updated_at: new Date().toISOString() };
    }

    function handleSaveError(err) {
      console.error('Save error:', err);
      const code = err && err.code;
      if (code === 'DB_CONFLICT') {
        setStatus('offline', '未儲存：資料庫檔案已被外部修改 ⚠️（點此處理）');
        showDbConflictDialog(false);
      } else if (code === 'DB_NO_REPORT') {
        setStatus('offline', '未儲存：報告不在目前資料庫 ❌');
      } else if (code === 'DB_NOT_READY') {
        setStatus('offline', '未儲存：尚未開啟資料庫 ❌');
      } else {
        setStatus('offline', '儲存失敗 ❌');
      }
    }

    // Save status sequencing: a save that started earlier and finishes later
    // must not paint "已儲存" over the error of a save that started after it.
    let _saveSeq = 0, _lastFailSeq = -1;
    function beginSave() { setStatus('saving', '儲存中...'); return ++_saveSeq; }
    function endSaveOk(seq) { if (seq > _lastFailSeq) setStatus('saved', '已儲存'); }
    function endSaveErr(seq, err) { _lastFailSeq = Math.max(_lastFailSeq, seq); handleSaveError(err); }

    async function savePageToFirestore(page, reportId) {
      const seq = beginSave();
      try {
        await Promise.all([
          dbAdapter.setPage(reportId, page.order, pageRecord(page)),
          dbAdapter.updateReportMeta(reportId, buildReportMeta()),
        ]);
        endSaveOk(seq);
      } catch (err) {
        endSaveErr(seq, err);
      }
    }

    // ━━━ Debounced auto-save ━━━
    // Timers are keyed by page id and bound to the page object + report at
    // schedule time, so a reorder, delete or report switch can never redirect a
    // pending save to the wrong page/report.
    let saveTimers = {};          // pageId → { timer, page, reportId }
    let lastSavedSnapshots = {};  // pageId → JSON of the last committed state (undo baseline)
    let _structureSave = null;    // in-flight whole-page-list write

    function scheduleSave(pageIndex, opts = {}) {
      const page = state.pages[pageIndex];
      if (!page) return;
      const id = page.id;
      if (opts.undo !== false && !saveTimers[id] && lastSavedSnapshots[id] !== undefined) {
        const snap = lastSavedSnapshots[id];
        if (snap !== JSON.stringify(page.data)) {
          if (!undoStacks[id]) undoStacks[id] = [];
          undoStacks[id].push(snap);
          if (undoStacks[id].length > UNDO_MAX) undoStacks[id].shift();
          redoStacks[id] = [];
          updateUndoRedoButtons();
        }
      }
      if (saveTimers[id]) clearTimeout(saveTimers[id].timer);
      saveTimers[id] = { page, reportId: state.reportId, timer: setTimeout(() => runPageSave(id), 1000) };
      schedulePageBadgeRefresh();
    }

    function runPageSave(id) {
      const entry = saveTimers[id];
      if (!entry) return Promise.resolve();
      clearTimeout(entry.timer);
      delete saveTimers[id];
      const { page, reportId } = entry;
      // Page deleted / report already closed → nothing to write (a structural
      // save or flush has already persisted the surviving pages).
      if (reportId !== state.reportId || !state.pages.includes(page)) return Promise.resolve();
      lastSavedSnapshots[id] = JSON.stringify(page.data);
      return savePageToFirestore(page, reportId);
    }

    // Persist the whole page list in ONE atomic write after a structural change
    // (delete / duplicate / reorder / gap healing). Pending per-page saves are
    // folded into it, and no undo entries are created.
    function saveStructure() {
      if (!state.reportId) return Promise.resolve();
      state.pages.forEach((p, i) => { p.order = i; });
      Object.keys(saveTimers).forEach(id => {
        clearTimeout(saveTimers[id].timer);
        const pg = saveTimers[id].page;
        if (state.pages.includes(pg)) lastSavedSnapshots[id] = JSON.stringify(pg.data);
        delete saveTimers[id];
      });
      const reportId = state.reportId;
      const seq = beginSave();
      const p = Promise.all([
        dbAdapter.setAllPages(reportId, state.pages.map(pageRecord)),
        dbAdapter.updateReportMeta(reportId, buildReportMeta()),
      ])
        .then(() => endSaveOk(seq))
        .catch(err => endSaveErr(seq, err))
        .finally(() => { if (_structureSave === p) _structureSave = null; });
      _structureSave = p;
      return p;
    }

    // True if a save attempt that started after `seq` (from currentSaveSeq()) failed.
    function currentSaveSeq() { return _saveSeq; }
    function saveFailedSince(seq) { return _lastFailSeq > seq; }

    // Write every pending save now and wait for the file write to finish.
    // Used before leaving a report, switching database, and on tab close.
    async function flushAllSaves() {
      await Promise.all([...Object.keys(saveTimers).map(runPageSave), flushTimSave()]);
      if (_structureSave) await _structureSave;
      await dbAdapter.flush();
    }
    function hasPendingSaves() {
      return Object.keys(saveTimers).length > 0 || !!_structureSave || !!_timSaveTimer;
    }

    // The TIM library is a database-wide record; typing in its fields is
    // debounced into one write instead of a full-file write per keystroke.
    let _timSaveTimer = null;
    function scheduleTimSave() {
      if (_timSaveTimer) clearTimeout(_timSaveTimer);
      _timSaveTimer = setTimeout(flushTimSave, 600);
    }
    async function flushTimSave() {
      if (!_timSaveTimer) return;
      clearTimeout(_timSaveTimer);
      _timSaveTimer = null;
      const seq = beginSave();
      try { await dbAdapter.setTimLibrary(state.timLibrary); endSaveOk(seq); }
      catch (err) { endSaveErr(seq, err); }
    }

    // Forget everything tied to the previously open report (undo history,
    // timers, selections). Call only after flushAllSaves().
    // Drop pending saves without writing them (used when the user chooses to
    // reload the database file and discard this window's unsaved edits).
    function discardPendingSaves() {
      Object.values(saveTimers).forEach(e => clearTimeout(e.timer));
      saveTimers = {};
      if (_timSaveTimer) { clearTimeout(_timSaveTimer); _timSaveTimer = null; }
    }

    function resetEditorSession() {
      Object.values(saveTimers).forEach(e => clearTimeout(e.timer));
      saveTimers = {};
      undoStacks = {};
      redoStacks = {};
      lastSavedSnapshots = {};
      dtSelectionRange = null;
      annoResetUI(null);
      contextTarget = null;
    }

    function initPageSnapshot(page) {
      if (page) lastSavedSnapshots[page.id] = JSON.stringify(page.data);
    }

    // ━━━ Image handling (base64 / Storage) ━━━
    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 本機模式已移除圖片大小限制，直接使用原始 base64
    async function processImage(file) {
      return await fileToDataURL(file);
    }

    // Quality used when re-encoding inserted photos (annotation & image pages).
    const PHOTO_JPEG_QUALITY = 0.5;

    // Re-encode an inserted photo as JPEG at the given quality to shrink the
    // stored base64. Keeps the original pixel dimensions — only quality drops.
    // Falls back to the untouched original if decoding/encoding fails.
    function processImageCompressed(file, quality) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onerror = () => resolve('');
        reader.onload = () => {
          const original = reader.result;
          const img = new Image();
          img.onerror = () => resolve(original);
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth || img.width;
              canvas.height = img.naturalHeight || img.height;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';                    // JPEG has no alpha → white behind any transparency
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0);
              const out = canvas.toDataURL('image/jpeg', quality);
              // Guard: if somehow larger than the original, keep the original.
              resolve(out && out.length < original.length ? out : original);
            } catch (err) {
              resolve(original);
            }
          };
          img.src = original;
        };
        reader.readAsDataURL(file);
      });
    }

    // ━━━ Dropdown logic ━━━
    function setupDropdown(btnId, menuId) {
      const btn = document.getElementById(btnId);
      const menu = document.getElementById(menuId);

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        // Close all other dropdowns
        document.querySelectorAll('.dropdown-menu.open').forEach(m => {
          if (m !== menu) m.classList.remove('open');
        });
        menu.classList.toggle('open');
      });

      menu.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          menu.classList.remove('open');
          const type = item.dataset.type;
          if (type === 'cover') addCoverPage();
          else if (type === 'image') addImagePage();
          else if (type === 'annotation') addAnnotationPage();
          else if (type === 'data') addDataPage();
          else if (type === 'sim_vs_meas') addSimVsMeasPage();
          else if (type === 'conclusion') addConclusionPage();
          else if (type === 'note') addNotePage();
          else if (type === 'image-batch') showBatchImageModal(state.activePage);
          else if (type === 'compare') addPageOfType('compare');
          else if (type === 'toc') addTocPage();
        });
      });
    }

    // Close dropdowns / context menu on outside click
    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
      $contextMenu.classList.remove('open');
    });

    // ━━━ Page management ━━━
    // New page object of a type with its default data (not yet in the report).
    function makePage(type) {
      const page = { id: newPageId(), type, order: state.pages.length, data: {} };
      const today = todayStr();
      if (type === 'cover') {
        const prefs = userPrefs();
        page.data = {
          project_name: '',
          model: '',
          stage: 'DVT',
          tested_by: defaultTestedBy(),
          date: today,
          dept: prefs.dept || '',
          report_version: 'v1.0',
          cover_image: '',
          cover_image_w: 460,
          cover_image_h: 345, // 4:3 橫式
        };
      } else if (type === 'image') {
        page.data = { im_v: 2, title: '', layout: 'auto', split: { c: 50, r: 50 }, images: [], texts: [] };
      } else if (type === 'annotation') {
        page.data = {
          title: '',
          photo_url_or_base64: '',
          markers: [] // { id, x, y, label, label_x, label_y }
        };
      } else if (type === 'data') {
        // Sync stage from cover page if exists
        const coverPage = state.pages.find(p => p.type === 'cover');
        page.data = {
          header: {
            test_date: today,
            stage: coverPage ? coverPage.data.stage : 'DVT',
            sw_version: '',
            waveform_ver: '',
            eq_time_min: '120',
            mounting: 'Pole Mount',
            location: 'Chamber',
          },
          ta_conditions: [25, 55],
          components: [],
          sensors: [],
        };
      } else if (type === 'sim_vs_meas') {
        page.data = {
          title: '',
          sim_image: '',
          meas_image: '',
          sim_note: '',
          items: [],
        };
      } else if (type === 'conclusion') {
        page.data = {
          summary: '',
          compliance: [],
          issues: [''],
          actions: [],
        };
      } else if (type === 'note') {
        page.data = { title: '', blocks: [newNoteBlock()] };
      } else if (type === 'compare') {
        // start with this report's test conditions (data pages), first = baseline
        const dps = state.pages.filter(p => p.type === 'data').slice(0, 4);
        page.data = { title: '', ta: null, sort: 'order', series: dps.map(p => ({ report_id: null, page_id: p.id, label: '' })) };
      } else if (type === 'toc') {
        page.data = { title: '' };
      }
      return page;
    }
    // Append a new page of `type` and select it.
    function addPageOfType(type) {
      const page = makePage(type);
      state.pages.push(page);
      initPageSnapshot(page);
      renderPageList();
      selectPage(state.pages.length - 1);
      scheduleSave(state.pages.length - 1);
      return page;
    }

    function addCoverPage() { return addPageOfType('cover'); }
    function addTocPage() {
      const page = makePage('toc');
      const at = state.pages.findIndex(p => p.type === 'cover') + 1;   // right after the cover (or first)
      state.pages.splice(at, 0, page);
      initPageSnapshot(page);
      saveStructure();
      renderPageList();
      selectPage(at);
      return page;
    }

    // Auto-generated base name for a page (some types carry a running count).
    function pageBaseLabel(idx) {
      const page = state.pages[idx];
      if (!page) return '';
      const t = page.type;
      if (t === 'cover') return '封面頁';
      if (t === 'annotation') return '標註頁';
      if (t === 'sim_vs_meas') return '比對頁';
      if (t === 'conclusion') return '結論頁';
      if (t === 'toc') return '目錄頁';
      if (t === 'image' || t === 'data' || t === 'note' || t === 'compare') {
        let n = 0;
        for (let j = 0; j <= idx; j++) if (state.pages[j].type === t) n++;
        return ({ image: '圖片頁 ', data: '數據頁 ', note: '備註頁 ', compare: '比較頁 ' })[t] + n;
      }
      return '未知頁面';
    }

    // Inline-edit the user note appended after a page's base label.
    function startPageNoteEdit(idx) {
      const page = state.pages[idx];
      if (!page) return;
      const item = $pageList.querySelector(`.page-item[data-index="${idx}"]`);
      const labelEl = item && item.querySelector('.page-label');
      if (!labelEl) return;
      const editBtn = item.querySelector('.page-note-edit');
      if (editBtn) editBtn.style.display = 'none';

      labelEl.innerHTML = '';
      const baseSpan = document.createElement('span');
      baseSpan.className = 'page-base';
      baseSpan.style.flexShrink = '0';
      baseSpan.textContent = pageBaseLabel(idx);
      labelEl.appendChild(baseSpan);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'page-note-input';
      input.value = page.data.list_note || '';
      input.placeholder = '加註，例：-RF';
      input.maxLength = 40;
      labelEl.appendChild(input);
      input.focus();
      input.select();

      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        if (save) {
          page.data.list_note = input.value.trim();
          scheduleSave(idx);
        }
        renderPageList();
      };
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
      // Don't let clicks/drags on the input bubble to select/reorder handlers
      ['click', 'mousedown', 'dblclick'].forEach(ev =>
        input.addEventListener(ev, (e) => e.stopPropagation()));
    }

    function renderPageList() {
      $pageList.innerHTML = '';
      state.pages.forEach((page, idx) => {
        const el = document.createElement('div');
        el.className = 'page-item' + (idx === state.activePage ? ' active' : '');
        el.dataset.index = idx;

        const idxSpan = document.createElement('span');
        idxSpan.style.cssText = 'font-family:var(--font-mono);font-size:9px;color:var(--d-400);width:16px;text-align:right;flex-shrink:0;';
        idxSpan.textContent = String(idx + 1).padStart(2, '0');
        el.appendChild(idxSpan);

        // Label = auto base name + optional user note (page.data.list_note)
        const labelSpan = document.createElement('span');
        labelSpan.className = 'page-label';
        const baseSpan = document.createElement('span');
        baseSpan.className = 'page-base';
        baseSpan.style.flexShrink = '0';
        baseSpan.textContent = pageBaseLabel(idx);
        labelSpan.appendChild(baseSpan);
        const noteSpan = document.createElement('span');
        noteSpan.className = 'page-note';
        noteSpan.textContent = page.data.list_note || '';
        labelSpan.appendChild(noteSpan);
        el.appendChild(labelSpan);
        el.title = `${String(idx + 1).padStart(2, '0')} ${pageBaseLabel(idx)}${page.data.list_note || ''}`;   // full name (truncated label / collapsed list)
        const badge = pageBadgeHTML(page);
        if (badge) el.insertAdjacentHTML('beforeend', badge);

        // Hover pencil to add/edit the note
        const editBtn = document.createElement('button');
        editBtn.className = 'page-note-edit';
        editBtn.title = '編輯標籤文字';
        editBtn.textContent = '✎';
        editBtn.addEventListener('click', (e) => { e.stopPropagation(); startPageNoteEdit(idx); });
        el.appendChild(editBtn);

        el.addEventListener('click', () => selectPage(idx));
        // Double-click the label to edit the note inline
        labelSpan.addEventListener('dblclick', (e) => { e.stopPropagation(); startPageNoteEdit(idx); });
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showContextMenu(e, idx);
        });

        $pageList.appendChild(el);
      });
    }

    function selectPage(idx) {
      state.activePage = idx;
      renderPageList();
      renderCanvas();
      updatePageNavButtons();
      updateUndoRedoButtons();
    }

    // ━━━ Context menu ━━━
    let contextTarget = null;

    function showContextMenu(e, pageIdx) {
      contextTarget = pageIdx;
      const dupClear = document.getElementById('context-dup-clear');
      if (dupClear) dupClear.style.display = state.pages[pageIdx] && state.pages[pageIdx].type === 'data' ? '' : 'none';
      $contextMenu.style.left = e.clientX + 'px';
      $contextMenu.style.top = e.clientY + 'px';
      $contextMenu.classList.add('open');
    }

    document.getElementById('context-delete').addEventListener('click', () => {
      $contextMenu.classList.remove('open');
      if (contextTarget === null) return;
      const delIdx = contextTarget;
      contextTarget = null;
      if (!state.pages[delIdx]) return;

      if (!confirm('確定要刪除此頁面嗎？')) return;

      state.pages.splice(delIdx, 1);
      // Keep the same page selected when an earlier page is removed.
      if (state.activePage !== null) {
        if (delIdx < state.activePage) state.activePage--;
        else if (state.activePage >= state.pages.length) state.activePage = state.pages.length - 1;
      }
      if (state.pages.length === 0) state.activePage = null;

      saveStructure();
      renderPageList();
      renderCanvas();
      updatePageNavButtons();
      updateUndoRedoButtons();
    });

    // ━━━ Duplicate page ━━━
    document.getElementById('context-duplicate').addEventListener('click', () => {
      $contextMenu.classList.remove('open');
      if (contextTarget === null) return;
      const srcIdx = contextTarget;
      contextTarget = null;
      const src = state.pages[srcIdx];
      if (!src) return;

      const copy = {
        id: newPageId(),
        type: src.type,
        order: srcIdx + 1,
        data: JSON.parse(JSON.stringify(src.data)),
      };

      // Insert after source
      state.pages.splice(srcIdx + 1, 0, copy);
      initPageSnapshot(copy);
      saveStructure();
      renderPageList();
      selectPage(srcIdx + 1);
    });

    // Data page → a new test condition: same components / specs / Ta conditions /
    // logger mapping, readings and machine power cleared; the new page's label is
    // opened for editing right away so the condition gets a name.
    document.getElementById('context-dup-clear').addEventListener('click', () => {
      $contextMenu.classList.remove('open');
      if (contextTarget === null) return;
      const srcIdx = contextTarget;
      contextTarget = null;
      const src = state.pages[srcIdx];
      if (!src || src.type !== 'data') return;
      const data = clearDataPageValues(JSON.parse(JSON.stringify(src.data)));
      data.list_note = '';
      const copy = { id: newPageId(), type: 'data', order: srcIdx + 1, data };
      state.pages.splice(srcIdx + 1, 0, copy);
      initPageSnapshot(copy);
      saveStructure();
      renderPageList();
      selectPage(srcIdx + 1);
      startPageNoteEdit(srcIdx + 1);
    });

    // ━━━ Canvas rendering ━━━
    function renderCanvas() {
      $canvas.classList.remove('scrollable-edit');
      $canvas.classList.remove('anno-wide');
      const editorArea = $canvas.closest('.editor-area');
      if (editorArea) editorArea.classList.remove('has-tim-panel');
      const canvasTag = document.getElementById('canvas-tag');
      const timContainer = document.getElementById('tim-panel-container');
      if (timContainer) timContainer.innerHTML = '';
      if (state.activePage === null || state.activePage < 0 || !state.pages[state.activePage]) {
        $canvas.classList.remove('landscape');
        $canvas.innerHTML = '<span class="canvas-placeholder">← 請從左側選擇或新增頁面</span>';
        if (canvasTag) canvasTag.textContent = 'A4 PORTRAIT';
        return;
      }

      const page = state.pages[state.activePage];
      // Switch canvas orientation
      if (page.type === 'image' || page.type === 'annotation' || page.type === 'sim_vs_meas' || page.type === 'data' || page.type === 'conclusion' || page.type === 'compare' || page.type === 'toc') {
        $canvas.classList.add('landscape');
        if (canvasTag) canvasTag.textContent = 'A4 LANDSCAPE';
      } else if (page.type === 'note') {
        // Working scratchpad — not a paper page; grows/scrolls, never exported.
        $canvas.classList.remove('landscape');
        if (canvasTag) canvasTag.textContent = 'NOTES · 不匯出';
      } else {
        $canvas.classList.remove('landscape');
        if (canvasTag) canvasTag.textContent = 'A4 PORTRAIT';
      }

      if (page.type === 'cover') {
        renderCoverPage(page);
      } else if (page.type === 'image') {
        renderImagePage(page);
      } else if (page.type === 'annotation') {
        renderAnnotationPage(page);
      } else if (page.type === 'data') {
        renderDataPage(page);
      } else if (page.type === 'sim_vs_meas') {
        renderSimVsMeasPage(page);
      } else if (page.type === 'conclusion') {
        renderConclusionPage(page);
      } else if (page.type === 'note') {
        renderNotePage(page);
      } else if (page.type === 'compare') {
        renderComparePage(page);
      } else if (page.type === 'toc') {
        renderTocPage(page);
      }
    }

                     <div style="width:24px;height:1px;background:var(--d-200);position:absolute;top:0;left:-12px;"></div>

      // Bind field change events

          // the next new report starts with the same department / engineer
          if (el.dataset.field === 'dept' || el.dataset.field === 'tested_by') setUserPref(el.dataset.field, el.value.trim());

          if (el.dataset.field === 'stage') {
