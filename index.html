      title.addEventListener('keydown', (e) => { if (e.key === 'Enter') title.blur(); });
      fileOne.addEventListener('change', async () => { const f = fileOne.files[0]; if (f) await imReplace(page, +fileOne.dataset.slot, f); fileOne.value = ''; });
      fileMany.addEventListener('change', async () => { const fs = Array.from(fileMany.files); fileMany.value = ''; if (fs.length) await imAddFiles(page, fs, fileMany.dataset.at ? +fileMany.dataset.at : undefined); });

      // drop files onto a slot (replace) / free area (add)
      vp.addEventListener('dragover', (e) => { if (Array.from(e.dataTransfer?.types || []).includes('Files')) { e.preventDefault(); vp.classList.add('dragover'); } });
      vp.addEventListener('dragleave', (e) => { if (e.target === vp) vp.classList.remove('dragover'); });
      vp.addEventListener('drop', async (e) => {
        vp.classList.remove('dragover');
        const fs = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/'));
        if (!fs.length) return;
        e.preventDefault();
        const fr = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-im-frame],[data-im-empty]');
        if (fr && fr.dataset.imFrame != null && fs.length === 1) await imReplace(page, +fr.dataset.imFrame, fs[0]);
        else await imAddFiles(page, fs, fr && fr.dataset.imEmpty != null ? +fr.dataset.imEmpty : undefined);
      });
      vp.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) { e.preventDefault(); annoZoom(page, e.deltaY < 0 ? 1 : -1, { x: e.clientX, y: e.clientY }, imUI); return; }
        // plain wheel over the selected photo zooms that photo
        const fr = e.target.closest && e.target.closest('[data-im-frame]');
        if (!fr || +fr.dataset.imFrame !== imUI.selImg || imUI.mode !== 'select') return;
        const im = d.images[imUI.selImg];
        if (!im || !im.nar) return;
        e.preventDefault();
        const F = imFrame(imSlots(d)[imUI.selImg], im);
        im.z = clampN((im.z || 1) * (e.deltaY < 0 ? 1.1 : 1 / 1.1), 0.2, 8);
        imClampView(im, F);
        imUpdateGeo(page);
        imSave(page);
      }, { passive: false });

      // side panel
      side.addEventListener('click', (e) => {
        const lay = e.target.closest('[data-im-layout]');
        if (lay && !lay.disabled) { d.layout = lay.dataset.imLayout; imSave(page); renderImagePage(page); return; }
        if (e.target.closest('#im-add')) { fileMany.dataset.at = ''; fileMany.click(); return; }
        if (e.target.closest('#im-paste-clip') && photoClip) { if (d.images.length >= IM_MAX) showToast('這頁已放滿 6 張，請新增圖片頁', 'warn'); else imAddFiles(page, [{ clip: photoClip }], imUI.selImg !== null ? imUI.selImg + 1 : d.images.length); return; }
        const del = e.target.closest('[data-im-del]');
        if (del) { imUI.selImg = +del.dataset.imDel; imTool(page, 'delimg'); return; }
        const row = e.target.closest('[data-im-row]');
        if (row && !e.target.closest('input')) imSelect(page, null, +row.dataset.imRow);
      });
      side.addEventListener('focusin', (e) => { const n = e.target.closest('[data-im-capin]'); if (n && imUI.selImg !== +n.dataset.imCapin) imSelect(page, null, +n.dataset.imCapin); });
      side.addEventListener('input', (e) => {
        const n = e.target.closest('[data-im-capin]');
        if (!n) return;
        const im = d.images[+n.dataset.imCapin];
        if (!im) return;
        const hadCap = !!String(im.caption || '').trim();
        im.caption = n.value;
        if (hadCap !== !!String(im.caption || '').trim()) { imRenderSlots(page); imRenderUI(page); }   // frame grows / shrinks
        else { const c = document.querySelector(`[data-im-cap="${n.dataset.imCapin}"]`); if (c) c.textContent = n.value.trim(); }
        imRenderOverlay(page);
        imSave(page);
      });
      side.addEventListener('keydown', (e) => { if (e.target.closest('[data-im-capin]') && e.key === 'Enter') e.target.blur(); });
      imBindSortable(page);

      paper.addEventListener('click', (e) => {
        const pick = e.target.closest('[data-im-pick]');
        if (pick) { fileMany.dataset.at = pick.dataset.imPick; fileMany.click(); return; }
        const ce = e.target.closest('[data-im-capedit]');
        if (ce) imEditCaption(page, +ce.dataset.imCapedit);
      });
      paper.addEventListener('contextmenu', (e) => {
        const t = e.target.closest('[data-im-lbl],[data-im-dot],[data-im-shape]');
        if (!t) return;
        e.preventDefault();
        const id = t.dataset.imLbl || t.dataset.imDot || t.dataset.imShape;
        imSelect(page, id);
        document.querySelector('.an-ctx')?.remove();
        const menu = document.createElement('div');
        menu.className = 'an-ctx';
        menu.innerHTML = `<button type="button" data-act="rename">編輯文字<kbd>Enter</kbd></button><button type="button" data-act="dup">複製<kbd>Ctrl+D</kbd></button><button type="button" data-act="del" class="danger">刪除<kbd>Del</kbd></button>`;
        document.body.appendChild(menu);
        menu.style.left = Math.min(e.clientX, window.innerWidth - menu.offsetWidth - 8) + 'px';
        menu.style.top = Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 8) + 'px';
        const close = () => { menu.remove(); document.removeEventListener('pointerdown', outside, true); };
        menu._close = close;
        const outside = (ev) => { if (!menu.contains(ev.target)) close(); };
        document.addEventListener('pointerdown', outside, true);
        menu.addEventListener('click', (ev) => {
          const act = ev.target.closest('[data-act]')?.dataset.act;
          if (!act) return;
          close();
          if (act === 'rename') imRename(page, id); else if (act === 'dup') imDuplicate(page, id); else imDeleteCallout(page, id);
        });
      });

      paper.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.an-rename, .an-drop-btn, .im-capghost, [data-im-empty]')) return;
        if (e.button === 1 || (e.button === 0 && imUI.space)) {
          e.preventDefault();
          const sx = e.clientX, sy = e.clientY, sl = vp.scrollLeft, st = vp.scrollTop;
          annoDrag(paper, e, ev => { vp.scrollLeft = sl - (ev.clientX - sx); vp.scrollTop = st - (ev.clientY - sy); }, () => {});
          return;
        }
        if (e.button !== 0) return;
        const p0 = annoPt(paper, e);
        const handle = e.target.closest('[data-im-handle]');
        const lbl = e.target.closest('[data-im-lbl]');
        const dot = e.target.closest('[data-im-dot]');
        const shape = e.target.closest('[data-im-shape]');
        const frame = e.target.closest('[data-im-frame]');
        const cap = e.target.closest('[data-im-cap]');
        const hitId = (lbl && lbl.dataset.imLbl) || (dot && dot.dataset.imDot) || (shape && imUI.mode === 'select' && shape.dataset.imShape) || null;
        const last = imUI.lastPress;
        imUI.lastPress = hitId || cap ? { id: hitId || 'cap' + cap.dataset.imCap, t: e.timeStamp, x: e.clientX, y: e.clientY } : null;
        const dbl = last && imUI.lastPress && last.id === imUI.lastPress.id && e.timeStamp - last.t < 450 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 6;
        if (dbl) { imUI.lastPress = null; e.preventDefault(); if (cap) imEditCaption(page, +cap.dataset.imCap); else imRename(page, hitId); return; }

        if (imUI.mode === 'text' && !handle && !lbl) {          // new free text box
          e.preventDefault();
          const t = { id: imNewId('t_'), label: '', lx: 0, ly: 0 };
          const s = imLabelSize(d, '文字' + (d.texts.length + 1));
          const q = annoClampLabel(p0.x - s.w / 2, p0.y - s.h / 2, s.w, s.h);
          t.lx = r1(q.x); t.ly = r1(q.y);
          d.texts.push(t);
          imUI.mode = 'select';
          imSave(page);
          renderImagePage(page);
          imRename(page, t.id);
          return;
        }
        if (!handle && !lbl && !dot && !shape && !frame) { if (imUI.sel || imUI.selImg !== null) { imUI.selImg = null; imSelect(page, null); imRefreshSide(page); } return; }
        e.preventDefault();
        document.activeElement?.blur?.();

        if (handle) {
          const h = handle.dataset.imHandle;
          if (h === 'gc' || h === 'gr') {                         // gutter: resize the layout split
            const A = IM_AREA;
            const s0 = { ...(d.split || { c: 50, r: 50 }) };
            const slots0 = imSlots(d), key = imLayoutKey(d);
            const top0 = key === '1+2' ? slots0[1].y : A.y, hgt = key === '1+2' ? (A.h) : A.h;
            annoDrag(paper, e, (ev) => {
              const p = annoPt(paper, ev);
              d.split = { ...s0 };
              if (h === 'gc') d.split.c = Math.round(clampN((p.x - A.x) / A.w * 100, 15, 85) * 10) / 10;
              else d.split.r = Math.round(clampN((p.y - top0) / hgt * 100, 15, 85) * 10) / 10;
              d.images.forEach((im, n) => { const sl = imSlots(d)[n]; if (sl) imClampView(im, imFrame(sl, im)); });
              imUpdateGeo(page);
            }, () => imSave(page));
            return;
          }
          // shape corner: resize the circle / box around its centre
          const f = imFindCallout(d, imUI.sel), g = f && imCalloutGeo(d).find(x => x.c.id === imUI.sel);
          if (!g) return;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            f.c.w = Math.round(clampN(Math.abs(p.x - g.px) * 2 / g.R.w, 0.01, 2) * 1e4) / 1e4;
            f.c.h = Math.round(clampN(Math.abs(p.y - g.py) * 2 / g.R.h, 0.01, 2) * 1e4) / 1e4;
            if (ev.shiftKey) { const m = Math.max(f.c.w * g.R.w, f.c.h * g.R.h); f.c.w = Math.round(m / g.R.w * 1e4) / 1e4; f.c.h = Math.round(m / g.R.h * 1e4) / 1e4; }
            imUpdateGeo(page);
          }, () => imSave(page));
          return;
        }

        if (lbl) {                                                // move a label (snaps to other labels' edges)
          const id = lbl.dataset.imLbl, f = imFindCallout(d, id);
          if (!f) return;
          imSelect(page, id, f.im ? d.images.indexOf(f.im) : imUI.selImg);
          const all = [...imCalloutGeo(d).map(g => ({ id: g.c.id, ...g.L })), ...(d.texts || []).map((t, k) => { const s = imLabelSize(d, imLabelText({ ...t, type: 'text' }, k)); return { id: t.id, ...annoClampLabel(t.lx, t.ly, s.w, s.h), w: s.w, h: s.h }; })];
          const me = all.find(r => r.id === id);
          const edges = all.filter(r => r.id !== id).flatMap(r => [r.x, r.x + r.w]);
          let moved = false;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 3) return;
            moved = true;
            let x = me.x + p.x - p0.x, snap = null;
            if (!ev.altKey) for (const ex of edges) {
              if (Math.abs(x - ex) < 5 / p.k) { x = ex; snap = ex; break; }
              if (Math.abs(x + me.w - ex) < 5 / p.k) { x = ex - me.w; snap = ex; break; }
            }
            const q = annoClampLabel(x, me.y + p.y - p0.y, me.w, me.h);
            f.c.lx = r1(q.x); f.c.ly = r1(q.y);
            imRenderOverlay(page);
            const gd = paper.querySelector('.im-guide') || (() => { const el = document.createElement('div'); el.className = 'an-guide im-guide'; document.getElementById('an-ui-dyn').appendChild(el); return el; })();
            gd.style.display = snap === null ? 'none' : 'block'; gd.style.left = snap + 'px';
          }, () => { paper.querySelector('.im-guide')?.remove(); if (moved) imSave(page); });
          return;
        }

        if (dot || (shape && imUI.mode === 'select')) {         // move a point / shape on its photo
          const id = (dot && dot.dataset.imDot) || shape.dataset.imShape, f = imFindCallout(d, id);
          const g = f && imCalloutGeo(d).find(x => x.c.id === id);
          if (!g) return;
          imSelect(page, id, g.i);
          const x0 = f.c.x, y0 = f.c.y;
          let moved = false;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 3) return;
            moved = true;
            f.c.x = Math.round(clampN(x0 + (p.x - p0.x) / g.R.w, 0, 1) * 1e4) / 1e4;
            f.c.y = Math.round(clampN(y0 + (p.y - p0.y) / g.R.h, 0, 1) * 1e4) / 1e4;
            imUpdateGeo(page);
          }, () => { if (moved) imSave(page); });
          return;
        }

        const i = +frame.dataset.imFrame, im = d.images[i];
        if (!im) return;
        const F = imFrame(imSlots(d)[i], im), R = imPhotoRect(im, F);
        const mode = imUI.mode;
        if ((mode === 'dot' || mode === 'circle' || mode === 'rect') && R) {
          const u = (p0.x - R.x) / R.w, v = (p0.y - R.y) / R.h;
          if (u < 0 || u > 1 || v < 0 || v > 1) return;            // outside the photo (letterbox)
          const c = { id: imNewId('c_'), type: mode, x: Math.round(u * 1e4) / 1e4, y: Math.round(v * 1e4) / 1e4, label: '' };
          if (mode !== 'dot') { c.w = 0.01; c.h = 0.01; }
          im.callouts.push(c);
          imSelect(page, c.id, i);
          const draw = paper.querySelector('.im-draw'), rub = () => paper.querySelector('.an-rubber');
          let moved = false, pEnd = p0;
          annoDrag(paper, e, (ev) => {
            const p = annoPt(paper, ev);
            if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 5) return;
            moved = true; pEnd = p;
            if (mode === 'dot') {
              const s = imLabelSize(d, imLabelText(c, im.callouts.indexOf(c)));
              const q = annoClampLabel(p.x - s.w / 2, p.y - s.h / 2, s.w, s.h);
              c.lx = r1(q.x); c.ly = r1(q.y);
              imRenderOverlay(page);
              const rb = rub(), line = rb && rb.querySelector('line');
              if (line) { rb.style.display = 'block'; line.setAttribute('x1', p0.x); line.setAttribute('y1', p0.y); line.setAttribute('x2', p.x); line.setAttribute('y2', p.y); }
            } else {
              const x1 = clampN(Math.min(p0.x, p.x), R.x, R.x + R.w), x2 = clampN(Math.max(p0.x, p.x), R.x, R.x + R.w);
              const y1 = clampN(Math.min(p0.y, p.y), R.y, R.y + R.h), y2 = clampN(Math.max(p0.y, p.y), R.y, R.y + R.h);
              c.x = Math.round(((x1 + x2) / 2 - R.x) / R.w * 1e4) / 1e4; c.y = Math.round(((y1 + y2) / 2 - R.y) / R.h * 1e4) / 1e4;
              c.w = Math.round(Math.max(0.01, (x2 - x1) / R.w) * 1e4) / 1e4; c.h = Math.round(Math.max(0.01, (y2 - y1) / R.h) * 1e4) / 1e4;
              const dw = paper.querySelector('.im-draw');
              if (dw) Object.assign(dw.style, { display: 'block', left: x1 + 'px', top: y1 + 'px', width: (x2 - x1) + 'px', height: (y2 - y1) + 'px', borderRadius: mode === 'circle' ? '50%' : '0' });
            }
          }, () => {
            if (mode !== 'dot' && (!moved || c.w * R.w < 6 || c.h * R.h < 6)) {   // a click: default size
              const sz = Math.min(R.w, R.h) * 0.16;
              c.w = Math.round(sz / R.w * 1e4) / 1e4; c.h = Math.round(sz / R.h * 1e4) / 1e4;
            }
            if (c.lx == null) {
              const s = imLabelSize(d, imLabelText(c, im.callouts.indexOf(c)));
              const bw = (c.w || 0) * R.w, bh = (c.h || 0) * R.h;
              Object.assign(c, imPlaceLabel(d, { x: R.x + c.x * R.w - bw / 2, y: R.y + c.y * R.h - bh / 2, w: bw, h: bh }, s, c.id));
            }
            imSave(page);
            renderImagePage(page);
            imRename(page, c.id);
          });
          return;
        }

        // select mode on a photo: select it; drag = pan (zoomed) or move it to another slot
        if (imUI.selImg !== i || imUI.sel) imSelect(page, null, i);
        imRefreshSide(page);
        if (!R) return;
        const zoomed = R.w > F.w + 0.5 || R.h > F.h + 0.5;
        const cx0 = im.cx != null ? im.cx : 0.5, cy0 = im.cy != null ? im.cy : 0.5;
        let moved = false, target = null;
        annoDrag(paper, e, (ev) => {
          const p = annoPt(paper, ev);
          if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * p.k < 4) return;
          moved = true;
          if (zoomed) {
            im.cx = cx0 - (p.x - p0.x) / R.w; im.cy = cy0 - (p.y - p0.y) / R.h;
            imClampView(im, F);
            imUpdateGeo(page);
          } else {
            const slots = imSlots(d);
            target = slots.findIndex((s, n) => n !== i && n < Math.max(d.images.length, 1) && p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h);
            if (target < 0) target = null;
            paper.querySelectorAll('.im-frame-ui').forEach(el => el.classList.remove('drop'));
            if (target !== null) paper.querySelectorAll('.im-frame-ui')[target]?.classList.add('drop');
            paper.classList.add('swapping');
          }
        }, () => {
          paper.classList.remove('swapping');
          if (!moved) return;
          if (zoomed) { imSave(page); return; }
          if (target === null) { imRenderUI(page); return; }
          [d.images[i], d.images[target]] = [d.images[target], d.images[i]];
          d.images.forEach((x, n) => { x.position = n; });
          imUI.selImg = target;
          imSave(page);
          renderImagePage(page);
        });
      });
    }

    // Keyboard (image page): V / D / C / R / T modes, Esc, Delete, arrows (label), Enter rename,
    // Ctrl+D duplicate, + / − / 0 view zoom, Space pan.
    window.addEventListener('keydown', (e) => {
      const page = state.pages[state.activePage];
      if (!page || page.type !== 'image' || !document.getElementById('im-stage')) return;
      if (document.querySelector('.tool-modal-overlay, .sim-modal-overlay, .hp-modal-overlay, .update-backdrop') || document.getElementById('preview-overlay')?.classList.contains('open')) return;
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      const d = page.data, k = e.key;
      let handled = true;
      if (e.ctrlKey || e.metaKey) {
        if ((k === 'd' || k === 'D') && imUI.sel) imDuplicate(page, imUI.sel);
        else if ((k === 'c' || k === 'C') && imUI.selImg !== null && d.images[imUI.selImg] && !String(window.getSelection() || '')) {
          const im = d.images[imUI.selImg];
          copyPhotoKey({ url: im.url_or_base64, rot: im.rot, fh: im.fh, caption: im.caption });
        } else handled = false;
      } else if (k === 'v' || k === 'V') imSetMode(page, 'select');
      else if (k === 'd' || k === 'D') imSetMode(page, 'dot');
      else if (k === 'c' || k === 'C') imSetMode(page, 'circle');
      else if (k === 'r' || k === 'R') imSetMode(page, 'rect');
      else if (k === 't' || k === 'T') imSetMode(page, 'text');
      else if (k === 'Escape') {
        const pop = document.querySelector('.an-pop, .an-ctx');
        if (pop) { if (pop._close) pop._close(); else pop.remove(); }
        else if (imUI.mode !== 'select') imSetMode(page, 'select');
        else if (imUI.sel || imUI.selImg !== null) { imUI.selImg = null; imSelect(page, null); imRefreshSide(page); }
        else handled = false;
      } else if ((k === 'Delete' || k === 'Backspace') && imUI.sel) imDeleteCallout(page, imUI.sel);
      else if ((k === 'Delete' || k === 'Backspace') && imUI.selImg !== null) imTool(page, 'delimg');
      else if ((k === 'Enter' || k === 'F2') && imUI.sel) imRename(page, imUI.sel);
      else if (k.startsWith('Arrow') && imUI.sel) {
        const f = imFindCallout(d, imUI.sel);
        if (!f) return;
        const st = e.shiftKey ? 10 : 1;
        const g = f.im && imCalloutGeo(d).find(x => x.c.id === f.c.id);
        const sz = g ? g.L : imLabelSize(d, imLabelText({ ...f.c, type: 'text' }, d.texts.indexOf(f.c)));
        const q = annoClampLabel((f.c.lx || 0) + (k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0), (f.c.ly || 0) + (k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0), sz.w, sz.h);
        f.c.lx = r1(q.x); f.c.ly = r1(q.y);
        imRenderOverlay(page);
        imSave(page);
      } else if (k === '+' || k === '=') annoZoom(page, 1, null, imUI);
      else if (k === '-' || k === '_') annoZoom(page, -1, null, imUI);
      else if (k === '0') annoZoom(page, 0, null, imUI);
      else if (k === ' ') { imUI.space = true; document.getElementById('an-paper')?.classList.add('panning'); }
      else handled = false;
      if (handled) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ' && imUI.space) { e.preventDefault(); imUI.space = false; document.getElementById('an-paper')?.classList.remove('panning'); }
    }, true);
    window.addEventListener('blur', () => { imUI.space = false; });

    // ━━━ Thermal data model (single source of truth) ━━━
    // Every place that shows a margin / pass-fail / comparison value — the data
    // page editor, the in-place row refresh, preview/PDF, 比對頁 and 結論頁 —
    // goes through these functions, so the numbers can never drift apart.
    //
    // Definitions (also printed on the data page):
    //   Derated Tc        = Tc Spec × Derating
    //   Margin (%)        = (Derated Tc − Tc 實測) / Derated Tc × 100
    //   ΔT Margin (°C)    = Derated Tc − Tc 實測
    //   Margin ≥ 10% → Pass · 0–10% → Warning · < 0% → Fail
    const MARGIN_PASS_PCT = 10;
    const MARGIN_DEFINITION_TEXT = 'Derated Tc = Tc Spec × Derating；Margin(%) = (Derated Tc − Tc實測) / Derated Tc × 100；'
      + 'ΔT Margin(°C) = Derated Tc − Tc實測；判定：Margin ≥ 10% Pass、0~10% Warning、< 0% Fail；P/F 以所有 Ta 中最差者為準，未量測不判定。';

    // Parse a stored temperature / number. Accepts a plain number optionally
    // followed by a °C unit ("85.3", "85.3°C", "85.3 ℃"); anything else → NaN.
    function parseTemp(v) {
      if (v === null || v === undefined) return NaN;
      if (typeof v === 'number') return isFinite(v) ? v : NaN;
      const m = String(v).trim().replace(/,/g, '').match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*(?:°\s*C|℃|C)?$/i);
      return m ? parseFloat(m[1]) : NaN;
    }
    // Normalised string for a number cell ('' when empty/invalid).
    function numStr(v) {
      const n = parseTemp(v);
      return isNaN(n) ? '' : String(n);
    }

    function marginStatus(pct) {
      return pct >= MARGIN_PASS_PCT ? 'pass' : pct >= 0 ? 'warn' : 'fail';
    }

    function computeComponent(comp, tas) {
      const tcSpec = parseTemp(comp.tc_spec);
      let derating = parseTemp(comp.derating);
      if (!(derating > 0)) derating = 0.9;
      const derated = tcSpec > 0 ? tcSpec * derating : NaN;
      const disabled = !!comp.disabled;
      let worst = null, maxCell = null;
      const cells = (tas || []).map(ta => {
        const key = 'ta_' + ta;
        const raw = comp.readings ? comp.readings[key] : undefined;
        const tc = parseTemp(raw);
        let marginPct = NaN, marginC = NaN, status = 'none';
        if (!disabled && !isNaN(tc) && derated > 0) {
          marginC = derated - tc;
          marginPct = marginC / derated * 100;
          status = marginStatus(marginPct);
        }
        const cell = { ta, key, raw, tc, marginPct, marginC, status };
        if (status !== 'none' && (!worst || marginPct < worst.marginPct)) worst = cell;
        if (!disabled && !isNaN(tc) && (!maxCell || tc > maxCell.tc)) maxCell = cell;
        return cell;
      });
      const status = disabled ? 'disabled' : (worst ? worst.status : 'none');
      return { tcSpec, derating, derated, disabled, cells, worst, maxCell, status };
    }

    // P/F column (binary per the spec: any Ta with Margin < 0 → Fail).
    function passFailOf(calc) {
      if (calc.status === 'disabled') return { text: '斷線 N/A', short: '斷線 N/A', cls: 'disabled' };
      if (calc.status === 'none') return { text: '—', short: '—', cls: 'none' };
      if (calc.status === 'fail') return { text: '❌ Fail', short: '❌', cls: 'fail' };
      return { text: '✔ Pass', short: '✔', cls: 'pass' };
    }

    const fmt1 = v => (typeof v === 'number' && isFinite(v)) ? v.toFixed(1) : '—';
    const fmtPct = v => (typeof v === 'number' && isFinite(v)) ? v.toFixed(1) + '%' : '—';
    const fmtDeltaC = v => (typeof v === 'number' && isFinite(v)) ? 'ΔT ' + v.toFixed(1) + '°C' : '';

    // Components of every data page, grouped per page, with computed values.
    // Each data page restarts its own category counter (RF-1, RF-2, …).
    // Components are referenced by (data page id, component uid) — both are
    // persisted — so renames, reorders, deletions and copied pages can never
    // make a 比對頁 / 結論頁 row silently pick up another component's numbers.
    function getDataPageComponentGroups() {
      const groups = [];
      state.pages.forEach((p, pageIdx) => {
        if (p.type !== 'data') return;
        const comps = p.data.components || [];
        const tas = p.data.ta_conditions || [];
        const catCounters = { RF: 0, Digital: 0, PWR: 0, Other: 0 };
        let assignedUid = false;
        const list = comps.map((comp, ci) => {
          if (!comp.uid) { comp.uid = newCompUid(); assignedUid = true; }
          const cat = comp.category || 'RF';
          catCounters[cat] = (catCounters[cat] || 0) + 1;
          const calc = computeComponent(comp, tas);
          return {
            category: cat,
            component_name: comp.name || ('(' + cat + '-' + catCounters[cat] + ')'),
            sourceId: cat + '-' + catCounters[cat],
            tc_derated: calc.derated,
            calc,
            tas,
            disabled: calc.disabled,
            source_page: p.id,
            source_uid: comp.uid,
            source_idx: ci,
            readingAt: (ta) => { const c = calc.cells.find(x => x.ta === ta); return c ? c.tc : NaN; },
          };
        });
        // Safety net: a uid minted here must be persisted or links would break on reload.
        if (assignedUid) scheduleSave(pageIdx, { undo: false });
        groups.push({ pageIdx, pageId: p.id, label: pageBaseLabel(pageIdx), note: (p.data.list_note || ''), tas, components: list });
      });
      return groups;
    }

    // Flat list of all data-page components (across every data page).
    function getDataPageComponents() {
      return getDataPageComponentGroups().flatMap(g => g.components);
    }

    const compRefKey = c => c ? c.source_page + '::' + c.source_uid : '';

    // Resolve a 比對頁 item / 結論頁 compliance row to its live source component.
    // A (page, uid) link is authoritative: if that component is gone the row is
    // reported as stale instead of falling back to a look-alike. Legacy rows
    // (index or name links) are verified by name before being trusted.
    function resolveComponentRef(row, all) {
      all = all || getDataPageComponents();
      const name = row.component_name !== undefined ? row.component_name : row.component;
      if (row.source_page && row.source_uid) {
        return all.find(c => c.source_page === row.source_page && c.source_uid === row.source_uid) || null;
      }
      if (row.source_page != null && row.source_idx != null) {
        const byIdx = all.find(c => c.source_page === row.source_page && c.source_idx === row.source_idx);
        if (byIdx && byIdx.component_name === name) return byIdx;
        const sameName = all.find(c => c.source_page === row.source_page && c.component_name === name);
        if (sameName) return sameName;
      }
      if (!name) return null;
      return all.find(c => c.component_name === name && (!row.category || c.category === row.category)) || null;
    }

    // Upgrade a row's link to (page id, uid). Returns true if the row changed.
    function relinkComponentRef(row, all) {
      if (row.source_page && row.source_uid) return false;
      const m = resolveComponentRef(row, all);
      if (!m) return false;
      row.source_page = m.source_page;
      row.source_uid = m.source_uid;
      delete row.source_idx;
      return true;
    }

    // ── 比對頁 (Sim vs Meas) ──
    // The comparison is made at ONE ambient chosen by the user (d.compare_ta).
    // Legacy pages without a choice default to 55°C when any data page has it,
    // else the highest Ta available. No silent fallback to another Ta per row.
    function allDataPageTas() {
      const set = new Set();
      state.pages.forEach(p => { if (p.type === 'data') (p.data.ta_conditions || []).forEach(t => set.add(t)); });
      return Array.from(set).sort((a, b) => a - b);
    }
    function simCompareTa(d) {
      if (typeof d.compare_ta === 'number' && isFinite(d.compare_ta)) return d.compare_ta;
      const tas = allDataPageTas();
      if (tas.includes(55)) return 55;
      return tas.length ? tas[tas.length - 1] : null;
    }

    // 比對頁偏差 — 以「溫升」為基準（CFD 實際預測的是溫升 ΔT = P × Rth，Ta 是
    // 邊界條件；以溫升為分母，誤差百分比才不會隨 Ta 高低而變）:
    //   Meas ΔT = Meas Tc − Ta
    //   Dev(°C) = Sim Tc − Meas Tc
    //   Dev(%)  = (Sim Tc − Meas Tc) / (Meas Tc − Ta) × 100
    // 判定取「% 門檻」與「絕對溫差下限」中較寬鬆者；下限對應熱電偶量測不確定度
    // （約 ±1~2°C），避免低溫升元件因 1~2°C 的差異被誤判：
    //   ✅ |Dev%| ≤ 10% 或 |Dev| ≤ 2°C
    //   ⚠️ |Dev%| ≤ 20% 或 |Dev| ≤ 4°C
    //   ❌ 其餘
    const SIM_DEV_GOOD_PCT = 10, SIM_DEV_WARN_PCT = 20;
    const SIM_DEV_GOOD_C = 2, SIM_DEV_WARN_C = 4;
    function simNotesLines(compareTa) {
      const ta = compareTa === null ? '—' : compareTa;
      return [
        `※ 備註 1：判斷規則（以溫升為基準）：|Dev%| ≤ ${SIM_DEV_GOOD_PCT}% 或 |Dev| ≤ ${SIM_DEV_GOOD_C}°C 為 ✅；|Dev%| ≤ ${SIM_DEV_WARN_PCT}% 或 |Dev| ≤ ${SIM_DEV_WARN_C}°C 為 ⚠️；其餘為 ❌。`,
        '※ 備註 2：Sim Tc 為實測瓦數後的模擬校正值。',
        `※ 備註 3：Meas Tc 取自數據頁 Ta = ${ta}°C 的實測值；Meas ΔT = Meas Tc − Ta；Dev(°C) = Sim Tc − Meas Tc；Dev(%) = (Sim Tc − Meas Tc) / (Meas Tc − Ta) × 100。`,
        `※ 備註 4：±${SIM_DEV_GOOD_PCT}% 相當於絕對溫差 ±(${SIM_DEV_GOOD_PCT / 100} × Meas ΔT)°C，例：Meas ΔT = 40°C 時約 ±${(SIM_DEV_GOOD_PCT * 0.4).toFixed(0)}°C；${SIM_DEV_GOOD_C}°C / ${SIM_DEV_WARN_C}°C 下限對應熱電偶量測不確定度。`,
      ];
    }
    function simRowValues(item, all, compareTa) {
      const m = resolveComponentRef(item, all);
      const simTc = parseTemp(item.sim_tc);
      const out = {
        stale: !m,
        category: m ? m.category : (item.category || ''),
        name: m ? m.component_name : (item.component_name || ''),
        derated: m ? m.tc_derated : NaN,
        simTc,
        measTc: NaN,
        measDT: NaN,      // measured temperature rise above the comparison Ta
        noTa: false,
        devC: NaN, devPct: NaN, judge: 'none',
      };
      if (m) {
        if (compareTa === null || !m.tas.includes(compareTa)) out.noTa = true;
        else out.measTc = m.readingAt(compareTa);
      }
      if (!isNaN(out.measTc) && compareTa !== null) out.measDT = out.measTc - compareTa;
      if (!isNaN(simTc) && !isNaN(out.measTc)) {
        out.devC = simTc - out.measTc;
        // A non-positive rise means the reading is at/below ambient — no % basis.
        if (out.measDT > 0) out.devPct = out.devC / out.measDT * 100;
        const a = Math.abs(out.devC);
        const p = isNaN(out.devPct) ? Infinity : Math.abs(out.devPct);
        out.judge = (p <= SIM_DEV_GOOD_PCT || a <= SIM_DEV_GOOD_C) ? 'good'
          : (p <= SIM_DEV_WARN_PCT || a <= SIM_DEV_WARN_C) ? 'warn' : 'bad';
      }
      return out;
    }
    // Tooltip: what the % thresholds mean in °C for this row's temperature rise.
    function simDevTooltip(v) {
      if (!(v.measDT > 0)) return '';
      const g = Math.max(SIM_DEV_GOOD_PCT / 100 * v.measDT, SIM_DEV_GOOD_C);
      const w = Math.max(SIM_DEV_WARN_PCT / 100 * v.measDT, SIM_DEV_WARN_C);
      return `Meas ΔT = ${v.measDT.toFixed(1)}°C → ✅ 範圍 ±${g.toFixed(1)}°C，⚠️ 範圍 ±${w.toFixed(1)}°C`;
    }
    const SIM_JUDGE_ICON = { good: '✅', warn: '⚠️', bad: '❌', none: '—' };

    // ── 結論頁 Compliance ──
    // Max Tc = the highest measured Tc across ALL Ta conditions of the source
    // component (the worst case the data page judges), with its Ta shown.
    function complianceRowValues(row, all) {
      const m = resolveComponentRef(row, all);
      if (!m) return { stale: true, pageId: null, key: '', name: row.component || '', maxTc: NaN, maxTa: null, derated: NaN, marginPct: NaN, marginC: NaN, verdict: 'stale' };
      const mc = m.calc.maxCell;
      const derated = m.tc_derated;
      let marginPct = NaN, marginC = NaN, verdict = 'none';
      if (m.disabled) verdict = 'disabled';
      else if (mc && derated > 0) {
        marginC = derated - mc.tc;
        marginPct = marginC / derated * 100;
        verdict = marginStatus(marginPct);
      }
      return { stale: false, pageId: m.source_page, key: compRefKey(m), name: m.component_name, maxTc: mc ? mc.tc : NaN, maxTa: mc ? mc.ta : null, derated, marginPct, marginC, verdict };
    }

    // Pass/fail summary of a set of data-page components (enabled + with spec).
    const RESULT_LABEL = { fail: '❌ FAIL', warning: '⚠️ CONDITIONAL PASS', pass: '✅ PASS', none: '尚未判定' };
    function summarizeComponents(comps) {
      const judged = comps.filter(c => !c.disabled && c.tc_derated > 0);
      const evaluated = judged.filter(c => c.calc.status !== 'none');
      const fails = evaluated.filter(c => c.calc.status === 'fail');
      const warns = evaluated.filter(c => c.calc.status === 'warn');
      const status = fails.length ? 'fail' : warns.length ? 'warning' : evaluated.length ? 'pass' : 'none';
      return {
        status, label: RESULT_LABEL[status],
        total: judged.length, nEvaluated: evaluated.length,
        nFail: fails.length, nWarn: warns.length, unmeasured: judged.length - evaluated.length,
        flagged: [...fails, ...warns],          // Fail first, then Warning
      };
    }
    function summaryCountsText(sm) {
      const parts = [];
      if (sm.nFail) parts.push(`${sm.nFail} Fail`);
      if (sm.nWarn) parts.push(`${sm.nWarn} Warning`);
      if (sm.unmeasured) parts.push(`${sm.unmeasured} 未量測`);
      return (parts.length ? parts.join(' · ') + ' / ' : '') + `共 ${sm.total} 顆`;
    }

    // Overall result is derived from EVERY enabled data-page component with a
    // spec — not just the rows hand-picked into the Compliance Summary — so a
    // Fail on the data page can never be shown as an overall PASS. Each data
    // page is one test condition, so results are also reported per page.
    function computeOverallResult(groups) {
      groups = groups || getDataPageComponentGroups();
      // `name` = the test condition (data page); `label` = its result label.
      const perPage = groups.map(g => ({ ...summarizeComponents(g.components), pageId: g.pageId, name: conditionName(g) }));
      const overall = summarizeComponents(groups.flatMap(g => g.components));
      const detail = perPage.length
        ? `依 ${perPage.length} 個數據頁（測試條件）判定`
        : '尚無數據頁';
      return { ...overall, detail, perPage };
    }

    // Display name of a data page (= test condition): "數據頁 1 · RF無補償".
    const conditionName = g => g.label + (g.note ? ' · ' + g.note : '');

    // Compliance rows grouped by their source data page (report page order);
    // rows whose source was deleted go into a trailing "stale" group.
    function groupComplianceRows(rows, groups, all) {
      const byPage = new Map(groups.map(g => [g.pageId, { group: g, items: [] }]));
      const stale = [];
      rows.forEach((row, i) => {
        const v = complianceRowValues(row, all);
        if (v.stale || !byPage.has(v.pageId)) stale.push({ row, i, v });
        else byPage.get(v.pageId).items.push({ row, i, v });
      });
      const out = [];
      byPage.forEach(({ group, items }) => { if (items.length) out.push({ group, items }); });
      if (stale.length) out.push({ group: null, items: stale });
      return out;
    }

    // ━━━ Data Page Module ━━━
    function addDataPage() { return addPageOfType('data'); }

    // Excel-style drag-to-fill for the data page. A small square handle appears
    // on the focused text/number cell; pressing it and dragging up/down over the
    // same column fills that column's cells with the source cell's value. It
    // reuses each input's existing 'input' handler (via a dispatched event), so
    // the data model, computed cells and autosave all update as if typed.
    // Re-created on every renderDataPage; listeners live on the fresh .data-page
    // container so nothing leaks across renders.
    function setupDataFillHandle(container) {
      if (!container) return;

      const handle = document.createElement('div');
      handle.className = 'dt-fill-handle';
      handle.style.display = 'none';
      container.appendChild(handle);
      let sourceInput = null;

      const attach = (input) => {
        sourceInput = input;
        const td = input.closest('td');
        if (!td) { handle.style.display = 'none'; return; }
        td.style.position = 'relative';
        td.appendChild(handle);
        handle.style.display = 'block';
      };
      const detach = () => { handle.style.display = 'none'; sourceInput = null; };

      container.addEventListener('focusin', (e) => {
        const inp = e.target.closest ? e.target.closest('input[data-fill-col]') : null;
        if (inp) attach(inp); else detach();
      });

      handle.addEventListener('mousedown', (e) => {
        if (!sourceInput) return;
        e.preventDefault();
        e.stopPropagation();
        const col = sourceInput.dataset.fillCol;
        const val = sourceInput.value;
        const group = Array.from(container.querySelectorAll('input[data-fill-col]'))
          .filter(i => i.dataset.fillCol === col);
        const srcIdx = group.indexOf(sourceInput);
        if (srcIdx < 0) return;
        let curIdx = srcIdx;
        handle.style.pointerEvents = 'none';

        const clearHi = () => group.forEach(i => {
          const td = i.closest('td'); if (td) td.classList.remove('dt-fill-target');
        });
        const paint = () => {
          clearHi();
          const a = Math.min(srcIdx, curIdx), b = Math.max(srcIdx, curIdx);
          for (let i = a; i <= b; i++) {
            const td = group[i].closest('td'); if (td) td.classList.add('dt-fill-target');
          }
        };
        paint();

        const onMove = (me) => {
          const el = document.elementFromPoint(me.clientX, me.clientY);
          const inp = el && el.closest ? el.closest('input[data-fill-col]') : null;
          if (inp && inp.dataset.fillCol === col) {
            const idx = group.indexOf(inp);
            if (idx >= 0) curIdx = idx;
          }
          paint();
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          handle.style.pointerEvents = '';
          const a = Math.min(srcIdx, curIdx), b = Math.max(srcIdx, curIdx);
          for (let i = a; i <= b; i++) {
            if (i === srcIdx) continue;
            const tgt = group[i];
            if (tgt.value !== val) {
              tgt.value = val;
              tgt.dispatchEvent(new Event('input', { bubbles: true }));
            }
          }
          clearHi();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // Excel-style grid behaviours (rectangular range select + copy + delete +
    // ↑/↓/Enter navigation) for a table body. Works for both the component table
    // and the embedded-sensor table. Selection state is module-level so a single
    // (bound-once) document listener can serialise/clear it — after a drag-select
    // no input has focus, so copy/Delete land on <body>, not the table.
    let dtSelectionRange = null;   // { rA, cA, rB, cB, cellAt } or null
    let dtGridKeysBound = false;

    function setupGridSelection(tbody) {
      if (!tbody) return;
      dtSelectionRange = null;

      // 2D grid of editable cells (input/select) in DOM order.
      const grid = Array.from(tbody.querySelectorAll('tr'))
        .map(tr => Array.from(tr.querySelectorAll('input, select')))
        .filter(cells => cells.length > 0);
      if (grid.length === 0) return;
      const cellAt = (r, c) => (grid[r] && grid[r][c]) || null;
      const coordOf = (el) => {
        for (let r = 0; r < grid.length; r++) { const c = grid[r].indexOf(el); if (c >= 0) return { r, c }; }
        return null;
      };

      let sel = null;      // { r1,c1,r2,c2 } (anchor r1c1 → focus r2c2)
      let anchor = null;   // last clicked coord (for shift-click extend)

      // Clear highlight across the whole data page so selecting in one table
      // drops any selection shown in the other.
      const clearHi = () => $canvas.querySelectorAll('td.dt-range-sel').forEach(td => td.classList.remove('dt-range-sel'));
      const commitSel = () => {
        clearHi();
        if (!sel) { dtSelectionRange = null; return; }
        const rA = Math.min(sel.r1, sel.r2), rB = Math.max(sel.r1, sel.r2);
        const cA = Math.min(sel.c1, sel.c2), cB = Math.max(sel.c1, sel.c2);
        for (let r = rA; r <= rB; r++) for (let c = cA; c <= cB; c++) {
          const td = cellAt(r, c) && cellAt(r, c).closest('td');
          if (td) td.classList.add('dt-range-sel');
        }
        dtSelectionRange = { rA, cA, rB, cB, cellAt };
      };
      const clearSel = () => { sel = null; commitSel(); };

      tbody.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (tbody.closest('.data-frozen')) return;   // frozen page: no range select / bulk delete
        if (e.target.closest('.dt-fill-handle') || e.target.closest('button')) return;

        // Shift-click extends the current selection from the anchor.
        if (e.shiftKey && anchor) {
          const over = e.target.closest('input, select');
          const co = over && coordOf(over);
          if (co) { sel = { r1: anchor.r, c1: anchor.c, r2: co.r, c2: co.c }; commitSel(); e.preventDefault(); }
          return;
        }

        // A drag starts on an input cell; a plain click just edits normally.
        const startCell = e.target.closest('input');
        const co = startCell && coordOf(startCell);
        if (!co) { clearSel(); return; }
        anchor = co;
        clearSel(); // reset any prior range; a drag re-extends it

        const startX = e.clientX, startY = e.clientY;
        let started = false;
        const onMove = (me) => {
          if (!started) {
            if (Math.hypot(me.clientX - startX, me.clientY - startY) < 4) return;
            started = true;
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            tbody.classList.add('dt-selecting');
          }
          me.preventDefault();
          const el = document.elementFromPoint(me.clientX, me.clientY);
          const cur = el && el.closest ? el.closest('input, select') : null;
          const cc = cur && coordOf(cur);
          if (cc) { sel = { r1: anchor.r, c1: anchor.c, r2: cc.r, c2: cc.c }; commitSel(); }
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          tbody.classList.remove('dt-selecting');
          if (!started) clearSel(); // plain click → no range (normal edit)
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // Keyboard: Esc clears; ↑/↓/Enter move the caret between rows in the same
      // column (input cells only — selects keep their native option cycling).
      tbody.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { clearSel(); return; }
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Enter') return;
        const cell = e.target.closest('input');
        const co = cell && coordOf(cell);
        if (!co) return;
        e.preventDefault();
        const target = cellAt(e.key === 'ArrowUp' ? co.r - 1 : co.r + 1, co.c);
        if (target) { target.focus(); if (target.select) target.select(); }
      });

      // One global copy + delete handler acting on the current range.
      if (!dtGridKeysBound) {
        dtGridKeysBound = true;
        const liveRange = () => {
          const s = dtSelectionRange;
          if (!s) return null;
          const a = s.cellAt(s.rA, s.cA);
          if (!a || !a.isConnected) { dtSelectionRange = null; return null; } // stale (re-rendered / page switched)
          return s;
        };
        document.addEventListener('copy', (e) => {
          const s = liveRange();
          if (!s) return;
          const ae = document.activeElement;
          if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.selectionStart !== ae.selectionEnd) return; // copying text in a cell
          const lines = [];
          for (let r = s.rA; r <= s.rB; r++) {
            const vals = [];
            for (let c = s.cA; c <= s.cB; c++) { const el = s.cellAt(r, c); vals.push(el ? el.value : ''); }
            lines.push(vals.join('\t'));
          }
          if (e.clipboardData) { e.clipboardData.setData('text/plain', lines.join('\n')); e.preventDefault(); }
        });
        document.addEventListener('keydown', (e) => {
          if (e.key !== 'Delete' && e.key !== 'Backspace') return;
          const ae = document.activeElement;
          if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return; // editing a cell → normal
          const s = liveRange();
          if (!s) return;
          e.preventDefault();
          for (let r = s.rA; r <= s.rB; r++) {
            for (let c = s.cA; c <= s.cB; c++) {
              const el = s.cellAt(r, c);
              if (el && el.tagName === 'INPUT' && !el.disabled && el.value !== '') {
                el.value = '';
                el.dispatchEvent(new Event('input', { bubbles: true }));
              }
            }
          }
        });
      }
    }

    // Grid-paste cell normalisers: return the value to store, or undefined to
    // reject the cell (rejections are counted and reported, never stored).
    const PASTE_NORMALIZE = {
      number: v => {
        if (v === '') return '';
        const n = parseTemp(v);
        return isNaN(n) ? undefined : String(n);
      },
      category: v => CATEGORY_OPTIONS.find(o => o.toLowerCase() === v.toLowerCase())
        || (/^digi/i.test(v) ? 'Digital' : /^(pwr|power)$/i.test(v) ? 'PWR' : undefined),
      specType: v => {
        const t = v.toLowerCase().replace(/\.$/, '');
        if (t === 'rec' || t === 'recommended') return 'Rec.';
        if (t === 'abs' || t === 'absolute' || t === 'absolute maximum') return 'Abs.';
        return undefined;
      },
      derating: v => {
        const pct = /%\s*$/.test(v);
        let n = parseTemp(v.replace(/%\s*$/, ''));
        if (pct) n = n / 100;
        return (n > 0 && n <= 1) ? n.toFixed(2) : undefined;
      },
      sensorType: v => ['Local', 'Remote'].find(o => o.toLowerCase() === v.toLowerCase()),
    };

    // Excel-style block paste for a table body: a TSV pasted into a cell fills
    // rightwards/downwards from it, growing the underlying row list as needed.
    // Each field may carry a `normalize` (see PASTE_NORMALIZE) that validates
    // and canonicalises the pasted text before it is stored.
    function setupGridPaste(page, tbody, fieldMap, rowIndexAttr, getRows, makeRow, rerender) {
      if (!tbody) return;
      rerender = rerender || renderDataPage;
      tbody.addEventListener('paste', (e) => {
        const target = e.target;
        if (target.tagName !== 'INPUT' && target.tagName !== 'SELECT') return;
        const clipText = (e.clipboardData || window.clipboardData).getData('text');
        if (!clipText) return;
        if (!(clipText.includes('\t') || clipText.trim().includes('\n'))) return; // single value → native paste
        e.preventDefault();
        const tr = target.closest('tr');
        if (!tr) return;
        const startRowIdx = parseInt(target.dataset[rowIndexAttr]);
        if (isNaN(startRowIdx)) return;
        const startColIdx = Array.from(tr.querySelectorAll('input, select')).indexOf(target);
        if (startColIdx < 0) return;

        const clipGrid = clipText.replace(/\r\n?/g, '\n').trimEnd().split('\n').map(row => row.split('\t'));
        const rows = getRows();
        let rejected = 0;
        for (let r = 0; r < clipGrid.length; r++) {
          const rowIdx = startRowIdx + r;
          while (rowIdx >= rows.length) {
            if (!makeRow) break;         // fixed row set (e.g. 比對頁) → don't grow
            rows.push(makeRow());
          }
          if (rowIdx >= rows.length) break;   // clamp: skip pasted rows past the last row
          const rowObj = rows[rowIdx];
          for (let c = 0; c < clipGrid[r].length; c++) {
            const colIdx = startColIdx + c;
            if (colIdx >= fieldMap.length) break;
            const fld = fieldMap[colIdx];
            const val = fld.normalize ? fld.normalize(clipGrid[r][c].trim()) : clipGrid[r][c].trim();
            if (val === undefined) { rejected++; continue; }
            if (fld.taKey) { if (!rowObj.readings) rowObj.readings = {}; rowObj.readings[fld.taKey] = val; }
            else rowObj[fld.field] = val;
          }
        }
        scheduleSave(state.activePage);
        rerender(page);
        if (rejected) {
          alert(`已略過 ${rejected} 個格式不符的儲存格。\n數值欄只接受數字（例：85.3 或 85.3°C）；類別 / Spec Type / Derating / 類型欄需符合下拉選項。`);
        }
      });
    }

    // Machine total power = voltage × current, formatted with unit. Shared by the
    // editor and the PDF so the two always agree.
    function machineWatt(v, i) {
      const vn = parseFloat(v), inn = parseFloat(i);
      if (isNaN(vn) || isNaN(inn)) return '—';
      return (vn * inn).toFixed(1) + ' W';
    }

    // Rename an existing Ta condition and carry all data keyed by ta_<temp> to the
    // new temperature: component readings, sensor readings, and machine-power rows.
    // Caller guarantees newTemp is a number that isn't already in ta_conditions.
    function renameTaCondition(d, idx, newTemp) {
      const oldTemp = d.ta_conditions[idx];
      if (oldTemp === undefined || newTemp === oldTemp) return false;
      const oldKey = 'ta_' + oldTemp, newKey = 'ta_' + newTemp;
      const migrate = (obj) => {
        if (obj && Object.prototype.hasOwnProperty.call(obj, oldKey)) {
          obj[newKey] = obj[oldKey];
          delete obj[oldKey];
        }
      };
      (d.components || []).forEach(c => migrate(c.readings));
      (d.sensors || []).forEach(s => migrate(s.readings));
      migrate(d.machine_power);
      d.ta_conditions[idx] = newTemp;
      return true;
    }

    // Rebuild the component "TIM Type" dropdown options in place from the current
    // TIM library, preserving each row's current selection. Used when a TIM entry
    // is edited so the dropdowns update immediately without a full re-render
    // (which would steal focus from the TIM name field being typed).
    function refreshTimTypeOptions(page) {
      const d = page.data;
      const timLib = state.timLibrary || { grease: [], pad: [], putty: [] };
      const allTimNames = [
        ...(timLib.grease || []).map(t => t.name),

        ...(timLib.putty || []).map(t => t.name),

      $canvas.querySelectorAll('select[data-comp-field="tim_type"]').forEach(sel => {
        const ri = parseInt(sel.dataset.comp);
        const comp = d.components[ri];
        const cur = comp ? (comp.tim_type || '') : sel.value;
        let html = '<option value="">N/A</option>';
        html += allTimNames.map(n =>
          `<option value="${escapeAttr(n)}" ${cur === n ? 'selected' : ''}>${escHtml(n)}</option>`).join('');
        if (cur && !allTimNames.includes(cur)) {
          html += `<option value="${escapeAttr(cur)}" selected>${escHtml(cur)}</option>`;
        }
        sel.innerHTML = html;
        sel.value = cur;
      });
    }

    // Margin cell (data page editor): % on the first line, ΔT margin (°C) below.
    function marginCellClass(c) {
      return c.status === 'pass' ? 'dt-margin-pass' : c.status === 'warn' ? 'dt-margin-warn'
        : c.status === 'fail' ? 'dt-margin-fail' : 'dt-readonly';

    function renderDataPage(page) {

          <td><select data-comp="${ri}" data-comp-field="derating">${derOpts.map(v =>
              `<option value="${v}" ${derStr === v ? 'selected' : ''}>${v}</option>`).join('')}

          <td><select data-comp="${ri}" data-comp-field="tim_type"><option value="">N/A</option>${allTimNames.map(n =>

          <td class="dt-act-cell">
            <button type="button" class="dt-act-btn dt-hl-btn" data-hl-comp="${ri}" title="標記顏色"><span class="dt-hl-dot"${comp.highlight ? ` style="background:${hlSwatchColor(comp.highlight)};border-color:${hlSwatchColor(comp.highlight)};"` : ''}></span></button>

            <button type="button" class="dt-del-btn" data-del-row="${ri}" title="刪除此列">✕</button>
          </td>
        </tr>`;
      });

      // Insert category boundary classes
      // (done via JS after render for simplicity)

      // ── Ta sub-headers ──
      const taHeaders1 = d.ta_conditions.map((ta, ti) =>
        `<th class="ta-group-header" colspan="2"${ti === 0 ? ' style="border-left:2px solid rgba(15,23,42,0.08);"' : ''}>Ta = ${ta}°C</th>`
      ).join('');
      const taHeaders2 = d.ta_conditions.map(() =>

        return `<tr data-sensor-row-idx="${si}" class="${sTrClass}"${sTrStyleAttr}>

            </select></td>

      const sensorTaHeaders = d.ta_conditions.map(ta =>
        `<th>Ta = ${ta}°C</th>`
      ).join('');

      const timCategories = [
        { key: 'grease', label: 'Thermal Grease' },

        { key: 'putty',  label: 'Thermal Putty' },

      const timActiveTab = state._timActiveTab || 'grease';
      const timPanelHTML = `<div class="tim-panel" id="tim-panel">
        <div class="tim-panel-header" id="tim-panel-toggle">

        <div class="tim-panel-body${state._timPanelOpen ? ' open' : ''}" id="tim-panel-body">
          <div class="tim-tabs">
            ${timCategories.map(c =>
              `<button class="tim-tab${timActiveTab === c.key ? ' active' : ''}" data-tim-cat="${c.key}">${c.label}</button>`
            ).join('')}
          </div>
          <div class="tim-list-header"><span>名稱</span><span>K值</span><span>廠商</span><span></span></div>
          <div class="tim-list" id="tim-list">

      const timContainer = document.getElementById('tim-panel-container');
      if (timContainer) timContainer.innerHTML = timPanelHTML;
      const editorArea = $canvas.closest('.editor-area');
      if (editorArea) editorArea.classList.add('has-tim-panel');

      $canvas.innerHTML = editorPageWrapHTML(`
        <div class="data-page">
          <div class="data-page-title">
            <span class="data-page-title-text">Thermal Test Data</span>
            <input class="data-top-note" type="text" placeholder="註記（可手動輸入）"
                   value="${escapeAttr(d.top_note || '')}" data-field="top_note">
            <button type="button" class="data-freeze-btn${d.frozen ? ' is-frozen' : ''}" id="data-freeze-btn" data-freeze-toggle
                    title="${d.frozen ? '解除凍結後即可編輯' : '凍結整頁，鎖定所有內容避免誤改'}">
              ${d.frozen ? '🔓 解除凍結' : '🔒 凍結此頁'}
            </button>
          </div>

          <div class="data-header-grid">
            <div class="data-field">
              <span class="data-field-label">Test Date</span>
              <input type="date" value="${escapeAttr(h.test_date || '')}" data-header="test_date">
            </div>

                <span class="unit-label">min</span>
              </div>
            </div>
            <div class="data-field">
              <span class="data-field-label">Stage</span>
              <select data-header="stage">
                ${stageOptions.map(s =>
                  `<option value="${s}" ${h.stage === s ? 'selected' : ''}>${s}</option>`
                ).join('')}
              </select>
            </div>
            <div class="data-field">
              <span class="data-field-label">Mounting</span>
              <select data-header="mounting" id="data-mounting-select">
                ${mountOptions.map(m =>

                ).join('')}

            <div class="data-field">

              <select data-header="location">

            <div class="data-field">
              <span class="data-field-label">All SW Version</span>
              <div class="sw-upload-row">
                <button type="button" class="sw-upload-btn" id="sw-upload-btn"${(h.sw_images || []).length >= 2 ? ' disabled' : ''} title="上傳截圖（BMP/JPG/PNG，最多 2 張）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg></button>
                <input type="file" id="sw-file-input" accept="image/png,image/jpeg,image/bmp,.png,.jpg,.jpeg,.bmp" multiple style="display:none;">
                <div class="sw-file-list">
                  ${(h.sw_images || []).map((im, ix) => `<span class="sw-file-chip"><span class="sw-file-name" data-sw-preview="${ix}" title="點擊預覽">${escHtml(swDisplayName(im.name))}</span><button type="button" class="sw-file-del" data-sw-del="${ix}" title="刪除此圖">✕</button></span>`).join('')}
                </div>
              </div>
            </div>
          </div>

          <!-- Ta Conditions -->
          <div class="ta-section">
            <div class="ta-section-title">量測環境溫度條件（Ta Conditions）</div>
            <div class="ta-tags" id="ta-tags-container">
              ${taTagsHTML}
              <button class="ta-add-btn" id="ta-add-btn">+ 新增</button>
            </div>
          </div>

          <!-- Machine Power (per Ta) -->
          <div class="mp-section">
            <div class="mp-title">機台功耗（Machine Power）</div>
            <table class="mp-table">
              <thead>
                <tr>
                  <th>環溫 Ta</th>
                  <th>電壓 (V)</th>
                  <th>電流 (A)</th>
                  <th>整機功耗 (W)</th>
                </tr>
              </thead>
              <tbody>
                ${d.ta_conditions.map(ta => {
                  const key = 'ta_' + ta;
                  const mp = (d.machine_power && d.machine_power[key]) || {};
                  return `<tr>
                    <td class="mp-ta">Ta = ${ta}°C</td>
                    <td><input type="number" step="any" class="mp-v" data-mp-ta="${escapeAttr(key)}" placeholder="—" value="${escapeAttr(mp.v !== undefined ? mp.v : '')}"></td>
                    <td><input type="number" step="any" class="mp-i" data-mp-ta="${escapeAttr(key)}" placeholder="—" value="${escapeAttr(mp.i !== undefined ? mp.i : '')}"></td>
                    <td class="mp-w" data-mp-w="${escapeAttr(key)}">${machineWatt(mp.v, mp.i)}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- Data Table -->
          <div class="dt-summary" id="dt-summary">${dataSummaryHTML(d)}</div>
          ${specMemoryDatalistHTML(specMem)}
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th rowspan="2">類別</th>
                  <th rowspan="2">#</th>
                  <th rowspan="2" class="dt-name-col">元件名稱</th>
                  <th rowspan="2" class="dt-th-help" title="Spec Type 規格類型&#10;Rec. (Recommended)：廠商建議的操作溫度上限；Derating 通常取 1.0&#10;Abs. (Absolute Maximum)：絕對最大額定溫度（不可超過）；Derating 通常取 0.9 以保留餘裕">Spec Type</th>
                  <th rowspan="2">Tc Spec</th>
                  <th rowspan="2">Derating</th>
                  <th rowspan="2">Derated Tc</th>
                  <th rowspan="2">TIM Type</th>
                  ${taHeaders1}
                  <th rowspan="2">P/F</th>
                  <th rowspan="2">備註</th>
                  <th rowspan="2" class="dt-act-header"></th>
                </tr>
                <tr>${taHeaders2}</tr>
              </thead>
              <tbody id="dt-tbody">
                ${compRows.join('')}
              </tbody>
            </table>
          </div>
          <div class="dt-def-note">※ ${MARGIN_DEFINITION_TEXT}</div>
          <button class="dt-add-row-btn" id="dt-add-row">+ 新增元件</button>
          <button class="dt-add-row-btn" id="dt-import-anno" style="margin-left:8px;">⇩ 帶入標註頁元件</button>
          <select class="dt-add-row-btn dt-sort-select" id="dt-sort" style="margin-left:8px;" title="重新排列元件順序（可 Ctrl+Z 復原）">
            <option value="">⇅ 排序…</option>
            <option value="cat">依類別（RF → Digital → PWR → Other）</option>
            <option value="name">依元件名稱</option>
            <option value="margin">依最差 Margin（小 → 大）</option>
            <option value="tc">依最高 Tc（高 → 低）</option>
          </select>
          <button class="dt-add-row-btn" id="dt-import-csv" style="margin-left:8px;" title="讀取記錄器匯出的 CSV / TXT，取最後一段時間平均填入實測 Tc（也可以直接把檔案拖到此頁）">📥 匯入記錄器 CSV</button>

          <!-- Embedded Sensor Section -->
          <div class="sensor-section">
            <button class="sensor-toggle" id="sensor-toggle">
              <span class="arrow" id="sensor-arrow">▶</span> Embedded Sensor Readings
            </button>
            <div class="sensor-body" id="sensor-body">
              <table class="sensor-table">
                <thead>
                  <tr>
                    <th>Sensor 名稱</th>
                    <th>類型</th>
                    ${sensorTaHeaders}
                    <th class="sensor-ref-th">對應實測元件 / Δ</th>
                    <th>備註</th>
                    <th class="dt-act-header"></th>
                  </tr>
                </thead>
                <tbody id="sensor-tbody">${sensorRows}</tbody>
              </table>
              <button class="dt-add-row-btn" id="sensor-add-row" style="margin-top:6px;">+ 新增 Sensor</button>
            </div>
          </div>
        </div>
      `);
      $canvas.classList.add('scrollable-edit');

      // ── Mark category boundaries ──
      const tbody = document.getElementById('dt-tbody');
      if (tbody) {
        let prevCat = null;
        tbody.querySelectorAll('tr').forEach(tr => {
          const idx = parseInt(tr.dataset.rowIdx);
          if (!isNaN(idx) && d.components[idx]) {
            const cat = d.components[idx].category;
            if (prevCat !== null && cat !== prevCat) {
              tr.classList.add('category-boundary');
            }
            prevCat = cat;
          }
        });
      }

      // ── Bind header fields ──
      $canvas.querySelectorAll('[data-header]').forEach(el => {
        const eventType = el.tagName === 'SELECT' ? 'change' : 'input';
        el.addEventListener(eventType, () => {
          d.header[el.dataset.header] = el.value;
          if (el.dataset.header === 'stage') {
            const coverPage = state.pages.find(p => p.type === 'cover');
            if (coverPage) {
              coverPage.data.stage = el.value;
              scheduleSave(state.pages.indexOf(coverPage));
            }
          }
          scheduleSave(state.activePage);
        });
      });

      // Top note (free text on the title row)
      const topNoteInput = $canvas.querySelector('.data-top-note');
      if (topNoteInput) {
        topNoteInput.addEventListener('input', () => {
          d.top_note = topNoteInput.value;
          scheduleSave(state.activePage);
        });
      }

      // ── All SW Version: upload / preview / delete screenshots (max 2) ──
      const swUploadBtn = document.getElementById('sw-upload-btn');
      const swFileInput = document.getElementById('sw-file-input');
      if (swUploadBtn && swFileInput) {
        swUploadBtn.addEventListener('click', () => swFileInput.click());
        swFileInput.addEventListener('change', async () => {
          if (!d.header.sw_images) d.header.sw_images = [];
          const okTypes = ['image/png', 'image/jpeg', 'image/bmp'];
          const okExt = /\.(png|jpe?g|bmp)$/i;
          const files = Array.from(swFileInput.files || []).filter(f => okTypes.includes(f.type) || okExt.test(f.name));
          const slots = 2 - d.header.sw_images.length;
          const picked = slots > 0 ? files.slice(0, slots) : [];
          for (const f of picked) {
            try {
              const url = await fileToDataURL(f);
              d.header.sw_images.push({ name: f.name, url });
            } catch (e) {}
          }
          swFileInput.value = '';
          if (picked.length) { scheduleSave(state.activePage); renderDataPage(page); }
        });
      }
      $canvas.querySelectorAll('.sw-file-name[data-sw-preview]').forEach(el => {
        el.addEventListener('click', () => {
          const im = (d.header.sw_images || [])[parseInt(el.dataset.swPreview)];
          if (im) openSwLightbox(im.url, im.name);
        });
      });
      $canvas.querySelectorAll('.sw-file-del[data-sw-del]').forEach(el => {
        el.addEventListener('click', () => {
          const ix = parseInt(el.dataset.swDel);
          if (!d.header.sw_images || isNaN(ix)) return;
          d.header.sw_images.splice(ix, 1);
          scheduleSave(state.activePage);
          renderDataPage(page);
        });
      });

      // Machine power: V/I inputs update the Watt cell in place (no re-render, so
      // the field being typed keeps focus). W = V × I.
      $canvas.querySelectorAll('.mp-v, .mp-i').forEach(el => {
        el.addEventListener('input', () => {
          const key = el.dataset.mpTa;
          if (!d.machine_power) d.machine_power = {};
          if (!d.machine_power[key]) d.machine_power[key] = {};
          d.machine_power[key][el.classList.contains('mp-v') ? 'v' : 'i'] = el.value;
          const wCell = el.closest('tr').querySelector('.mp-w');
          if (wCell) wCell.textContent = machineWatt(d.machine_power[key].v, d.machine_power[key].i);
          scheduleSave(state.activePage);
        });
      });

      // ── Ta tags ──
      $canvas.querySelectorAll('.ta-tag-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          d.ta_conditions.splice(parseInt(btn.dataset.taIdx), 1);
          scheduleSave(state.activePage);
          renderDataPage(page);
        });
      });
      // Click a Ta tag's temperature to edit it in place. Committing re-keys all
      // component / sensor / machine-power data from ta_<old> to ta_<new> so the
      // already-entered readings follow the changed condition.
      $canvas.querySelectorAll('.ta-tag-temp').forEach(el => {
        el.addEventListener('click', () => {
          if (d.frozen) return;   // frozen page: Ta conditions are locked too
          const idx = parseInt(el.dataset.taIdx);
          const cur = d.ta_conditions[idx];
          if (cur === undefined) return;
          const tag = el.closest('.ta-tag');
          const rm = tag.querySelector('.ta-tag-remove');
          const input = document.createElement('input');
          input.type = 'number'; input.step = 'any';
          input.className = 'ta-tag-edit';
          input.value = cur;
          el.style.display = 'none';
          if (rm) rm.style.display = 'none';
          tag.insertBefore(input, el);
          input.focus(); input.select();
          let done = false;
          const commit = (save) => {
            if (done) return; done = true;
            const num = parseFloat(input.value);
            if (save && !isNaN(num) && num !== cur) {
              if (d.ta_conditions.some((t, i) => i !== idx && t === num)) {
                alert('環溫 ' + num + '°C 已存在，請使用不同的值。');
              } else {
                renameTaCondition(d, idx, num);
                scheduleSave(state.activePage);
              }
            }
            renderDataPage(page);
          };
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
          });
          input.addEventListener('blur', () => commit(true));
        });
      });
      const taAddBtn = document.getElementById('ta-add-btn');
      if (taAddBtn) {
        taAddBtn.addEventListener('click', () => {
          const val = prompt('輸入環境溫度 (°C)：', '35');
          if (val === null) return;
          const num = parseFloat(val);
          if (isNaN(num)) return;
          if (d.ta_conditions.includes(num)) {
            alert('環溫 ' + num + '°C 已存在，請使用不同的值。');
            return;
          }
          d.ta_conditions.push(num);
          scheduleSave(state.activePage);
          renderDataPage(page);
        });
      }

      // ── Helper: update computed cells in-place without re-render ──
      function updateRowComputed(ri) {
        const comp = d.components[ri];
        if (!comp) return;
        const tr = tbody?.querySelector(`tr[data-row-idx="${ri}"]`);
        if (!tr) return;

        const calc = computeComponent(comp, d.ta_conditions);
        // Column layout: 0 cat · 1 # · 2 name · 3 spec type · 4 Tc spec ·
        // 5 derating · 6 derated · 7 TIM · then (Tc, Margin) per Ta · P/F
        const tds = tr.querySelectorAll('td');
        if (tds[6]) tds[6].textContent = fmt1(calc.derated);

        calc.cells.forEach((c, ti) => {
          const marginCell = tds[8 + ti * 2 + 1];
          if (marginCell) {
            marginCell.innerHTML = marginCellHTML(c);
            marginCell.className = 'dt-ta-col ' + marginCellClass(c);
          }
        });

        const pfCell = tds[8 + d.ta_conditions.length * 2];
        if (pfCell) {
          const pf = passFailOf(calc);
          pfCell.textContent = pf.text;
          pfCell.className = 'dt-passfail-' + pf.cls;
        }

        // Row fail class (never on a disabled row)
        tr.classList.toggle('row-fail', calc.status === 'fail');

        // Update auto-number and category boundary (only for category change)
        updateAutoNumbers();
        refreshDataSummary();
      }

      function refreshDataSummary() {
        const el = document.getElementById('dt-summary');
        if (el) el.innerHTML = dataSummaryHTML(d);
      }

      function updateAutoNumbers() {
        const catCounters2 = { RF: 0, Digital: 0, PWR: 0, Other: 0 };
        let prevCat2 = null;
        tbody?.querySelectorAll('tr[data-row-idx]').forEach(tr => {
          const idx = parseInt(tr.dataset.rowIdx);
          const comp = d.components[idx];
          if (!comp) return;
          const cat = comp.category;
          catCounters2[cat] = (catCounters2[cat] || 0) + 1;
          const autoNum = cat + '-' + catCounters2[cat];
          const tds = tr.querySelectorAll('td');
          if (tds[1]) tds[1].textContent = autoNum;
          // Refresh the category colour strip so it follows the current category
          const strip = tds[0] && tds[0].querySelector('.dt-cat-strip');
          if (strip) strip.className = 'dt-cat-strip ' + catClassOf(cat);
          // Category boundary
          if (prevCat2 !== null && cat !== prevCat2) {
            tr.classList.add('category-boundary');
          } else {
            tr.classList.remove('category-boundary');
          }
          prevCat2 = cat;
        });
      }

      // ── Component field bindings ──
      $canvas.querySelectorAll('[data-comp-field]').forEach(el => {
        const eventType = el.tagName === 'SELECT' ? 'change' : 'input';
        el.addEventListener(eventType, () => {
          const ri = parseInt(el.dataset.comp);
          const field = el.dataset.compField;
          d.components[ri][field] = el.value;
          // Spec Type drives the default Derating: Rec.→1.00, Abs.→0.90
          if (field === 'spec_type') {
            const autoDer = el.value === 'Rec.' ? '1.00' : '0.90';
            d.components[ri].derating = autoDer;
            const derSel = el.closest('tr')?.querySelector('select[data-comp-field="derating"]');
            if (derSel) derSel.value = autoDer;
          }
          scheduleSave(state.activePage);
          // Update computed cells in-place without re-render
          if (['category', 'tc_spec', 'derating', 'spec_type'].includes(field)) {
            updateRowComputed(ri);
          } else if (field === 'name') {
            refreshDataSummary();
          }
        });
      });

      // ── Spec memory: a committed name that is known elsewhere fills an empty spec ──
      $canvas.querySelectorAll('input[data-comp-field="name"]').forEach(el => {
        el.addEventListener('change', () => {
          const comp = d.components[parseInt(el.dataset.comp)];
          const e = fillSpecFromMemory(comp);
          if (!e) return;
          scheduleSave(state.activePage);
          // after the click / Tab that committed the name has moved focus
          setTimeout(() => { if (state.pages[state.activePage] === page) rerenderKeepFocus(renderDataPage, page); }, 0);
          showToast(`已帶入「${e.name}」的規格：${e.spec_type} ${e.tc_spec}°C × ${e.derating || '—'}${e.from ? '（' + e.from + '）' : ''}`, 'ok', 3500);
        });
      });

      // ── Summary bar: jump to rows, bulk-fill specs from memory ──
      const summaryEl = document.getElementById('dt-summary');
      if (summaryEl) {
        summaryEl.addEventListener('click', (e) => {
          const rowLink = e.target.closest('[data-sum-row]');
          if (rowLink) { flashDataRow(parseInt(rowLink.dataset.sumRow)); return; }
          const jump = e.target.closest('[data-sum-jump]');
          if (jump) {
            const kind = jump.dataset.sumJump;
            const hit = dataPageStats(d).rows.find(x => !x.calc.disabled && (
              kind === 'nospec' ? !(x.calc.derated > 0) : x.calc.derated > 0 && x.calc.status === kind));
            if (hit) flashDataRow(hit.ri);
            return;
          }
          if (e.target.closest('[data-sum-fill-spec]')) {
            const mem = specMemory();
            const n = d.components.filter(c => fillSpecFromMemory(c, mem)).length;
            if (!n) return;
            scheduleSave(state.activePage);
            renderDataPage(page);
            showToast(`已依規格記憶帶入 ${n} 顆元件的規格，請確認`, 'ok');
          }
        });
      }

      // ── Sort components (one undo step; links use uids so nothing breaks) ──
      document.getElementById('dt-sort')?.addEventListener('change', (e) => {
        const mode = e.target.value;
        if (!mode) return;
        const catRank = c => { const i = CATEGORY_OPTIONS.indexOf(c.category); return i < 0 ? CATEGORY_OPTIONS.length : i; };
        const keyed = d.components.map((c, i) => ({ c, i, calc: computeComponent(c, d.ta_conditions) }));
        const worst = x => (x.calc.worst ? x.calc.worst.marginPct : Infinity);
        const hottest = x => (x.calc.maxCell ? x.calc.maxCell.tc : -Infinity);
        const cmp = {
          cat: (a, b) => catRank(a.c) - catRank(b.c) || a.i - b.i,
          name: (a, b) => naturalCompare(a.c.name || '', b.c.name || '') || a.i - b.i,
          margin: (a, b) => worst(a) - worst(b) || a.i - b.i,
          tc: (a, b) => hottest(b) - hottest(a) || a.i - b.i,
        }[mode];
        d.components = keyed.sort(cmp).map(x => x.c);
        scheduleSave(state.activePage);
        renderDataPage(page);
      });

      // ── Data-logger CSV import (button or drop a file on the page) ──
      document.getElementById('dt-import-csv')?.addEventListener('click', () => showLoggerImportModal(page));
      const dataPageEl = $canvas.querySelector('.data-page');
      if (dataPageEl && !d.frozen) {
        const isFileDrag = e => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files');
        dataPageEl.addEventListener('dragover', (e) => { if (!isFileDrag(e)) return; e.preventDefault(); dataPageEl.classList.add('csv-dragover'); });
        dataPageEl.addEventListener('dragleave', (e) => { if (!dataPageEl.contains(e.relatedTarget)) dataPageEl.classList.remove('csv-dragover'); });
        dataPageEl.addEventListener('drop', (e) => {
          if (!isFileDrag(e)) return;
          e.preventDefault();
          dataPageEl.classList.remove('csv-dragover');
          const f = Array.from(e.dataTransfer.files || []).find(x => /\.(csv|txt|tsv|dat)$/i.test(x.name));
          if (f) showLoggerImportModal(page, f);
          else showToast('請拖入記錄器匯出的 CSV / TXT 檔', 'warn');
        });
      }

      // ── Tc measured input bindings ──
      // (↑/↓/Enter row navigation is handled generically by setupGridSelection.)
      $canvas.querySelectorAll('[data-ta-key]').forEach(el => {
        el.addEventListener('input', () => {
          const ri = parseInt(el.dataset.comp);
          const key = el.dataset.taKey;
          d.components[ri].readings[key] = el.value;
          scheduleSave(state.activePage);
          // Update margin cell in-place
          updateRowComputed(ri);
        });
      });

      // ── Add row ──
      const addRowBtn = document.getElementById('dt-add-row');
      if (addRowBtn) {
        addRowBtn.addEventListener('click', () => {
          const lastCat = d.components.length > 0
            ? d.components[d.components.length - 1].category : 'RF';
          d.components.push({
            uid: newCompUid(),
            category: lastCat,
            name: '',
            spec_type: 'Rec.',
            tc_spec: '',
            derating: '0.90',
            tim_type: '',
            readings: {},
            note: '',
          });
          scheduleSave(state.activePage);
          renderDataPage(page);
        });
      }

      // ── Import all components from annotation page(s) ──
      const importBtn = document.getElementById('dt-import-anno');
      if (importBtn) {
        importBtn.addEventListener('click', () => {
          showAnnotationImportModal((selectedComps) => {
            const mem = specMemory();
            let filled = 0;
            selectedComps.forEach(c => {
              const comp = {
                uid: newCompUid(),
                category: c.category,
                name: c.name,
                spec_type: 'Rec.',
                tc_spec: '',
                derating: '0.90',
                tim_type: '',
                readings: {},
                note: '',
              };
              if (fillSpecFromMemory(comp, mem)) filled++;
              d.components.push(comp);
            });
            if (selectedComps.length > 0) {
              scheduleSave(state.activePage);
              renderDataPage(page);
              if (filled) showToast(`已帶入 ${selectedComps.length} 顆元件，其中 ${filled} 顆依規格記憶填好規格`, 'ok');
            }
          });
        });
      }

      // ── Row actions: disable toggle, highlight swatch, delete (button + ctx menu) ──
      if (tbody) {
        tbody.addEventListener('click', (e) => {
          const disBtn = e.target.closest('.dt-disable-btn');
          if (disBtn) {
            const ri = parseInt(disBtn.dataset.disableComp);
            if (isNaN(ri) || !d.components[ri]) return;
            d.components[ri].disabled = !d.components[ri].disabled;
            scheduleSave(state.activePage);
            renderDataPage(page);
            return;
          }
          const hlBtn = e.target.closest('.dt-hl-btn');
          if (hlBtn) {
            const ri = parseInt(hlBtn.dataset.hlComp);
            if (isNaN(ri) || !d.components[ri]) return;
            openHighlightPalette(hlBtn, d.components[ri].highlight || '', (key) => {
              d.components[ri].highlight = key;
              scheduleSave(state.activePage);
              renderDataPage(page);
            });
            return;
          }
          const btn = e.target.closest('.dt-del-btn');
          if (!btn) return;
          const ri = parseInt(btn.dataset.delRow);
          if (isNaN(ri)) return;
          d.components.splice(ri, 1);
