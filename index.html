    // ━━━ Virtual Pages (flattens data page sub-pages for preview/PDF) ━━━
    function buildVirtualPages() {
      const list = [];
      state.pages.forEach((page, pageIdx) => {
        // 備註頁 is an editor-only scratchpad — never part of preview or PDF.
        if (page.type === 'note') return;
        if (page.type === 'data') {
          const subPages = buildDataPagePagesHTML(page.data);
          subPages.forEach(html => {
            list.push({ page, pageIdx, html, isLandscape: true });
          });
          // The uploaded "All SW Version" screenshots go on a single landscape
          // page (side by side), placed right after the data page's own pages
          // (which already end with the Embedded Sensor Readings section).
          const swImgs = (page.data.header && page.data.header.sw_images) || [];
          if (swImgs.length) {
            list.push({ page, pageIdx, html: buildSwImagesPageHTML(swImgs), isLandscape: true });
          }
        } else if (page.type === 'sim_vs_meas') {
          // The comparison table paginates like the data page (many components).
          buildSimVsMeasPagesHTML(page.data).forEach(html => {
            list.push({ page, pageIdx, html, isLandscape: true });
          });
        } else if (page.type === 'compare') {
          buildComparePagesHTML(page.data).forEach(html => list.push({ page, pageIdx, html, isLandscape: true }));
        } else if (page.type === 'toc') {
          list.push({ page, pageIdx, html: '', isLandscape: true });   // filled in by numberVirtualPages
        } else if (page.type === 'conclusion') {
          // Long Compliance Summaries continue onto further pages.
          buildConclusionPagesHTML(page.data).forEach(html => {
            list.push({ page, pageIdx, html, isLandscape: true });
          });
        } else {
          let html = '';
          const isLandscape = page.type === 'image' || page.type === 'annotation' || page.type === 'conclusion';
          if (page.type === 'cover') html = buildCoverHTML(page.data);
          else if (page.type === 'image') html = buildImagePageHTML(page.data);
          else if (page.type === 'annotation') html = buildAnnotationHTML(page.data);
          list.push({ page, pageIdx, html, isLandscape });
        }
      });
      return list;
    }

    // "n / N" in the footer centre of every page except the cover (numbered over
    // the pages actually previewed / exported; the cover counts as page 1).
    function numberVirtualPages(list) {
      const n = list.length;
      list = list.map(vp => vp.page.type === 'toc' ? { ...vp, html: buildTocHTML(list, vp.page) } : vp);
      return list.map((vp, i) => (vp.page.type === 'cover') ? vp : { ...vp, html: pgNumbered(vp.html, `${i + 1} / ${n}`) });
    }
    // The page number band (data-pg-foot: pagination keeps content above it, see pgMeasure).
    const pgNumbered = (html, label) => `<div style="position:relative;width:100%;height:100%;">${html}<div data-pg-foot style="position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(15,23,42,0.45);letter-spacing:0;z-index:3;">${label}</div></div>`;

    // ━━━ Preview Mode ━━━
    let previewIdx = 0;
    let _virtualPages = [];

    let _previewSeq = 0;
    // Same source page and the same sub-page within it (clamped) after a re-layout.
    function previewKeepIndex(oldList, idx, newList) {
      const at = oldList[idx];
      if (!at) return Math.max(0, Math.min(newList.length - 1, idx));
      const k = idx - oldList.findIndex(vp => vp.pageIdx === at.pageIdx);
      const first = newList.findIndex(vp => vp.pageIdx === at.pageIdx);
      if (first < 0) return Math.max(0, Math.min(newList.length - 1, idx));
      const n = newList.filter(vp => vp.pageIdx === at.pageIdx).length;
      return first + Math.min(k, n - 1);
    }
    function openPreview() {
      if (state.pages.length === 0) return;
      const raw = buildVirtualPages();
      _virtualPages = numberVirtualPages(raw);
      if (state.activePage !== null) {
        const vpIdx = _virtualPages.findIndex(vp => vp.pageIdx === state.activePage);
        previewIdx = vpIdx >= 0 ? vpIdx : 0;
      } else {
        previewIdx = 0;
      }
      renderPreviewPage();
      document.getElementById('preview-overlay').classList.add('open');
      // Shown at once; then laid out again with the fonts of the built pages (as the PDF is).
      const seq = ++_previewSeq;
      buildVirtualPagesWithFonts(raw).then(vps => {
        if (vps === raw) return;
        if (seq !== _previewSeq || !document.getElementById('preview-overlay').classList.contains('open')) return;
        const next = numberVirtualPages(vps);
        if (next.length === _virtualPages.length && next.every((vp, i) => vp.html === _virtualPages[i].html)) return;
        previewIdx = previewKeepIndex(_virtualPages, previewIdx, next);
        _virtualPages = next;
        renderPreviewPage();
      }).catch(() => {});
    }

    function closePreview() {
      document.getElementById('preview-overlay').classList.remove('open');
    }

    function renderPreviewPage() {
      const wrap = document.getElementById('preview-canvas-wrap');
      const footer = document.getElementById('preview-footer');
      const vp = _virtualPages[previewIdx];
      if (!vp) return;

      const isLandscape = vp.isLandscape;
      const w = isLandscape ? 842 : 595;
      const h = isLandscape ? 595 : 842;

      const vw = window.innerWidth - 64;
      const vh = window.innerHeight - 120;
      const scale = Math.min(vw / w, vh / h, 1);

      const el = document.createElement('div');
      // same font + letter-spacing reset as the PDF render (and the pagination measurer)
      el.className = 'pv-page';
      el.style.cssText = `width:${w}px;height:${h}px;background:#fff;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,0.5);overflow:hidden;transform:scale(${scale});transform-origin:center center;flex-shrink:0;font-family:${PDF_FONT};letter-spacing:0;word-spacing:0;`;
      el.innerHTML = vp.html;

      el.title = '雙擊回到此頁編輯';
      el.addEventListener('dblclick', () => { closePreview(); selectPage(vp.pageIdx); });
      wrap.innerHTML = '';
      wrap.appendChild(el);
      footer.textContent = `第 ${previewIdx + 1} 頁 / 共 ${_virtualPages.length} 頁（雙擊頁面可回到該頁編輯）`;

      const prevBtn = document.getElementById('preview-prev');
      const nextBtn = document.getElementById('preview-next');
      if (prevBtn) prevBtn.disabled = previewIdx <= 0;
      if (nextBtn) nextBtn.disabled = previewIdx >= _virtualPages.length - 1;
    }

    // Preview nav buttons
    document.getElementById('preview-prev').addEventListener('click', () => {
      if (previewIdx > 0) { previewIdx--; renderPreviewPage(); }
    });
    document.getElementById('preview-next').addEventListener('click', () => {
      if (previewIdx < _virtualPages.length - 1) { previewIdx++; renderPreviewPage(); }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('preview-overlay');
      const isPreviewOpen = overlay.classList.contains('open');

      // Skip if user is typing in an input/textarea/select
      const tag = document.activeElement?.tagName;
      const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement?.isContentEditable;

      if (isPreviewOpen) {
        // Preview mode navigation
        if (e.key === 'Escape') {
          closePreview();
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          if (previewIdx < _virtualPages.length - 1) { previewIdx++; renderPreviewPage(); }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (previewIdx > 0) { previewIdx--; renderPreviewPage(); }
        }
      } else if (!isTyping && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        // Editor mode: left/right arrow to flip pages (only when not in an input)
        e.preventDefault();
        if (e.key === 'ArrowLeft' && state.activePage > 0) {
          selectPage(state.activePage - 1);
        } else if (e.key === 'ArrowRight' && state.activePage < state.pages.length - 1) {
          selectPage(state.activePage + 1);
        }
      }
    });

    // ━━━ PDF Export ━━━

    // Offscreen renderer: builds static HTML for a page (no event bindings)
    // NOTE: html2canvas has a known bug with letter-spacing — all builders must avoid it
    const PDF_FONT = "'Space Grotesk','DM Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";

    // Delta Blue page wrapper: adds progression bars, corner brackets, footer to all PDF pages
    function wrapPageHTML(innerHtml, opts = {}) {
      const progBar = 'linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79)';
      const cs = 'position:absolute;width:32px;height:32px;';
      const dept = opts.dept || '';
      return `<div style="width:100%;height:100%;position:relative;">
        <div style="position:absolute;top:0;left:0;right:0;height:10px;background:${progBar};z-index:2;"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;height:10px;background:${progBar};z-index:2;"></div>
        <div style="${cs}top:14px;left:14px;border-top:1.5px solid #8DC4F0;border-left:1.5px solid #8DC4F0;"></div>
        <div style="${cs}top:14px;right:14px;border-top:1.5px solid #8DC4F0;border-right:1.5px solid #8DC4F0;"></div>
        <div style="${cs}bottom:14px;left:14px;border-bottom:1.5px solid #8DC4F0;border-left:1.5px solid #8DC4F0;"></div>
        <div style="${cs}bottom:14px;right:14px;border-bottom:1.5px solid #8DC4F0;border-right:1.5px solid #8DC4F0;"></div>
        <div style="position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(15,23,42,0.35);letter-spacing:0.04em;z-index:1;">
          <span>${dept}</span>
          <span>CONFIDENTIAL</span>
        </div>
        ${innerHtml}
      </div>`;
    }

    // ── Static HTML builders (pure layout, no inputs/events) ──

    function buildCoverHTML(d) {
      const hasImg = !!d.cover_image;
      // Size the cover image box by the SAME width-percentage the editor uses, so
      // dragging the frame to resize is reflected in the preview and PDF. Width
      // basis 499 = cover content width (A4 portrait 595 − 48×2 padding).
      const pctW = Math.min(100, Math.max(10, d.cover_image_w_pct || 77));
      const pdfW = Math.round(499 * pctW / 100);
      const pdfH = Math.round(pdfW * 3 / 4); // 固定 4:3 橫式插圖框
      const deptUpper = (d.dept || '').toUpperCase();
      const progBar = 'linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79)';
      const cornerStyle = 'position:absolute;width:32px;height:32px;';
      return `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:46px 48px 32px;color:rgba(15,23,42,0.90);overflow:hidden;font-family:${PDF_FONT};letter-spacing:0px;word-spacing:0px;position:relative;">
        <!-- Progression bar top -->
        <div style="position:absolute;top:0;left:0;right:0;height:10px;background:${progBar};"></div>
        <!-- Progression bar bottom -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:10px;background:${progBar};"></div>
        <!-- Corner brackets -->
        <div style="${cornerStyle}top:12px;left:12px;border-top:1.5px solid #8DC4F0;border-left:1.5px solid #8DC4F0;"></div>
        <div style="${cornerStyle}top:12px;right:12px;border-top:1.5px solid #8DC4F0;border-right:1.5px solid #8DC4F0;"></div>
        <div style="${cornerStyle}bottom:12px;left:12px;border-bottom:1.5px solid #8DC4F0;border-left:1.5px solid #8DC4F0;"></div>
        <div style="${cornerStyle}bottom:12px;right:12px;border-bottom:1.5px solid #8DC4F0;border-right:1.5px solid #8DC4F0;"></div>
        <!-- Delta logo top-right -->
        <img src="${DELTA_FULL_LOGO_B64}" style="position:absolute;top:14px;right:16px;height:28px;width:auto;object-fit:contain;z-index:5;" alt="Delta">
        <!-- Type label -->
        <div style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.18em;color:#3A7AD4;align-self:flex-start;margin-bottom:8px;">THERMAL TEST REPORT</div>
        <div style="font-size:14px;font-weight:700;letter-spacing:0px;word-spacing:0px;color:#1A4E96;padding:6px 8px;margin-bottom:16px;text-align:center;width:100%;">${escHtml(d.dept || '')}</div>
        ${hasImg
          ? `<div style="width:${pdfW}px;height:${pdfH}px;margin-bottom:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #C2DFF8;">
               <img src="${escapeAttr(d.cover_image)}" style="max-width:100%;max-height:100%;object-fit:contain;">
             </div>`
          : `<div style="width:${pdfW}px;height:${pdfH}px;margin-bottom:24px;flex-shrink:0;background:#F7F9FC;border:1px solid #C2DFF8;"></div>`}
        <div style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;text-align:center;letter-spacing:-0.01em;word-spacing:0px;padding:8px;margin-bottom:4px;width:100%;color:#0B3D7A;">${escHtml(d.model)}</div>
        <div style="width:48px;height:2px;background:#3A7AD4;margin:0 auto 8px;"></div>
        <div style="font-size:15px;font-weight:500;text-align:center;letter-spacing:0px;word-spacing:0px;color:rgba(15,23,42,0.65);padding:6px 8px;margin-bottom:24px;width:100%;">${escHtml(d.project_name)}</div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;width:100%;max-width:380px;margin-top:auto;padding-top:16px;letter-spacing:0px;word-spacing:0px;">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;letter-spacing:0.05em;word-spacing:0px;color:#2357A7;text-align:right;">STAGE</span>
          <span style="font-size:13px;letter-spacing:0px;word-spacing:0px;padding:4px 8px;">${escHtml(d.stage)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;letter-spacing:0.05em;word-spacing:0px;color:#2357A7;text-align:right;">VERSION</span>
          <span style="font-size:13px;letter-spacing:0px;word-spacing:0px;padding:4px 8px;">${escHtml(d.report_version)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;letter-spacing:0.05em;word-spacing:0px;color:#2357A7;text-align:right;">DATE</span>
          <span style="font-size:13px;letter-spacing:0px;word-spacing:0px;padding:4px 8px;">${escHtml(d.date)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;letter-spacing:0.05em;word-spacing:0px;color:#2357A7;text-align:right;">TESTED BY</span>
          <span style="font-size:13px;letter-spacing:0px;word-spacing:0px;padding:4px 8px;">${escHtml(d.tested_by)}</span>
          ${[['REVIEWED BY', d.reviewed_by], ['APPROVED BY', d.approved_by]].filter(([, v]) => String(v || '').trim()).map(([k, v]) => `
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;letter-spacing:0.05em;word-spacing:0px;color:#2357A7;text-align:right;">${k}</span>
          <span style="font-size:13px;letter-spacing:0px;word-spacing:0px;padding:4px 8px;">${escHtml(v)}</span>`).join('')}
        </div>
        <!-- Footer -->
        <div style="position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(15,23,42,0.35);letter-spacing:0.04em;">
          <span>${escHtml(deptUpper)}</span>
          <span>CONFIDENTIAL</span>
        </div>
      </div>`;
    }

    // A single landscape page holding the uploaded "All SW Version" screenshots
    // side by side, each fit + centred in its half (same object-fit approach the
    // image pages use), with the filename as a caption below each image.
    function buildSwImagesPageHTML(images) {
      const cells = images.map(img => `
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;">
          <div style="flex:1;border:1px solid rgba(15,23,42,0.08);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;">
            <img src="${escapeAttr(img.url || '')}" style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;">
          </div>
          <div style="font-size:11px;color:rgba(15,23,42,0.6);text-align:center;padding:4px 6px;margin-top:4px;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(swDisplayName(img.name))}</div>
        </div>`).join('');
      const inner = `<div style="width:100%;height:100%;display:flex;flex-direction:column;padding:22px 28px 28px;overflow:hidden;color:rgba(15,23,42,0.90);letter-spacing:0px;word-spacing:0px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:0.02em;padding:6px 8px;margin-bottom:10px;color:#0B3D7A;">ALL SW VERSION</div>
        <div style="flex:1;display:flex;gap:16px;min-height:0;justify-content:center;align-items:stretch;">${cells}</div>
      </div>`;
      return wrapPageHTML(inner);
    }

    // Returns an ARRAY of page HTML strings: the conclusion normally fits on one
    // page; when the Compliance Summary is long it continues on further pages
    // (header row repeated) instead of being clipped. Issues / Next Action go
    // after the last compliance row, or onto their own final page.
    function buildConclusionPagesHTML(d) {
      const comp = d.compliance || [];
      const issues = (d.issues || []).filter(s => s);
      const acts = d.actions || [];

      const groups = getDataPageComponentGroups();
      const all = groups.flatMap(g => g.components);
      const overall = computeOverallResult(groups);
      const statusColor = st => st === 'pass' ? '#15803d' : st === 'warning' ? '#a16207' : st === 'fail' ? '#b91c1c' : 'rgba(15,23,42,0.45)';
      const oColor = statusColor(overall.status);
      const oBg = overall.status === 'pass' ? 'rgba(34,197,94,0.10)' : overall.status === 'warning' ? 'rgba(250,204,21,0.14)'
        : overall.status === 'fail' ? 'rgba(239,68,68,0.10)' : 'rgba(15,23,42,0.03)';
      const oBorder = overall.status === 'pass' ? 'rgba(34,197,94,0.35)' : overall.status === 'warning' ? 'rgba(202,138,4,0.35)'
        : overall.status === 'fail' ? 'rgba(239,68,68,0.35)' : 'rgba(15,23,42,0.10)';

      const thStyle = 'text-align:center;font-family:&apos;JetBrains Mono&apos;,monospace;font-size:9px;font-weight:500;letter-spacing:0.04em;word-spacing:0px;color:#ffffff;background:#0B3D7A;padding:5px 6px;border:1px solid rgba(255,255,255,0.3);';
      const tdStyle = 'padding:4px 8px;border:1px solid rgba(15,23,42,0.08);font-size:11px;letter-spacing:0px;word-spacing:0px;text-align:center;';
      const tdLeft = tdStyle + 'text-align:left;';
      const secTitle = "font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.08em;word-spacing:0px;color:#2357A7;margin-bottom:6px;text-transform:uppercase;";
      const sub = t => `<div style="font-size:8px;font-weight:500;opacity:0.75;line-height:1.2;">${t}</div>`;

      const headerHtml = (cont) => `<div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:2px solid #C2DFF8;">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:0.02em;color:#0B3D7A;">TEST CONCLUSION${cont ? '（續）' : ''}</div>
          <div style="display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:6px;background:${oBg};border:1px solid ${oBorder};">
            <span style="font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;letter-spacing:0.08em;color:rgba(15,23,42,0.45);text-transform:uppercase;">Overall Result</span>
            <span style="font-size:13px;font-weight:700;color:${oColor};">${overall.label}</span>
            <span style="font-size:8px;color:rgba(15,23,42,0.5);">${escHtml(overall.detail)}</span>
          </div>
        </div>`;

      const summaryHtml = `<div>
          <div style="${secTitle}">Conclusion</div>
          <div style="min-height:48px;padding:9px 12px;border:1px solid #C2DFF8;border-radius:4px;font-size:12px;line-height:1.6;">${sanitizeRichHtml(d.summary || '')}</div>
        </div>`;

      const conditionHtml = overall.perPage.length ? `<div>
          <div style="${secTitle}">Result by Test Condition</div>
          <div style="border:1px solid #C2DFF8;"><table style="width:100%;border-collapse:collapse;">
            <thead><tr><th style="${thStyle}text-align:left;width:46%;">Test Condition（數據頁）</th><th style="${thStyle}width:22%;">Result</th><th style="${thStyle}">Fail / Warning / 未量測</th></tr></thead>
            <tbody>${overall.perPage.map(pp => `<tr>
              <td style="${tdLeft}">${escHtml(pp.name)}</td>
              <td style="${tdStyle}font-weight:700;color:${statusColor(pp.status)};">${pp.label}</td>
              <td style="${tdStyle}color:rgba(15,23,42,0.65);">${escHtml(summaryCountsText(pp))}</td>
            </tr>`).join('')}</tbody></table></div>
        </div>` : '';

      // Compliance rows, grouped by data page (each group gets a label row).
      const compRowList = [];
      groupComplianceRows(comp, groups, all).forEach(({ group, items }) => {
        compRowList.push(`<tr><td colspan="5" style="${tdLeft}font-weight:700;color:#0B3D7A;background:#EDF2F8;font-size:10px;">${group ? escHtml(conditionName(group)) : '⚠ 來源元件已變更'}</td></tr>`);
        items.forEach(({ v }) => {
          const vd = CONCL_VERDICT[v.verdict] || CONCL_VERDICT.none;
          const mColor = CONCL_MARGIN_PDF[v.verdict] || '';
          compRowList.push(`<tr>
            <td style="${tdLeft}">${escHtml(v.name) || '—'}</td>
            <td style="${tdStyle}">${fmt1(v.maxTc)}${v.maxTa !== null ? sub('@ Ta ' + v.maxTa + '°C') : ''}</td>
            <td style="${tdStyle}">${fmt1(v.derated)}</td>
            <td style="${tdStyle}font-weight:600;${mColor}">${fmtPct(v.marginPct)}${isNaN(v.marginC) ? '' : sub(fmtDeltaC(v.marginC))}</td>
            <td style="${tdStyle}font-weight:600;${vd.pdf}">${vd.label}</td>
          </tr>`);
        });
      });
      const complianceBlock = (rowsHtml, cont) => `<div>
          <div style="${secTitle}">Compliance Summary${cont ? '（續）' : ''}</div>
          ${rowsHtml !== null ? `<div style="border:1px solid #C2DFF8;"><table style="width:100%;border-collapse:collapse;">
            <thead><tr>
              <th style="${thStyle}text-align:left;">Component</th><th style="${thStyle}">Max Tc (°C)</th><th style="${thStyle}">Derated Spec (°C)</th><th style="${thStyle}">Margin</th><th style="${thStyle}">Verdict</th>
            </tr></thead><tbody>${rowsHtml}</tbody></table></div>`
            : `<div style="font-size:11px;color:rgba(15,23,42,0.4);padding:6px 2px;">尚未選取元件</div>`}
        </div>`;

      const issuesHtml = issues.length
        ? issues.map(s => `<li style="margin-bottom:5px;font-size:11px;line-height:1.6;">• ${escHtml(s)}</li>`).join('')
        : `<li style="list-style:none;font-size:11px;color:rgba(15,23,42,0.4);">—</li>`;
      const actTd = 'padding:4px 8px;border:1px solid rgba(15,23,42,0.08);font-size:11px;letter-spacing:0px;word-spacing:0px;text-align:left;';
      const actRows = acts.length
        ? acts.map(a => `<tr><td style="${actTd}">${escHtml(a.description)}</td><td style="${actTd}">${escHtml(a.owner)}</td><td style="${actTd}">${escHtml(a.due_date)}</td></tr>`).join('')
        : `<tr><td style="${actTd}color:rgba(15,23,42,0.4);" colspan="3">—</td></tr>`;
      const issuesActionsHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
          <div>
            <div style="${secTitle}">Issues Found</div>
            <ul style="list-style:none;padding:0;margin:0;">${issuesHtml}</ul>
          </div>
          <div>
            <div style="${secTitle}">Next Action</div>
            <div style="border:1px solid #C2DFF8;"><table style="width:100%;border-collapse:collapse;">
              <thead><tr><th style="${thStyle}text-align:left;">Action</th><th style="${thStyle}text-align:left;">Owner</th><th style="${thStyle}text-align:left;">Due Date</th></tr></thead>
              <tbody>${actRows}</tbody></table></div>
          </div>
        </div>`;

      const pageInner = (blocks) => `<div style="width:100%;height:100%;display:flex;flex-direction:column;padding:26px 34px 24px;gap:14px;color:rgba(15,23,42,0.90);overflow:hidden;letter-spacing:0px;word-spacing:0px;">${blocks.join('')}</div>`;
      const page = (blocks) => wrapPageHTML(pageInner(blocks));

      // Fit check: content must clear the footer band of the 595px-tall page.
      const SAFE_H = 560;
      const fits = (blocks) => {
        const m = document.createElement('div');
        m.style.cssText = `position:fixed;left:-9999px;top:0;width:842px;background:#fff;z-index:-1;font-family:${PDF_FONT};letter-spacing:0;word-spacing:0;`;
        m.innerHTML = pageInner(blocks).replace('height:100%;', '').replace('overflow:hidden;', '');
        document.body.appendChild(m);
        void m.offsetHeight;
        const h = m.firstElementChild.getBoundingClientRect().height;
        document.body.removeChild(m);
        return h <= SAFE_H;
      };

      const firstBlocks = [headerHtml(false), summaryHtml, conditionHtml].filter(Boolean);
      const single = [...firstBlocks, complianceBlock(comp.length ? compRowList.join('') : null, false), issuesActionsHtml];
      if (comp.length === 0 || fits(single)) return [page(single)];

      // Paginate the compliance rows greedily (at least one row per page).
      const pages = [];
      let idx = 0, first = true;
      while (idx < compRowList.length) {
        const base = first ? firstBlocks : [headerHtml(true)];
        let end = idx + 1;
        while (end < compRowList.length && fits([...base, complianceBlock(compRowList.slice(idx, end + 1).join(''), !first)])) end++;
        const chunk = compRowList.slice(idx, end).join('');
        const isLast = end >= compRowList.length;
        if (isLast && fits([...base, complianceBlock(chunk, !first), issuesActionsHtml])) {
          pages.push(page([...base, complianceBlock(chunk, !first), issuesActionsHtml]));
          return pages;
        }
        pages.push(page([...base, complianceBlock(chunk, !first)]));
        idx = end;
        first = false;
      }
      pages.push(page([headerHtml(true), issuesActionsHtml]));
      return pages;
    }

    // ━━━ Measured pagination (preview / PDF) ━━━
    // Pages are 842 × 595 px. Instead of fixed "rows per page" (rows differ in
    // height: wrapped names, a second line with Δ / warnings …), every page is laid
    // out off-screen with the export fonts and must end above a limit, so no row
    // can ever slide under the footer, whatever the data. Builders put PG_END at
    // the end of their content flow and mark what they pin above the page bottom
    // (the margin definitions …) with data-pg-foot; the page number is measured
    // too, so content always ends PG_FOOT_GAP above the highest footer line, even
    // when a note wraps onto more lines.
    const PG_END = '<div data-pg-end style="height:0;margin:0;padding:0;"></div>';
    const PG_LIMIT = 548;         // lowest content y: clear of the corner marks (the page number is measured)
    const PG_FOOT_GAP = 10;
    let _pgBox = null;
    /** { end: y of PG_END, room: lowest y content may reach on this page }. */
    function pgMeasure(pageHtml) {
      if (!_pgBox || !_pgBox.isConnected) {
        _pgBox = document.createElement('div');
        _pgBox.className = 'pg-measure';
        // renderable (not visibility:hidden), so webfont metrics are the real ones
        _pgBox.style.cssText = `position:fixed;left:-10000px;top:0;width:842px;height:595px;background:#fff;z-index:-1;overflow:hidden;font-family:${PDF_FONT};letter-spacing:0;word-spacing:0;pointer-events:none;`;
        document.body.appendChild(_pgBox);
      }
      _pgBox.innerHTML = '<style>.pg-measure *{letter-spacing:0!important;word-spacing:0!important;text-transform:none!important}</style><div style="width:100%;height:100%;">' + pgNumbered(pageHtml, '00 / 00') + '</div>';
      const top = _pgBox.getBoundingClientRect().top;
      const end = _pgBox.querySelector('[data-pg-end]');
      const foot = Math.min(...Array.from(_pgBox.querySelectorAll('[data-pg-foot]'), el => el.getBoundingClientRect().top - top));
      const res = { end: end ? end.getBoundingClientRect().top - top : 0, room: Math.min(PG_LIMIT, foot - PG_FOOT_GAP) };
      _pgBox.innerHTML = '';
      return res;
    }
    const pgFits = (pageHtml) => { const m = pgMeasure(pageHtml); return m.end <= m.room; };
    // Largest e in [lo, hi] with ok(e) true (ok must be monotone: true … true false … false); lo − 1 if none.
    function pgMax(lo, hi, ok) {
      if (lo > hi || !ok(lo)) return lo - 1;
      let good = lo, step = 1;
      while (good + step <= hi && ok(good + step)) { good += step; step *= 2; }   // gallop from lo (a page holds few rows)
      let bad = Math.min(hi + 1, good + step);
      while (bad - good > 1) { const m = (good + bad) >> 1; if (ok(m)) good = m; else bad = m; }
      return good;
    }
    // Split n rows into pages: page(start, end, pageNo) → page HTML. Each page takes as
    // many rows as fit (pgFits; at least one). Returns [[start, end], …].
    function pgSplit(n, page) {
      const out = [];
      let i = 0;
      while (i < n) {
        const no = out.length;
        const e = Math.max(i + 1, pgMax(i + 1, n, e => pgFits(page(i, e, no))));
        out.push([i, e]);
        i = e;
      }
      return out;
    }

    function buildDataPagePagesHTML(d) {
      const h = d.header || {};
      const tas = d.ta_conditions || [];
      const comps = d.components || [];
      const specMap = { 'Recommended': 'Rec.', 'Absolute': 'Abs.' };

      // Table styles at a given font size. Free-text columns (name / TIM / note)
      // may wrap; numeric columns never do.
      const styleFor = (fs) => ({
        th: `text-align:center;font-family:&apos;JetBrains Mono&apos;,monospace;font-size:${fs - 2}px;font-weight:500;color:#ffffff;padding:4px ${fs >= 9 ? 5 : 3}px;background:#0B3D7A;border:1px solid rgba(255,255,255,0.3);white-space:nowrap;letter-spacing:0.04em;word-spacing:0px;`,
        td: `padding:3px ${fs >= 9 ? 5 : 3}px;border:1px solid rgba(15,23,42,0.08);font-size:${fs}px;white-space:nowrap;letter-spacing:0px;word-spacing:0px;text-align:center;`,
        wrap: 'white-space:normal;word-break:break-word;min-width:48px;',
      });

      const buildRows = (fs) => {
        const st = styleFor(fs);
        const tdStyle = st.td;
        const catCounters = { RF: 0, Digital: 0, PWR: 0, Other: 0 };
        return comps.map(comp => {
          const cat = comp.category || 'RF';
          catCounters[cat] = (catCounters[cat] || 0) + 1;
          const autoNum = cat + '-' + catCounters[cat];
          const calc = computeComponent(comp, tas);
          const disabled = calc.disabled;
          const rowFail = calc.status === 'fail';

          const taCells = calc.cells.map(c => {
            const marginBg = c.status === 'pass' ? 'background:rgba(39,174,96,0.10);color:#27AE60;'
              : c.status === 'warn' ? 'background:rgba(243,156,18,0.10);color:#F39C12;'
              : c.status === 'fail' ? 'background:rgba(231,76,60,0.08);color:#E74C3C;' : '';
            const marginHtml = c.status === 'none' ? '—'
              : `${fmtPct(c.marginPct)}<div style="font-size:${fs - 2}px;font-weight:500;opacity:0.85;line-height:1.2;">${fmtDeltaC(c.marginC)}</div>`;
            const tcTxt = isNaN(c.tc) ? '—' : escHtml(numStr(c.raw));
            return `<td style="${tdStyle}text-align:center;">${tcTxt}</td><td style="${tdStyle}text-align:center;font-weight:600;${marginBg}">${marginHtml}</td>`;
          }).join('');

          const catColor = catColorOf(cat);
          const hlBg = disabled ? '' : hlRowBg(comp.highlight || '');
          const rowBg = disabled ? 'background:rgba(15,23,42,0.05);color:rgba(15,23,42,0.5);'
            : (hlBg ? `background:${hlBg};` : (rowFail ? 'background:rgba(231,76,60,0.06);' : ''));
          const pf = passFailOf(calc);
          const nameStyle = disabled ? 'text-decoration:line-through;' : '';
          const pfColor = pf.cls === 'fail' ? 'color:#b91c1c;' : pf.cls === 'pass' ? 'color:#15803d;' : 'color:rgba(15,23,42,0.5);';
          const noteStyle = disabled ? 'color:#dc2626;font-weight:600;' : '';

          return `<tr style="${rowBg}">
            <td style="${tdStyle}text-align:left;"><div style="display:inline-flex;align-items:center;gap:3px;"><span style="width:3px;height:14px;border-radius:2px;background:${catColor};flex-shrink:0;"></span>${escHtml(cat)}</div></td>
            <td style="${tdStyle}text-align:center;color:rgba(15,23,42,0.55);font-weight:600;">${escHtml(autoNum)}</td>
            <td style="${tdStyle}${st.wrap}text-align:center;${nameStyle}">${escHtml(comp.name)}</td>
            <td style="${tdStyle}text-align:center;">${escHtml(specMap[comp.spec_type] || comp.spec_type)}</td>
            <td style="${tdStyle}text-align:center;">${calc.tcSpec > 0 ? escHtml(numStr(comp.tc_spec)) : '—'}</td>
            <td style="${tdStyle}text-align:center;">${calc.derating.toFixed(2)}</td>
            <td style="${tdStyle}text-align:center;background:rgba(15,23,42,0.03);font-weight:600;">${fmt1(calc.derated)}</td>
            <td style="${tdStyle}${st.wrap}text-align:center;">${escHtml(comp.tim_type || 'N/A')}</td>
            ${taCells}
            <td style="${tdStyle}text-align:center;font-weight:700;${pfColor}">${pf.short}</td>
            <td style="${tdStyle}${st.wrap}text-align:center;${noteStyle}">${escHtml(comp.note)}</td>
          </tr>`;
        });
      };

      const buildThead = (fs) => {
        const thStyle = styleFor(fs).th;
        const taHeaders1 = tas.map(ta => `<th colspan="2" style="${thStyle}text-align:center;border-left:2px solid rgba(255,255,255,0.2);">Ta = ${escHtml(String(ta))}°C</th>`).join('');
        const taHeaders2 = tas.map(() => `<th style="${thStyle}text-align:center;font-size:${fs - 3}px;">Tc 實測</th><th style="${thStyle}text-align:center;font-size:${fs - 3}px;">Margin<br>% / ΔT°C</th>`).join('');
        return `<thead><tr><th rowspan="2" style="${thStyle}">類別</th><th rowspan="2" style="${thStyle}">#</th><th rowspan="2" style="${thStyle}">元件名稱</th><th rowspan="2" style="${thStyle}">Spec Type</th><th rowspan="2" style="${thStyle}">Tc Spec</th><th rowspan="2" style="${thStyle}">Derating</th><th rowspan="2" style="${thStyle}">Derated Tc</th><th rowspan="2" style="${thStyle}">TIM Type</th>${taHeaders1}<th rowspan="2" style="${thStyle}">P/F</th><th rowspan="2" style="${thStyle}">備註</th></tr><tr>${taHeaders2}</tr></thead>`;
      };

      // Pick the largest font size at which the component table fits the A4
      // landscape content width (842 − 2×32 px). Without this, many Ta columns
      // pushed P/F and 備註 off the right edge where they were silently clipped.
      const TABLE_MAX_W = 842 - 64 - 2;   // page width − side padding − table frame border
      let fs = 10;
      if (comps.length > 0) {
        const probe = document.createElement('div');
        probe.style.cssText = `position:fixed;left:-9999px;top:0;width:${TABLE_MAX_W}px;background:#fff;z-index:-1;font-family:${PDF_FONT};letter-spacing:0;word-spacing:0;`;
        document.body.appendChild(probe);
        for (const cand of [10, 9, 8, 7]) {
          fs = cand;
          probe.innerHTML = `<table style="width:100%;border-collapse:collapse;">${buildThead(cand)}<tbody>${buildRows(cand).join('')}</tbody></table>`;
          if (probe.firstElementChild.getBoundingClientRect().width <= TABLE_MAX_W + 0.5) break;
        }
        document.body.removeChild(probe);
      }
      const rowsHtml = buildRows(fs);
      const theadHtml = buildThead(fs);
      const thStyle = styleFor(10).th;
      const tdStyle = styleFor(10).td;

      const titleStyle = "font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.02em;word-spacing:0px;color:#0B3D7A;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #C2DFF8;";
      const topNoteSpan = d.top_note ? `<span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0px;color:rgba(15,23,42,0.7);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(d.top_note)}</span>` : '';
      // Title + the 註記 typed at the top of the page (usually the test condition). The
      // page-list label (list_note) is for finding the page in the editor: not printed here.
      const titleHtml = `<div style="${titleStyle}display:flex;align-items:baseline;gap:12px;"><span style="flex-shrink:0;">THERMAL TEST DATA</span>${topNoteSpan}</div>`;

      const lblStyle = "font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:500;color:#2357A7;letter-spacing:0.06em;";
      const infoGridHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:10px;font-size:11px;background:#EDF2F8;padding:8px 10px;">
        <div><span style="${lblStyle}">TEST DATE</span><div>${escHtml(h.test_date)}</div></div>
        <div><span style="${lblStyle}">EQUILIBRIUM TIME</span><div>${escHtml(h.eq_time_min)} min</div></div>
        <div><span style="${lblStyle}">STAGE</span><div>${escHtml(h.stage)}</div></div>
        <div><span style="${lblStyle}">MOUNTING</span><div>${escHtml(h.mounting)}</div></div>
        <div><span style="${lblStyle}">ALL SW VERSION</span><div style="display:flex;gap:14px;flex-wrap:wrap;">${(h.sw_images || []).length ? h.sw_images.map(im => `<span>${escHtml(swDisplayName(im.name))}</span>`).join('') : '—'}</div></div>
        <div><span style="${lblStyle}">UDC SETTING (H+V)</span><div>${escHtml(h.udc_setting)}</div></div>
        <div><span style="${lblStyle}">LOCATION</span><div>${escHtml(h.location)}</div></div>
      </div>`;
      const taTagsHtml = '';

      // Machine power table (per Ta). Shown only if any voltage/current was entered.
      const mpHasData = tas.some(ta => { const mp = (d.machine_power || {})['ta_' + ta]; return mp && (mp.v !== undefined && mp.v !== '' || mp.i !== undefined && mp.i !== ''); });
      const powerHtml = mpHasData ? `<div style="margin-bottom:10px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:#0B3D7A;margin-bottom:4px;">機台功耗（Machine Power）</div>
        <table style="width:100%;border-collapse:collapse;font-size:10px;">
          <thead><tr>
            <th style="${thStyle}">環溫 Ta</th><th style="${thStyle}">電壓 (V)</th><th style="${thStyle}">電流 (A)</th><th style="${thStyle}">整機功耗 (W)</th>
          </tr></thead>
          <tbody>${tas.map(ta => {
            const mp = (d.machine_power || {})['ta_' + ta] || {};
            const vTxt = (mp.v !== undefined && mp.v !== '') ? escHtml(String(mp.v)) : '—';
            const iTxt = (mp.i !== undefined && mp.i !== '') ? escHtml(String(mp.i)) : '—';
            return `<tr><td style="${tdStyle}font-family:&apos;JetBrains Mono&apos;,monospace;color:#2357A7;">Ta = ${escHtml(String(ta))}°C</td><td style="${tdStyle}">${vTxt}</td><td style="${tdStyle}">${iTxt}</td><td style="${tdStyle}font-weight:700;color:#0B3D7A;">${machineWatt(mp.v, mp.i)}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>` : '';

      // Margin definitions, pinned just above the page footer on every page
      // that carries component rows (outside the paginated content area).
      const defNoteHtml = `<div data-pg-foot style="position:absolute;left:32px;right:32px;bottom:27px;font-size:7px;line-height:1.35;color:rgba(15,23,42,0.5);">※ ${escHtml(MARGIN_DEFINITION_TEXT)}</div>`;

      const sensors = d.sensors || [];
      const sensorsWithData = sensors.filter(s => s.name || Object.values(s.readings || {}).some(v => v));
      let sensorHtml = '';
      let sensorRowArr = [];
      let buildSensorBlock = () => '';
      if (sensorsWithData.length > 0) {
        const sThStyle = 'text-align:center;font-size:8px;font-weight:500;color:#ffffff;padding:4px 5px;background:#0B3D7A;border:1px solid rgba(255,255,255,0.3);white-space:nowrap;letter-spacing:0.04em;word-spacing:0px;font-family:&apos;JetBrains Mono&apos;,monospace;';
        const sTdStyle = 'padding:3px 5px;border:1px solid rgba(15,23,42,0.08);font-size:10px;white-space:nowrap;letter-spacing:0px;word-spacing:0px;text-align:center;';
        const sensorTaHeaders = tas.map(ta => `<th style="${sThStyle}">Ta = ${escHtml(String(ta))}°C</th>`).join('');
        sensorRowArr = sensorsWithData.map(s => {
          const sDisabled = !!s.disabled;
          const sHlBg = sDisabled ? '' : hlRowBg(s.highlight || '');
          const sRowBg = sDisabled ? 'background:rgba(15,23,42,0.05);color:rgba(15,23,42,0.5);'
            : (sHlBg ? `background:${sHlBg};` : '');
          const sNameStyle = sDisabled ? 'text-decoration:line-through;' : '';
          const sNoteStyle = sDisabled ? 'color:#dc2626;font-weight:600;' : '';
          const taCells = tas.map(ta => {
            const val = s.readings ? s.readings['ta_' + ta] : '';
            return `<td style="${sTdStyle}">${escHtml(val) || '—'}</td>`;
          }).join('');
          const refComp = resolveSensorRef(d, s);
          let refCell = '—';
          if (refComp) {
            const dl = (sensorRefDeltas(d, s) || []).map(x => `${x.ta}°C ${fmtDelta(x.delta)}`).join('　');
            refCell = `${escHtml(refComp.name || '(未命名)')}<div style="font-size:8px;color:rgba(15,23,42,0.6);margin-top:1px;">${dl}</div>`;
          }
          return `<tr style="${sRowBg}">
            <td style="${sTdStyle}white-space:normal;word-break:break-word;${sNameStyle}">${escHtml(s.name)}</td>
            <td style="${sTdStyle}">${escHtml(['Local','Remote'].includes(s.type) ? s.type : 'Local')}</td>
            ${taCells}
            <td style="${sTdStyle}">${refCell}</td>
            <td style="${sTdStyle}white-space:normal;word-break:break-word;${sNoteStyle}">${escHtml(s.note)}</td>
          </tr>`;
        });
        // Builds the bordered sensor block for an arbitrary subset of rows so the
        // section can be split across pages (the table header repeats each page).
        buildSensorBlock = (rowsArr) => `
          <div style="margin-top:10px;border:1px solid #C2DFF8;border-radius:4px;">
            <div style="padding:6px 10px;font-size:10px;font-weight:700;color:#0B3D7A;background:#ffffff;border-bottom:1px solid #C2DFF8;letter-spacing:0.04em;word-spacing:0px;font-family:'JetBrains Mono',monospace;">EMBEDDED SENSOR READINGS</div>
            <table style="width:100%;border-collapse:collapse;font-size:10px;">
              <thead><tr>
                <th style="${sThStyle}">Sensor</th>
                <th style="${sThStyle}">類型</th>
                ${sensorTaHeaders}
                <th style="${sThStyle}">對應實測元件 / Δ</th>
                <th style="${sThStyle}">備註</th>
              </tr></thead>
              <tbody>${rowsArr.join('')}</tbody>
            </table>
          </div>`;
        sensorHtml = buildSensorBlock(sensorRowArr);
      }

      const makeInner = (title, headerBlock, rows, sensor) =>
        `<div style="width:100%;height:100%;padding:28px 32px 28px;color:rgba(15,23,42,0.90);overflow:hidden;letter-spacing:0px;word-spacing:0px;">
          ${title}${headerBlock}
          ${rows || !sensor ? `<div style="border:1px solid #C2DFF8;">
            <table style="width:100%;border-collapse:collapse;font-size:${fs}px;">
              ${theadHtml}
              <tbody>${rows}</tbody>
            </table>
          </div>` : ''}
          ${sensor}${PG_END}
        </div>${rows ? defNoteHtml : ''}`;

      // Pages are filled by measurement (see pgMeasure): component rows first, then
      // the sensor rows (their table header repeats on every page they continue to).
      // Pages carrying component rows end above the margin definitions (data-pg-foot).
      const headerBlocks = infoGridHtml + taTagsHtml + powerHtml;
      const nC = rowsHtml.length, nS = sensorRowArr.length;
      const html = sp => wrapPageHTML(makeInner(titleHtml, sp.first ? headerBlocks : '',
        rowsHtml.slice(sp.c0, sp.c1).join(''), sp.s1 > sp.s0 ? buildSensorBlock(sensorRowArr.slice(sp.s0, sp.s1)) : ''));
      const fits = sp => pgFits(html(sp));
      const specs = [];
      let ci = 0, si = 0;
      do {
        const sp = { first: specs.length === 0, c0: ci, c1: ci, s0: si, s1: si };
        if (ci < nC) {
          sp.c1 = Math.max(ci + 1, pgMax(ci + 1, nC, e => fits({ ...sp, c1: e })));
          ci = sp.c1;
        }
        if (ci >= nC && si < nS) {
          // continue with the sensors here only if at least two rows (or all that is left) fit
          const minRows = Math.min(2, nS - si);
          const e = pgMax(si + minRows, nS, e => fits({ ...sp, s1: e }));
          if (e >= si + minRows) sp.s1 = e;
          else if (sp.c1 === sp.c0 && !sp.first) sp.s1 = si + 1;   // an otherwise empty page always takes one row
          si = sp.s1;
        }
        specs.push(sp);
      } while (ci < nC || si < nS);
      return specs.map(html);
    }

    // Returns an ARRAY of page HTML strings. The comparison table is paginated by
    // measured height (title + table header repeat on each page) so long or
    // wrapped component lists are never clipped. The footer
    // notes and 結論敘述 sit on the last page, or spill onto their own final page
    // when that last page is too full (measured, like the data page).
    function buildSimVsMeasPagesHTML(d) {
      const items = d.items || [];

      const thStyle = 'text-align:center;font-family:&apos;JetBrains Mono&apos;,monospace;font-size:8px;font-weight:500;color:#ffffff;padding:4px 6px;background:#0B3D7A;border:1px solid rgba(255,255,255,0.3);white-space:nowrap;letter-spacing:0.04em;word-spacing:0px;';
      const tdStyle = 'padding:3px 5px;border:1px solid rgba(15,23,42,0.08);font-size:10px;white-space:nowrap;letter-spacing:0px;word-spacing:0px;text-align:center;';

      const all = getDataPageComponents();
      const compareTa = simCompareTa(d);
      const taLabel = compareTa === null ? '' : ` @ ${compareTa}°C`;
      const wrap = 'white-space:normal;word-break:break-word;';

      const rowHtml = (item) => {
        const v = simRowValues(item, all, compareTa);
        const devStyle = v.judge === 'good' ? 'background:rgba(39,174,96,0.10);color:#27AE60;'
          : v.judge === 'warn' ? 'background:rgba(243,156,18,0.10);color:#F39C12;'
          : v.judge === 'bad' ? 'background:rgba(231,76,60,0.08);color:#E74C3C;' : '';
        const meas = v.stale ? '—' : v.noTa ? '無此 Ta' : fmt1(v.measTc);
        const catColor = catColorOf(v.category);
        return `<tr>
          <td style="${tdStyle}text-align:left;"><span style="display:inline-block;width:3px;height:14px;border-radius:2px;background:${catColor};margin-right:3px;vertical-align:middle;"></span>${escHtml(v.category)}</td>
          <td style="${tdStyle}${wrap}">${escHtml(v.name)}${v.stale ? '<div style="font-size:8px;color:#b45309;">⚠ 來源元件已變更</div>' : ''}</td>
          <td style="${tdStyle}text-align:center;">${fmt1(v.derated)}</td>
          <td style="${tdStyle}text-align:center;">${fmt1(v.simTc)}</td>
          <td style="${tdStyle}text-align:center;">${meas}</td>
          <td style="${tdStyle}text-align:center;">${fmt1(v.measDT)}</td>
          <td style="${tdStyle}text-align:center;font-weight:600;${devStyle}">${isNaN(v.devC) ? '—' : v.devC.toFixed(1)}</td>
          <td style="${tdStyle}text-align:center;font-weight:600;${devStyle}">${fmtPct(v.devPct)}</td>
          <td style="${tdStyle}text-align:center;font-size:12px;${devStyle}">${SIM_JUDGE_ICON[v.judge]}</td>
          <td style="${tdStyle}${wrap}">${escHtml(item.note)}</td>
        </tr>`;
      };

      const titleHtml = `<div style="font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.02em;word-spacing:0px;color:#0B3D7A;margin-bottom:10px;">SIMULATION VS MEASUREMENT COMPARISON${compareTa === null ? '' : ` — Ta = ${compareTa}°C`}</div>`;
      const theadHtml = `<thead><tr>
              <th style="${thStyle}">類別</th><th style="${thStyle}">元件名稱</th><th style="${thStyle}">Derated Tc (°C)</th>
              <th style="${thStyle}">Sim Tc${taLabel}</th><th style="${thStyle}">Meas Tc${taLabel}</th><th style="${thStyle}">Meas ΔT (°C)</th>
              <th style="${thStyle}">Dev (°C)</th><th style="${thStyle}">Dev (%)</th><th style="${thStyle}">判斷</th><th style="${thStyle}">備註</th>
            </tr></thead>`;
      const notesHtml = `<div style="font-size:9px;color:rgba(15,23,42,0.55);padding:6px 0 0;text-align:left;line-height:1.6;">
          ${simNotesLines(compareTa).map(t => `<div>${escHtml(t)}</div>`).join('')}
        </div>`;
      // Prefer the highlighted rich HTML; fall back to the legacy plain text.
      const conclBody = d.conclusion_html ? sanitizeRichHtml(d.conclusion_html) : (d.conclusion ? escHtml(d.conclusion) : '');
      const conclusionHtml = conclBody ? `<div style="margin-top:12px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:#0B3D7A;margin-bottom:4px;">結論敘述</div>
          <div style="font-size:10px;line-height:1.7;color:rgba(15,23,42,0.85);white-space:pre-wrap;border:1px solid #C2DFF8;border-radius:4px;padding:8px 10px;background:#F7F9FC;">${conclBody}</div>
        </div>` : '';
      const chartUrls = d.show_chart !== false ? simChartDataURLs(d) : [];
      const chartsHtml = chartUrls.map(u => `<div style="margin-top:8px;"><img src="${u}" style="display:block;width:${SIM_CHART_W}px;height:${SIM_CHART_H}px;"></div>`);
      const extras = [notesHtml, ...chartsHtml, conclusionHtml].filter(Boolean);
      const extrasHtml = extras.join('');

      const tableBlock = (rowsStr) => `<div style="border:1px solid #C2DFF8;">
          <table style="width:100%;border-collapse:collapse;font-size:10px;">
            ${theadHtml}
            <tbody>${rowsStr}</tbody>
          </table>
        </div>`;
      const pageShell = (bodyHtml) => wrapPageHTML(`<div style="width:100%;height:100%;padding:22px 28px 28px;color:rgba(15,23,42,0.90);overflow:hidden;letter-spacing:0px;word-spacing:0px;">${titleHtml}${bodyHtml}${PG_END}</div>`);

      if (items.length === 0) return [pageShell(tableBlock('') + extrasHtml)];
      // Rows per page by measurement (a wrapped name or a "來源元件已變更" line makes a row taller).
      const rowStrs = items.map(rowHtml);
      const chunks = pgSplit(rowStrs.length, (a, b) => pageShell(tableBlock(rowStrs.slice(a, b).join(''))));
      const pages = chunks.map(([a, b]) => tableBlock(rowStrs.slice(a, b).join('')));
      // notes, chart(s) and 結論敘述 follow the last rows, each on the page where it still fits
      extras.forEach(x => {
        const last = pages.length - 1;
        if (pgFits(pageShell(pages[last] + x))) pages[last] += x;
        else pages.push(x);
      });
      return pages.map(pageShell);
    }

    // HTML-escape any value (numbers included — 0 renders as "0", not "").
    function escHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Rich text from the contenteditable summary / 結論敘述 fields is stored as
    // HTML and re-rendered with innerHTML (editor, preview, PDF). Keep only a
    // small formatting allowlist so pasted or tampered markup can never carry
    // scripts, event handlers or remote resources.
    const RICH_ALLOWED = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'DIV', 'P', 'SPAN', 'MARK', 'UL', 'OL', 'LI']);
    function sanitizeRichHtml(html) {
      if (!html) return '';
      const doc = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html');
      const clean = (node) => {
        Array.from(node.childNodes).forEach(child => {
          if (child.nodeType === Node.TEXT_NODE) return;
          if (child.nodeType !== Node.ELEMENT_NODE) { child.remove(); return; }
          if (!RICH_ALLOWED.has(child.tagName)) {
            if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE', 'SVG', 'MATH', 'IMG', 'LINK', 'META'].includes(child.tagName)) { child.remove(); return; }
            clean(child);
            child.replaceWith(...child.childNodes);   // unwrap unknown tags, keep text
            return;
          }
          const isHl = child.tagName === 'MARK' && child.classList.contains('concl-hl');
          Array.from(child.attributes).forEach(a => child.removeAttribute(a.name));
          if (isHl) { child.className = 'concl-hl'; child.setAttribute('style', CONCL_HL_STYLE); }
          clean(child);
        });
      };
      clean(doc.body);
      return doc.body.innerHTML;
    }

    // Let the user pick which pages go into the PDF. Lists every exportable page
    // (備註頁 is never exported, so it's omitted); all checked by default.
    // onConfirm receives a Set of selected state.pages indices.
    function showExportPagePicker(onConfirm) {
      const items = [];
      state.pages.forEach((p, idx) => {
        if (p.type === 'note') return;
        items.push({ idx, label: pageBaseLabel(idx), note: (p.data && p.data.list_note) || '' });
      });
      if (items.length === 0) { alert('沒有可匯出的頁面（備註頁不會匯出）。'); return; }

      // Report check: things that are probably unfinished, each a link to its page.
      const checks = runReportCheck();
      const nWarn = checks.filter(c => c.level === 'warn').length, nInfo = checks.length - nWarn;
      const pageName = idx => idx === null ? '整份報告' : String(idx + 1).padStart(2, '0') + ' ' + pageBaseLabel(idx);
      const checkHTML = `
        <div class="exp-check${nWarn ? ' open' : ''}" id="exp-check">
          <div class="exp-check-head ${checks.length ? 'warn' : 'ok'}" id="exp-check-head">
            ${checks.length ? `⚠ 報告檢查：${nWarn ? nWarn + ' 項待確認' : ''}${nWarn && nInfo ? '、' : ''}${nInfo ? nInfo + ' 項提醒' : ''}` : '✔ 報告檢查：沒有發現漏填'}
            ${checks.length ? '<span class="exp-check-toggle">點此展開 / 收合 · 點項目跳到該頁</span>' : ''}
          </div>
          <div class="exp-check-list">${checks.map(c => `
            <button type="button" class="exp-check-item" data-goto="${c.idx === null ? '' : c.idx}">
              <span class="lv">${c.level === 'warn' ? '⚠️' : 'ℹ️'}</span><span class="pg">${escHtml(pageName(c.idx))}</span><span>${escHtml(c.text)}</span>
            </button>`).join('')}</div>
        </div>`;
      const spOn = !!(window.spSync && spSync.isEnabled() && spSync.account() && spSync.status().state !== 'needs-login');
      const spChecked = spOn && userPrefs().export_sp !== false;
      const spFolder = (() => {

        return cv ? [cv.data.project_name, cv.data.stage].filter(Boolean).join('_') : '';
      })() || 'Report';

      const overlay = document.createElement('div');
      overlay.className = 'sim-modal-overlay';
      const rowsHTML = items.map(it =>
        `<label class="exp-item">
           <input type="checkbox" class="exp-cb" value="${it.idx}" checked>
           <span class="exp-idx">${String(it.idx + 1).padStart(2, '0')}</span>
           <span class="exp-label">${escHtml(it.label)}${it.note ? `<span class="exp-note">${escHtml(it.note)}</span>` : ''}</span>
         </label>`).join('');
      overlay.innerHTML = `
        <div class="sim-modal" style="width:580px;max-width:calc(100vw - 32px);max-height:88vh;">
          <div class="sim-modal-header">選擇要匯出的頁面</div>
          ${checkHTML}
          <div class="exp-toolbar"><button type="button" class="exp-toggle-all" id="exp-toggle-all">全不選</button></div>
          <div class="sim-modal-body">${rowsHTML}</div>
          <div class="sim-modal-footer">
            ${spOn ? `<label class="exp-sp" title="上傳到 SharePoint：Thermal_Report_Builder/Reports/${escapeAttr(spFolder)}/"><input type="checkbox" id="exp-sp-upload"${spChecked ? ' checked' : ''}> 同時上傳到 SharePoint</label>` : ''}
            <button class="sim-modal-btn" id="exp-cancel">取消</button>
            <button class="sim-modal-btn primary" id="exp-confirm">匯出所選</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => document.body.removeChild(overlay);
      overlay.querySelector('#exp-cancel').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      overlay.querySelector('#exp-check-head').addEventListener('click', () => overlay.querySelector('#exp-check').classList.toggle('open'));
      overlay.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => {
        close();
        if (b.dataset.goto !== '') selectPage(parseInt(b.dataset.goto));
      }));
      const toggleBtn = overlay.querySelector('#exp-toggle-all');
      toggleBtn.addEventListener('click', () => {
        const cbs = Array.from(overlay.querySelectorAll('.exp-cb'));
        const anyChecked = cbs.some(c => c.checked);
        cbs.forEach(c => { c.checked = !anyChecked; });
        toggleBtn.textContent = anyChecked ? '全選' : '全不選';
      });
      overlay.querySelector('#exp-confirm').addEventListener('click', () => {

        if (sel.size === 0) { alert('請至少選取一個頁面。'); return; }
        const spCb = overlay.querySelector('#exp-sp-upload');
