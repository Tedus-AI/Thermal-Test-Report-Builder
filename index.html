<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Report Builder</title>
  <!-- Build id, stamped by .github/workflows/pages.yml (same value as version.json). -->
  <meta name="trb-version" content="__BUILD_VERSION__">

  <script src="fileDb.js?v=__BUILD_VERSION__"></script>
  <script src="dbAdapter.js?v=__BUILD_VERSION__"></script>
  <script src="spSync.js?v=__BUILD_VERSION__"></script>
  <script src="loggerCsv.js?v=__BUILD_VERSION__"></script>

  <!-- Google Fonts: Space Grotesk + DM Sans + JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- SortableJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

  <!-- html2canvas + jsPDF CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <style>
    /* ━━━ CSS Design System: Delta Blue Futuristic ━━━ */
    :root {
      /* Delta Blue Ramp */
      --d-900: #021B3A;
      --d-800: #042952;
      --d-700: #0B3D7A;
      --d-600: #1A4E96;
      --d-500: #2357A7;
      --d-400: #3A7AD4;
      --d-300: #5BA3E6;
      --d-200: #8DC4F0;
      --d-100: #C2DFF8;
      --d-50:  #E8F0FA;

      /* Semantic Colors */
      --color-pass:    #27AE60;
      --color-fail:    #E74C3C;
      --color-warn:    #F39C12;
      --color-neutral: #8E8E93;
      --color-bg:      #F7F9FC;
      --color-bg2:     #EDF2F8;

      /* Progression Bar */
      --progression-bar: linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79);

      /* Mapped aliases (for legacy compatibility) */
      --color-primary: var(--d-400);
      --color-primary-glass: rgba(58,122,212,0.12);
      --color-primary-glow: rgba(58,122,212,0.25);
      --color-success: var(--color-pass);
      --color-warning: var(--color-warn);
      --color-danger: var(--color-fail);

      --text-primary: #ffffff;
      --text-secondary: var(--d-200);
      --text-placeholder: rgba(141,196,240,0.4);
      --text-on-white: #1a2a3a;

      --font-heading: 'Space Grotesk', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-ui: 'DM Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', monospace;
      --font-data: 'JetBrains Mono', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', monospace;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;

      --transition-fast: 0.15s ease;
      --transition-base: 0.25s ease;
      --transition-slow: 0.35s ease;

      /* Legacy compat aliases (mapped to Delta Blue) */
      --bg-gradient: var(--d-900);
      --bg-glow-1: radial-gradient(ellipse 600px 400px at 20% 30%, rgba(11,61,122,0.25), transparent);
      --bg-glow-2: radial-gradient(ellipse 500px 350px at 75% 60%, rgba(35,87,167,0.15), transparent);
      --bg-glow-3: radial-gradient(ellipse 400px 300px at 50% 80%, rgba(58,122,212,0.10), transparent);
      --bg-glow-4: radial-gradient(ellipse 300px 250px at 80% 20%, rgba(91,163,230,0.08), transparent);
      --glass-blur: 16px;
      --glass-blur-heavy: 24px;
      --glass-shadow-lg: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
      --radius-sm: 0px;
      --radius-md: 0px;
      --radius-lg: 0px;
      --radius-xl: 0px;
      --radius-full: 0px;
    }

    /* ━━━ Reset & Base ━━━ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--text-primary);
      background: var(--d-900);
    }

    body {
      background: var(--d-900);
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before { background: var(--bg-glow-1), var(--bg-glow-3); opacity: 0.6; }
    body::after { background: var(--bg-glow-2), var(--bg-glow-4); opacity: 0.6; }

    /* ━━━ Layout ━━━ */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ━━━ Toolbar ━━━ */
    .toolbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--d-900);
      background-image: linear-gradient(180deg, rgba(11,61,122,0.4) 0%, transparent 100%);
      border-bottom: 1px solid rgba(91,163,230,0.15);
      flex-shrink: 0;
      z-index: 100;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .toolbar-logo { height: 28px; width: auto; object-fit: contain; }
    .toolbar-divider { width: 1px; height: 24px; background: rgba(91,163,230,0.2); }
    .toolbar-brand { display: flex; flex-direction: column; gap: 1px; }
    .toolbar-brand-name {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #ffffff;
    }
    .toolbar-brand-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--d-300);
      letter-spacing: 0.06em;
    }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--d-200);
    }

    /* Angle-cut button (replaces glass-btn) */
    .glass-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-family: var(--font-heading);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: rgba(91,163,230,0.12);
      border: 1px solid rgba(91,163,230,0.3);
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      position: relative;
      border-radius: 0;
    }

    .glass-btn:hover {
      background: rgba(91,163,230,0.22);
    }

    .glass-btn:active {
      transform: scale(0.97);
    }

    /* Disabled toolbar buttons (e.g. Undo/Redo at the end of history): greyed,
       not-allowed, and no hover/press feedback so it's clear they can't be used. */
    .glass-btn:disabled,
    .glass-btn[disabled] {
      color: rgba(255,255,255,0.30);
      background: rgba(91,163,230,0.04);
      border-color: rgba(91,163,230,0.12);
      cursor: not-allowed;
    }
    .glass-btn:disabled:hover,
    .glass-btn[disabled]:hover { background: rgba(91,163,230,0.04); }
    .glass-btn:disabled:active,
    .glass-btn[disabled]:active { transform: none; }

    .glass-btn.btn-accent {
      background: var(--d-300);
      border-color: var(--d-300);
      font-weight: 600;
    }
    .glass-btn.btn-accent:hover {
      background: var(--d-200);
      color: var(--d-800);
    }

    /* ━━━ Dropdown Menu ━━━ */
    .dropdown-wrap { position: relative; }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 180px;
      background: rgba(2,27,58,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(91,163,230,0.15);
      border-top: 1px solid rgba(91,163,230,0.25);
      clip-path: polygon(0 0, 100% 0, calc(100% - 4px) 100%, 4px 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(35,87,167,0.08);
      padding: var(--space-1) 0;
      z-index: 200;
    }

    .dropdown-menu.open { display: block; }

    .dropdown-item {
      display: block;
      width: 100%;
      padding: var(--space-2) var(--space-4);
      font-size: 13px;
      font-family: var(--font-ui);
      color: var(--text-primary);
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .dropdown-item:hover {
      background: rgba(91,163,230,0.12);
    }

    /* ━━━ Context Menu ━━━ */
    .context-menu {
      display: none;
      position: fixed;
      min-width: 140px;
      background: rgba(2,27,58,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(91,163,230,0.15);
      border-top: 1px solid rgba(91,163,230,0.25);
      clip-path: polygon(0 0, 100% 0, calc(100% - 4px) 100%, 4px 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      padding: var(--space-1) 0;
      z-index: 300;
    }

    .context-menu.open { display: block; }

    .context-item {
      display: block;
      width: 100%;
      padding: var(--space-2) var(--space-4);
      font-size: 13px;
      font-family: var(--font-ui);
      color: var(--d-200);
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .context-item:hover {
      background: rgba(91,163,230,0.12);
    }

    /* ━━━ Body ━━━ */
    .body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ━━━ Sidebar ━━━ */
    .sidebar {
      width: 152px;
      min-width: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(4,41,82,0.3);
      border-right: 1px solid rgba(91,163,230,0.1);
      z-index: 50;
      padding: 10px 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 6px 6px 12px;
      font-size: 9px;
      font-family: var(--font-mono);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--d-400);
    }

    #page-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    /* Page list: drag the edge to resize, «/» to collapse into a rail of page numbers */
    .sidebar-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sidebar-toggle { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--d-300); cursor: pointer; }
    .sidebar-toggle:hover, .sidebar-toggle:focus-visible { background: rgba(91,163,230,0.14); border-color: rgba(91,163,230,0.3); color: #fff; outline: none; }
    .sidebar-toggle svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--transition-fast); }
    .sidebar-resizer { flex-shrink: 0; width: 7px; margin: 0 -3px; position: relative; z-index: 60; cursor: col-resize; touch-action: none; }
    .sidebar-resizer::after { content: ''; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; transition: background var(--transition-fast); }
    .sidebar-resizer:hover::after, .sidebar-resizer:focus-visible::after, .sidebar-resizer.dragging::after { background: rgba(91,163,230,0.7); width: 2px; left: 2.5px; }
    .sidebar-resizer:focus-visible { outline: none; }
    body.sidebar-resizing, body.sidebar-resizing * { cursor: col-resize !important; user-select: none !important; }
    .sidebar.collapsed { width: 40px !important; }
    .sidebar.collapsed .sidebar-header { padding: 4px 0 8px; justify-content: center; }
    .sidebar.collapsed .sidebar-title, .sidebar.collapsed .sidebar-footer,
    .sidebar.collapsed .page-label, .sidebar.collapsed .page-note-edit { display: none; }
    .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
    .sidebar.collapsed .page-item { justify-content: center; gap: 0; padding: 7px 0; position: relative; }
    .sidebar.collapsed .page-item > span:first-child { width: auto !important; text-align: center !important; font-size: 10px !important; }
    .sidebar.collapsed .page-item.active > span:first-child { color: #fff !important; }
    .sidebar.collapsed .page-badge { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; padding: 0; font-size: 0; border-radius: 50%; }
    .sidebar.collapsed .page-badge:not(.page-badge-fail):not(.page-badge-warn) { display: none; }
    .sidebar.collapsed .page-badge-fail { background: #f87171; }
    .sidebar.collapsed .page-badge-warn { background: #fbbf24; }
    .sidebar.collapsed + .sidebar-resizer { display: none; }
    .sidebar.will-collapse { opacity: 0.45; }

    .page-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      font-size: 11px;
      font-family: var(--font-ui);
      color: var(--d-200);
      background: transparent;
      border: none;
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .page-item:hover {
      background: rgba(91,163,230,0.06);
    }

    .page-item.active {
      background: rgba(35,87,167,0.15);
      color: #ffffff;
      border-left-color: var(--d-300);
      font-weight: 500;
    }

    .page-item.sortable-ghost {
      opacity: 0.4;
    }

    /* Page-list label: auto base name + optional user note */
    .page-label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .page-label .page-note {
      color: var(--d-300);
      text-overflow: ellipsis;
      overflow: hidden;
      min-width: 0;
    }
    .page-item.active .page-label .page-note {
      color: rgba(255,255,255,0.82);
    }
    /* Pencil to add/edit the note — appears on hover */
    .page-note-edit {
      flex-shrink: 0;
      margin-left: auto;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--d-300);
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--transition-fast), background var(--transition-fast);
    }
    .page-item:hover .page-note-edit { opacity: 0.7; }
    .page-note-edit:hover { opacity: 1; background: rgba(91,163,230,0.18); }
    .page-note-input {
      flex: 1;
      min-width: 0;
      font-family: var(--font-ui);
      font-size: 11px;
      color: #fff;
      background: rgba(2,27,58,0.85);
      border: 1px solid var(--d-300);
      border-radius: 4px;
      padding: 1px 5px;
      outline: none;
    }
    .page-note-input::placeholder { color: rgba(255,255,255,0.35); }

    .sidebar-footer {
      padding: 8px 12px;
      border-top: 1px solid rgba(91,163,230,0.1);
    }

    .sidebar-add-btn {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      padding: 6px 10px;
      font-size: 11px;
      font-family: var(--font-heading);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--d-300);
      background: rgba(91,163,230,0.08);
      border: 1px solid rgba(91,163,230,0.15);
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
      cursor: pointer;
      transition: background var(--transition-fast);
      position: relative;
    }

    .sidebar-add-btn:hover {
      background: rgba(91,163,230,0.18);
      color: #ffffff;
    }

    /* Sidebar bottom dropdown opens upward */
    .sidebar-footer .dropdown-menu {
      top: auto;
      bottom: calc(100% + 4px);
      left: 0;
    }

    /* ━━━ Editor Area ━━━ */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px 20px;
      position: relative;
      /* Blueprint grid background */
      background-image:
        repeating-linear-gradient(0deg,
          rgba(35,87,167,0.08) 0, rgba(35,87,167,0.08) 1px,
          transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg,
          rgba(35,87,167,0.08) 0, rgba(35,87,167,0.08) 1px,
          transparent 1px, transparent 40px);
      background-size: 40px 40px;
    }

    /* Center guideline */
    .editor-area::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      width: 1px; height: 100%;
      background: rgba(91,163,230,0.08);
      pointer-events: none;
      z-index: 0;
    }

    /* Canvas tag label */
    .canvas-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--d-400);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1;
    }
    .canvas-tag::before,
    .canvas-tag::after {
      content: '';
      width: 40px;
      height: 1px;
      background: rgba(91,163,230,0.15);
    }

    #editor-canvas {
      /* Default portrait A4 aspect ratio 595:842 */
      --canvas-aspect: 595 / 842;
      aspect-ratio: var(--canvas-aspect);
      max-width: calc(100% - 80px);  /* leave room for nav buttons */
      max-height: 100%;
      /* Fill as much space as possible while keeping ratio */
      width: auto;
      height: 100%;
      background: #ffffff;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.3),
        0 0 0 1px rgba(91,163,230,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 1;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* Scrollable data page editor — content grows beyond A4, scrollbar appears */
    #editor-canvas.scrollable-edit {
      overflow-y: auto;
      overflow-x: hidden;
      align-items: flex-start;
      /* The data page is a working editor, not a 1:1 paper preview. Its width
         normally derives from the A4-landscape aspect ratio (width = height ×
         842/595), so on small screens the sheet is short → narrow → all the
         columns get crammed. Break the aspect ratio here and let the sheet
         reclaim most of the blue side margins so every column stays readable;
         cap the width on large screens so columns don't over-stretch.
         PDF export uses separate render functions and is unaffected. */
      aspect-ratio: auto;
      width: calc(100% - 140px);
      max-width: 1500px;
    }
    .scrollable-edit .report-page-wrap {
      height: auto;
      min-height: 100%;
    }
    .scrollable-edit .data-page {
      height: auto;
      min-height: 100%;
      overflow-y: visible;
    }
    .scrollable-edit .data-table-wrap {
      flex: none;
      overflow: visible;
    }
    /* Comparison page uses the same widened, scrollable editor treatment. */
    .scrollable-edit .sim-page {
      height: auto;
      min-height: 100%;
      overflow-y: visible;
    }
    .scrollable-edit .sim-table-wrap {
      flex: none;
      overflow: visible;
    }

    /* Annotation page: widen the editor canvas on small screens (like the data
       page) so there's room for the side panels, without changing the fixed
       photo layout or scroll behaviour. Editor only — buildAnnotationHTML (PDF)
       is unaffected. */
    #editor-canvas.anno-wide {
      aspect-ratio: auto;
      width: calc(100% - 120px);
      max-width: 1500px;
    }

    /* Page navigation buttons */
    .page-nav-btn {
      position: absolute;
      bottom: 20px;
      z-index: 60;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(91,163,230,0.25);
      background: rgba(2,27,58,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      user-select: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .page-nav-btn:hover {
      background: rgba(35,87,167,0.6);
      transform: scale(1.1);
      color: #fff;
      box-shadow: 0 0 20px rgba(35,87,167,0.3), 0 4px 16px rgba(0,0,0,0.3);
    }
    .page-nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }
    .page-nav-btn.prev { left: 20px; }
    .page-nav-btn.next { right: 20px; }

    .canvas-placeholder {
      font-size: 15px;
      color: var(--text-on-white);
      opacity: 0.4;
      user-select: none;
    }

    /* ━━━ Status dot ━━━ */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--color-success);
      margin-right: var(--space-2);
      transition: background var(--transition-fast);
    }

    .status-dot.saving { background: var(--color-warning); }
    .status-dot.offline { background: var(--color-warning); }

    /* ━━━ Cover Page Module ━━━ */
    .cover-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4.7% 5.7% 3.8%;
      padding-top: calc(4.7% + 10px); /* room for progression bar */
      font-family: var(--font-ui);
      color: var(--text-on-white);
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
    }

    /* Progression bar top */
    .cover-page::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79);
      z-index: 2;
    }
    /* Progression bar bottom */
    .cover-page::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 10px;
      background: linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79);
      z-index: 2;
    }

    /* Corner brackets */
    .cover-corner-tl, .cover-corner-tr, .cover-corner-bl, .cover-corner-br {
      position: absolute;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 1;
    }
    .cover-corner-tl { top: 12px; left: 12px; border-top: 1.5px solid var(--d-200); border-left: 1.5px solid var(--d-200); }
    .cover-corner-tr { top: 12px; right: 12px; border-top: 1.5px solid var(--d-200); border-right: 1.5px solid var(--d-200); }
    .cover-corner-bl { bottom: 12px; left: 12px; border-bottom: 1.5px solid var(--d-200); border-left: 1.5px solid var(--d-200); }
    .cover-corner-br { bottom: 12px; right: 12px; border-bottom: 1.5px solid var(--d-200); border-right: 1.5px solid var(--d-200); }

    .cover-page input,
    .cover-page select {
      font-family: var(--font-ui);
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      text-align: center;
    }

    .cover-page input::placeholder {
      color: rgba(15,23,42,0.30);
    }

    .cover-page input:hover,
    .cover-page select:hover {
      background: rgba(35,87,167,0.04);
    }

    .cover-page input:focus,
    .cover-page select:focus {
      background: rgba(35,87,167,0.06);
    }

    .cover-type-label {
      font-family: var(--font-mono);
      font-size: clamp(7px, 1.2vmin, 9px);
      letter-spacing: 0.18em;
      color: var(--d-400);
      align-self: flex-start;
      margin-bottom: 1%;
    }

    .cover-dept {
      font-size: clamp(11px, 1.6vmin, 14px);
      font-family: var(--font-ui);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1A4E96;
      padding: 6px 8px;
      margin-bottom: 1.9%;
    }

    .cover-photo-zone {
      width: 77%;
      max-width: 460px;
      aspect-ratio: 460 / 300;
      border: 1px solid var(--d-100);
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 2.8%;
      position: relative;
      overflow: hidden;
      transition: border-color var(--transition-fast), background var(--transition-fast);
      flex-shrink: 1;
      min-height: 0;
    }

    /* Blueprint grid inside photo zone */
    .cover-photo-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg,
          rgba(35,87,167,0.03) 0, rgba(35,87,167,0.03) 1px,
          transparent 1px, transparent 20px),
        repeating-linear-gradient(90deg,
          rgba(35,87,167,0.03) 0, rgba(35,87,167,0.03) 1px,
          transparent 1px, transparent 20px);
      pointer-events: none;
      z-index: 0;
    }

    .cover-photo-resize {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 20px;
      height: 20px;
      cursor: nwse-resize;
      z-index: 6;
      display: none;
    }
    .cover-photo-resize::after {
      content: '';
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(15,23,42,0.25);
      border-bottom: 2px solid rgba(15,23,42,0.25);
    }
    .cover-photo-zone.has-image .cover-photo-resize {
      display: block;
    }
    .cover-photo-zone.has-image:hover .cover-photo-resize::after {
      border-color: rgba(56,189,248,0.6);
    }

    .cover-photo-zone:hover {
      border-color: var(--d-300);
      background: rgba(35,87,167,0.03);
    }

    .cover-photo-zone.dragover {
      border-color: var(--d-400);
      background: rgba(35,87,167,0.06);
    }

    .cover-photo-zone.has-image {
      border: 1px solid rgba(15,23,42,0.08);
      background: transparent;
    }
    .cover-photo-zone.has-image::before {
      display: none;
    }

    .cover-photo-placeholder {
      text-align: center;
      color: rgba(15,23,42,0.30);
      font-size: 13px;
      pointer-events: none;
    }
    .cover-photo-placeholder .img-browse-btn {
      pointer-events: auto;
    }

    .cover-photo-placeholder .icon {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
    }

    .cover-photo-zone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cover-photo-actions {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      gap: 4px;
      z-index: 4;   /* above the image (z-index:1) so the buttons are clickable */
    }

    .cover-photo-zone.has-image:hover .cover-photo-actions {
      display: flex;
    }

    .photo-action-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-ui);
      color: #fff;
      background: rgba(0,0,0,0.55);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .photo-action-btn:hover {
      background: rgba(0,0,0,0.75);
    }

    .photo-action-btn.danger:hover {
      background: rgba(239,68,68,0.8);
    }

    .photo-action-btn.icon {
      padding: 4px 7px;
      font-size: 13px;
      line-height: 1;
    }

    .cover-divider {
      width: 48px;
      height: 2px;
      background: var(--d-400);
      margin: 4px auto 8px;
    }

    .cover-project-name {
      font-family: var(--font-heading);
      font-size: clamp(18px, 3vmin, 26px);
      font-weight: 700;
      padding: 8px;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
      color: var(--d-700);
    }

    .cover-model {
      font-size: clamp(13px, 2vmin, 17px);
      font-weight: 500;
      padding: 6px 8px;
      margin-bottom: 2.8%;
      color: rgba(15,23,42,0.65);
    }

    .cover-meta-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: clamp(4px, 1vmin, 8px) 16px;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin-top: auto;
      padding-top: 1.9%;
    }

    .cover-meta-label {
      font-family: var(--font-mono);
      font-size: clamp(10px, 1.4vmin, 12px);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--d-500);
      text-align: right;
      white-space: nowrap;
    }

    .cover-meta-grid input,
    .cover-meta-grid select {
      text-align: left;
      font-size: clamp(11px, 1.6vmin, 14px);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .cover-meta-grid select {
      cursor: pointer;
      appearance: auto;
    }

    /* ━━━ Shared Report Page Elements (Editor) ━━━ */
    .report-page-wrap {
      width: 100%; height: 100%; position: relative;
    }
    .report-page-wrap > .prog-bar-top {
      position: absolute; top: 0; left: 0; right: 0; height: 10px; z-index: 2;
      background: linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79);
    }
    .report-page-wrap > .prog-bar-bot {
      position: absolute; bottom: 0; left: 0; right: 0; height: 10px; z-index: 2;
      background: linear-gradient(90deg, #0B3D7A, #2357A7, #3A7AD4, #5BA3E6, #6EC5A0, #4CAF79);
    }
    .report-page-wrap > .corner { position: absolute; width: 32px; height: 32px; pointer-events: none; z-index: 1; }
    .report-page-wrap > .corner.tl { top: 14px; left: 14px; border-top: 1.5px solid var(--d-200); border-left: 1.5px solid var(--d-200); }
    .report-page-wrap > .corner.tr { top: 14px; right: 14px; border-top: 1.5px solid var(--d-200); border-right: 1.5px solid var(--d-200); }
    .report-page-wrap > .corner.bl { bottom: 14px; left: 14px; border-bottom: 1.5px solid var(--d-200); border-left: 1.5px solid var(--d-200); }
    .report-page-wrap > .corner.br { bottom: 14px; right: 14px; border-bottom: 1.5px solid var(--d-200); border-right: 1.5px solid var(--d-200); }
    .report-page-wrap > .page-footer {
      position: absolute; bottom: 14px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 18px;
      font-family: var(--font-mono); font-size: 8px; color: rgba(15,23,42,0.35); letter-spacing: 0.04em;
      pointer-events: none; z-index: 1;
    }

    /* ━━━ Conclusion Page Module ━━━ */
    .conclusion-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px 30px 26px;
      font-family: var(--font-ui);
      color: var(--text-on-white);
      overflow-y: auto;
      gap: 16px;
    }
    /* Conclusion uses the same widened, scrollable editor treatment as the data page */
    .scrollable-edit .conclusion-page {
      height: auto;
      min-height: 100%;
      overflow-y: visible;
    }

    .concl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #C2DFF8;
    }
    .concl-page-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0B3D7A;
    }
    .concl-overall {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(15,23,42,0.10);
    }
    .concl-overall-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(15,23,42,0.45);
    }
    .concl-overall-value { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .concl-overall-detail { font-size: 10px; color: rgba(15,23,42,0.55); white-space: nowrap; }
    .concl-sub { display: block; font-size: 9px; font-weight: 500; opacity: 0.75; line-height: 1.2; }
    .concl-verdict-stale { color: #b45309; font-weight: 600; }
    .concl-hint { margin: 6px 0; padding: 6px 10px 8px; font-size: 11px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; }
    .concl-hint-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; }
    .concl-hint-close { border: none; background: transparent; color: #92400e; font-size: 13px; line-height: 1; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .concl-hint-close:hover { background: rgba(245,158,11,0.18); }
    .concl-hint-group { border-top: 1px dashed #fcd34d; padding-top: 5px; }
    .concl-hint-label { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #78350f; margin-bottom: 4px; }
    .concl-hint-count { font-weight: 500; color: #92400e; }
    .concl-hint-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .concl-chip { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; cursor: pointer; background: #fff; }
    .concl-chip-fail { border: 1px solid #fca5a5; color: #991b1b; }
    .concl-chip-warn { border: 1px solid #fcd34d; color: #854d0e; }
    .concl-chip:hover { filter: brightness(0.95); box-shadow: 0 0 0 2px rgba(245,158,11,0.25); }
    .concl-hint-btn { font-size: 11px; padding: 2px 10px; border: 1px solid #f59e0b; background: #fff; color: #92400e; border-radius: 4px; cursor: pointer; }
    .concl-btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .concl-reopen-btn { color: #b45309 !important; border-color: #fcd34d !important; }
    .concl-overall-pass    { background: rgba(34,197,94,0.10);  border-color: rgba(34,197,94,0.35); }
    .concl-overall-pass .concl-overall-value    { color: #15803d; }
    .concl-overall-warning { background: rgba(250,204,21,0.14); border-color: rgba(202,138,4,0.35); }
    .concl-overall-warning .concl-overall-value { color: #a16207; }
    .concl-overall-fail    { background: rgba(239,68,68,0.10);  border-color: rgba(239,68,68,0.35); }
    .concl-overall-fail .concl-overall-value    { color: #b91c1c; }
    .concl-overall-none .concl-overall-value    { color: rgba(15,23,42,0.45); }

    .concl-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .concl-section {
      flex-shrink: 0;
    }

    .concl-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(15,23,42,0.38);
      margin-bottom: 8px;
    }

    /* Summary rich text */
    .concl-summary {
      min-height: 72px;
      padding: 10px 12px;
      border: 1px solid rgba(15,23,42,0.10);
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-on-white);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .concl-summary:empty::before {
      content: attr(data-placeholder);
      color: rgba(15,23,42,0.25);
      pointer-events: none;
    }

    .concl-summary:focus {
      border-color: rgba(56,189,248,0.4);
    }

    /* 標記 (highlight) toolbar shared by the conclusion + comparison 結論敘述 */
    .concl-hl-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
    .concl-hl-btn {
      font-size: 11px; color: #0B3D7A; background: #fff;
      border: 1px solid rgba(15,23,42,0.18); border-radius: 4px;
      padding: 2px 10px; cursor: pointer; font-family: var(--font-ui);
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .concl-hl-btn:hover { background: #fff7cc; border-color: #ffe066; }
    .concl-summary mark, .sim-conclusion-input mark { background: #ffe066; color: inherit; border-radius: 2px; padding: 0 1px; }

    /* Compliance table */
    .concl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .concl-table th {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: rgba(15,23,42,0.45);
      padding: 6px 8px;
      border-bottom: 2px solid rgba(15,23,42,0.10);
    }

    .concl-table th:first-child { text-align: left; }   /* name column left, value columns centred like their cells */
    .concl-table td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      vertical-align: middle;
    }
    .concl-table tr.concl-group-row td {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #0B3D7A;
      background: #EDF2F8;
      border-bottom: 1px solid rgba(15,23,42,0.08);
    }
    .concl-table td.concl-count { font-weight: 500; font-size: 11px; color: rgba(15,23,42,0.65); }

    .concl-table input {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      padding: 2px 0;
    }

    .concl-table input::placeholder {
      color: rgba(15,23,42,0.22);
    }

    .concl-table input:focus {
      background: rgba(56,189,248,0.04);
    }

    .concl-table select {
      font-family: var(--font-ui);
      font-size: 12px;
      border: none;
      outline: none;
      background: transparent;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      appearance: auto;
    }

    .concl-verdict-pass { background: rgba(34,197,94,0.12); color: #166534; }
    .concl-verdict-warning { background: rgba(250,204,21,0.18); color: #854d0e; }
    .concl-verdict-fail { background: rgba(239,68,68,0.12); color: #991b1b; }

    /* Auto-filled (read-only) compliance cells — pulled from the data page */
    .concl-table td.concl-readonly {
      color: var(--text-on-white);
      font-weight: 600;
      text-align: center;
    }
    .concl-table td.concl-readonly:first-child { font-weight: 500; }
    .concl-margin-pass { color: #15803d; }
    .concl-margin-warn { color: #a16207; }
    .concl-margin-fail { color: #b91c1c; }
    .concl-table td.concl-verdict-cell { text-align: center; font-weight: 600; }
    .concl-table td.concl-empty {
      text-align: center;
      color: rgba(15,23,42,0.35);
      padding: 12px 8px;
      font-size: 11px;
    }
    .concl-del-cell { text-align: center; }
    .concl-del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(15,23,42,0.28);
      font-size: 12px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 3px;
      transition: color var(--transition-fast), background var(--transition-fast);
    }
    .concl-del-btn:hover { color: #b91c1c; background: rgba(239,68,68,0.08); }

    .concl-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.8);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.25);
      border-radius: 4px;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .concl-add-btn:hover {
      background: rgba(56,189,248,0.06);
      border-color: rgba(56,189,248,0.5);
    }

    /* Issues list */
    .concl-issues-list {
      list-style: none;
      padding: 0;
    }

    .concl-issue-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 4px;
    }

    .concl-issue-bullet {
      color: rgba(15,23,42,0.30);
      font-size: 13px;
      line-height: 1.7;
      flex-shrink: 0;
      user-select: none;
    }

    .concl-issue-input {
      flex: 1;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      padding: 2px 0;
      line-height: 1.7;
      border-bottom: 1px dashed rgba(15,23,42,0.08);
    }

    .concl-issue-input::placeholder {
      color: rgba(15,23,42,0.22);
    }

    .concl-issue-input:focus {
      border-bottom-color: rgba(56,189,248,0.3);
    }

    /* Actions table */
    .concl-actions-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .concl-actions-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: rgba(15,23,42,0.45);
      padding: 6px 8px;
      border-bottom: 2px solid rgba(15,23,42,0.10);
    }

    .concl-actions-table td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(15,23,42,0.06);
    }

    .concl-actions-table input {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      padding: 2px 0;
    }

    .concl-actions-table input::placeholder {
      color: rgba(15,23,42,0.22);
    }

    .concl-actions-table input:focus {
      background: rgba(56,189,248,0.04);
    }

    /* ━━━ Data Page Module (A4 Portrait) ━━━ */
    .data-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 3.3% 3.8% 2.8%;
      font-family: var(--font-ui);
      color: var(--text-on-white);
      overflow-y: auto;
    }

    .data-page-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #0B3D7A;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #C2DFF8;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .data-page-title-text { white-space: nowrap; flex-shrink: 0; }
    /* Whole-page freeze (唯讀鎖定) toggle, lives on the data-page title row */
    .data-freeze-btn {
      flex-shrink: 0;
      margin-left: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: #2357A7;
      background: rgba(35,87,167,0.08);
      border: 1px solid rgba(35,87,167,0.25);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .data-freeze-btn:hover { background: rgba(35,87,167,0.16); }
    .data-freeze-btn.is-frozen {
      color: #B45309;
      background: rgba(245,158,11,0.16);
      border-color: rgba(245,158,11,0.45);
    }
    /* Frozen data page: amber title underline as a clear read-only cue */
    .data-page.data-frozen .data-page-title { border-bottom-color: #F59E0B; }
    .data-page.data-frozen input:disabled,
    .data-page.data-frozen select:disabled,
    .data-page.data-frozen textarea:disabled {
      cursor: not-allowed;
      -webkit-text-fill-color: rgba(15,23,42,0.55); /* keep values readable when disabled */
      opacity: 1;
    }
    .data-top-note {
      margin-left: auto;
      flex: 1;
      max-width: 62%;
      min-width: 120px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text-on-white);
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(15,23,42,0.15);
      outline: none;
      padding: 2px 4px;
      text-align: right;
    }
    .data-top-note::placeholder { color: rgba(15,23,42,0.28); }
    .data-top-note:hover { border-bottom-color: rgba(15,23,42,0.3); }
    .data-top-note:focus {
      border-bottom-color: var(--color-primary);
      background: rgba(56,189,248,0.05);
    }

    .data-header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 20px;
      margin-bottom: 10px;
      background: #EDF2F8;
      padding: 8px 10px;
      border-radius: 4px;
    }

    .data-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .data-field-label {
      font-size: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #2357A7;
      font-family: var(--font-mono);
    }

    .data-field input,
    .data-field select {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text-on-white);
      border: 1px solid rgba(15,23,42,0.10);
      border-radius: 4px;
      outline: none;
      background: transparent;
      padding: 5px 8px;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    .data-field input::placeholder {
      color: rgba(15,23,42,0.25);
    }

    .data-field input:hover,
    .data-field select:hover {
      border-color: rgba(15,23,42,0.20);
    }

    .data-field input:focus,
    .data-field select:focus {
      border-color: rgba(56,189,248,0.45);
      background: rgba(56,189,248,0.03);
    }

    .data-field-unit {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .data-field-unit input {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      flex: 1;
    }

    .data-field-unit .unit-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(15,23,42,0.40);
      background: rgba(15,23,42,0.04);
      border: 1px solid rgba(15,23,42,0.10);
      border-left: none;
      border-radius: 0 4px 4px 0;
      padding: 5px 8px;
      white-space: nowrap;
    }

    /* All SW Version — upload screenshots (BMP/JPG/PNG), max 2, filename chips */
    .sw-upload-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sw-upload-btn {
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px;
      font-size: 11px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.9);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.35);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .sw-upload-btn:hover { background: rgba(56,189,248,0.06); border-color: rgba(56,189,248,0.55); }
    .sw-upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sw-file-list { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .sw-file-chip {
      display: inline-flex;
      align-items: center;
      height: 28px;
      max-width: 210px;
      border: 1px solid rgba(15,23,42,0.12);
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
    }
    .sw-file-name {
      padding: 0 8px;
      font-size: 11px;
      line-height: 28px;
      color: #2357A7;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 176px;
    }
    .sw-file-name:hover { color: #0B3D7A; background: rgba(56,189,248,0.06); }
    .sw-file-del {
      height: 28px; width: 24px; flex-shrink: 0;
      border: none; border-left: 1px solid rgba(15,23,42,0.10);
      background: transparent; color: rgba(15,23,42,0.30);
      font-size: 11px; cursor: pointer; transition: all 0.15s;
    }
    .sw-file-del:hover { background: rgba(231,76,60,0.12); color: #E74C3C; }

    /* Simple full-screen image preview (click a filename to open) */
    .sw-lightbox {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(15,23,42,0.78);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px;
    }
    .sw-lightbox-name {
      color: #fff; font-family: var(--font-mono); font-size: 12px;
      margin-bottom: 10px; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sw-lightbox img {
      max-width: 92vw; max-height: 82vh; object-fit: contain;
      background: #fff; border-radius: 4px; box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    }
    .sw-lightbox-close {
      position: absolute; top: 18px; right: 22px;
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.14); color: #fff; font-size: 18px; cursor: pointer;
    }
    .sw-lightbox-close:hover { background: rgba(255,255,255,0.26); }

    /* ─── Notes page (備註頁) — editor-only scratchpad, never exported ─── */
    .scrollable-edit .note-page { height: auto; min-height: 100%; }
    .note-page {
      width: 100%;
      background: #fff;
      border-radius: 8px;
      padding: 20px 22px 28px;
      box-sizing: border-box;
      color: var(--text-on-white);
    }
    .note-page-head {
      border-bottom: 1px dashed rgba(15,23,42,0.14);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .note-page-title-row { display: flex; align-items: center; gap: 10px; }
    .note-page-kicker {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #2357A7;
      background: rgba(35,87,167,0.08);
      border: 1px solid rgba(35,87,167,0.15);
      border-radius: 4px;
      padding: 4px 8px;
    }
    .note-page-title {
      flex: 1;
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-on-white);
      border: none;
      border-bottom: 1px solid transparent;
      outline: none;
      background: transparent;
      padding: 4px 2px;
    }
    .note-page-title:focus { border-bottom-color: rgba(56,189,248,0.5); }
    .note-page-title::placeholder { color: rgba(15,23,42,0.30); font-weight: 500; }
    .note-page-hint {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(15,23,42,0.45);
      font-family: var(--font-mono);
    }

    .note-blocks { display: flex; flex-direction: column; gap: 14px; }
    .note-block {
      border: 1px solid rgba(15,23,42,0.10);
      border-radius: 8px;
      background: rgba(15,23,42,0.015);
      padding: 10px 12px 12px;
    }
    .note-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .note-block-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(15,23,42,0.42);
      letter-spacing: 0.02em;
    }
    .note-block-tools { display: flex; align-items: center; gap: 4px; }
    .note-tool-btn {
      width: 24px; height: 24px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 4px; background: transparent;
      color: rgba(15,23,42,0.40); cursor: pointer; line-height: 1;
      transition: all 0.15s;
    }
    .note-img-add:hover { background: rgba(56,189,248,0.14); color: #2357A7; }
    .note-block-del { font-size: 12px; }
    .note-block-del:hover { background: rgba(231,76,60,0.12); color: #E74C3C; }
    .note-block-text {
      width: 100%;
      box-sizing: border-box;
      min-height: 70px;
      resize: vertical;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-on-white);
      border: 1px solid rgba(15,23,42,0.10);
      border-radius: 6px;
      outline: none;
      background: #fff;
      padding: 8px 10px;
      white-space: pre;
      overflow-x: auto;
    }
    .note-block-text:focus { border-color: rgba(56,189,248,0.45); background: rgba(56,189,248,0.02); }
    .note-block-text::placeholder { color: rgba(15,23,42,0.28); white-space: pre-wrap; }

    .note-img-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .note-thumb {
      position: relative;
      width: 132px;
      border: 1px solid rgba(15,23,42,0.12);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
    }
    .note-thumb img { display: block; width: 100%; height: 90px; object-fit: cover; }
    .note-thumb:hover { border-color: rgba(56,189,248,0.55); box-shadow: 0 2px 10px rgba(15,23,42,0.12); }
    .note-thumb-name {
      display: block;
      font-family: var(--font-mono);
      font-size: 9px;
      color: rgba(15,23,42,0.55);
      padding: 3px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(15,23,42,0.08);
    }
    .note-thumb-del {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border: none; border-radius: 50%;
      background: rgba(15,23,42,0.55); color: #fff; font-size: 11px;
      cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
    }
    .note-thumb:hover .note-thumb-del { opacity: 1; }
    .note-thumb-del:hover { background: #E74C3C; }

    .note-add-block-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 14px;
      padding: 7px 16px;
      font-size: 12px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.9);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.35);
      border-radius: 6px;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .note-add-block-btn:hover { background: rgba(56,189,248,0.06); border-color: rgba(56,189,248,0.55); }

    /* Ta conditions */
    .ta-section {
      border-top: 1px solid rgba(15,23,42,0.08);
      padding-top: 12px;
      margin-bottom: 16px;
    }

    .ta-section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(15,23,42,0.40);
      margin-bottom: 8px;
    }

    .ta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .ta-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 500;
      font-family: var(--font-mono);
      color: #2357A7;
      background: rgba(35,87,167,0.08);
      border: 1px solid rgba(35,87,167,0.15);
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
      white-space: nowrap;
    }

    .ta-tag-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 12px;
      line-height: 1;
      color: rgba(14,116,144,0.5);
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      transition: color var(--transition-fast), background var(--transition-fast);
    }

    .ta-tag-remove:hover {
      color: #991b1b;
      background: rgba(239,68,68,0.12);
    }

    /* Click the temperature text to edit an existing Ta condition in place */
    .ta-tag-temp { cursor: pointer; }
    .ta-tag-temp:hover { text-decoration: underline dotted; text-underline-offset: 2px; }
    .ta-tag-edit {
      width: 52px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: #2357A7;
      text-align: center;
      border: 1px solid rgba(35,87,167,0.45);
      border-radius: 3px;
      outline: none;
      background: #fff;
      padding: 1px 2px;
    }

    .ta-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 10px;
      font-size: 12px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.7);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.25);
      border-radius: 14px;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .ta-add-btn:hover {
      background: rgba(56,189,248,0.06);
      border-color: rgba(56,189,248,0.5);
    }

    /* Data body placeholder */
    .data-body-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(15,23,42,0.12);
      border-radius: 6px;
      font-size: 13px;
      color: rgba(15,23,42,0.25);
    }

    /* ━━━ Machine Power (per Ta: voltage / current / auto watt) ━━━ */
    .mp-section { margin-bottom: 10px; }
    .mp-title {
      font-size: 12px;
      font-weight: 600;
      color: #0B3D7A;
      margin-bottom: 4px;
    }
    .mp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .mp-table th {
      background: #0B3D7A;
      color: #fff;
      font-weight: 500;
      font-size: 10px;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.3);
      text-align: center;
      white-space: nowrap;
    }
    .mp-table td {
      border: 1px solid rgba(15,23,42,0.08);
      padding: 3px 6px;
      text-align: center;
    }
    .mp-table td.mp-ta {
      font-family: var(--font-mono);
      color: #2357A7;
      white-space: nowrap;
    }
    .mp-table input {
      width: 90px;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-size: 11px;
      font-family: var(--font-ui);
      color: var(--text-on-white);
    }
    .mp-table input::placeholder { color: rgba(15,23,42,0.25); }
    .mp-table input:focus { background: rgba(56,189,248,0.06); border-radius: 3px; }
    /* W is computed → plain read-only text (not a greyed disabled input) */
    .mp-table td.mp-w {
      font-weight: 600;
      color: #0B3D7A;
      background: rgba(11,61,122,0.04);
      white-space: nowrap;
    }

    /* ━━━ Data Table ━━━ */
    .data-table-wrap {
      flex: 1;
      overflow: auto;
      border: 1px solid #C2DFF8;
      border-radius: 4px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      table-layout: auto;
      min-width: 100%;
    }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      text-align: center;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #ffffff;
      padding: 4px 5px;
      background: #0B3D7A;
      border: 1px solid rgba(255,255,255,0.3);
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    .data-table th.ta-group-header {
      text-align: center;
      border-left: 2px solid rgba(255,255,255,0.2);
    }

    .data-table th.ta-sub-header {
      font-size: 7px;
      text-align: center;
    }

    .data-table td {
      padding: 3px 5px;
      border: 1px solid rgba(15,23,42,0.08);
      vertical-align: middle;
      white-space: nowrap;
      text-align: center;
    }

    .data-table tr.row-fail td {
      background: rgba(254,226,226,0.4) !important;
    }

    .data-table tr.category-boundary td {
      border-top: 2px solid rgba(15,23,42,0.12);
    }

    /* Spec Type header: hint that it carries an explanatory tooltip */
    .data-table th.dt-th-help {
      cursor: help;
      text-decoration: underline dotted rgba(15,23,42,0.4);
      text-underline-offset: 2px;
    }

    /* Excel-style drag-to-fill handle (shown on the focused fillable cell) */
    .dt-fill-handle {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 8px;
      height: 8px;
      background: #2357A7;
      border: 1px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(35,87,167,0.4);
      cursor: crosshair;
      z-index: 9;
    }
    .data-table td.dt-fill-target,
    .sim-table td.dt-fill-target {
      box-shadow: inset 0 0 0 1px #2357A7;
      background: rgba(35,87,167,0.08) !important;
    }

    /* Rectangular range selection (drag to select, Ctrl+C copy, Del clears) */
    .data-table td.dt-range-sel,
    .sensor-table td.dt-range-sel,
    .sim-table td.dt-range-sel {
      background: rgba(56,189,248,0.18) !important;
      box-shadow: inset 0 0 0 1px rgba(35,87,167,0.55);
    }
    /* Suppress text selection while dragging a range */
    #dt-tbody.dt-selecting, #dt-tbody.dt-selecting *,
    #sensor-tbody.dt-selecting, #sensor-tbody.dt-selecting *,
    #sim-tbody.dt-selecting, #sim-tbody.dt-selecting * {
      user-select: none !important;
      -webkit-user-select: none !important;
      cursor: cell;
    }

    /* Category color strip */
    .dt-cat-strip {
      width: 3px;
      height: 18px;
      border-radius: 2px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 2px;
    }
    .dt-cat-strip.cat-rf      { background: #2563EB; }
    .dt-cat-strip.cat-digital { background: #16A34A; }
    .dt-cat-strip.cat-pwr     { background: #EA580C; }
    .dt-cat-strip.cat-other   { background: #9333EA; }

    .data-table input,
    .data-table select {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      padding: 2px 3px;
      width: 100%;
      min-width: 0;
      text-align: center;
    }

    .data-table input::placeholder { color: rgba(15,23,42,0.20); }
    .data-table input:focus,
    .data-table select:focus { background: rgba(56,189,248,0.05); }

    .data-table select { cursor: pointer; appearance: auto; width: auto; min-width: 50px; }

    /* 元件名稱 column: keep a comfortable minimum width so it isn't squeezed
       on smaller screens (e.g. 17"). This is a floor only — on wider screens
       the auto table-layout still gives it more room. Screen editor only;
       PDF export uses its own inline styles and is unaffected. */
    .data-table th.dt-name-col,
    .data-table td.dt-name-col { min-width: 160px; }

    .dt-readonly {
      background: rgba(15,23,42,0.03) !important;
      color: rgba(15,23,42,0.55);
      font-weight: 600;
      text-align: center;
      padding: 2px 4px;
      font-size: 11px;
    }

    .dt-margin-pass  { background: #dcfce7 !important; color: #15803d !important; font-weight: 600; text-align: center; }
    .dt-margin-warn  { background: #fef9c3 !important; color: #a16207 !important; font-weight: 600; text-align: center; }
    .dt-margin-fail  { background: #fee2e2 !important; color: #b91c1c !important; font-weight: 600; text-align: center; }

    .dt-passfail-pass { color: #15803d; font-weight: 700; }
    .dt-passfail-fail { color: #b91c1c; font-weight: 700; }
    .dt-passfail-none { color: rgba(15,23,42,0.35); font-weight: 600; text-align: center; }
    /* ΔT margin (°C) shown under the % margin */
    .dt-margin-c { display: block; font-size: 9px; font-weight: 500; opacity: 0.85; line-height: 1.2; white-space: nowrap; }
    .dt-sub-unit { display: block; font-size: 8px; font-weight: 400; opacity: 0.75; }
    .dt-def-note { margin-top: 6px; font-size: 10px; line-height: 1.6; color: rgba(15,23,42,0.55); }

    .dt-tc-input { width: 55px; text-align: center; }

    .data-table td.dt-ta-col {
      border-left: 1px solid rgba(15,23,42,0.06);
      text-align: center;
    }
    .data-table td.dt-ta-col-first {
      border-left: 2px solid rgba(15,23,42,0.08);
    }

    .dt-add-row-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 4px 12px;
      font-size: 11px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.8);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.25);
      border-radius: 4px;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .dt-add-row-btn:hover {
      background: rgba(56,189,248,0.06);
      border-color: rgba(56,189,248,0.5);
    }
    .dt-del-header { width: 28px; padding: 0 !important; }
    .dt-del-cell { width: 28px; padding: 2px !important; text-align: center; }
    .dt-del-btn {
      width: 20px; height: 20px; padding: 0; border: none; border-radius: 3px;
      background: transparent; color: rgba(15,23,42,0.25); font-size: 11px;
      cursor: pointer; line-height: 1; transition: all 0.15s;
    }
    .dt-del-btn:hover { background: rgba(231,76,60,0.12); color: #E74C3C; }

    /* Trailing row-actions cell: highlight swatch + disable toggle + delete */
    .dt-act-header { width: 78px; padding: 0 !important; }
    .dt-act-cell { width: 78px; padding: 2px !important; text-align: center; white-space: nowrap; }
    .dt-act-cell .dt-act-btn,
    .dt-act-cell .dt-del-btn {
      width: 20px; height: 20px; padding: 0; border: none; border-radius: 3px;
      background: transparent; font-size: 12px; cursor: pointer; line-height: 1;
      vertical-align: middle; transition: all 0.15s;
    }
    .dt-disable-btn { color: rgba(15,23,42,0.4); font-weight: 600; font-size: 11px; }
    .dt-disable-btn:hover { background: rgba(15,23,42,0.10); color: rgba(15,23,42,0.75); }
    .dt-disable-btn.is-on { color: #B45309; background: rgba(245,158,11,0.14); }
    .dt-hl-btn { position: relative; }
    .dt-hl-dot {
      display: inline-block; width: 12px; height: 12px; border-radius: 50%;
      border: 1.5px solid rgba(15,23,42,0.35); box-sizing: border-box; vertical-align: middle;
    }
    .dt-hl-btn:hover .dt-hl-dot { border-color: rgba(15,23,42,0.6); }

    /* Disabled (temporarily closed) row — greyed, name struck, note in red.
       Applies to both the component and sensor tables. */
    .data-table tr.dt-row-disabled td,
    .sensor-table tr.dt-row-disabled td { background: rgba(15,23,42,0.05) !important; }
    .data-table tr.dt-row-disabled input,
    .data-table tr.dt-row-disabled select,
    .sensor-table tr.dt-row-disabled input,
    .sensor-table tr.dt-row-disabled select { color: rgba(15,23,42,0.42); }
    .data-table tr.dt-row-disabled .dt-name-input,
    .sensor-table tr.dt-row-disabled .dt-name-input { text-decoration: line-through; }
    .data-table tr.dt-row-disabled .dt-note-input,
    .sensor-table tr.dt-row-disabled .dt-note-input { color: #dc2626; font-weight: 600; }
    .dt-passfail-disabled { color: rgba(15,23,42,0.5); font-weight: 600; text-align: center; }

    /* Highlight-colour picker popover (opened from the swatch button) */
    .dt-hl-pop {
      position: fixed; z-index: 1000; display: flex; gap: 6px;
      padding: 6px; background: #fff; border: 1px solid rgba(15,23,42,0.14);
      border-radius: 8px; box-shadow: 0 8px 28px rgba(15,23,42,0.18);
    }
    .dt-hl-opt {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 1.5px solid rgba(15,23,42,0.20); padding: 0; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(15,23,42,0.5); background: transparent;
      transition: transform 0.1s;
    }
    .dt-hl-opt:hover { transform: scale(1.12); }
    .dt-hl-opt.is-active { box-shadow: 0 0 0 2px rgba(15,23,42,0.55); }

    /* Highlighted row — tint every cell (via the --hl inline var) but keep the
       margin cells' pass/warn/fail colours so the P/F signal is never hidden. */
    .data-table tr.dt-row-hl td,
    .sensor-table tr.dt-row-hl td { background: var(--hl) !important; }
    .data-table tr.dt-row-hl td.dt-margin-pass { background: #dcfce7 !important; }
    .data-table tr.dt-row-hl td.dt-margin-warn { background: #fef9c3 !important; }
    .data-table tr.dt-row-hl td.dt-margin-fail { background: #fee2e2 !important; }

    .editor-area.has-tim-panel { padding-top: 52px; }

    /* TIM Library Panel — sits in .editor-area, top-left */
    #tim-panel-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 30;
    }
    #tim-panel-container:empty { display: none; }
    .tim-panel {
      width: 340px;
      background: #ffffff;
      border: 1px solid #C2DFF8;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18);
      font-family: var(--font-ui);
      overflow: hidden;
    }
    .tim-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #EDF2F8;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      font-weight: 600;
      color: #0B3D7A;
    }
    .tim-panel-header:hover { background: #dde8f5; }
    .tim-panel-arrow { font-size: 9px; transition: transform 0.2s; color: #5BA3E6; }
    .tim-panel-arrow.open { transform: rotate(90deg); }
    .tim-panel-body { display: none; }
    .tim-panel-body.open { display: block; }
    .tim-tabs {
      display: flex;
      border-bottom: 1px solid #C2DFF8;
    }
    .tim-tab {
      flex: 1;
      padding: 5px 4px;
      font-size: 9px;
      font-weight: 600;
      text-align: center;
      color: rgba(15,23,42,0.45);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-ui);
    }
    .tim-tab:hover { color: #0B3D7A; background: rgba(11,61,122,0.04); }
    .tim-tab.active {
      color: #0B3D7A;
      border-bottom-color: #0B3D7A;
      background: rgba(11,61,122,0.06);
    }
    .tim-list {
      max-height: 220px;
      overflow-y: auto;
      padding: 4px 8px;
    }
    .tim-entry {
      display: grid;
      grid-template-columns: 1fr 50px 70px 24px;
      gap: 4px;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid rgba(15,23,42,0.06);
    }
    .tim-entry input {
      font-family: var(--font-ui);
      font-size: 10px;
      border: 1px solid rgba(15,23,42,0.12);
      border-radius: 3px;
      padding: 2px 4px;
      outline: none;
      width: 100%;
      min-width: 0;
      color: var(--text-on-white);
    }
    .tim-entry input::placeholder { color: rgba(15,23,42,0.25); }
    .tim-entry input:focus { border-color: #3A7AD4; }
    .tim-entry-del {
      width: 20px; height: 20px; padding: 0; border: none;
      border-radius: 3px; background: transparent;
      color: rgba(15,23,42,0.25); font-size: 11px;
      cursor: pointer; line-height: 1;
    }
    .tim-entry-del:hover { background: rgba(231,76,60,0.12); color: #E74C3C; }
    .tim-add-btn {
      display: block;
      padding: 4px;
      font-size: 10px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.8);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.25);
      border-radius: 3px;
      cursor: pointer;
      margin: 4px 8px 6px;
      width: calc(100% - 16px);
    }
    .tim-add-btn:hover { background: rgba(56,189,248,0.06); border-color: rgba(56,189,248,0.5); }
    .tim-list-header {
      display: grid;
      grid-template-columns: 1fr 50px 70px 24px;
      gap: 4px;
      padding: 2px 0;
      font-size: 8px;
      font-weight: 600;
      color: rgba(15,23,42,0.4);
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
      border-bottom: 1px solid rgba(15,23,42,0.08);
      margin: 0 8px;
    }

    /* Sensor section */
    .sensor-section {
      margin-top: 10px;
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 6px;
      overflow: hidden;
    }

    .sensor-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-ui);
      color: #0B3D7A;
      background: rgba(15,23,42,0.02);
      border: none;
      cursor: pointer;
      text-align: left;
    }
    .sensor-toggle:hover { background: rgba(15,23,42,0.04); }

    .sensor-toggle .arrow {
      display: inline-block;
      transition: transform 0.15s;
      font-size: 10px;
    }
    .sensor-toggle .arrow.open { transform: rotate(90deg); }

    .sensor-body {
      padding: 8px;
      display: none;
    }
    .sensor-body.open { display: block; }

    .sensor-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .sensor-table th {
      text-align: center;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #ffffff;
      padding: 4px 6px;
      background: #0B3D7A;
      border: 1px solid rgba(255,255,255,0.3);
      white-space: nowrap;
      font-family: var(--font-mono);
    }
    .sensor-table td {
      padding: 3px 5px;
      border: 1px solid rgba(15,23,42,0.08);
      text-align: center;
    }
    .sensor-table input,
    .sensor-table select {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--text-on-white);
      border: none;
      outline: none;
      background: transparent;
      padding: 2px 3px;
      width: 100%;
      text-align: center;
      text-align-last: center;
    }
    .sensor-table input::placeholder { color: rgba(15,23,42,0.20); }
    .sensor-table input:focus { background: rgba(56,189,248,0.05); }
    .sensor-table select { cursor: pointer; appearance: auto; width: auto; }

    /* Sensor 對應元件 Δ column (link a sensor to a component; show per-Ta diff) */
    .sensor-table th.sensor-ref-th { min-width: 116px; }
    .sensor-table td.sensor-ref-cell { padding: 3px 5px; text-align: center; vertical-align: top; }
    .sensor-ref-btn {
      width: 100%;
      padding: 5px 6px;
      font-size: 10.5px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.9);
      background: transparent;
      border: 1px dashed rgba(56,189,248,0.35);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .sensor-ref-btn:hover { background: rgba(56,189,248,0.06); border-color: rgba(56,189,248,0.55); }
    .sensor-ref-btn.stale { color: #B45309; border-color: rgba(245,158,11,0.5); }
    .sensor-ref-linked { display: flex; flex-direction: column; gap: 3px; align-items: center; }
    .sensor-ref-head { display: flex; align-items: center; justify-content: center; gap: 4px; max-width: 100%; }
    .sensor-ref-name {
      min-width: 0; max-width: 100%;
      font-size: 11px; font-weight: 600; color: #2357A7; text-align: center;
      cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sensor-ref-name:hover { color: #0B3D7A; }
    .sensor-ref-clear {
      flex-shrink: 0; width: 16px; height: 16px; padding: 0; border: none; border-radius: 3px;
      background: transparent; color: rgba(15,23,42,0.30); font-size: 10px; cursor: pointer; line-height: 1;
    }
    .sensor-ref-clear:hover { background: rgba(231,76,60,0.12); color: #E74C3C; }
    .sensor-ref-deltas { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; }
    .sensor-ref-delta { display: inline-flex; align-items: baseline; gap: 4px; font-family: var(--font-mono); font-size: 10px; }
    .sensor-ref-delta .srd-ta { color: rgba(15,23,42,0.45); }
    .sensor-ref-delta .srd-val { font-weight: 600; color: rgba(15,23,42,0.80); }

    /* Sensor→component single-select picker (rows show each Ta's measured value).
       Lives inside the dark .sim-modal, so styling is light-on-dark. */
    .scp-body { display: flex; flex-direction: column; gap: 5px; padding: 4px 12px; }
    .scp-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 10px; text-align: left; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.10); border-radius: 6px;
      font-family: var(--font-ui); color: #e2e8f0; transition: all 0.12s;
    }
    .scp-item:hover { background: rgba(56,189,248,0.12); border-color: rgba(56,189,248,0.55); }
    .scp-num { font-family: var(--font-mono); font-size: 10px; color: rgba(226,232,240,0.5); flex-shrink: 0; }
    .scp-name { font-weight: 600; font-size: 13px; flex-shrink: 0; color: #f1f5f9; }
    .scp-readings { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: flex-end; }
    .scp-reading { font-family: var(--font-mono); font-size: 11px; color: rgba(226,232,240,0.7); }

    /* PDF export page picker (inside the dark .sim-modal) */
    .exp-toolbar { display: flex; justify-content: flex-end; padding: 6px 14px 0; }
    .exp-toggle-all {
      font-size: 11px; color: rgba(56,189,248,0.9); background: transparent;
      border: 1px solid rgba(56,189,248,0.35); border-radius: 4px; padding: 3px 10px; cursor: pointer;
    }
    .exp-toggle-all:hover { background: rgba(56,189,248,0.12); }
    .exp-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; cursor: pointer; transition: background var(--transition-fast);
    }
    .exp-item:hover { background: rgba(255,255,255,0.05); }
    .exp-item input[type="checkbox"] { accent-color: #38bdf8; width: 16px; height: 16px; flex-shrink: 0; }
    .exp-idx { font-family: var(--font-mono); font-size: 10px; color: rgba(226,232,240,0.45); flex-shrink: 0; }
    .exp-label { font-size: 13px; color: #e2e8f0; display: flex; align-items: baseline; gap: 8px; }
    .exp-note { font-size: 11px; color: rgba(226,232,240,0.55); }

    /* ━━━ Sim vs Meas Comparison Page ━━━ */
    .sim-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 2.4% 2.8% 1.9%;
      font-family: var(--font-ui);
      color: var(--text-on-white);
      overflow-y: auto;
      gap: 1.2%;
    }

    .sim-page-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sim-page-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #0B3D7A;
    }

    .sim-page-actions { display: flex; align-items: center; gap: 10px; }
    .sim-ta-pick { font-size: 11px; font-weight: 600; color: #0B3D7A; display: inline-flex; align-items: center; gap: 6px; }
    .sim-ta-pick select { font-size: 11px; padding: 2px 4px; border: 1px solid rgba(15,23,42,0.2); border-radius: 4px; background: #fff; color: #0B3D7A; }
    .sim-ref-warn { color: #b45309; font-size: 10px; font-weight: 600; }
    .sim-select-btn {
      padding: 4px 12px;
      font-size: 11px;
      font-family: var(--font-ui);
      color: rgba(56,189,248,0.85);
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.20);
      border-radius: 4px;
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .sim-select-btn:hover {
      background: rgba(56,189,248,0.15);
    }

    /* Image pair zone */
    .sim-images {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .sim-img-zone {
      flex: 1;
      height: clamp(120px, 22vmin, 170px);
      border: 2px dashed rgba(15,23,42,0.14);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }
    .sim-img-zone:hover {
      border-color: rgba(56,189,248,0.35);
      background: rgba(56,189,248,0.02);
    }
    .sim-img-zone.dragover {
      border-color: var(--color-primary);
      background: rgba(56,189,248,0.06);
    }
    .sim-img-zone.has-image {
      border: 1px solid rgba(15,23,42,0.10);
    }
    .sim-img-zone.has-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sim-img-placeholder {
      text-align: center;
      color: rgba(15,23,42,0.28);
      font-size: 11px;
      pointer-events: none;
    }
    .sim-img-placeholder .img-browse-btn {
      pointer-events: auto;
    }
    .sim-img-placeholder .icon {
      font-size: 24px;
      display: block;
      margin-bottom: 4px;
    }

    .sim-img-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(15,23,42,0.35);
      margin-top: 4px;
      text-align: center;
    }

    .sim-img-caption {
      width: 100%;
      font-family: var(--font-ui);
